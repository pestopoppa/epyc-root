name: NI07 VB-SERVE-TIMING-1 pinned fixture conformance
on:
  push:
    branches: [codex/ni07-serving-ci-20261006]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  serving-call:
    name: serving-call
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROOT_PIN: 29a0aec659b9080ece417483d25b82abbfab438f
      APP_PIN: 62db79be0bf9a4cdc8341ec48d8d240a14458288
      EPYC_SERVING_CALLS_SOURCE_SHA256: a528b20c6d106e9d5ce4c3a2f95919103bed44bad30cabb863491d768ad1214c
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      ORCHESTRATOR_MOCK_MODE: '1'
      ORCHESTRATOR_LOG_DIR: /dev/null
      ORCHESTRATOR_SERVING_CALLS_LOG: off
      ORCHESTRATOR_COHERENCE_JUDGE_LOG: off
      PYTHONUNBUFFERED: '1'
      NI07_INSTALL_COMMAND: python -m pip install pytest==8.4.2 PyYAML==6.0.2
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni07-serving/result"
          printf '{"state":"setup_pending","job":"vb-serve-timing1","exit_code":null}\n' > "$RUNNER_TEMP/ni07-serving/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed ROOT source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_PIN }}
          path: root
          persist-credentials: false
      - name: Checkout immutable APP producer
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install only selected fixture dependencies
        run: python -m pip install pytest==8.4.2 PyYAML==6.0.2
      - name: Capture original selected fixture receipt
        run: |
          export EPYC_ORCHESTRATOR_ROOT="$GITHUB_WORKSPACE/app"
          export PYTHONPATH="$GITHUB_WORKSPACE/root/scripts/vidya"
          python recipe/scripts/ci/ni07_serving_capture.py
      - name: Preserve original native receipt, JUnit, source readset and context on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni07-serving-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni07-serving/result/
          if-no-files-found: error
