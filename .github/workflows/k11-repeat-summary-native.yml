name: K11 complete-repeat summary native controls
on:
  push:
    branches: [codex/ni08-k11-repeat-summary-native-20261007]
permissions:
  contents: read
jobs:
  complete-repeat-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PYTEST_PLUGINS: ''
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Preserve original setup status before imports
        run: |
          mkdir -p "$RUNNER_TEMP/k11-summary"
          printf '{"state":"setup_pending","exit_code":null}\n' > "$RUNNER_TEMP/k11-summary/status.json"
      - name: Checkout exact ROOT recipe and unchanged carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout approved exact Research source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-inference-research
          ref: 507848f57f3fdefdc216463660668095324e2821
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact primary dependency lock source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: 70096b763939a43409a1f1827ab633d62425a6c1
          path: lock-source
          persist-credentials: false
      - name: Checkout MAIN exact prospective source and native enrollment
        uses: actions/checkout@v4
        with:
          ref: d71676281bfbbec7383a84292add3be214e8b9e9
          path: context
          persist-credentials: false
      - name: Setup exact bounded interpreter
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install isolated ALL-wheel locked pytest closure
        run: |
          python -m venv "$RUNNER_TEMP/k11-summary-venv"
          "$RUNNER_TEMP/k11-summary-venv/bin/python" -m pip install --no-deps --only-binary=:all: --require-hashes -r recipe/scripts/ci/k11_repeat_summary_requirements.txt > "$RUNNER_TEMP/k11-summary/dependency-install.log" 2>&1
      - name: Capture whole original unit module and existing shared grade
        run: |
          "$RUNNER_TEMP/k11-summary-venv/bin/python" recipe/scripts/ci/k11_repeat_summary_capture.py
      - name: Preserve all original setup and native outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k11-repeat-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/k11-summary
          include-hidden-files: true
          retention-days: 90
