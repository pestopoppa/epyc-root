name: UFH-13 thesis adapter native fixture conformance
on:
  push:
    branches: [codex/vb-thesis2-native-capture-20261006]
    paths:
      - .github/workflows/vb-thesis2-native-conformance.yml
      - scripts/ci/vb_thesis2_native_capture.py
      - scripts/ci/vb_thesis2_native_cases.json
      - scripts/ci/vb_thesis2_native_requirements.txt
permissions:
  contents: read
jobs:
  ufh13-thesis-native-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RECIPE_PIN: ${{ github.sha }}
      SOURCE_PIN: 9891c1979d4580512aeb6451850b8bd0dca86055
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      APP_PIN: 70096b763939a43409a1f1827ab633d62425a6c1
      RESEARCH_PIN: 1bace97dc655ab5896291b4571781e53b821d9a3
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/vb-thesis2/result"
          printf '{"state":"setup_pending","job":"ufh13-thesis-native-conformance","exit_code":null}\n' > "$RUNNER_TEMP/vb-thesis2/result/status.json"
          cp "$RUNNER_TEMP/vb-thesis2/result/status.json" "$RUNNER_TEMP/vb-thesis2/result/pre-status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout native conformance carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout frozen thesis source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.SOURCE_PIN }}
          path: source
          persist-credentials: false
      - name: Checkout APP dependency lock source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - name: Checkout pinned UFH-13 producer source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-inference-research
          ref: ${{ env.RESEARCH_PIN }}
          path: research
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install exact pytest and PyYAML lock closure
        run: python -m pip install --no-deps --require-hashes -r recipe/scripts/ci/vb_thesis2_native_requirements.txt
      - name: Capture original JUnit, native receipt, source readset, and shared grade
        run: python recipe/scripts/ci/vb_thesis2_native_capture.py
      - name: Retain capture artifacts on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vb-thesis2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vb-thesis2/result/
          if-no-files-found: error
