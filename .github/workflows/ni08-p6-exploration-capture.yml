name: HS-4 P6 exploration source controls
on:
  push:
    branches: [codex/ni08-hs4-p6-source-capture-20261007]
permissions:
  contents: read
jobs:
  p6-source-controls:
    name: p6-source-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_PIN: 10075e6cb559d7e8ce3e1f1251b4a63bc78ec2c8
      ROOT_BASE_PIN: 928a740464d041ece312b0f23c0dee5f31e891e6
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      P6_RUNNER_CONTEXT: ubuntu-24.04
      P6_EXECUTION_CONTEXT: hs4-p6-source-controls-no-catalog-or-inference
      P6_INSTALL_COMMAND: >-
        python -m venv "$RUNNER_TEMP/ni08-p6-exploration/venv" &&
        "$RUNNER_TEMP/ni08-p6-exploration/venv/bin/python" -m pip install
        --require-hashes --no-deps --only-binary=:all: -r
        recipe/scripts/ci/ni08_p6_exploration_requirements.txt
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Initialize artifact status before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni08-p6-exploration/result"
          printf '{"state":"setup_pending","exit_code":null}\n' > "$RUNNER_TEMP/ni08-p6-exploration/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          path: recipe
          persist-credentials: false
      - name: Checkout unchanged native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout exact APP source proposal
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install isolated hash-locked wheel-only dependencies
        run: |
          set -euo pipefail
          ${{ env.P6_INSTALL_COMMAND }} 2>&1 | tee "$RUNNER_TEMP/ni08-p6-exploration/result/dependency-install.log"
      - name: Capture the exact 11 P6 source-control cases
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/app"
          "$RUNNER_TEMP/ni08-p6-exploration/venv/bin/python" recipe/scripts/ci/ni08_p6_exploration_capture.py
      - name: Preserve original status, JUnit and native receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni08-p6-exploration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni08-p6-exploration/result/
          if-no-files-found: error
