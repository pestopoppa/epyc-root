name: NI07 DCP render identity synthetic custody
on:
  push:
    branches: [codex/ni07-21-render-recipe]
    paths:
      - .github/workflows/ni07-21-dcp-render-identity.yml
      - scripts/ci/ni07_21_dcp_render_identity_capture.py
permissions:
  contents: read
jobs:
  dcp-render-identity:
    name: dcp-render-identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PIN: 762dadb3cbb433a6f02ef21c5820270b26e756c3
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      NI07_RUNNER_CONTEXT: ubuntu-latest
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      NI07_INSTALL_COMMAND: >-
        python -m pip install pytest==9.0.3 iniconfig==2.3.0 packaging==26.0
        pluggy==1.6.0 Pygments==2.20.0
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni07-21-dcp-render-identity/result"
          printf '{"state":"setup_pending","job":"dcp-render-identity","exit_code":null}\n' > "$RUNNER_TEMP/ni07-21-dcp-render-identity/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout reviewed APP source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned pytest and lock-resolved runtime dependencies
        run: ${{ env.NI07_INSTALL_COMMAND }}
      - name: Capture original DCP render identity receipt
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/app"
          python recipe/scripts/ci/ni07_21_dcp_render_identity_capture.py
      - name: Preserve original receipt, JUnit and status on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni07-21-dcp-render-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni07-21-dcp-render-identity/result/
          if-no-files-found: error
