name: TD29 typed-decision fixture source controls
on:
  push:
    branches: [codex/ni08-td29-prefill-native-20261007]
permissions:
  contents: read
jobs:
  td29-native-fixture-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_PIN: 130a394e38a5b0cf1b199e33c267070dc7087bd6
      ROOT_CONTEXT_PIN: c986a107fde2c6e7cd6bd8e05ff7cf7243207034
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      TD29_RUNNER_CONTEXT: ubuntu-24.04-cpython-3.11
      TD29_EXECUTION_CONTEXT: three-whole-test-modules-existing-mocks-no-inference
      ORCHESTRATOR_MOCK_MODE: '1'
      ORCHESTRATOR_PATHS_LLAMA_CPP_BIN: '${{ runner.temp }}/td29-native/empty-kernel-bin'
      CI: 'true'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PYTEST_PLUGINS: ''
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Initialize private result custody
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/td29-native/result"
          mkdir -m 700 "$RUNNER_TEMP/td29-native/empty-kernel-bin"
          test "$(stat -c '%u:%a' "$RUNNER_TEMP/td29-native/empty-kernel-bin")" = "$(id -u):700"
          test -z "$(find "$RUNNER_TEMP/td29-native/empty-kernel-bin" -mindepth 1 -maxdepth 1 -print -quit)"
          printf '{"state":"setup_pending","capture_started":false,"native_receipt_state":"no_receipt","native_metric_value":null,"proposition_invented":false}\n' > "$RUNNER_TEMP/td29-native/result/status.json"
      - name: Checkout exact ROOT recipe and prospective enrollment context
        id: root_checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: recipe
          persist-credentials: false
      - name: Checkout pinned existing native carrier
        id: carrier_checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout exact APP source candidate
        id: app_checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          fetch-depth: 0
          path: app
          persist-credentials: false
      - name: Set up Linux CPython 3.11
        id: setup_python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install only the complete pinned Linux wheel closure
        id: install_deps
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/td29-native/venv"
          "$RUNNER_TEMP/td29-native/venv/bin/python" -m pip install --no-deps --only-binary=:all: --require-hashes -r recipe/scripts/ci/td29_native/requirements-linux-py311.txt 2>&1 | tee "$RUNNER_TEMP/td29-native/result/dependency-install.log"
      - name: Retain resolved isolated dependency inventory
        id: freeze
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/td29-native/venv/bin/python" -m pip freeze --all > "$RUNNER_TEMP/td29-native/result/pip-freeze.txt"
      - name: Capture original whole-module source controls and existing shared grade
        id: capture
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/td29-native/venv/bin/python" recipe/scripts/ci/td29_native_capture.py
      - name: Preserve setup-failure custody if capture did not start
        if: always()
        env:
          ROOT_CHECKOUT_OUTCOME: ${{ steps.root_checkout.outcome }}
          CARRIER_CHECKOUT_OUTCOME: ${{ steps.carrier_checkout.outcome }}
          APP_CHECKOUT_OUTCOME: ${{ steps.app_checkout.outcome }}
          PYTHON_SETUP_OUTCOME: ${{ steps.setup_python.outcome }}
          DEPENDENCY_INSTALL_OUTCOME: ${{ steps.install_deps.outcome }}
          ENV_FREEZE_OUTCOME: ${{ steps.freeze.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: |
          python3 - "$RUNNER_TEMP/td29-native/result" <<'PYSETUP'
          import json, os, sys
          from pathlib import Path
          root=Path(sys.argv[1]); status_path=root/'status.json'
          if not status_path.is_file(): raise SystemExit(0)
          status=json.loads(status_path.read_text())
          if status.get('capture_started') is True or (root/'error-custody.json').exists(): raise SystemExit(0)
          outcomes={k:os.environ.get(k) for k in ('ROOT_CHECKOUT_OUTCOME','CARRIER_CHECKOUT_OUTCOME','APP_CHECKOUT_OUTCOME','PYTHON_SETUP_OUTCOME','DEPENDENCY_INSTALL_OUTCOME','ENV_FREEZE_OUTCOME','CAPTURE_OUTCOME')}
          record={'phase':'workflow_setup_before_capture','capture_started':False,'native_receipt_state':'no_receipt','native_metric_value':None,'workflow_step_outcomes':outcomes,'proposition_invented':False}
          with (root/'error-custody.json').open('x') as f: json.dump(record,f,sort_keys=True,indent=2); f.write('\n'); f.flush(); os.fsync(f.fileno())
          status.update(state='setup_failed',workflow_step_outcomes=outcomes,error_custody_state='written before final status')
          status_path.write_text(json.dumps(status,sort_keys=True)+'\n')
          PYSETUP
      - name: Upload original request, JUnit, receipt, sources, logs and custody
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: td29-native-fixture-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/td29-native/result/
          if-no-files-found: error
