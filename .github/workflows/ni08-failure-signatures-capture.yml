name: NI08 AutoPilot failure diagnostics capture
on:
  push:
    branches: [codex/ni08-failure-signatures-capture-20261006]
    paths:
      - .github/workflows/ni08-failure-signatures-capture.yml
      - scripts/ci/ni08_failure_signatures_capture.py
permissions:
  contents: read
jobs:
  failure-signatures-synthetic-capture:
    name: failure-signatures-synthetic-capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PIN: 15e5b52ec8941c8a46211d363cc9b6774813b30b
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      NI08_RUNNER_CONTEXT: ubuntu-latest
      NI08_EXECUTION_CONTEXT: offline-native-journal-fixtures
      ORCHESTRATOR_PATHS_LLAMA_CPP_BIN: /fixture/kernel-bin
      ORCHESTRATOR_PATHS_LLAMA_MTMD: /fixture/llama-mtmd-cli
      ORCHESTRATOR_PATHS_LLAMA_SERVER: /fixture/llama-server
      NI08_INSTALL_COMMAND: >-
        python -m pip install pytest==9.0.3 iniconfig==2.3.0 packaging==26.0
        pluggy==1.6.0 Pygments==2.20.0
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      ORCHESTRATOR_MOCK_MODE: '1'
      ORCHESTRATOR_LOG_DIR: /dev/null
      ORCHESTRATOR_SERVING_CALLS_LOG: off
      ORCHESTRATOR_COHERENCE_JUDGE_LOG: off
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni08-failure-signatures-capture/result"
          printf '{"state":"setup_pending","job":"failure-signatures-synthetic-capture","exit_code":null}\n' > "$RUNNER_TEMP/ni08-failure-signatures-capture/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout reviewed APP source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install pinned APP lock-resolved test import closure
        run: ${{ env.NI08_INSTALL_COMMAND }}
      - name: Capture original JUnit and native synthetic receipt
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/app"
          python recipe/scripts/ci/ni08_failure_signatures_capture.py
      - name: Preserve status, original JUnit and every native receipt member
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni08-failure-signatures-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni08-failure-signatures-capture/result/
          if-no-files-found: error
