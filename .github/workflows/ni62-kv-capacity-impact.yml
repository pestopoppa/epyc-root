name: NI62 APP KV capacity exact-symbol impact

on:
  push:
    branches: [codex/ni62-kv-capacity-impact-20261005]
    paths: [.github/workflows/ni62-kv-capacity-impact.yml]

permissions:
  contents: read

concurrency:
  group: ni62-kv-capacity-impact-20261005
  cancel-in-progress: false

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_KIND: app
      ROOT_SHA: e6c0c9db7282ab85acdc2cc4b9119c72bfab02e1
      APP_SHA: 6bb8d860d410217895efb7806e9ef907a62a4350
      LOCK_SHA: 734c187820f8e972354dec7aa7519ce37bf0b688530ef83623d8baeb645b448c
      TARBALL_SHA: 9c90be3532671e6f4a94f949816113389798a26c604e61f7953dadaa405ecdd6
      PACKAGE_SHA: 99deb36e0705d0553fcd1baf1951e0c51c1cfd8297c0cde213c55088cb192750
      CLI_SHA: c4a575f85e7c40e707f4cb8bfbe8fcded4ffeefe6e1da1241545fad6c780078d
      MANAGER_SHA: 7e0dbfde84c815f953b02874654304f4c02d21952578f13d09f047609a6625b3
      LADYBUG_INSTALL_SHA: cb7d1110fa4144d39bd2d7ae347040a16cc5cced6607129409673655f22b099c
      LADYBUG_BINARY_SHA: 85b101251f07b052927443a994c69c23621f7c10159687145fa15b06decf7b49
    steps:
      - name: Checkout immutable recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout exact APP input with ancestry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: 6bb8d860d410217895efb7806e9ef907a62a4350
          path: _ni62_app_input
          persist-credentials: false
          fetch-depth: 0

      - name: Pin reviewed Node and npm
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: 22.14.0
          check-latest: false

      - name: Establish private scope and immutable source
        shell: bash
        run: |
          set -euo pipefail
          NI62_SCOPE="$RUNNER_TEMP/ni62-$SOURCE_KIND-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$NI62_SCOPE" && test ! -L "$NI62_SCOPE"
          mkdir -m 700 "$NI62_SCOPE"
          export NI62_SCOPE
          NI62_PROJECT="$NI62_SCOPE/npm-project"
          NI62_SOURCE="$NI62_SCOPE/source"
          NI62_CAPTURE="$NI62_SCOPE/originals"
          GITNEXUS_HOME="$NI62_SCOPE/gitnexus-home"
          NI62_ALIAS="ni62-$SOURCE_KIND-$GITHUB_RUN_ID"
          NPM_CONFIG_CACHE="$NI62_SCOPE/npm-cache"
          NPM_CONFIG_PREFIX="$NI62_SCOPE/npm-prefix"
          NPM_CONFIG_USERCONFIG="$NI62_SCOPE/npmrc"
          export NI62_PROJECT NI62_SOURCE NI62_CAPTURE GITNEXUS_HOME NI62_ALIAS NPM_CONFIG_CACHE NPM_CONFIG_PREFIX NPM_CONFIG_USERCONFIG
          for dir in "$NI62_PROJECT" "$NI62_CAPTURE" "$GITNEXUS_HOME" "$NPM_CONFIG_CACHE" "$NPM_CONFIG_PREFIX"; do mkdir -m 700 "$dir"; done
          printf '%s\n' 'ignore-scripts=true' 'audit=false' 'fund=false' 'update-notifier=false' > "$NPM_CONFIG_USERCONFIG"
          chmod 600 "$NPM_CONFIG_USERCONFIG"
          printf 'NI62_SCOPE=%s\nNI62_PROJECT=%s\nNI62_SOURCE=%s\nNI62_CAPTURE=%s\nGITNEXUS_HOME=%s\nNI62_ALIAS=%s\nNPM_CONFIG_CACHE=%s\nNPM_CONFIG_PREFIX=%s\nNPM_CONFIG_USERCONFIG=%s\n' \
            "$NI62_SCOPE" "$NI62_PROJECT" "$NI62_SOURCE" "$NI62_CAPTURE" "$GITNEXUS_HOME" "$NI62_ALIAS" "$NPM_CONFIG_CACHE" "$NPM_CONFIG_PREFIX" "$NPM_CONFIG_USERCONFIG" >> "$GITHUB_ENV"
          printf '%s\n' "$HOME" > "$NI62_CAPTURE/home-before.txt"
          test "$(node --version)" = v22.14.0
          test "$(npm --version)" = 10.9.2
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$ROOT_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = .github/workflows/ni62-kv-capacity-impact.yml
          git diff --exit-code "$ROOT_SHA" HEAD -- . ':(exclude).github/workflows/ni62-kv-capacity-impact.yml' > "$NI62_CAPTURE/recipe-only-diff.stdout"
          cp .github/workflows/ni62-kv-capacity-impact.yml "$NI62_CAPTURE/workflow.yml"
          sha256sum "$NI62_CAPTURE/workflow.yml" > "$NI62_CAPTURE/workflow.sha256"
          input="$GITHUB_WORKSPACE/_ni62_app_input"
          source_sha="$APP_SHA"
          printf 'NI62_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
          timeout --signal=TERM --kill-after=15s 120s git clone --no-local --no-hardlinks --no-checkout "$input" "$NI62_SOURCE" \
            > "$NI62_CAPTURE/source-clone.stdout" 2> "$NI62_CAPTURE/source-clone.stderr"
          timeout --signal=TERM --kill-after=15s 60s git -C "$NI62_SOURCE" checkout --detach "$source_sha" \
            > "$NI62_CAPTURE/source-checkout.stdout" 2> "$NI62_CAPTURE/source-checkout.stderr"
          chmod 700 "$NI62_SOURCE"
          test "$(git -C "$NI62_SOURCE" rev-parse HEAD)" = "$source_sha"
          test "$(git -C "$NI62_SOURCE" rev-parse --is-shallow-repository)" = false
          test -z "$(git -C "$NI62_SOURCE" status --porcelain=v1 --untracked-files=all)"
          test ! -e "$NI62_SOURCE/.gitnexus" && test ! -L "$NI62_SOURCE/.gitnexus"
          test ! -e /mnt/raid0/llm && test ! -L /mnt/raid0/llm
          test ! -e /workspace/repos && test ! -L /workspace/repos
          cat /proc/self/mountinfo > "$NI62_CAPTURE/mountinfo.txt"
          if rg -n '/mnt/raid0/llm|/workspace/repos' "$NI62_CAPTURE/mountinfo.txt"; then exit 64; fi
          git -C "$NI62_SOURCE" rev-parse HEAD > "$NI62_CAPTURE/source-head-before.txt"
          git -C "$NI62_SOURCE" status --porcelain=v1 --untracked-files=all > "$NI62_CAPTURE/source-status-before.txt"
          sha256sum "$NI62_SOURCE/scripts/server/stack_manifest.py" > "$NI62_CAPTURE/source-target.sha256"
          test "$(sha256sum "$NI62_SOURCE/scripts/server/stack_manifest.py" | cut -d' ' -f1)" = 5f7acb6d067e4420edfc2bcc662148cd8fc7aff6c90682c51ece207666171610
          printf '{"schema":"ni62.isolated_context.v1","source_kind":"%s","source_sha":"%s","recipe_sha":"%s","scope":"%s","HOME_unchanged":true,"direct_private_cli":true,"host_wrappers_called":false,"global_npm":false,"embeddings":false,"wiki":false,"LLM":false}\n' \
            "$SOURCE_KIND" "$source_sha" "$GITHUB_SHA" "$NI62_SCOPE" > "$NI62_CAPTURE/context.json"
          cat /etc/os-release > "$NI62_CAPTURE/os-release.txt"
          node --version > "$NI62_CAPTURE/node-version.txt"
          npm --version > "$NI62_CAPTURE/npm-version.txt"
          timeout --signal=TERM --kill-after=15s 30s node --input-type=module - <<'NODE' > "$NI62_CAPTURE/isolation-validation.stdout" 2> "$NI62_CAPTURE/isolation-validation.stderr"
          import fs from 'node:fs'; import path from 'node:path';
          const scope=process.env.NI62_SCOPE, uid=process.getuid();
          for(const value of [scope,process.env.NI62_PROJECT,process.env.NI62_SOURCE,process.env.NI62_CAPTURE,process.env.GITNEXUS_HOME,process.env.NPM_CONFIG_CACHE,process.env.NPM_CONFIG_PREFIX]) {
            if(!path.isAbsolute(value) || (value!==scope && !value.startsWith(scope+'/'))) throw Error('path outside private scope');
            const pieces=value.split('/').filter(Boolean); let prefix='/';
            for(const piece of pieces) {prefix=path.join(prefix,piece); if(fs.lstatSync(prefix).isSymbolicLink()) throw Error(`symlink directory ${prefix}`);}
            const stat=fs.statSync(value); if(stat.uid!==uid || (stat.mode & 0o777)!==0o700) throw Error(`nonprivate directory ${value}`);
          }
          // Preserve tracked symlinks, but ensure no reachable target leaves the private source.
          const source=process.env.NI62_SOURCE; const links=[];
          function visit(dir) {for(const entry of fs.readdirSync(dir,{withFileTypes:true})) {
            if(entry.name==='.git') continue;
            const file=path.join(dir,entry.name);
            if(entry.isSymbolicLink()) {
              const target=path.resolve(path.dirname(file),fs.readlinkSync(file));
              const reachable=fs.existsSync(file);
              if(reachable && !fs.realpathSync(file).startsWith(source+'/')) throw Error(`reachable external source symlink ${file}`);
              links.push({file,target,reachable});
            } else if(entry.isDirectory()) visit(file);
          }}
          visit(source); console.log(JSON.stringify({scope,uid,private:true,sourceSymlinks:links}));
          NODE

      - name: Verify reviewed npm graph and install without lifecycle
        shell: bash
        run: |
          set -euo pipefail
          lock_input="$GITHUB_WORKSPACE/artifacts/ni05/code-index-37358369281/ni52-index-install-originals-37358369281"
          test "$(sha256sum "$lock_input/package-lock.json" | cut -d' ' -f1)" = "$LOCK_SHA"
          test "$(sha256sum "$lock_input/gitnexus-1.6.8.tgz" | cut -d' ' -f1)" = "$TARBALL_SHA"
          timeout --signal=TERM --kill-after=15s 30s node --input-type=module - "$lock_input/package-lock.json" <<'NODE' > "$NI62_CAPTURE/lock-validation.stdout" 2> "$NI62_CAPTURE/lock-validation.stderr"
          import fs from 'node:fs';
          const lock=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(lock.lockfileVersion!==3 || lock.packages[''].dependencies.gitnexus!=='1.6.8') throw Error('root lock mismatch');
          const deps=Object.entries(lock.packages).filter(([key])=>key!=='');
          if(deps.length!==270) throw Error('locked package count mismatch');
          for(const [key,p] of deps) if(!p.resolved?.startsWith('https://registry.npmjs.org/') || !p.integrity?.startsWith('sha512-') || p.link || p.inBundle) throw Error(`unapproved package ${key}`);
          for(const key of ['node_modules/@ladybugdb/core','node_modules/@ladybugdb/core-linux-x64']) if(lock.packages[key].version!=='0.17.1') throw Error(`native version mismatch ${key}`);
          console.log(JSON.stringify({packages:deps.length,gitnexus:'1.6.8',passed:true}));
          NODE
          printf '%s\n' '{"name":"ni52-gitnexus-lock-prep","version":"1.0.0","private":true,"dependencies":{"gitnexus":"1.6.8"}}' > "$NI62_PROJECT/package.json"
          cp "$lock_input/package-lock.json" "$NI62_PROJECT/package-lock.json"
          cp "$lock_input/package-lock.json" "$NI62_CAPTURE/package-lock.json"
          timeout --signal=TERM --kill-after=15s 30s npm config get prefix > "$NI62_CAPTURE/npm-prefix.stdout" 2> "$NI62_CAPTURE/npm-prefix.stderr"
          timeout --signal=TERM --kill-after=15s 30s npm config get cache > "$NI62_CAPTURE/npm-cache.stdout" 2> "$NI62_CAPTURE/npm-cache.stderr"
          test "$(cat "$NI62_CAPTURE/npm-prefix.stdout")" = "$NPM_CONFIG_PREFIX"
          test "$(cat "$NI62_CAPTURE/npm-cache.stdout")" = "$NPM_CONFIG_CACHE"
          printf '%s\n' '["timeout","--signal=TERM","--kill-after=15s","480s","npm","ci","--ignore-scripts","--no-audit","--no-fund","--prefix","<private npm-project>"]' > "$NI62_CAPTURE/npm-ci-argv.json"
          set +e
          timeout --signal=TERM --kill-after=15s 480s npm ci --ignore-scripts --no-audit --no-fund --prefix "$NI62_PROJECT" \
            > "$NI62_CAPTURE/npm-ci.stdout" 2> "$NI62_CAPTURE/npm-ci.stderr"
          rc=$?
          set -e
          printf '{"exit_code":%s,"timeout_seconds":480,"ignore_scripts":true}\n' "$rc" > "$NI62_CAPTURE/npm-ci-status.json"
          test "$rc" -eq 0
          cmp "$lock_input/package-lock.json" "$NI62_PROJECT/package-lock.json"
          pkg="$NI62_PROJECT/node_modules/gitnexus"
          test "$(sha256sum "$pkg/package.json" | cut -d' ' -f1)" = "$PACKAGE_SHA"
          test "$(sha256sum "$pkg/dist/cli/index.js" | cut -d' ' -f1)" = "$CLI_SHA"
          test "$(sha256sum "$pkg/dist/storage/repo-manager.js" | cut -d' ' -f1)" = "$MANAGER_SHA"
          readlink -f "$NI62_PROJECT/node_modules/.bin/gitnexus" > "$NI62_CAPTURE/actual-cli-realpath.txt"
          test "$(cat "$NI62_CAPTURE/actual-cli-realpath.txt")" = "$pkg/dist/cli/index.js"
          sha256sum "$pkg/package.json" "$pkg/dist/cli/index.js" "$pkg/dist/storage/repo-manager.js" > "$NI62_CAPTURE/installed-tool.sha256"
          printf '{"package_sha256":"%s","cli_sha256":"%s","manager_sha256":"%s","lock_sha256":"%s","global_install":false}\n' \
            "$PACKAGE_SHA" "$CLI_SHA" "$MANAGER_SHA" "$LOCK_SHA" > "$NI62_CAPTURE/installed-tool-attestation.json"

      - name: Retain install originals immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ni62-app-install-originals-${{ github.run_id }}
          path: ${{ env.NI62_CAPTURE }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Verify and load audited prebuilt native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          native="$NI62_CAPTURE/native"
          mkdir -m 700 "$native"
          cd "$NI62_PROJECT"
          test "$(sha256sum node_modules/@ladybugdb/core/install.js | cut -d' ' -f1)" = "$LADYBUG_INSTALL_SHA"
          test ! -L node_modules/@ladybugdb/core-linux-x64/lbugjs.node
          test "$(sha256sum node_modules/@ladybugdb/core-linux-x64/lbugjs.node | cut -d' ' -f1)" = "$LADYBUG_BINARY_SHA"
          test ! -e node_modules/@ladybugdb/core/lbugjs.node && test ! -L node_modules/@ladybugdb/core/lbugjs.node
          cp -p node_modules/@ladybugdb/core-linux-x64/lbugjs.node node_modules/@ladybugdb/core/lbugjs.node
          test "$(sha256sum node_modules/@ladybugdb/core/lbugjs.node | cut -d' ' -f1)" = "$LADYBUG_BINARY_SHA"
          set +e
          timeout --signal=TERM --kill-after=15s 30s node - <<'NODE' > "$native/runtime.stdout" 2> "$native/runtime.stderr"
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const {Database}=require('@ladybugdb/core');
          console.log(JSON.stringify({ladybugVersion:Database.getVersion(),prebuilt:true}));
          const resolve=require('node-gyp-build');
          for(const [name,sha] of Object.entries({'tree-sitter-c':'85e912b183a49111b0f4c3a6c8908375732e70aca759ab0124501913cbbd942a','tree-sitter-proto':'dea80ed2fb48a6d19866468f652ec48eab5435306c6477b213eafe51cbbbf2ee'})) {
            const file=fs.realpathSync(resolve.path(path.join(process.cwd(),'node_modules/gitnexus/vendor',name)));
            if(!file.startsWith(process.cwd()+'/node_modules/gitnexus/vendor/') || !file.includes('/prebuilds/linux-x64/')) throw Error('native path outside reviewed prebuild');
            if(crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')!==sha) throw Error('native digest mismatch');
            require(file); console.log(JSON.stringify({name,file,sha256:sha,loaded:true}));
          }
          NODE
          rc=$?
          set -e
          printf '{"exit_code":%s,"native_compilation_attempted":false,"lifecycle_scripts_enabled":false}\n' "$rc" > "$native/command-status.json"
          test "$rc" -eq 0

      - name: Retain native originals immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ni62-app-native-originals-${{ github.run_id }}
          path: ${{ env.NI62_CAPTURE }}/native/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Run direct private CLI and exact entry-point evidence
        shell: bash
        run: |
          set -euo pipefail
          index="$NI62_CAPTURE/index"
          mkdir -m 700 "$index"
          cd "$NI62_SOURCE"
          cli="$NI62_PROJECT/node_modules/gitnexus/dist/cli/index.js"
          # No host wrapper, patcher, global CLI, PATH override or CI grant is used.
          run_capture() {
            local label="$1" seconds="$2"
            shift 2
            node -e 'require("node:fs").writeFileSync(process.argv[1],JSON.stringify(process.argv.slice(2))+"\n")' "$index/$label-argv.json" "$@"
            local rc=0
            if timeout --signal=TERM --kill-after=15s "${seconds}s" "$@" > "$index/$label.stdout" 2> "$index/$label.stderr"; then rc=0; else rc=$?; fi
            printf '{"exit_code":%s,"timeout_seconds":%s,"kill_after_seconds":15}\n' "$rc" "$seconds" > "$index/$label-status.json"
            return "$rc"
          }
          run_capture version 30 node "$cli" --version
          test "$(cat "$index/version.stdout")" = 1.6.8
          run_capture analyze 1200 node "$cli" analyze --index-only --skip-agents-md --skip-skills --name "$NI62_ALIAS" --workers 2
          run_capture status 120 node "$cli" status
          test -f .gitnexus/meta.json && test ! -L .gitnexus/meta.json
          cp .gitnexus/meta.json "$index/meta.json"
          cp "$GITNEXUS_HOME/registry.json" "$index/registry.json"
          run_capture meta-validation 30 node --input-type=module -e \
            'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(m.lastCommit!==process.argv[2] || Number(m.stats?.embeddings ?? -1)!==0) throw Error("wrong source or nonzero/missing embeddings"); console.log(JSON.stringify({lastCommit:m.lastCommit,stats:m.stats,passed:true}));' \
            "$index/meta.json" "$NI62_SOURCE_SHA"
          highstop_symbols=""
          unassessed_symbols=""
          for symbol in kv_layers kv_kib_per_token_f16 kv_gib_for validate_serving_shape_capacity; do
            uid="Function:scripts/server/stack_manifest.py:$symbol"
            run_capture "context-$symbol" 120 node "$cli" context --uid "$uid" --repo "$NI62_ALIAS" --content || context_rc=$?
            context_rc="${context_rc:-0}"
            if [ "$context_rc" -ne 0 ]; then unassessed_symbols="$unassessed_symbols $symbol:context-exit-$context_rc"; fi
            unset context_rc
            impact_rc=0
            if run_capture "impact-$symbol" 120 node "$cli" impact --uid "$uid" --direction upstream --repo "$NI62_ALIAS" --depth 3 --limit 100; then impact_rc=0; else impact_rc=$?; fi
            if [ "$impact_rc" -ne 0 ]; then
              unassessed_symbols="$unassessed_symbols $symbol:impact-exit-$impact_rc"
              printf '{"target":"%s","risk":"UNASSESSED","reason":"impact command exited nonzero","exit_code":%s}\n' "$uid" "$impact_rc" > "$index/decision-$symbol.json"
              continue
            fi
            if run_capture "validate-$symbol" 30 node --input-type=module -e \
              'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(r.target?.id!==process.argv[2] || r.direction!=="upstream" || r.epistemic!=="exact") throw Error("ambiguous/missing/non-exact impact"); const risk=String(r.risk).toUpperCase(); if(!["LOW","MEDIUM","HIGH","CRITICAL"].includes(risk)) throw Error("unrecognized risk"); console.log(JSON.stringify({target:r.target.id,risk,direction:r.direction,epistemic:r.epistemic,decision:["HIGH","CRITICAL"].includes(risk)?"HIGH_STOP":"CONTINUE"}));' \
              "$index/impact-$symbol.stdout" "$uid"; then
              cp "$index/validate-$symbol.stdout" "$index/decision-$symbol.json"
              if rg -q '"decision":"HIGH_STOP"' "$index/decision-$symbol.json"; then highstop_symbols="$highstop_symbols $symbol"; fi
            else
              validate_rc=$?
              unassessed_symbols="$unassessed_symbols $symbol:validation-exit-$validate_rc"
              printf '{"target":"%s","risk":"UNASSESSED","reason":"impact validation failed","exit_code":%s}\n' "$uid" "$validate_rc" > "$index/decision-$symbol.json"
            fi
          done
          # The module constant is data, not a callable target. Preserve exact literal references
          # from the pinned source and report impact as UNASSESSED, never LOW.
          set +e
          timeout --signal=TERM --kill-after=15s 60s git grep -n -F \
            -e 'kv_layers' -e 'kv_kib_per_token_f16' -e 'kv_gib_for' \
            -e 'validate_serving_shape_capacity' -e '_KV_TYPE_F16_RATIO' \
            HEAD -- > "$index/manual-exact-source-caller-map.stdout" 2> "$index/manual-exact-source-caller-map.stderr"
          grep_rc=$?
          set -e
          printf '{"exit_code":%s,"scope":"all tracked paths at pinned APP source SHA","constant_impact":"UNASSESSED","no_hit_means_LOW":false}\n' "$grep_rc" > "$index/manual-exact-source-caller-map-status.json"
          test "$grep_rc" -le 1
          printf '{"target":"_KV_TYPE_F16_RATIO","target_kind":"module constant","risk":"UNASSESSED","reason":"module constant is not a callable impact target; see manual exact-source caller map"}\n' > "$index/constant-impact-unassessed.json"
          test "$(sha256sum "$cli" | cut -d' ' -f1)" = "$CLI_SHA"
          test "$(sha256sum "$NI62_PROJECT/node_modules/gitnexus/package.json" | cut -d' ' -f1)" = "$PACKAGE_SHA"
          test "$(sha256sum "$NI62_PROJECT/package-lock.json" | cut -d' ' -f1)" = "$LOCK_SHA"
          printf '{"source_kind":"%s","source_sha":"%s","direct_private_cli":true,"host_index_deployment":false,"high_stop_symbols":"%s","unassessed_symbols":"%s"}\n' "$SOURCE_KIND" "$NI62_SOURCE_SHA" "$highstop_symbols" "$unassessed_symbols" > "$index/complete.json"
          if [ -n "$highstop_symbols" ]; then exit 42; fi
          if [ -n "$unassessed_symbols" ]; then exit 43; fi

      - name: Retain index and impact originals immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ni62-app-index-originals-${{ github.run_id }}
          path: ${{ env.NI62_CAPTURE }}/index/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Independently record source and isolation postchecks
        if: always() && env.NI62_SOURCE != ''
        shell: bash
        run: |
          set -euo pipefail
          post="$NI62_CAPTURE/postcheck"
          mkdir -m 700 "$post"
          test "$(git -C "$NI62_SOURCE" rev-parse HEAD)" = "$NI62_SOURCE_SHA"
          git -C "$NI62_SOURCE" status --porcelain=v1 --untracked-files=all > "$post/source-status.txt"
          git -C "$NI62_SOURCE" status --porcelain=v1 --untracked-files=all > "$post/source-status-repeat.txt"
          cmp "$post/source-status.txt" "$post/source-status-repeat.txt"
          test ! -s "$post/source-status.txt"
          git -C "$NI62_SOURCE" diff --exit-code HEAD > "$post/tracked-source-diff.stdout"
          test "$HOME" = "$(cat "$NI62_CAPTURE/home-before.txt")"
          test ! -e /mnt/raid0/llm && test ! -L /mnt/raid0/llm
          test ! -e /workspace/repos && test ! -L /workspace/repos
          test ! -e "$NI62_SCOPE/session-bus" && test ! -L "$NI62_SCOPE/session-bus"
          test "$(stat -c '%a' "$NI62_SCOPE")" = 700
          test "$(stat -c '%u' "$NI62_SCOPE")" = "$(id -u)"
          test ! -L "$NI62_SOURCE/.gitnexus"
          if [ -d "$NI62_SOURCE/.gitnexus" ]; then
            test -z "$(find "$NI62_SOURCE/.gitnexus" -type l -print -quit)"
            find "$NI62_SOURCE/.gitnexus" -type f -print0 | sort -z | xargs -0 -r sha256sum > "$post/generated-index.sha256"
          fi
          printf '{"source_sha":"%s","source_clean":true,"HOME_unchanged":true,"canonical_host_paths_absent":true,"bus_absent":true,"index_deployed":false}\n' "$NI62_SOURCE_SHA" > "$post/result.json"
          find "$NI62_CAPTURE" -type f ! -name sha256sums.txt -print0 | sort -z | xargs -0 -r sha256sum > "$post/sha256sums.txt"

      - name: Retain independent postchecks immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ni62-app-postcheck-${{ github.run_id }}
          path: ${{ env.NI62_CAPTURE }}/postcheck/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
