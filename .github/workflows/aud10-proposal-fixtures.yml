name: aud10 prospective native proposal fixtures
on:
  push:
    branches: [codex/proposal-fixture-native-20261008]
permissions:
  contents: read
jobs:
  source-fixture-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ROOT_ENROLLMENT_PIN: 84c441145cca9b088dfe7b9687e01b9e03156f75
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Initialize original status envelope
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proposal-native-aud10/result"
          printf '{"state":"setup_pending","exit_code":null}\n' > "$RUNNER_TEMP/proposal-native-aud10/status.json"
      - name: Checkout exact recipe and copied candidate subjects
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout unchanged existing producer and shared reader
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout published prospective enrollment independently
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_ENROLLMENT_PIN }}
          path: enrollment
          persist-credentials: false
          sparse-checkout: |
            scripts/vidya/adapters/README.md
            handoffs/active/vidya-belief-substrate-program.md
          sparse-checkout-cone-mode: false
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install original locked pytest closure
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/proposal-native-aud10/venv"
          "$RUNNER_TEMP/proposal-native-aud10/venv/bin/python" -m pip install --require-hashes --no-deps --only-binary=:all: -r recipe/scripts/ci/proposal_fixture_native/requirements.txt 2>&1 | tee "$RUNNER_TEMP/proposal-native-aud10/result/dependency-install.log"
      - name: Execute whole copied modules through existing capture producer
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/proposal-native-aud10/venv/bin/python" -I recipe/scripts/ci/proposal_fixture_native/capture.py aud10
      - name: Retain original result errors and source custody
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proposal-native-aud10-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proposal-native-aud10/result/
            ${{ runner.temp }}/proposal-native-aud10/source-readset.json
            ${{ runner.temp }}/proposal-native-aud10/status.json
          if-no-files-found: error
