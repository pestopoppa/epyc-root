name: NI08 EVL42 report native controls
on:
  push:
    branches: [codex/ni08-evl42-report-native-20261007]
permissions:
  contents: read
jobs:
  report-source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PYTEST_PLUGINS: ''
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: recipe
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: source
          ref: 112217d1422a74b6b4a13dbc8354381a0bf058d1
      - uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-inference-research
          path: research
          ref: cb801b9b7bb4ad3555ffc4be5a6d879cc6ae7875
      - uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          path: lock-source
          ref: 70096b763939a43409a1f1827ab633d62425a6c1
      - uses: actions/checkout@v4
        with:
          path: context
          ref: 7981a9acf2b8e2c328b9add8e21a68656c99c1d6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Fresh private hosted layout and dependency installation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/evl42-report"
          test ! -L "$RUNNER_TEMP/evl42-report"
          mkdir -m 0700 "$RUNNER_TEMP/evl42-report"
          printf '{"state":"installing"}\n' > "$RUNNER_TEMP/evl42-report/status.json"
          python -m venv "$RUNNER_TEMP/evl42-report-venv"
          "$RUNNER_TEMP/evl42-report-venv/bin/python" -m pip install --disable-pip-version-check --require-hashes --no-deps --only-binary=:all: -r recipe/scripts/ci/ni08_evl42_report_requirements.txt 2>&1 | tee "$RUNNER_TEMP/evl42-report/dependency-install.log"
      - name: Actual synthetic report attachment and existing carrier controls
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/evl42-report-venv/bin/python" recipe/scripts/ci/ni08_evl42_report_capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evl42-report-native-originals
          path: ${{ runner.temp }}/evl42-report
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
