name: NI07 DTAP native-tool contract fixtures

on:
  push:
    branches: [codex/ni07-dtap-native-ci-20261006]
    paths:
      - '.github/workflows/ni07-dtap.yml'
      - 'scripts/ci/ni07_dtap_capture.py'
      - 'artifacts/ni07/tool-rendering/dtap-ni07-11-ci-readset.json'
permissions:
  contents: read
jobs:
  dtap-native-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROOT_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      APP_PIN: 4c86bd611848ffa6aeca99843f0b964d59f7b5e0
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Initialize retained status before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni07/result"
          printf '{"schema":"ni07-dtap-ci-status.v1","state":"setup_pending","exit_code":null}\n' > "$RUNNER_TEMP/ni07/result/status.json"
      - name: Checkout workflow and capture recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout pinned native conformance producer
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_PIN }}
          path: root
          persist-credentials: false
      - name: Checkout exact DTAP source candidate
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated pytest dependency
        env:
          NI07_INSTALL_COMMAND: python -m pip install pytest==9.1.1
        run: python -m pip install pytest==9.1.1
      - name: Capture bounded fake-transport and fixture regressions
        if: always()
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          NI07_ROOT_PIN: ${{ env.ROOT_PIN }}
          NI07_APP_PIN: ${{ env.APP_PIN }}
          NI07_INSTALL_COMMAND: python -m pip install pytest==9.1.1
          PYTHONPATH: ${{ github.workspace }}/app
        run: python recipe/scripts/ci/ni07_dtap_capture.py
      - name: Retain original request, JUnit, logs, source readset, context, and status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni07-dtap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni07/result/
          if-no-files-found: error
