name: NI07-30 standalone guard NUMA capture
on:
  push:
    branches: [codex/ni07-30-cli-numa-capture-recipe-20261006]
    paths:
      - .github/workflows/ni07-30-standalone-numa-capture.yml
      - scripts/ci/ni07_30_standalone_numa_capture.py
permissions:
  contents: read
jobs:
  standalone-numa-synthetic:
    name: standalone-numa-synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PIN: 0059cfef33859b11adca42f53ff3f2831c558f32
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      NI07_RUNNER_CONTEXT: ubuntu-latest
      NI07_EXECUTION_CONTEXT: offline-synthetic-guard-fixtures
      NI07_INSTALL_COMMAND: >-
        python -m pip install pytest==9.0.3 iniconfig==2.3.0 packaging==26.0
        pluggy==1.6.0 Pygments==2.20.0 PyYAML==6.0.3 numpy==2.4.4
        pydantic==2.13.0 pydantic-settings==2.13.1 pydantic-core==2.46.0
        annotated-types==0.7.0 typing-inspection==0.4.2 python-dotenv==1.2.2
        typing-extensions==4.15.0
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/app
      ORCHESTRATOR_PATHS_LLAMA_CPP_BIN: /fixture/kernel-bin
      ORCHESTRATOR_PATHS_LLAMA_MTMD: /fixture/llama-mtmd-cli
      ORCHESTRATOR_PATHS_LLAMA_SERVER: /fixture/llama-server
      ORCHESTRATOR_PATHS_LOG_DIR: /dev/null
      ORCHESTRATOR_PATHS_REGISTRY_PATH: >-
        ${{ github.workspace }}/app/orchestration/model_registry.yaml
      ORCHESTRATOR_MOCK_MODE: '1'
      ORCHESTRATOR_IGNORE_RUNTIME_STACK_FACTS: '1'
      ORCHESTRATOR_LOG_DIR: /dev/null
      ORCHESTRATOR_SERVING_CALLS_LOG: off
      ORCHESTRATOR_COHERENCE_JUDGE_LOG: off
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni07-30-standalone-numa-capture/result"
          printf '%s\n' \
            '{"state":"setup_pending","job":"standalone-numa-synthetic","exit_code":null}' \
            > "$RUNNER_TEMP/ni07-30-standalone-numa-capture/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout reviewed APP source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install exact lock-resolved import closure
        run: ${{ env.NI07_INSTALL_COMMAND }}
      - name: Capture original JUnit and native synthetic receipt
        env:
          ORCHESTRATOR_PATHS_PROJECT_ROOT: ${{ runner.temp }}/ni07-30-inert-project
          ORCHESTRATOR_PATHS_LLM_ROOT: ${{ runner.temp }}/ni07-30-inert-llm
          ORCHESTRATOR_PATHS_MODELS_DIR: ${{ runner.temp }}/ni07-30-inert-models
          ORCHESTRATOR_PATHS_MODEL_BASE: ${{ runner.temp }}/ni07-30-inert-models
          ORCHESTRATOR_PATHS_CACHE_DIR: ${{ runner.temp }}/ni07-30-inert-cache
          ORCHESTRATOR_PATHS_TMP_DIR: ${{ runner.temp }}/ni07-30-inert-tmp
        run: python recipe/scripts/ci/ni07_30_standalone_numa_capture.py
      - name: Preserve status, original JUnit and every native receipt member
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni07-30-standalone-numa-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni07-30-standalone-numa-capture/result/
          if-no-files-found: error
