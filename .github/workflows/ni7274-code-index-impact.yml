      - name: Retain index and impact originals immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ni7274-${{ matrix.source }}-index-originals-${{ github.run_id }}
