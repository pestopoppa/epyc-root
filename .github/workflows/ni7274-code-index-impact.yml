          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Independently record source and isolation postchecks
        if: always() && env.NI7274_SOURCE != ''
        shell: bash
        run: |
          set -euo pipefail
          post="$NI7274_CAPTURE/postcheck"
          mkdir -m 700 "$post"
          test "$(git -C "$NI7274_SOURCE" rev-parse HEAD)" = "$NI7274_SOURCE_SHA"
          git -C "$NI7274_SOURCE" status --porcelain=v1 --untracked-files=all > "$post/source-status.txt"
          git -C "$NI7274_SOURCE" status --porcelain=v1 --untracked-files=all > "$post/source-status-repeat.txt"
          cmp "$post/source-status.txt" "$post/source-status-repeat.txt"
          test ! -s "$post/source-status.txt"
          git -C "$NI7274_SOURCE" diff --exit-code HEAD > "$post/tracked-source-diff.stdout"
          test "$HOME" = "$(cat "$NI7274_CAPTURE/home-before.txt")"
          test ! -e /mnt/raid0/llm && test ! -L /mnt/raid0/llm
          test ! -e /workspace/repos && test ! -L /workspace/repos
          test ! -e "$NI7274_SCOPE/session-bus" && test ! -L "$NI7274_SCOPE/session-bus"
          test "$(stat -c '%a' "$NI7274_SCOPE")" = 700
          test "$(stat -c '%u' "$NI7274_SCOPE")" = "$(id -u)"
          test ! -L "$NI7274_SOURCE/.gitnexus"
          if [ -d "$NI7274_SOURCE/.gitnexus" ]; then
            test -z "$(find "$NI7274_SOURCE/.gitnexus" -type l -print -quit)"
            find "$NI7274_SOURCE/.gitnexus" -type f -print0 | sort -z | xargs -0 -r sha256sum > "$post/generated-index.sha256"
          fi
          printf '{"source_sha":"%s","source_clean":true,"HOME_unchanged":true,"canonical_host_paths_absent":true,"bus_absent":true,"index_deployed":false}\n' "$NI7274_SOURCE_SHA" > "$post/result.json"
          find "$NI7274_CAPTURE" -type f ! -name sha256sums.txt -print0 | sort -z | xargs -0 -r sha256sum > "$post/sha256sums.txt"

      - name: Retain independent postchecks immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ni7274-${{ matrix.source }}-postcheck-${{ github.run_id }}
          path: ${{ env.NI7274_CAPTURE }}/postcheck/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
