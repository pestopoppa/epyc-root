name: NI27 terminal REPL timeout
on:
  push:
    branches: [codex/ni07-27-repl-terminal-timeout-20261006]
    paths:
      - .github/workflows/ni07-27-repl-timeout.yml
      - scripts/ci/ni07_27_repl_timeout_capture.py
permissions:
  contents: read
jobs:
  repl-timeout:
    name: repl-timeout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_PIN: 506acf51a060adc85e4c693221a2f50cd3342968
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      NI27_RUNNER_CONTEXT: ubuntu-latest
      ORCHESTRATOR_PATHS_PROJECT_ROOT: ${{ github.workspace }}/app
      ORCHESTRATOR_PATHS_LLAMA_CPP_BIN: /fixture/kernel-bin
      ORCHESTRATOR_PATHS_LLAMA_MTMD: /fixture/llama-mtmd-cli
      ORCHESTRATOR_PATHS_LLAMA_SERVER: /fixture/llama-server
      ORCHESTRATOR_MOCK_MODE: '1'
      ORCHESTRATOR_SERVING_CALLS_LOG: off
      ORCHESTRATOR_COHERENCE_JUDGE: '0'
      ORCHESTRATOR_COHERENCE_JUDGE_LOG: off
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      ORCHESTRATOR_SESSION_HMAC_KEY: ni07-27-synthetic-fixture-key
      NI27_INSTALL_COMMAND: >-
        python -m pip install uv==0.8.15; uv sync --frozen --no-dev;
        uv pip install --python .venv/bin/python pytest==9.0.3 pytest-asyncio==1.3.0
        iniconfig==2.3.0 packaging==26.0 pluggy==1.6.0 Pygments==2.20.0
        networkx==3.6.1
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni07-27-repl-timeout/result"
          printf '{"state":"setup_pending","job":"repl-timeout","exit_code":null}\n' > "$RUNNER_TEMP/ni07-27-repl-timeout/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout reviewed APP source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install frozen application, graph, and test dependencies
        working-directory: app
        run: |
          python -m pip install uv==0.8.15
          uv sync --frozen --no-dev
          # The lock contains networkx only through an excluded torch path; the fixture's
          # metadata guard still requires the exact locked package, so install it as a fixture extra.
          uv pip install --python .venv/bin/python pytest==9.0.3 pytest-asyncio==1.3.0 \
            iniconfig==2.3.0 packaging==26.0 pluggy==1.6.0 Pygments==2.20.0 \
            networkx==3.6.1
      - name: Capture original terminal timeout receipt
        working-directory: app
        env:
          PYTHONPATH: ${{ github.workspace }}/app
        run: .venv/bin/python "$GITHUB_WORKSPACE/recipe/scripts/ci/ni07_27_repl_timeout_capture.py"
      - name: Preserve original receipt, JUnit and status on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni07-27-repl-timeout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni07-27-repl-timeout/result/
          if-no-files-found: error
