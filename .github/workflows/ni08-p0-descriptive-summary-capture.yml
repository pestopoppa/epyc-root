name: HS-19d.P0 descriptive summary native capture
on:
  push:
    branches: [codex/ni08-hs19d-p0-summary-capture-20261006]
permissions:
  contents: read
jobs:
  p0-descriptive-summary-capture:
    name: p0-descriptive-summary-capture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_PIN: 224fbf991f7b68aa6466ecbaf829a336c20d5f5c
      ROOT_SOURCE_PIN: 4295ff6255576d97822661857990b89087e3bcd9
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      P0_RUNNER_CONTEXT: ubuntu-24.04
      P0_EXECUTION_CONTEXT: pytest-pinned-verdict-summary-no-inference
      P0_INSTALL_COMMAND: >-
        python -m venv "$RUNNER_TEMP/ni08-p0-summary/venv" &&
        "$RUNNER_TEMP/ni08-p0-summary/venv/bin/python" -m pip install
        --require-hashes --no-deps --only-binary=:all: -r
        recipe/scripts/ci/ni08_p0_summary_requirements.txt
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Initialize status before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni08-p0-summary/result"
          printf '{"state":"setup_pending","exit_code":null}\n' > "$RUNNER_TEMP/ni08-p0-summary/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout shared native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout pinned APP source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - name: Checkout exact ROOT verdict source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_SOURCE_PIN }}
          path: root-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install isolated hash-locked wheel-only test dependencies
        run: |
          set -euo pipefail
          ${{ env.P0_INSTALL_COMMAND }} 2>&1 | tee "$RUNNER_TEMP/ni08-p0-summary/result/dependency-install.log"
      - name: Capture the four exact descriptive-summary cases
        run: |
          export HS19D_ROOT_CHECKOUT="$GITHUB_WORKSPACE/root-source"
          "$RUNNER_TEMP/ni08-p0-summary/venv/bin/python" recipe/scripts/ci/ni08_p0_summary_capture.py
      - name: Preserve status, original JUnit, native receipt and original-only grade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni08-p0-descriptive-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni08-p0-summary/result/
          if-no-files-found: error
