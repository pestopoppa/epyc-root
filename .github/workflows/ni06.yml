name: NI06 pinned fixture conformance
on:
  push:
    branches: [codex/ni06-ci-20261006]
    paths:
      - .github/workflows/ni06.yml
      - scripts/ci/ni06_capture.py
      - scripts/ci/ni06_reader_b_pytest.py
permissions:
  contents: read
jobs:
  fixtures:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: root-graph
            app_pin: ''
            deps: pytest==9.1.1
          - job: cj13
            app_pin: 1721cc208d756506b7d31e315436f1edf8cb343b
            deps: pytest==9.1.1 jsonschema==4.25.1
          - job: k3
            app_pin: 9d3a338acdd3dec258afee27ac3d359dc35efbf3
            deps: pytest==9.1.1 numpy==2.3.2
    env:
      ROOT_PIN: ec513cbefa937bbe382ea502a88ab96c27022863
      NI06_JOB: ${{ matrix.job }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      ORCHESTRATOR_MOCK_MODE: '1'
      ORCHESTRATOR_LOG_DIR: /dev/null
      PYTHONUNBUFFERED: '1'
      KB_RAG_QUERY_LENGTH_LOG: 'off'
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni06/result/$NI06_JOB"
          printf '{"state":"setup_pending","job":"%s"}\n' "$NI06_JOB" > "$RUNNER_TEMP/ni06/result/$NI06_JOB/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout pinned native receipt producer and root fixtures
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_PIN }}
          path: root
          persist-credentials: false
      - name: Checkout pinned application fixtures
        if: matrix.app_pin != ''
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ matrix.app_pin }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared test dependencies
        env:
          NI06_DEPS: ${{ matrix.deps }}
        run: python -m pip install $NI06_DEPS
      - name: Capture native fixture evidence
        env:
          NI06_INSTALL_COMMAND: python -m pip install ${{ matrix.deps }}
        run: |
          if [ "$NI06_JOB" = root-graph ]; then
            export PYTHONPATH="$GITHUB_WORKSPACE/root"
          else
            export PYTHONPATH="$GITHUB_WORKSPACE/app"
          fi
          python recipe/scripts/ci/ni06_capture.py
      - name: Retain native receipt, JUnit and status on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni06-${{ matrix.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni06/result/${{ matrix.job }}/
          if-no-files-found: error
