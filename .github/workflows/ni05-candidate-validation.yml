name: NI05 candidate hermetic validation
on:
  push:
    branches: ['codex/ni05-validation-*']
permissions:
  contents: read
env:
  ROOT_SHA: 36c191832bd58f175f0a7b90e733f2ea14a5169b
  RESEARCH_SHA: e98909009f5dd2d148ad0e93029ea9fb85ba031f
  ORCH_SHA: 2c4bd7dae00dd6e9bc38a75e98ade6a493bafe54
jobs:
  root:
    # Exact unchanged root source passed focused validation in run 37282435460.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORCHESTRATOR_PATHS_LLAMA_CPP_BIN: /tmp/ni05-unused-cpu-bin
      ORCHESTRATOR_PATHS_LLAMA_MTMD: /tmp/ni05-unused-mtmd
      ORCHESTRATOR_PATHS_LLAMA_SERVER: /tmp/ni05-unused-llama-server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ROOT_SHA }}
          path: root
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-control
      - uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-inference-research
          ref: ${{ env.RESEARCH_SHA }}
          path: research
      - uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.ORCH_SHA }}
          path: orchestrator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared fixture dependencies
        run: python -m pip install pytest==9.1.1 pyyaml numpy requests httpx rich sympy
      - name: Bind pinned sibling producers in ephemeral runner
        run: |
          sudo mkdir -p /workspace/repos /mnt/raid0/llm
          sudo ln -s "$GITHUB_WORKSPACE/research" /workspace/repos/epyc-inference-research
          sudo ln -s "$GITHUB_WORKSPACE/orchestrator" /workspace/repos/epyc-orchestrator
          sudo ln -s "$GITHUB_WORKSPACE/orchestrator" /mnt/raid0/llm/epyc-orchestrator
          ln -s research epyc-inference-research
          ln -s orchestrator epyc-orchestrator
          echo 'c46aa7f76064782f03b0db388bef220f301f6ff6d7d397c2e2274eac84eadc10  research/scripts/validate/check_evidence_durability.py' | sha256sum -c -
          echo '8caeb33dbb12986fadc385afe25d22bd791b036253c736f9527e67a55f85e268  research/scripts/kernel_rnd/exl3/evidence.py' | sha256sum -c -
      - name: Promotion fixture (no real promotion)
        working-directory: root
        run: python scripts/coordination/tests/test_promote_lane.py DefaultLockDirectoryTests
      - name: Focused native adapter and carrier acceptance
        working-directory: root
        env:
          EPYC_RESEARCH_ROOT: ${{ github.workspace }}/research
          VIDYA_ORCH_WRITER_ROOT: ${{ github.workspace }}/orchestrator
        run: |
          python scripts/ci/native_conformance.py --cwd "$PWD" --junit focused.xml --output native-focused \
            --repo "root=$PWD" --repo "research=$GITHUB_WORKSPACE/research" \
            --repo "orchestrator=$GITHUB_WORKSPACE/orchestrator" --repo "ci-control=$GITHUB_WORKSPACE/ci-control" \
            --read-path ../ci-control/.github/workflows/ni05-candidate-validation.yml \
            --read-path tests/vidya/test_kv_quant_27b_v10_adapter.py \
            --read-path tests/vidya/test_evidence_durability_adapter.py \
            --read-path tests/vidya/test_ci_conformance.py \
            --read-path tests/vidya/test_ingest_sources.py --read-path tests/vidya/test_claim_tuple.py \
            --read-path scripts/vidya/adapters/evidence_durability.py \
            --read-path scripts/vidya/adapters/ci_conformance.py \
            --read-path ../research/scripts/validate/check_evidence_durability.py \
            --read-path scripts/vidya/claim_tuple.py --read-path scripts/vidya/ingest_sources.py \
            --read-path scripts/vidya/cli.py \
            --select tests/vidya/test_kv_quant_27b_v10_adapter.py \
            --select tests/vidya/test_evidence_durability_adapter.py --select tests/vidya/test_ci_conformance.py \
            --select tests/vidya/test_ingest_sources.py --select tests/vidya/test_claim_tuple.py \
            -- python -m pytest -q tests/vidya/test_kv_quant_27b_v10_adapter.py \
               tests/vidya/test_evidence_durability_adapter.py tests/vidya/test_ci_conformance.py \
               tests/vidya/test_ingest_sources.py tests/vidya/test_claim_tuple.py --junitxml=focused.xml
      - name: Vidya including actual writer archive roundtrip
        if: always()
        working-directory: root
        env:
          EPYC_RESEARCH_ROOT: ${{ github.workspace }}/research
          VIDYA_ORCH_WRITER_ROOT: ${{ github.workspace }}/orchestrator
        run: python -m pytest -q tests/vidya --junitxml=vidya.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-results
          path: |
            root/vidya.xml
            root/focused.xml
            root/native-focused/
  research:
    # Exact unchanged research source passed KVQ/durability in run 37282435460.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORCHESTRATOR_PATHS_LLAMA_CPP_BIN: /tmp/ni05-unused-cpu-bin
      ORCHESTRATOR_PATHS_LLAMA_MTMD: /tmp/ni05-unused-mtmd
      ORCHESTRATOR_PATHS_LLAMA_SERVER: /tmp/ni05-unused-llama-server
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-inference-research
          ref: ${{ env.RESEARCH_SHA }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ROOT_SHA }}
          path: ci-source
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-control
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.ORCH_SHA }}
          path: orchestrator-binding
      - name: Bind authoritative scoring sibling in ephemeral runner
        run: |
          sudo mkdir -p /mnt/raid0/llm /workspace/repos
          sudo ln -s "$GITHUB_WORKSPACE/orchestrator-binding" /mnt/raid0/llm/epyc-orchestrator
          sudo ln -s "$GITHUB_WORKSPACE" /mnt/raid0/llm/epyc-inference-research
          sudo ln -s "$GITHUB_WORKSPACE" /workspace/repos/epyc-inference-research
      - name: Install pinned test extra and declared benchmark dependencies
        run: python -m pip install '.[benchmark,test]'
      - name: Durability strict and optional fixture contracts
        run: |
          echo 'NOT RUN off-host: test_the_real_registry_has_no_durability_errors requires the live raw evidence corpus; retained host validator job covers this separately.'
          python -m pytest -q scripts/validate/test_check_evidence_durability.py -k 'not test_the_real_registry_has_no_durability_errors' --junitxml=durability.xml
      - name: Native KVQ summary ingest and fail-closed median fixtures
        if: always()
        env:
          EPYC_ROOT_REPO: ${{ github.workspace }}/ci-source
        run: |
          python ci-source/scripts/ci/native_conformance.py --cwd "$PWD" --junit kvq.xml --output native-kvq \
            --repo "research=$PWD" --repo "root=$GITHUB_WORKSPACE/ci-source" \
            --repo "ci-control=$GITHUB_WORKSPACE/ci-control" \
            --read-path ci-control/.github/workflows/ni05-candidate-validation.yml \
            --read-path scripts/benchmark/test_kv_quant_27b_v10_ingest.py \
            --read-path scripts/benchmark/kv_quant_27b_v10_sweep.py \
            --read-path ci-source/scripts/vidya/adapters/kv_quant_27b_v10.py \
            --select scripts/benchmark/test_kv_quant_27b_v10_ingest.py \
            -- python -m pytest -q scripts/benchmark/test_kv_quant_27b_v10_ingest.py --junitxml=kvq.xml
      - name: Benchmark collection reproduction
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
          EPYC_ORCHESTRATOR_ROOT: ${{ github.workspace }}/orchestrator-binding
        shell: bash
        run: |
          set -o pipefail
          python -m pytest scripts/benchmark --collect-only -q 2>&1 | tee collection.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-results
          path: |
            durability.xml
            collection.txt
            kvq.xml
            native-kvq/
  orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      ORCHESTRATOR_MOCK_MODE: 'true'
      ORCHESTRATOR_PATHS_LLAMA_CPP_BIN: /tmp/ni05-unused-cpu-bin
      ORCHESTRATOR_PATHS_LLAMA_MTMD: /tmp/ni05-unused-mtmd
      ORCHESTRATOR_PATHS_LLAMA_SERVER: /tmp/ni05-unused-llama-server
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.ORCH_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-inference-research
          ref: ${{ env.RESEARCH_SHA }}
          path: research-binding
      - name: Resolve tracked registry symlink from pinned research checkout
        run: |
          sudo mkdir -p /mnt/raid0/llm
          sudo ln -s "$GITHUB_WORKSPACE/research-binding" /mnt/raid0/llm/epyc-inference-research
          test -r orchestration/model_registry_full.yaml
      - name: Makefile fail-closed fixture contracts
        run: python tests/unit/test_makefile_gate_contract.py
      - name: Install declared dev dependencies
        run: |
          python -m pip install '.[dev]'
          python -c 'from importlib.metadata import version; print("resolved pydantic-graph=" + version("pydantic-graph"))'
      - name: Kernel override and reviewed topology fixture contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q tests/unit/test_kernel_path_env_overrides.py tests/unit/test_graph_dependency_contract.py \
            tests/unit/test_default_template_topology_parity.py \
            tests/unit/test_stack_templates_v2.py::TestDefaultYamlRoundTrip::test_default_yaml_loads_and_validates \
            tests/unit/test_fleet_layer_dispatch.py tests/unit/test_v1_subagent_link.py --junitxml=topology.xml
      - name: Flags MCP and v1 mock isolation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/unit/test_runtime_flags.py tests/unit/test_openai_compat_backend_failure_status.py tests/unit/test_features.py tests/unit/test_mcp_undeclared_args_refused.py tests/unit/test_mcp_server.py tests/unit/test_mcp_chat_tool.py tests/unit/test_openai* --junitxml=orchestrator.xml
      - name: Native enqueue timing producer fixtures
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/unit/test_serving_calls.py tests/unit/test_inference_mixin.py --junitxml=enqueue-timing.xml
      - name: v1 mock test set in reversed file order
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          mapfile -t files < <(printf '%s\n' tests/unit/test_openai* | sort -r)
          python -m pytest -q "${files[@]}" --junitxml=orchestrator-reverse.xml
      - name: Broad unit fixture sweep after focused success
        if: success()
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/unit --junitxml=unit-broad.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orchestrator-results
          path: |
            orchestrator.xml
            orchestrator-reverse.xml
            enqueue-timing.xml
            topology.xml
            unit-broad.xml
  node-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ROOT_SHA }}
      - uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: 350c726aa8b6b11eb9242040bc5eb7ae837fbf8a
          path: opencode-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install exact audited SDK contract inputs (no repository lock exists)
        run: |
          mkdir sdk-fixture
          cd sdk-fixture
          npm init -y
          npm install --ignore-scripts --save-exact @ai-sdk/openai-compatible@2.0.41 @ai-sdk/provider@3.0.8 @ai-sdk/provider-utils@4.0.23
      - name: Node fixture and captured-fetch contract (no live service)
        env:
          EPYC_OPENCODE_SOURCE_DIR: ${{ github.workspace }}/opencode-source
          EPYC_OPENCODE_CONTRACT: '1'
          EPYC_OPENCODE_SDK_DIR: ${{ github.workspace }}/sdk-fixture
        working-directory: harness/opencode-plugin
        run: |
          node --test 'test/*.test.ts'
          npm run lint:config
          npm run lint:config:subagents
