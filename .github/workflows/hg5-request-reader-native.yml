name: HG5 strict native-label reader source controls
on:
  push:
    branches: [codex/hg5-v2-reader-closure-source-20261008]
permissions:
  contents: read
jobs:
  hg5-reader-source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_SOURCE_PIN: 352d4208931a6cf1ee21363fce390f6ae26bb81f
      HG5_WRITER_SOURCE: ${{ github.workspace }}/app/src/runtime/hg5_request_event.py
      UFH13_RESEARCH_PIN: 1bace97dc655ab5896291b4571781e53b821d9a3
      UFH13_RESEARCH_ROOT: ${{ github.workspace }}/ufh13-research
      ROOT_CONTEXT_PIN: 11649e2a2245407b4bf5a1d66bd993901654e5ac
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Initialize prospective original envelope
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hg5-reader-native/result"
          printf '{"state":"setup_pending","exit_code":null}\n' > "$RUNNER_TEMP/hg5-reader-native/status.json"
      - name: Checkout exact ROOT recipe and adapter proposal
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact APP stdlib writer source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_SOURCE_PIN }}
          path: app
          persist-credentials: false
          sparse-checkout: |
            src/runtime/hg5_request_event.py
            src/runtime/schemas/hg5-request-intervention-v1.json
            src/runtime/schemas/hg5-request-intervention-v2.json
          sparse-checkout-cone-mode: false
      - name: Checkout unchanged original CI carrier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout exact UFH13 fixture producer source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pestopoppa/epyc-inference-research
          ref: ${{ env.UFH13_RESEARCH_PIN }}
          path: ufh13-research
          persist-credentials: false
          sparse-checkout: scripts/benchmark/thesis_ufh13/score.py
          sparse-checkout-cone-mode: false
      - name: Bind null source-map commit to the exact event ROOT head
        run: |
          set -euo pipefail
          python3 -I recipe/scripts/ci/hg5_reader_native/bind_source_map.py
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install existing minimal locked native-test environment
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/hg5-reader-native/venv"
          "$RUNNER_TEMP/hg5-reader-native/venv/bin/python" -m pip install --require-hashes --no-deps --only-binary=:all: -r recipe/scripts/ci/hg5_reader_native/requirements.txt 2>&1 | tee "$RUNNER_TEMP/hg5-reader-native/result/dependency-install.log"
      - name: Capture whole-module selected synthetic source controls once
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/hg5-reader-native/venv/bin/python" -I recipe/scripts/ci/hg5_reader_native/capture.py
      - name: Retain original verdict JUnit errors and source custody
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hg5-reader-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hg5-reader-native/result/
            ${{ runner.temp }}/hg5-reader-native/source-readset.json
            ${{ runner.temp }}/hg5-reader-native/status.json
            ${{ runner.temp }}/hg5-reader-native/source-map.bound.json
          if-no-files-found: error
