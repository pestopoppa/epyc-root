name: NI76 immutable off-host entry-point impact

on:
  push:
    branches: [codex/ni76-code-index-impact-20261005]
    paths: [.github/workflows/ni76-code-index-impact.yml]

permissions:
  contents: read

concurrency:
  group: ni76-code-index-impact-20261005
  cancel-in-progress: false

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        source: [root, app]
    env:
      SOURCE_KIND: ${{ matrix.source }}
      ROOT_SHA: e6c0c9db7282ab85acdc2cc4b9119c72bfab02e1
      APP_SHA: 6bb8d860d410217895efb7806e9ef907a62a4350
      LOCK_SHA: 734c187820f8e972354dec7aa7519ce37bf0b688530ef83623d8baeb645b448c
      TARBALL_SHA: 9c90be3532671e6f4a94f949816113389798a26c604e61f7953dadaa405ecdd6
      PACKAGE_SHA: 99deb36e0705d0553fcd1baf1951e0c51c1cfd8297c0cde213c55088cb192750
      CLI_SHA: c4a575f85e7c40e707f4cb8bfbe8fcded4ffeefe6e1da1241545fad6c780078d
      MANAGER_SHA: 7e0dbfde84c815f953b02874654304f4c02d21952578f13d09f047609a6625b3
      LADYBUG_INSTALL_SHA: cb7d1110fa4144d39bd2d7ae347040a16cc5cced6607129409673655f22b099c
      LADYBUG_BINARY_SHA: 85b101251f07b052927443a994c69c23621f7c10159687145fa15b06decf7b49
    steps:
      - name: Checkout immutable recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout exact APP input with ancestry
        if: matrix.source == 'app'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: 6bb8d860d410217895efb7806e9ef907a62a4350
          path: _ni76_app_input
          persist-credentials: false
          fetch-depth: 0

      - name: Pin reviewed Node and npm
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: 22.14.0
          check-latest: false

      - name: Establish private scope and immutable source
        shell: bash
        run: |
          set -euo pipefail
          NI76_SCOPE="$RUNNER_TEMP/ni76-$SOURCE_KIND-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$NI76_SCOPE" && test ! -L "$NI76_SCOPE"
          mkdir -m 700 "$NI76_SCOPE"
          export NI76_SCOPE
          NI76_PROJECT="$NI76_SCOPE/npm-project"
          NI76_SOURCE="$NI76_SCOPE/source"
          NI76_CAPTURE="$NI76_SCOPE/originals"
          GITNEXUS_HOME="$NI76_SCOPE/gitnexus-home"
          NI76_ALIAS="ni76-$SOURCE_KIND-$GITHUB_RUN_ID"
          NPM_CONFIG_CACHE="$NI76_SCOPE/npm-cache"
          NPM_CONFIG_PREFIX="$NI76_SCOPE/npm-prefix"
          NPM_CONFIG_USERCONFIG="$NI76_SCOPE/npmrc"
          export NI76_PROJECT NI76_SOURCE NI76_CAPTURE GITNEXUS_HOME NI76_ALIAS NPM_CONFIG_CACHE NPM_CONFIG_PREFIX NPM_CONFIG_USERCONFIG
          for dir in "$NI76_PROJECT" "$NI76_CAPTURE" "$GITNEXUS_HOME" "$NPM_CONFIG_CACHE" "$NPM_CONFIG_PREFIX"; do mkdir -m 700 "$dir"; done
          printf '%s\n' 'ignore-scripts=true' 'audit=false' 'fund=false' 'update-notifier=false' > "$NPM_CONFIG_USERCONFIG"
          chmod 600 "$NPM_CONFIG_USERCONFIG"
          printf 'NI76_SCOPE=%s\nNI76_PROJECT=%s\nNI76_SOURCE=%s\nNI76_CAPTURE=%s\nGITNEXUS_HOME=%s\nNI76_ALIAS=%s\nNPM_CONFIG_CACHE=%s\nNPM_CONFIG_PREFIX=%s\nNPM_CONFIG_USERCONFIG=%s\n' \
            "$NI76_SCOPE" "$NI76_PROJECT" "$NI76_SOURCE" "$NI76_CAPTURE" "$GITNEXUS_HOME" "$NI76_ALIAS" "$NPM_CONFIG_CACHE" "$NPM_CONFIG_PREFIX" "$NPM_CONFIG_USERCONFIG" >> "$GITHUB_ENV"
          printf '%s\n' "$HOME" > "$NI76_CAPTURE/home-before.txt"
          test "$(node --version)" = v22.14.0
          test "$(npm --version)" = 10.9.2
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$ROOT_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = .github/workflows/ni76-code-index-impact.yml
          git diff --exit-code "$ROOT_SHA" HEAD -- . ':(exclude).github/workflows/ni76-code-index-impact.yml' > "$NI76_CAPTURE/recipe-only-diff.stdout"
          cp .github/workflows/ni76-code-index-impact.yml "$NI76_CAPTURE/workflow.yml"
          sha256sum "$NI76_CAPTURE/workflow.yml" > "$NI76_CAPTURE/workflow.sha256"
          if [ "$SOURCE_KIND" = root ]; then input="$GITHUB_WORKSPACE"; source_sha="$ROOT_SHA"; else input="$GITHUB_WORKSPACE/_ni76_app_input"; source_sha="$APP_SHA"; fi
          printf 'NI76_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
          timeout --signal=TERM --kill-after=15s 120s git clone --no-local --no-hardlinks --no-checkout "$input" "$NI76_SOURCE" \
            > "$NI76_CAPTURE/source-clone.stdout" 2> "$NI76_CAPTURE/source-clone.stderr"
          timeout --signal=TERM --kill-after=15s 60s git -C "$NI76_SOURCE" checkout --detach "$source_sha" \
            > "$NI76_CAPTURE/source-checkout.stdout" 2> "$NI76_CAPTURE/source-checkout.stderr"
          chmod 700 "$NI76_SOURCE"
          test "$(git -C "$NI76_SOURCE" rev-parse HEAD)" = "$source_sha"
          test "$(git -C "$NI76_SOURCE" rev-parse --is-shallow-repository)" = false
          test -z "$(git -C "$NI76_SOURCE" status --porcelain=v1 --untracked-files=all)"
          test ! -e "$NI76_SOURCE/.gitnexus" && test ! -L "$NI76_SOURCE/.gitnexus"
          test ! -e /mnt/raid0/llm && test ! -L /mnt/raid0/llm
          test ! -e /workspace/repos && test ! -L /workspace/repos
          cat /proc/self/mountinfo > "$NI76_CAPTURE/mountinfo.txt"
          if rg -n '/mnt/raid0/llm|/workspace/repos' "$NI76_CAPTURE/mountinfo.txt"; then exit 64; fi
          git -C "$NI76_SOURCE" rev-parse HEAD > "$NI76_CAPTURE/source-head-before.txt"
          git -C "$NI76_SOURCE" status --porcelain=v1 --untracked-files=all > "$NI76_CAPTURE/source-status-before.txt"
          sha256sum "$NI76_SOURCE/scripts/gitnexus-analyze.sh" > "$NI76_CAPTURE/source-wrapper.sha256"
          if [ "$SOURCE_KIND" = root ]; then
            test "$(sha256sum "$NI76_SOURCE/scripts/gitnexus-analyze.sh" | cut -d' ' -f1)" = 628b96a3c6ca54299eb80502ffa0623b22ad0120ccaa75b9b66dae57b87a4a91
            sha256sum "$NI76_SOURCE/scripts/gitnexus-patch.js" > "$NI76_CAPTURE/source-patcher.sha256"
            test "$(sha256sum "$NI76_SOURCE/scripts/gitnexus-patch.js" | cut -d' ' -f1)" = a568a90041c16b179e376ea2d760098f9caaf1d5749051623af989b0c55c295a
          else
            test "$(sha256sum "$NI76_SOURCE/scripts/gitnexus-analyze.sh" | cut -d' ' -f1)" = ceffa0e215a363c49b74445ecd2db3818b0fbe6c4d9152f993196412ad57e894
          fi
          printf '{"schema":"ni76.isolated_context.v1","source_kind":"%s","source_sha":"%s","recipe_sha":"%s","scope":"%s","HOME_unchanged":true,"direct_private_cli":true,"host_wrappers_called":false,"global_npm":false,"embeddings":false,"wiki":false,"LLM":false}\n' \
            "$SOURCE_KIND" "$source_sha" "$GITHUB_SHA" "$NI76_SCOPE" > "$NI76_CAPTURE/context.json"
          cat /etc/os-release > "$NI76_CAPTURE/os-release.txt"
          node --version > "$NI76_CAPTURE/node-version.txt"
          npm --version > "$NI76_CAPTURE/npm-version.txt"
          timeout --signal=TERM --kill-after=15s 30s node --input-type=module - <<'NODE' > "$NI76_CAPTURE/isolation-validation.stdout" 2> "$NI76_CAPTURE/isolation-validation.stderr"
          import fs from 'node:fs'; import path from 'node:path';
          const scope=process.env.NI76_SCOPE, uid=process.getuid();
          for(const value of [scope,process.env.NI76_PROJECT,process.env.NI76_SOURCE,process.env.NI76_CAPTURE,process.env.GITNEXUS_HOME,process.env.NPM_CONFIG_CACHE,process.env.NPM_CONFIG_PREFIX]) {
            if(!path.isAbsolute(value) || (value!==scope && !value.startsWith(scope+'/'))) throw Error('path outside private scope');
            const pieces=value.split('/').filter(Boolean); let prefix='/';
            for(const piece of pieces) {prefix=path.join(prefix,piece); if(fs.lstatSync(prefix).isSymbolicLink()) throw Error(`symlink directory ${prefix}`);}
            const stat=fs.statSync(value); if(stat.uid!==uid || (stat.mode & 0o777)!==0o700) throw Error(`nonprivate directory ${value}`);
          }
          // Preserve tracked symlinks, but ensure no reachable target leaves the private source.
          const source=process.env.NI76_SOURCE; const links=[];
          function visit(dir) {for(const entry of fs.readdirSync(dir,{withFileTypes:true})) {
            if(entry.name==='.git') continue;
            const file=path.join(dir,entry.name);
            if(entry.isSymbolicLink()) {
              const target=path.resolve(path.dirname(file),fs.readlinkSync(file));
              const reachable=fs.existsSync(file);
              if(reachable && !fs.realpathSync(file).startsWith(source+'/')) throw Error(`reachable external source symlink ${file}`);
              links.push({file,target,reachable});
            } else if(entry.isDirectory()) visit(file);
          }}
          visit(source); console.log(JSON.stringify({scope,uid,private:true,sourceSymlinks:links}));
          NODE

      - name: Verify reviewed npm graph and install without lifecycle
        shell: bash
        run: |
          set -euo pipefail
          lock_input="$GITHUB_WORKSPACE/artifacts/ni05/code-index-37358369281/ni52-index-install-originals-37358369281"
          test "$(sha256sum "$lock_input/package-lock.json" | cut -d' ' -f1)" = "$LOCK_SHA"
          test "$(sha256sum "$lock_input/gitnexus-1.6.8.tgz" | cut -d' ' -f1)" = "$TARBALL_SHA"
          timeout --signal=TERM --kill-after=15s 30s node --input-type=module - "$lock_input/package-lock.json" <<'NODE' > "$NI76_CAPTURE/lock-validation.stdout" 2> "$NI76_CAPTURE/lock-validation.stderr"
          import fs from 'node:fs';
          const lock=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(lock.lockfileVersion!==3 || lock.packages[''].dependencies.gitnexus!=='1.6.8') throw Error('root lock mismatch');
          const deps=Object.entries(lock.packages).filter(([key])=>key!=='');
          if(deps.length!==270) throw Error('locked package count mismatch');
          for(const [key,p] of deps) if(!p.resolved?.startsWith('https://registry.npmjs.org/') || !p.integrity?.startsWith('sha512-') || p.link || p.inBundle) throw Error(`unapproved package ${key}`);
          for(const key of ['node_modules/@ladybugdb/core','node_modules/@ladybugdb/core-linux-x64']) if(lock.packages[key].version!=='0.17.1') throw Error(`native version mismatch ${key}`);
          console.log(JSON.stringify({packages:deps.length,gitnexus:'1.6.8',passed:true}));
          NODE
          printf '%s\n' '{"name":"ni52-gitnexus-lock-prep","version":"1.0.0","private":true,"dependencies":{"gitnexus":"1.6.8"}}' > "$NI76_PROJECT/package.json"
          cp "$lock_input/package-lock.json" "$NI76_PROJECT/package-lock.json"
          cp "$lock_input/package-lock.json" "$NI76_CAPTURE/package-lock.json"
          timeout --signal=TERM --kill-after=15s 30s npm config get prefix > "$NI76_CAPTURE/npm-prefix.stdout" 2> "$NI76_CAPTURE/npm-prefix.stderr"
          timeout --signal=TERM --kill-after=15s 30s npm config get cache > "$NI76_CAPTURE/npm-cache.stdout" 2> "$NI76_CAPTURE/npm-cache.stderr"
          test "$(cat "$NI76_CAPTURE/npm-prefix.stdout")" = "$NPM_CONFIG_PREFIX"
          test "$(cat "$NI76_CAPTURE/npm-cache.stdout")" = "$NPM_CONFIG_CACHE"
          printf '%s\n' '["timeout","--signal=TERM","--kill-after=15s","480s","npm","ci","--ignore-scripts","--no-audit","--no-fund","--prefix","<private npm-project>"]' > "$NI76_CAPTURE/npm-ci-argv.json"
          set +e
          timeout --signal=TERM --kill-after=15s 480s npm ci --ignore-scripts --no-audit --no-fund --prefix "$NI76_PROJECT" \
            > "$NI76_CAPTURE/npm-ci.stdout" 2> "$NI76_CAPTURE/npm-ci.stderr"
          rc=$?
          set -e
          printf '{"exit_code":%s,"timeout_seconds":480,"ignore_scripts":true}\n' "$rc" > "$NI76_CAPTURE/npm-ci-status.json"
          test "$rc" -eq 0
          cmp "$lock_input/package-lock.json" "$NI76_PROJECT/package-lock.json"
          pkg="$NI76_PROJECT/node_modules/gitnexus"
          test "$(sha256sum "$pkg/package.json" | cut -d' ' -f1)" = "$PACKAGE_SHA"
          test "$(sha256sum "$pkg/dist/cli/index.js" | cut -d' ' -f1)" = "$CLI_SHA"
          test "$(sha256sum "$pkg/dist/storage/repo-manager.js" | cut -d' ' -f1)" = "$MANAGER_SHA"
          readlink -f "$NI76_PROJECT/node_modules/.bin/gitnexus" > "$NI76_CAPTURE/actual-cli-realpath.txt"
          test "$(cat "$NI76_CAPTURE/actual-cli-realpath.txt")" = "$pkg/dist/cli/index.js"
          sha256sum "$pkg/package.json" "$pkg/dist/cli/index.js" "$pkg/dist/storage/repo-manager.js" > "$NI76_CAPTURE/installed-tool.sha256"
          printf '{"package_sha256":"%s","cli_sha256":"%s","manager_sha256":"%s","lock_sha256":"%s","global_install":false}\n' \
            "$PACKAGE_SHA" "$CLI_SHA" "$MANAGER_SHA" "$LOCK_SHA" > "$NI76_CAPTURE/installed-tool-attestation.json"

      - name: Retain install originals immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ni76-${{ matrix.source }}-install-originals-${{ github.run_id }}
          path: ${{ env.NI76_CAPTURE }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Verify and load audited prebuilt native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          native="$NI76_CAPTURE/native"
          mkdir -m 700 "$native"
          cd "$NI76_PROJECT"
          test "$(sha256sum node_modules/@ladybugdb/core/install.js | cut -d' ' -f1)" = "$LADYBUG_INSTALL_SHA"
          test ! -L node_modules/@ladybugdb/core-linux-x64/lbugjs.node
          test "$(sha256sum node_modules/@ladybugdb/core-linux-x64/lbugjs.node | cut -d' ' -f1)" = "$LADYBUG_BINARY_SHA"
          test ! -e node_modules/@ladybugdb/core/lbugjs.node && test ! -L node_modules/@ladybugdb/core/lbugjs.node
          cp -p node_modules/@ladybugdb/core-linux-x64/lbugjs.node node_modules/@ladybugdb/core/lbugjs.node
          test "$(sha256sum node_modules/@ladybugdb/core/lbugjs.node | cut -d' ' -f1)" = "$LADYBUG_BINARY_SHA"
          set +e
          timeout --signal=TERM --kill-after=15s 30s node - <<'NODE' > "$native/runtime.stdout" 2> "$native/runtime.stderr"
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const {Database}=require('@ladybugdb/core');
          console.log(JSON.stringify({ladybugVersion:Database.getVersion(),prebuilt:true}));
          const resolve=require('node-gyp-build');
          for(const [name,sha] of Object.entries({'tree-sitter-c':'85e912b183a49111b0f4c3a6c8908375732e70aca759ab0124501913cbbd942a','tree-sitter-proto':'dea80ed2fb48a6d19866468f652ec48eab5435306c6477b213eafe51cbbbf2ee'})) {
            const file=fs.realpathSync(resolve.path(path.join(process.cwd(),'node_modules/gitnexus/vendor',name)));
            if(!file.startsWith(process.cwd()+'/node_modules/gitnexus/vendor/') || !file.includes('/prebuilds/linux-x64/')) throw Error('native path outside reviewed prebuild');
            if(crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')!==sha) throw Error('native digest mismatch');
            require(file); console.log(JSON.stringify({name,file,sha256:sha,loaded:true}));
          }
          NODE
          rc=$?
          set -e
          printf '{"exit_code":%s,"native_compilation_attempted":false,"lifecycle_scripts_enabled":false}\n' "$rc" > "$native/command-status.json"
          test "$rc" -eq 0

      - name: Retain native originals immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ni76-${{ matrix.source }}-native-originals-${{ github.run_id }}
          path: ${{ env.NI76_CAPTURE }}/native/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Run direct private CLI and exact entry-point evidence
        shell: bash
        run: |
          set -euo pipefail
          index="$NI76_CAPTURE/index"
          mkdir -m 700 "$index"
          cd "$NI76_SOURCE"
          cli="$NI76_PROJECT/node_modules/gitnexus/dist/cli/index.js"
          # No host wrapper, patcher, global CLI, PATH override or CI grant is used.
          run_capture() {
            local label="$1" seconds="$2"
            shift 2
            node -e 'require("node:fs").writeFileSync(process.argv[1],JSON.stringify(process.argv.slice(2))+"\n")' "$index/$label-argv.json" "$@"
            local rc=0
            if timeout --signal=TERM --kill-after=15s "${seconds}s" "$@" > "$index/$label.stdout" 2> "$index/$label.stderr"; then rc=0; else rc=$?; fi
            printf '{"exit_code":%s,"timeout_seconds":%s,"kill_after_seconds":15}\n' "$rc" "$seconds" > "$index/$label-status.json"
            return "$rc"
          }
          run_capture version 30 node "$cli" --version
          test "$(cat "$index/version.stdout")" = 1.6.8
          run_capture analyze 1200 node "$cli" analyze --index-only --skip-agents-md --skip-skills --name "$NI76_ALIAS" --workers 2
          run_capture status 120 node "$cli" status
          test -f .gitnexus/meta.json && test ! -L .gitnexus/meta.json
          cp .gitnexus/meta.json "$index/meta.json"
          cp "$GITNEXUS_HOME/registry.json" "$index/registry.json"
          run_capture meta-validation 30 node --input-type=module -e \
            'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(m.lastCommit!==process.argv[2] || Number(m.stats?.embeddings ?? -1)!==0) throw Error("wrong source or nonzero/missing embeddings"); console.log(JSON.stringify({lastCommit:m.lastCommit,stats:m.stats,passed:true}));' \
            "$index/meta.json" "$NI76_SOURCE_SHA"
          run_capture wrapper-file-node 120 node "$cli" cypher \
            "MATCH (n:File) WHERE n.filePath = 'scripts/gitnexus-analyze.sh' RETURN n" --repo "$NI76_ALIAS"
          run_capture wrapper-symbols 120 node "$cli" cypher \
            "MATCH (n:Function) WHERE n.filePath = 'scripts/gitnexus-analyze.sh' RETURN n" --repo "$NI76_ALIAS"
          # Capture unsupported shell impact honestly; no-hit is explicitly not LOW.
          if run_capture wrapper-impact 120 node "$cli" impact --uid 'File:scripts/gitnexus-analyze.sh' --direction upstream --repo "$NI76_ALIAS" --depth 3 --limit 100; then shell_rc=0; else shell_rc=$?; fi
          run_capture wrapper-risk-check 30 node --input-type=module -e \
            'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(["HIGH","CRITICAL"].includes(String(r.risk).toUpperCase())) throw Error("STOP: HIGH/CRITICAL wrapper impact"); console.log(JSON.stringify({status:r.status??null,reportedRisk:r.risk??null,callableCoverage:"UNASSESSED"}));' \
            "$index/wrapper-impact.stdout"
          printf '{"scope":"shell wrapper","impact_command_exit_code":%s,"coverage":"manual review required; shell file result is not an exact callable-symbol guarantee","risk":"UNASSESSED","no_fabricated_LOW":true}\n' "$shell_rc" > "$index/shell-coverage.json"
          set +e
          timeout --signal=TERM --kill-after=15s 30s git grep -n -e 'gitnexus-analyze' -e 'gitnexus-patch' HEAD -- scripts .github AGENTS.md CLAUDE.md README.md \
            > "$index/native-wrapper-caller-map.stdout" 2> "$index/native-wrapper-caller-map.stderr"
          grep_rc=$?
          set -e
          printf '{"exit_code":%s,"scope":"tracked scripts/workflows/agent/readme references; manual caller map"}\n' "$grep_rc" > "$index/native-wrapper-caller-map-status.json"
          test "$grep_rc" -le 1
          if [ "$SOURCE_KIND" = root ]; then
            for symbol in main resolveAnalyzeJs; do
              uid="Function:scripts/gitnexus-patch.js:$symbol"
              run_capture "context-$symbol" 120 node "$cli" context --uid "$uid" --repo "$NI76_ALIAS" --content
              run_capture "impact-$symbol" 120 node "$cli" impact --uid "$uid" --direction upstream --repo "$NI76_ALIAS" --depth 3 --limit 100
              run_capture "validate-$symbol" 30 node --input-type=module -e \
                'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(r.target?.id!==process.argv[2] || r.direction!=="upstream" || r.epistemic!=="exact") throw Error("ambiguous/missing/non-exact impact"); if(["HIGH","CRITICAL"].includes(String(r.risk).toUpperCase())) throw Error("STOP: HIGH/CRITICAL impact"); if(!["LOW","MEDIUM"].includes(String(r.risk).toUpperCase())) throw Error("unrecognized risk"); console.log(JSON.stringify({target:r.target.id,risk:r.risk,direction:r.direction,epistemic:r.epistemic}));' \
                "$index/impact-$symbol.stdout" "$uid"
            done
          fi
          test "$(sha256sum "$cli" | cut -d' ' -f1)" = "$CLI_SHA"
          test "$(sha256sum "$NI76_PROJECT/node_modules/gitnexus/package.json" | cut -d' ' -f1)" = "$PACKAGE_SHA"
          test "$(sha256sum "$NI76_PROJECT/package-lock.json" | cut -d' ' -f1)" = "$LOCK_SHA"
          printf '{"passed":true,"source_kind":"%s","source_sha":"%s","direct_private_cli":true,"host_index_deployment":false}\n' "$SOURCE_KIND" "$NI76_SOURCE_SHA" > "$index/complete.json"

      - name: Retain index and impact originals immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ni76-${{ matrix.source }}-index-originals-${{ github.run_id }}
          path: ${{ env.NI76_CAPTURE }}/index/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Independently record source and isolation postchecks
        if: always() && env.NI76_SOURCE != ''
        shell: bash
        run: |
          set -euo pipefail
          post="$NI76_CAPTURE/postcheck"
          mkdir -m 700 "$post"
          test "$(git -C "$NI76_SOURCE" rev-parse HEAD)" = "$NI76_SOURCE_SHA"
          git -C "$NI76_SOURCE" status --porcelain=v1 --untracked-files=all > "$post/source-status.txt"
          git -C "$NI76_SOURCE" status --porcelain=v1 --untracked-files=all > "$post/source-status-repeat.txt"
          cmp "$post/source-status.txt" "$post/source-status-repeat.txt"
          test ! -s "$post/source-status.txt"
          git -C "$NI76_SOURCE" diff --exit-code HEAD > "$post/tracked-source-diff.stdout"
          test "$HOME" = "$(cat "$NI76_CAPTURE/home-before.txt")"
          test ! -e /mnt/raid0/llm && test ! -L /mnt/raid0/llm
          test ! -e /workspace/repos && test ! -L /workspace/repos
          test ! -e "$NI76_SCOPE/session-bus" && test ! -L "$NI76_SCOPE/session-bus"
          test "$(stat -c '%a' "$NI76_SCOPE")" = 700
          test "$(stat -c '%u' "$NI76_SCOPE")" = "$(id -u)"
          test ! -L "$NI76_SOURCE/.gitnexus"
          if [ -d "$NI76_SOURCE/.gitnexus" ]; then
            test -z "$(find "$NI76_SOURCE/.gitnexus" -type l -print -quit)"
            find "$NI76_SOURCE/.gitnexus" -type f -print0 | sort -z | xargs -0 -r sha256sum > "$post/generated-index.sha256"
          fi
          printf '{"source_sha":"%s","source_clean":true,"HOME_unchanged":true,"canonical_host_paths_absent":true,"bus_absent":true,"index_deployed":false}\n' "$NI76_SOURCE_SHA" > "$post/result.json"
          find "$NI76_CAPTURE" -type f ! -name sha256sums.txt -print0 | sort -z | xargs -0 -r sha256sum > "$post/sha256sums.txt"

      - name: Retain independent postchecks immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ni76-${{ matrix.source }}-postcheck-${{ github.run_id }}
          path: ${{ env.NI76_CAPTURE }}/postcheck/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
