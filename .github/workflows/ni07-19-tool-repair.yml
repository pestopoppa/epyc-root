name: NI07-19 tool-repair log redaction fixtures

on:
  push:
    branches: [codex/ni07-19-tool-repair-ci-20261006]
    paths:
      - '.github/workflows/ni07-19-tool-repair.yml'
      - 'scripts/ci/ni07_19_tool_repair_capture.py'
      - 'artifacts/ni07-19-tool-repair/ni07-19-tool-repair-readset.json'
permissions:
  contents: read
jobs:
  repair-log-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NI07_ROOT_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      NI07_APP_PIN: 713a79ab4ab9bbffd11a00e806ee22f52866c5b9
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Initialize retained status before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni07-19-tool-repair/result"
          printf '{"schema":"ni07-19-tool-repair-ci-status.v1","state":"setup_pending","exit_code":null}\n' > "$RUNNER_TEMP/ni07-19-tool-repair/result/status.json"
      - name: Checkout workflow and capture recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout pinned native conformance producer
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.NI07_ROOT_PIN }}
          path: root
          persist-credentials: false
      - name: Checkout exact application source candidate
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.NI07_APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact selected-test dependencies from uv.lock
        env:
          NI07_INSTALL_COMMAND: python -m pip install pytest==9.0.3 PyYAML==6.0.3
        run: python -m pip install pytest==9.0.3 PyYAML==6.0.3
      - name: Capture prompt-builder regression module
        if: always()
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          NI07_ROOT_PIN: ${{ env.NI07_ROOT_PIN }}
          NI07_APP_PIN: ${{ env.NI07_APP_PIN }}
          NI07_INSTALL_COMMAND: python -m pip install pytest==9.0.3 PyYAML==6.0.3
          PYTHONPATH: ${{ github.workspace }}/app
        run: python recipe/scripts/ci/ni07_19_tool_repair_capture.py
      - name: Retain original request, JUnit, context, readset, and status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni07-19-tool-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni07-19-tool-repair/result/
          if-no-files-found: error
