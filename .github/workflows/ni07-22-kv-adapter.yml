name: NI07-22 research-backed Vidya adapter fixtures

on:
  push:
    branches: [codex/ni07-22-kv-ci-dependency-20261006]
    paths:
      - '.github/workflows/ni07-22-kv-adapter.yml'
      - 'scripts/ci/ni07_22_kv_adapter_capture.py'

permissions:
  contents: read

jobs:
  adapter-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NI22_CARRIER_PIN: 02f12d02ef40b28a141fb7ceaedba3897000a328
      NI22_RESEARCH_PIN: bed81e59f5a4d9f9cdb246b4b1eebe1d3e400762
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      KV_QUANT_TEST_RESEARCH_ROOT: ${{ github.workspace }}/research
      EXL3_TEST_PRODUCER: ${{ github.workspace }}/research/scripts/kernel_rnd/exl3/evidence.py
      EVIDENCE_DURABILITY_PRODUCER: ${{ github.workspace }}/research/scripts/validate/check_evidence_durability.py
    steps:
      - name: Initialize retained status before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni07-22-kv-adapter/result"
          printf '{"schema":"ni07-22-kv-adapter-ci-status.v1","state":"setup_pending","exit_code":null}\n' > "$RUNNER_TEMP/ni07-22-kv-adapter/result/status.json"

      - name: Checkout exact candidate and recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: root
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned native carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.NI22_CARRIER_PIN }}
          path: carrier
          persist-credentials: false

      - name: Checkout pinned research producers
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-inference-research
          ref: ${{ env.NI22_RESEARCH_PIN }}
          path: research
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install selected fixture dependencies
        run: python -m pip install pytest==9.1.1 PyYAML==6.0.3

      - name: Capture all three research-backed adapter modules
        if: always()
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_SHA: ${{ github.sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: python root/scripts/ci/ni07_22_kv_adapter_capture.py

      - name: Retain original command, JUnit, context, readset, and status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni07-22-kv-adapter-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni07-22-kv-adapter/result/
          if-no-files-found: error
