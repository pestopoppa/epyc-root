name: HS-4 P7 offline stdin compatibility capture
on:
  push:
    branches: [codex/ni08-p7-stdin-capture-20261006]
    paths:
      - .github/workflows/ni08-p7-stdin-capture.yml
      - scripts/ci/ni08_p7_stdin_capture.py
      - scripts/ci/ni08_p7_stdin_capture_requirements.txt
      - scripts/ci/ni08_p7_expected_cases.json
permissions:
  contents: read
jobs:
  hs4-p7-stdin-capture:
    name: hs4-p7-stdin-capture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_PIN: 70096b763939a43409a1f1827ab633d62425a6c1
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      NI08_INSTALL_COMMAND: >-
        python -m pip install --require-hashes -r recipe/scripts/ci/ni08_p7_stdin_capture_requirements.txt
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni08-p7-stdin-capture/result"
          printf '{"state":"setup_pending","job":"hs4-p7-stdin-capture","exit_code":null}\n' > "$RUNNER_TEMP/ni08-p7-stdin-capture/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout APP lock source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install hash-locked pytest closure
        run: ${{ env.NI08_INSTALL_COMMAND }}
      - name: Capture original JUnit and native fixture receipt
        run: python recipe/scripts/ci/ni08_p7_stdin_capture.py
      - name: Preserve status, original JUnit, native receipt and original-only grade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni08-p7-stdin-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni08-p7-stdin-capture/result/
          if-no-files-found: error
