name: NI07 standalone BSV EvalResult input integrity
on:
  push:
    branches: [codex/ni07-17-bsv-input-strict-20261006]
    paths:
      - .github/workflows/ni07-bsv-input-strict.yml
      - scripts/ci/ni07_bsv_input_strict_capture.py
permissions:
  contents: read
jobs:
  synthetic-bsv-input:
    name: synthetic-bsv-input
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PIN: 301df359719fe56d6a7d06bb5fe4474c33b6cb33
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      NI07_RUNNER_CONTEXT: ubuntu-latest
      NI07_EXECUTION_CONTEXT: offline-json-fixtures
      NI07_INSTALL_COMMAND: python -m pip install pytest==8.4.2 iniconfig==2.3.0 packaging==26.0 pluggy==1.6.0 Pygments==2.20.0
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      ORCHESTRATOR_MOCK_MODE: '1'
      ORCHESTRATOR_LOG_DIR: /dev/null
      ORCHESTRATOR_SERVING_CALLS_LOG: off
      ORCHESTRATOR_COHERENCE_JUDGE_LOG: off
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni07-bsv-input/result"
          printf '{"state":"setup_pending","job":"bsv-input-integrity","exit_code":null}\n' > "$RUNNER_TEMP/ni07-bsv-input/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout reviewed APP source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install pinned fixture test dependencies
        run: ${{ env.NI07_INSTALL_COMMAND }}
      - name: Capture standalone BSV input fixture receipt
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/app"
          python recipe/scripts/ci/ni07_bsv_input_strict_capture.py
      - name: Preserve custody artifacts on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni07-bsv-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni07-bsv-input/result/
          if-no-files-found: error
