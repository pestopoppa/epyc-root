name: NI07-08 provisional conversation shadow fixture custody
on:
  push:
    branches: [codex/ni07-08-shadow-ci-20261006]
    paths:
      - .github/workflows/ni07-08-conversation-shadow.yml
      - scripts/ci/ni07_08_conversation_shadow_capture.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-contract:
    name: mock-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PIN: 02d84c6a7b01302b9ed17b8c92c34d79ea8336a1
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      ORCHESTRATOR_MOCK_MODE: '1'
      ORCHESTRATOR_LOG_DIR: /dev/null
      ORCHESTRATOR_SERVING_CALLS_LOG: off
      ORCHESTRATOR_COHERENCE_JUDGE_LOG: off
      PYTHONUNBUFFERED: '1'
      NI07_08_INSTALL_COMMAND: python -m pip install pytest==8.4.2 PyYAML==6.0.2 jsonschema==4.25.1 httpx==0.28.1
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni07-08-shadow/result"
          printf '{"state":"setup_pending","job":"conversation-shadow-mock-contract","exit_code":null}\n' > "$RUNNER_TEMP/ni07-08-shadow/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout provisional shadow source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal fixture dependencies
        run: python -m pip install pytest==8.4.2 PyYAML==6.0.2 jsonschema==4.25.1 httpx==0.28.1
      - name: Capture original mock-contract receipt
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/app"
          python recipe/scripts/ci/ni07_08_conversation_shadow_capture.py
      - name: Preserve original receipt, JUnit, readset and context on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni07-08-conversation-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni07-08-shadow/result/
          if-no-files-found: error
