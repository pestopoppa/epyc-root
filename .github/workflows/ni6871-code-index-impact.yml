          run_capture ni71-1-impact 120 node "$cli" impact --uid "$uid" --direction upstream --repo "$NI6871_ALIAS" --depth 3 --limit 100
          run_capture ni71-1-validate 30 node --input-type=module -e \
            'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(r.target?.id!==process.argv[2] || r.direction!=="upstream" || r.epistemic!=="exact") throw Error("missing/nonexact impact"); if(["HIGH","CRITICAL"].includes(String(r.risk).toUpperCase())) throw Error("STOP: HIGH/CRITICAL"); if(!["LOW","MEDIUM"].includes(String(r.risk).toUpperCase())) throw Error("unrecognized risk"); console.log(JSON.stringify({target:r.target.id,risk:r.risk,epistemic:r.epistemic}));' \
            "$index/ni71-1-impact.stdout" "$uid"
          test "$(sha256sum "$cli" | cut -d' ' -f1)" = "$CLI_SHA"
          test "$(sha256sum "$NI6871_PROJECT/node_modules/gitnexus/package.json" | cut -d' ' -f1)" = "$PACKAGE_SHA"
          test "$(sha256sum "$NI6871_PROJECT/package-lock.json" | cut -d' ' -f1)" = "$LOCK_SHA"
          printf '{"passed":true,"source_kind":"%s","source_sha":"%s","direct_private_cli":true,"host_index_deployment":false}\n' "$SOURCE_KIND" "$NI6871_SOURCE_SHA" > "$index/complete.json"

      - name: Retain index and impact originals immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ni6871-${{ matrix.source }}-index-originals-${{ github.run_id }}
          path: ${{ env.NI6871_CAPTURE }}/index/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Independently record source and isolation postchecks
        if: always() && env.NI6871_SOURCE != ''
        shell: bash
        run: |
          set -euo pipefail
          post="$NI6871_CAPTURE/postcheck"
          mkdir -m 700 "$post"
          test "$(git -C "$NI6871_SOURCE" rev-parse HEAD)" = "$NI6871_SOURCE_SHA"
          git -C "$NI6871_SOURCE" status --porcelain=v1 --untracked-files=all > "$post/source-status.txt"
          git -C "$NI6871_SOURCE" status --porcelain=v1 --untracked-files=all > "$post/source-status-repeat.txt"
          cmp "$post/source-status.txt" "$post/source-status-repeat.txt"
          test ! -s "$post/source-status.txt"
          git -C "$NI6871_SOURCE" diff --exit-code HEAD > "$post/tracked-source-diff.stdout"
          test "$HOME" = "$(cat "$NI6871_CAPTURE/home-before.txt")"
          test ! -e /mnt/raid0/llm && test ! -L /mnt/raid0/llm
          test ! -e /workspace/repos && test ! -L /workspace/repos
          test ! -e "$NI6871_SCOPE/session-bus" && test ! -L "$NI6871_SCOPE/session-bus"
          test "$(stat -c '%a' "$NI6871_SCOPE")" = 700
          test "$(stat -c '%u' "$NI6871_SCOPE")" = "$(id -u)"
          test ! -L "$NI6871_SOURCE/.gitnexus"
          if [ -d "$NI6871_SOURCE/.gitnexus" ]; then
            test -z "$(find "$NI6871_SOURCE/.gitnexus" -type l -print -quit)"
            find "$NI6871_SOURCE/.gitnexus" -type f -print0 | sort -z | xargs -0 -r sha256sum > "$post/generated-index.sha256"
          fi
          printf '{"source_sha":"%s","source_clean":true,"HOME_unchanged":true,"canonical_host_paths_absent":true,"bus_absent":true,"index_deployed":false}\n' "$NI6871_SOURCE_SHA" > "$post/result.json"
          find "$NI6871_CAPTURE" -type f ! -name sha256sums.txt -print0 | sort -z | xargs -0 -r sha256sum > "$post/sha256sums.txt"

      - name: Retain independent postchecks immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ni6871-${{ matrix.source }}-postcheck-${{ github.run_id }}
          path: ${{ env.NI6871_CAPTURE }}/postcheck/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
