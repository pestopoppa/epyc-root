name: OBS-1 supervisor observation contract

on:
  push:
    branches: [codex-ni/obs1-contract-20261101]
    paths:
      - 'scripts/coordination/bus_supervisor.sh'
      - 'scripts/coordination/observer_registry.json'
      - 'scripts/coordination/tests/test_bus_supervisor.py'
      - 'tests/test_observer_contract.py'
      - '.github/workflows/obs1-supervisor-contract.yml'

permissions:
  contents: read

jobs:
  observer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Prepare isolated test environment and source identity
        shell: bash
        run: |
          set -euo pipefail
          OBS1_RESULT_DIR="$RUNNER_TEMP/obs1-supervisor-contract"
          mkdir -p "$OBS1_RESULT_DIR"
          python -m pip install pytest==9.0.3 iniconfig==2.3.0 packaging==26.0 pluggy==1.6.0 Pygments==2.20.0 2>&1 | tee "$OBS1_RESULT_DIR/dependencies.stdout.txt"
          git rev-parse HEAD > "$OBS1_RESULT_DIR/source-commit.txt"
          sha256sum \
            scripts/coordination/bus_supervisor.sh \
            scripts/coordination/observer_registry.json \
            scripts/coordination/tests/test_bus_supervisor.py \
            tests/test_observer_contract.py \
            > "$OBS1_RESULT_DIR/source-files.sha256"
      - name: Run exact OBS-1 observer and supervisor suites
        shell: bash
        env:
          PYTHONPATH: tests
        run: |
          set -uo pipefail
          set +e
          OBS1_RESULT_DIR="$RUNNER_TEMP/obs1-supervisor-contract"
          python -m pytest -q \
            --junitxml="$OBS1_RESULT_DIR/junit.xml" \
            tests/test_observer_contract.py \
            scripts/coordination/tests/test_bus_supervisor.py \
            2>&1 | tee "$OBS1_RESULT_DIR/pytest.stdout.txt"
          test_rc=${PIPESTATUS[0]}
          printf '%s\n' "$test_rc" > "$OBS1_RESULT_DIR/pytest.exit-code"
          exit "$test_rc"
      - name: Upload complete test record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: obs1-supervisor-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/obs1-supervisor-contract/
          if-no-files-found: error
