name: NI P6 surfaces native verification
on:
  push:
    branches: [codex/ni-p6-surfaces-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: ''
      PYTEST_PLUGINS: ''
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7011d23a76a28cb71860a29d00c442d3ed1d25db
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install exact existing wheel closure
        run: |
          mkdir -p evidence
          python -m venv "$RUNNER_TEMP/p6-venv"
          "$RUNNER_TEMP/p6-venv/bin/python" -m pip install --only-binary=:all: --no-deps --require-hashes -r candidate/scripts/ci/vb_tuadv_native_requirements.txt > evidence/pip-install.log 2>&1
          "$RUNNER_TEMP/p6-venv/bin/python" -m pip freeze --all > evidence/dependencies.txt
          "$RUNNER_TEMP/p6-venv/bin/python" --version > evidence/python-version.txt
          node --version > evidence/node-version.txt
          git -C candidate rev-parse HEAD > evidence/candidate.sha
          git -C baseline rev-parse HEAD > evidence/baseline.sha
          find candidate/dashboard candidate/tests -type f \( -name '*.py' -o -name '*.js' -o -name '*.html' -o -name 'kernel_progression_recorded*.json' \) -print0 | sort -z | xargs -0 sha256sum > evidence/source-sha256.txt
          sha256sum candidate/scripts/ci/vb_tuadv_native_requirements.txt candidate/.github/workflows/ni-p6-surfaces-native.yml > evidence/recipe-sha256.txt
      - name: Original baseline on the same runner and dependencies
        run: |
          set +e
          cd baseline
          "$RUNNER_TEMP/p6-venv/bin/python" -m pytest -q tests/test_dashboard_panels.py tests/test_dashboard_panels_redteam.py tests/test_production_kernel_set.py tests/test_dashboard_authoring_refusal_visible.py tests/test_dashboard_champion_card.py --junitxml=../evidence/baseline.junit.xml > ../evidence/baseline.log 2>&1
          rc=$?
          printf '%s\n' "$rc" > ../evidence/baseline.exit
          exit 0
      - name: Candidate dashboard behavior and actual page renderers
        run: |
          set +e
          cd candidate
          "$RUNNER_TEMP/p6-venv/bin/python" -m pytest -q tests/test_dashboard_*.py tests/test_production_kernel_set.py --junitxml=../evidence/candidate.junit.xml > ../evidence/candidate.log 2>&1
          rc=$?
          printf '%s\n' "$rc" > ../evidence/candidate.exit
          tail -100 ../evidence/candidate.log
          exit "$rc"
      - name: Retain original logs, JUnit, dependency and source identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni-p6-original-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
