name: RTG02 bounded native conformance capture
on:
  push:
    branches: [codex/ni08-rtg02-capture-20261006]
permissions:
  contents: read
jobs:
  rtg02-native-source-fixture:
    name: programmatic-input-echo-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_PIN: ceb3ea84feba2dbc654987e3bc2ec12fb061f177
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Initialize retained outcome before setup
        run: |
          mkdir -p "$RUNNER_TEMP/rtg02-native/result"
          printf '{"state":"setup_pending","exit_code":null}\n' > "$RUNNER_TEMP/rtg02-native/result/status.json"
      - name: Checkout the exact ROOT recipe and carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: root
          persist-credentials: false
      - name: Checkout the reviewed APP source proposal
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - name: Set up the accepted Python patch release
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Create isolated runner environment
        run: python -m venv "$RUNNER_TEMP/rtg02-native/venv"
      - name: Capture selected source-only controls through the existing carrier
        id: capture
        run: |
          set +e
          "$RUNNER_TEMP/rtg02-native/venv/bin/python" root/scripts/ci/rtg02_run_native_capture.py "$GITHUB_WORKSPACE/app" "$RUNNER_TEMP/rtg02-native/result/capture" > "$RUNNER_TEMP/rtg02-native/result/driver.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/rtg02-native/result/driver.log"
          printf '{"state":"capture_finished","exit_code":%s}\n' "$rc" > "$RUNNER_TEMP/rtg02-native/result/status.json"
          exit "$rc"
      - name: Preserve status, original JUnit, native receipt and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtg02-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rtg02-native/result/
          if-no-files-found: error
          retention-days: 90
