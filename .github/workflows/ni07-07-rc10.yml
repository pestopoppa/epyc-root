name: NI07-07 pinned RC-10 synthetic confidence fixtures

on:
  push:
    branches: [codex/ni07-07-rc10-native-ci-20261006]
    paths:
      - .github/workflows/ni07-07-rc10.yml
      - artifacts/ni07-07-confidence/ci/**
permissions:
  contents: read
jobs:
  rc10-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROOT_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      APP_PIN: b087a506317ba2422f5d14b790655e13e5ea032f
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni07-07/result"
          printf '{"state":"setup_pending"}\n' > "$RUNNER_TEMP/ni07-07/result/status.json"
      - name: Checkout exact recipe branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout pinned native receipt producer
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_PIN }}
          path: root
          persist-credentials: false
      - name: Checkout exact RC-10 application candidate
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install declared fixture dependencies
        run: python -m pip install pytest==9.1.1 PyYAML==6.0.2
      - name: Capture pinned synthetic fixture execution
        env:
          NI07_RC10_INSTALL_COMMAND: python -m pip install pytest==9.1.1 PyYAML==6.0.2
        run: python recipe/artifacts/ni07-07-confidence/ci/capture.py
      - name: Retain native receipt and original JUnit on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni07-07-rc10-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni07-07/result/
          if-no-files-found: error
