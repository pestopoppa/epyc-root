name: VB RTG-23 W8 native display conformance
on:
  push:
    branches: [codex/rtg23-w8-native-conformance2-20261007]
permissions:
  contents: read
jobs:
  rtg23w8-native-conformance:
    if: github.ref == 'refs/heads/codex/rtg23-w8-native-conformance2-20261007'
    name: rtg23w8-native-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_PIN: 94a6e8d41ec7d3f7a122f66bad53aa673d401d8a
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      APP_LOCK_PIN: 94a6e8d41ec7d3f7a122f66bad53aa673d401d8a
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTEST_ADDOPTS: ''
      PYTEST_PLUGINS: ''
    steps:
      - name: Initialize retained outcome before setup
        run: |
          mkdir -p "$RUNNER_TEMP/vb-rtg23w8/result"
          printf '{"state":"setup_pending","job":"rtg23w8-native-conformance","exit_code":null}\n' > "$RUNNER_TEMP/vb-rtg23w8/result/status.json"
          cp "$RUNNER_TEMP/vb-rtg23w8/result/status.json" "$RUNNER_TEMP/vb-rtg23w8/result/pre-status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed native carrier and shared grader
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout frozen APP source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.SOURCE_PIN }}
          path: source
          persist-credentials: false
      - name: Checkout frozen APP dependency lock source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_LOCK_PIN }}
          path: app-lock
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Create isolated Python environment
        run: python -m venv "$RUNNER_TEMP/vb-rtg23w8/venv"
      - name: Install exact APP-lock wheel closure
        run: |
          set -o pipefail
          "$RUNNER_TEMP/vb-rtg23w8/venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: --no-deps --require-hashes \
            -r recipe/scripts/ci/vb_rtg23w8_native_requirements.txt \
            2>&1 | tee "$RUNNER_TEMP/vb-rtg23w8/result/pip-install.log"
      - name: Capture original JUnit, source readset, native receipt and shared grade
        run: "$RUNNER_TEMP/vb-rtg23w8/venv/bin/python recipe/scripts/ci/vb_rtg23w8_native_capture.py"
      - name: Preserve every capture outcome and original
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vb-rtg23w8-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vb-rtg23w8/result/
          if-no-files-found: error
