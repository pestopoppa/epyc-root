name: INF50 registry compiler projection (ungraded)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Initialize artifact custody
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inf50-custody/result" "$RUNNER_TEMP/inf50-custody/meta"
          printf '%s\n' '{"record_kind":"attempt_inventory","phase":"workflow_started","native_receipt":null,"junit":null,"claim":null}' > "$RUNNER_TEMP/inf50-custody/result/attempt-start.json"
      - id: root_checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: root
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
      - id: app_checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: 87ecbf18bc3d3793271d0eaf183e19900ad9726a
          path: app
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
      - id: research_checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pestopoppa/epyc-inference-research
          ref: c49729505b6b85bcc2ef68255168014b4ae6a84d
          path: research
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
      - id: setup_python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
          architecture: x64
      - id: run_projection
        name: Capture native dry-run and full semantic/source custody
        env:
          EXPECTED_ROOT_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PYTHONNOUSERSITE: '1'
        run: >-
          python3 root/scripts/ci/inf50_registry_projection.py capture
          --root root --app app --research research
          --custody "$RUNNER_TEMP/inf50-custody"
      - name: Record workflow step outcomes
        if: always()
        env:
          ROOT_CHECKOUT: ${{ steps.root_checkout.outcome }}
          APP_CHECKOUT: ${{ steps.app_checkout.outcome }}
          RESEARCH_CHECKOUT: ${{ steps.research_checkout.outcome }}
          SETUP_PYTHON: ${{ steps.setup_python.outcome }}
          RUN_PROJECTION: ${{ steps.run_projection.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          printf '{"record_kind":"attempt_inventory","root_checkout":"%s","app_checkout":"%s","research_checkout":"%s","setup_python":"%s","run_projection":"%s","native_receipt":null,"junit":null,"claim":null}\n' \
            "$ROOT_CHECKOUT" "$APP_CHECKOUT" "$RESEARCH_CHECKOUT" "$SETUP_PYTHON" "$RUN_PROJECTION" \
            > "$RUNNER_TEMP/inf50-custody/result/attempt-outcomes.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inf50-registry-compiler-projection-ungraded
          path: ${{ runner.temp }}/inf50-custody/
          if-no-files-found: error
          retention-days: 90
