name: SSU-F13 bounded repro follow-up

on:
  push:
    branches: ['codex/ssu-f13-repro-followup-20261005']

permissions:
  contents: read

env:
  ROOT_PRODUCER_SHA: adbbe58e591f5e6dc444019551c91a9d6cd10a11
  APP_FIXTURE_BASE_PUBLISHED_SHA: 4244e72b2aa8aae9a92f684fcd5090a852223888
  APP_FIXTURE_CANDIDATE_PUBLISHED_SHA: 86015733aa5dbe4c1bfcfbd996d7496a2494f098
  APP_FIXTURE_BASE_SYNTHETIC_SHA: def18591f813070a20906f9d228ddd9dd0da9fd3
  APP_FIXTURE_CANDIDATE_SYNTHETIC_SHA: bb6ce5d72c0a2b2b9ec48f9d27e003d626d1fe37
  RESEARCH_SHA: e98909009f5dd2d148ad0e93029ea9fb85ba031f

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      ORCHESTRATOR_MOCK_MODE: 'true'
      ORCHESTRATOR_PATHS_LLAMA_CPP_BIN: /tmp/ssu-f13-unused-cpu-bin
      ORCHESTRATOR_PATHS_LLAMA_MTMD: /tmp/ssu-f13-unused-mtmd
      ORCHESTRATOR_PATHS_LLAMA_SERVER: /tmp/ssu-f13-unused-llama-server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-control
      - uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_FIXTURE_CANDIDATE_PUBLISHED_SHA }}
          fetch-depth: 2
          path: app-published
      - uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_FIXTURE_CANDIDATE_SYNTHETIC_SHA }}
          fetch-depth: 2
          path: app-synthetic
      - uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_FIXTURE_BASE_PUBLISHED_SHA }}
          path: app-fixture-base-published
      - uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_FIXTURE_BASE_SYNTHETIC_SHA }}
          path: app-fixture-base-synthetic
      - uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-inference-research
          ref: ${{ env.RESEARCH_SHA }}
          path: research
      - uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_PRODUCER_SHA }}
          path: root-producer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bind pinned research registry
        run: |
          sudo mkdir -p /mnt/raid0/llm /workspace/repos
          sudo ln -s "$GITHUB_WORKSPACE/research" /mnt/raid0/llm/epyc-inference-research
          sudo ln -s "$GITHUB_WORKSPACE/research" /workspace/repos/epyc-inference-research
          test -r app-published/orchestration/model_registry.yaml
          test -r app-synthetic/orchestration/model_registry.yaml
      - name: Install pinned app development dependencies and pytest
        working-directory: app-synthetic
        run: |
          python -m pip install '.[dev]' 'pytest==9.1.1'
          python -c 'from importlib.metadata import version; print("pytest=" + version("pytest"))'
      - name: Create only the ordinary-runner scratch directory required by AP54
        run: |
          sudo install -d --mode=0700 --owner="$(id -u)" --group="$(id -g)" /mnt/raid0/llm/tmp
          test "$(stat -c %u /mnt/raid0/llm/tmp)" = "$(id -u)"
          test "$(stat -c %a /mnt/raid0/llm/tmp)" = 700
      - name: Record ordinary-runner AP54 context
        working-directory: app-published
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          context = {
              "schema": "ssu_f13.repro_context.v2",
              "phase": "ordinary_runner_ap54",
              "fixture_candidate_published_sha": "86015733aa5dbe4c1bfcfbd996d7496a2494f098",
              "fixture_base_published_sha": "4244e72b2aa8aae9a92f684fcd5090a852223888",
              "runner_context": "ordinary GitHub runner; no synthetic RAM or topology",
              "scratch_directory": "/mnt/raid0/llm/tmp (owned by runner; mode 0700)",
              "timeout": "GNU timeout 120s; TERM; KILL after 30s",
              "selection": "tests/unit/test_ap54_eval_knowledge_fence.py",
              "inference": "none",
              "claim_scope": "one bounded AP54 unit-module command only",
          }
          with Path("ssu-f13-ap54-context.json").open("x", encoding="utf-8") as output:
              output.write(json.dumps(context, sort_keys=True) + "\n")
          PY
      - name: Capture ordinary-runner AP54 module
        if: always()
        working-directory: app-published
        run: |
          python "$GITHUB_WORKSPACE/root-producer/scripts/ci/native_conformance.py" \
            --cwd "$PWD" --junit ssu-f13-ap54.xml --output native-ssu-f13-ap54 \
            --generated-output ssu-f13-ap54.pytest.log \
            --repo "root_workflow=$GITHUB_WORKSPACE/ci-control" \
            --repo "root_producer=$GITHUB_WORKSPACE/root-producer" \
            --repo "orchestrator=$PWD" --repo "research=$GITHUB_WORKSPACE/research" \
            --read-path "$GITHUB_WORKSPACE/ci-control/.github/workflows/ssu-f13-bounded-followup.yml" \
            --read-path "$GITHUB_WORKSPACE/root-producer/scripts/ci/native_conformance.py" \
            --read-path "$GITHUB_WORKSPACE/root-producer/scripts/vidya/adapters/ci_conformance.py" \
            --read-path "$GITHUB_WORKSPACE/root-producer/scripts/vidya/claim_tuple.py" \
            --read-path "$GITHUB_WORKSPACE/root-producer/scripts/vidya/cli.py" \
            --read-path ssu-f13-ap54-context.json --read-path pyproject.toml \
            --read-path tests/conftest.py --read-path tests/unit/test_ap54_eval_knowledge_fence.py \
            --read-path src/builtin_tools.py --read-path src/registry/tool_registry.py \
            --read-path src/repl_environment/knowledge_fence.py \
            --read-path src/repl_environment/_fence_rules.py \
            --read-path src/repl_environment/fence_kernel.py \
            --read-path src/repl_environment/external_access.py \
            --read-path src/repl_environment/environment.py \
            --read-path src/repl_environment/parallel_dispatch.py --read-path src/tools/base.py \
            --read-path src/api/models/__init__.py --read-path src/api/models/requests.py \
            --read-path src/api/models/responses.py --read-path src/api/routes/chat.py \
            --read-path scripts/autopilot/eval_tower.py --read-path src/tool_registry.py \
            --read-path orchestration/model_registry.yaml \
            --read-path "$GITHUB_WORKSPACE/research/orchestration/model_registry.yaml" \
            --select tests/unit/test_ap54_eval_knowledge_fence.py -- \
            timeout --verbose --signal=TERM --kill-after=30s 120s \
              python -m pytest -q --tb=short tests/unit/test_ap54_eval_knowledge_fence.py \
              --junitxml=ssu-f13-ap54.xml --log-file=ssu-f13-ap54.pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssu-f13-${{ github.run_id }}-${{ github.run_attempt }}-ap54-ordinary-prefix
          path: |
            app-published/ssu-f13-ap54-context.json
            app-published/ssu-f13-ap54.xml
            app-published/ssu-f13-ap54.pytest.log
            app-published/native-ssu-f13-ap54/
      - name: Record ordinary capacity-guard context
        if: always()
        working-directory: app-published
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          context = {
              "schema": "ssu_f13.repro_context.v2",
              "phase": "ordinary_runner_capacity_guard",
              "fixture_candidate_published_sha": "86015733aa5dbe4c1bfcfbd996d7496a2494f098",
              "fixture_base_published_sha": "4244e72b2aa8aae9a92f684fcd5090a852223888",
              "runner_context": "ordinary GitHub runner; reads actual /proc/meminfo in a fresh child",
              "selection": "test_fresh_launcher_import_keeps_real_host_capacity_guard",
              "inference": "none",
              "claim_scope": "named actual-host capacity-guard control only",
          }
          with Path("ssu-f13-capacity-context.json").open("x", encoding="utf-8") as output:
              output.write(json.dumps(context, sort_keys=True) + "\n")
          PY
      - name: Capture the separate ordinary capacity guard
        if: always()
        working-directory: app-published
        run: |
          python "$GITHUB_WORKSPACE/root-producer/scripts/ci/native_conformance.py" \
            --cwd "$PWD" --junit ssu-f13-capacity.xml --output native-ssu-f13-capacity \
            --generated-output ssu-f13-capacity.pytest.log \
            --repo "root_workflow=$GITHUB_WORKSPACE/ci-control" \
            --repo "root_producer=$GITHUB_WORKSPACE/root-producer" \
            --repo "orchestrator=$PWD" --repo "research=$GITHUB_WORKSPACE/research" \
            --read-path "$GITHUB_WORKSPACE/ci-control/.github/workflows/ssu-f13-bounded-followup.yml" \
            --read-path "$GITHUB_WORKSPACE/root-producer/scripts/ci/native_conformance.py" \
            --read-path "$GITHUB_WORKSPACE/root-producer/scripts/vidya/adapters/ci_conformance.py" \
            --read-path "$GITHUB_WORKSPACE/root-producer/scripts/vidya/claim_tuple.py" \
            --read-path "$GITHUB_WORKSPACE/root-producer/scripts/vidya/cli.py" \
            --read-path ssu-f13-capacity-context.json --read-path pyproject.toml \
            --read-path tests/conftest.py --read-path tests/unit/test_runtime_flags.py \
            --read-path scripts/autopilot/species/structural_lab.py \
            --read-path src/api/routes/config.py --read-path src/runtime/config_attestation.py \
            --read-path src/config/__init__.py --read-path src/config/models.py \
            --read-path src/features.py \
            --read-path scripts/server/orchestrator_stack.py \
            --read-path scripts/server/stack_manifest.py \
            --read-path orchestration/launch_manifest.yaml \
            --read-path orchestration/stack_topology.yaml \
            --read-path orchestration/model_registry.yaml \
            --read-path "$GITHUB_WORKSPACE/research/orchestration/model_registry.yaml" \
            --select tests/unit/test_runtime_flags.py::test_fresh_launcher_import_keeps_real_host_capacity_guard -- \
            timeout --verbose --signal=TERM --kill-after=30s 120s \
              python -m pytest -q --tb=short \
              tests/unit/test_runtime_flags.py::test_fresh_launcher_import_keeps_real_host_capacity_guard \
              --junitxml=ssu-f13-capacity.xml --log-file=ssu-f13-capacity.pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssu-f13-${{ github.run_id }}-${{ github.run_attempt }}-capacity-ordinary-prefix
          path: |
            app-published/ssu-f13-capacity-context.json
            app-published/ssu-f13-capacity.xml
            app-published/ssu-f13-capacity.pytest.log
            app-published/native-ssu-f13-capacity/
      - name: Compare pinned topology-parity production and test inputs
        id: compare_topology_inputs
        if: always()
        working-directory: app-synthetic
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          published = workspace / "app-published"
          donor = Path(os.environ["GITHUB_WORKSPACE"]) / "app-synthetic"
          published_base = workspace / "app-fixture-base-published"
          donor_base = workspace / "app-fixture-base-synthetic"
          paths = [
              "pyproject.toml", "tests/conftest.py",
              "tests/unit/test_affinity_preflight_cell_manifest.py",
              "tests/unit/test_build_server_command_helpers.py",
              "tests/unit/test_contention_matrix_host_health.py",
              "scripts/server/affinity_preflight.py", "scripts/server/orchestrator_stack.py",
              "scripts/server/stack_commands.py", "scripts/server/contention_matrix.py",
              "scripts/server/stack_manifest.py", "scripts/server/stack_numa.py",
              "scripts/server/stack_paths.py", "scripts/server/stack_env.py",
              "scripts/server/stack_runtime.py", "scripts/server/stack_processes.py",
              "scripts/server/stack_state.py", "src/registry/stack_priors.py",
              "src/registry/kernel_paths.py", "src/registry_loader.py",
              "src/scheduling/device_model.py", "orchestration/launch_manifest.yaml",
              "orchestration/stack_topology.yaml", "orchestration/model_registry.yaml",
              "orchestration/model_registry_full.yaml", "orchestration/derived/stack_priors.yaml",
          ]

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          fixture_paths = {
              "tests/conftest.py",
              "tests/unit/test_affinity_preflight_cell_manifest.py",
              "tests/unit/test_build_server_command_helpers.py",
              "tests/unit/test_contention_matrix_host_health.py",
          }
          modified_readsets = {
              "tests/unit/test_affinity_preflight_cell_manifest.py",
              "tests/unit/test_build_server_command_helpers.py",
              "tests/unit/test_contention_matrix_host_health.py",
          }
          if len(paths) != 25:
              raise SystemExit(f"expected 25 bounded topology readsets, got {len(paths)}")
          expected_changed = sorted({
              "tests/unit/test_ap54_eval_knowledge_fence.py",
              "tests/unit/test_affinity_preflight_cell_manifest.py",
              "tests/unit/test_build_server_command_helpers.py",
              "tests/unit/test_contention_matrix_host_health.py",
          })

          if subprocess.check_output(["git", "-C", str(published), "rev-parse", "HEAD"], text=True).strip() != os.environ["APP_FIXTURE_CANDIDATE_PUBLISHED_SHA"]:
              raise SystemExit("published fixture candidate pin mismatch")
          if subprocess.check_output(["git", "-C", str(donor), "rev-parse", "HEAD"], text=True).strip() != os.environ["APP_FIXTURE_CANDIDATE_SYNTHETIC_SHA"]:
              raise SystemExit("synthetic fixture candidate pin mismatch")
          if subprocess.check_output(["git", "-C", str(published_base), "rev-parse", "HEAD"], text=True).strip() != os.environ["APP_FIXTURE_BASE_PUBLISHED_SHA"]:
              raise SystemExit("published fixture base pin mismatch")
          if subprocess.check_output(["git", "-C", str(donor_base), "rev-parse", "HEAD"], text=True).strip() != os.environ["APP_FIXTURE_BASE_SYNTHETIC_SHA"]:
              raise SystemExit("synthetic fixture base pin mismatch")
          for candidate, base, expected in (
              (published, published_base, os.environ["APP_FIXTURE_BASE_PUBLISHED_SHA"]),
              (donor, donor_base, os.environ["APP_FIXTURE_BASE_SYNTHETIC_SHA"]),
          ):
              parent = subprocess.check_output(
                  ["git", "-C", str(candidate), "rev-parse", "HEAD^"], text=True
              ).strip()
              if parent != expected:
                  raise SystemExit(f"fixture candidate is not directly based on its pinned original: {candidate.name}")
              changed = subprocess.check_output(
                  ["git", "-C", str(candidate), "diff", "--name-only", "HEAD^", "HEAD"],
                  text=True,
              )
              if sorted(path for path in changed.splitlines() if path) != expected_changed:
                  raise SystemExit(f"fixture candidate has unexpected changed paths: {candidate.name}")

          records = []
          for relative in paths:
              published_path, donor_path = published / relative, donor / relative
              published_base_path, donor_base_path = published_base / relative, donor_base / relative
              if not all(path.is_file() for path in (
                  published_path, donor_path, published_base_path, donor_base_path
              )):
                  raise SystemExit(f"missing comparison input: {relative}")
              published_sha, donor_sha = sha(published_path), sha(donor_path)
              published_base_sha, donor_base_sha = sha(published_base_path), sha(donor_base_path)
              if published_sha != donor_sha:
                  raise SystemExit(f"fixture candidate readset differs: {relative}")
              if relative not in modified_readsets:
                  if published_base_sha != published_sha:
                      raise SystemExit(f"published fixture candidate changed an input outside its fixtures: {relative}")
                  if donor_base_sha != donor_sha:
                      raise SystemExit(f"synthetic fixture candidate changed an input outside its fixtures: {relative}")
              records.append({"path": relative,
                              "fixture_base_published_sha256": published_base_sha,
                              "fixture_candidate_published_sha256": published_sha,
                              "fixture_base_synthetic_sha256": donor_base_sha,
                              "fixture_candidate_synthetic_sha256": donor_sha,
                              "fixture_inputs_identical": True,
                              "unchanged_from_base": relative not in modified_readsets})

          bootstrap = donor / "tests/fixtures/offhost_unit_bootstrap.py"
          if not bootstrap.is_file():
              raise SystemExit("synthetic donor bootstrap missing")
          bootstrap_base = donor_base / "tests/fixtures/offhost_unit_bootstrap.py"
          if not bootstrap_base.is_file() or sha(bootstrap) != sha(bootstrap_base):
              raise SystemExit("synthetic donor bootstrap changed from its original pin")
          comparison = {
              "schema": "ssu_f13.source_comparison.v1",
              "fixture_base_published_sha": os.environ["APP_FIXTURE_BASE_PUBLISHED_SHA"],
              "fixture_candidate_published_sha": os.environ["APP_FIXTURE_CANDIDATE_PUBLISHED_SHA"],
              "fixture_base_synthetic_sha": os.environ["APP_FIXTURE_BASE_SYNTHETIC_SHA"],
              "fixture_candidate_synthetic_sha": os.environ["APP_FIXTURE_CANDIDATE_SYNTHETIC_SHA"],
              "readset_count": len(records),
              "production_readset_count": len(paths) - len(fixture_paths),
              "unchanged_readset_count": len(paths) - len(modified_readsets),
              "readsets_identical_between_fixture_candidates": True,
              "non_test_readsets_unchanged_from_each_base": True,
              "fixture_changed_paths": expected_changed,
              "inputs": records,
              "bootstrap_path": "tests/fixtures/offhost_unit_bootstrap.py",
              "bootstrap_sha256": sha(bootstrap),
              "bootstrap_semantics": "test-process-only declared 1 TiB RAM; production validator unchanged",
          }
          with Path("ssu-f13-topology-comparison.json").open("x", encoding="utf-8") as output:
              output.write(json.dumps(comparison, sort_keys=True) + "\n")
          PY
      - name: Record synthetic topology-parity context
        if: ${{ always() && steps.compare_topology_inputs.outcome == 'success' }}
        working-directory: app-synthetic
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          context = {
              "schema": "ssu_f13.repro_context.v2",
              "phase": "synthetic_topology_parity_13_named_cases",
              "fixture_candidate_synthetic_sha": "bb6ce5d72c0a2b2b9ec48f9d27e003d626d1fe37",
              "fixture_base_synthetic_sha": "def18591f813070a20906f9d228ddd9dd0da9fd3",
              "comparison_fixture_candidate_published_sha": "86015733aa5dbe4c1bfcfbd996d7496a2494f098",
              "comparison_fixture_base_published_sha": "4244e72b2aa8aae9a92f684fcd5090a852223888",
              "runner_context": "ordinary GitHub runner; explicit existing offhost_unit_bootstrap only for this pytest process",
              "synthetic_host_ram_gib": 1024,
              "scope": "13 named topology-parity cases; no source capacity relaxation",
              "comparison_manifest": "ssu-f13-topology-comparison.json",
              "cache_dir": str(runner_temp / "ssu-f13-topology-cache"),
              "tmp_dir": str(runner_temp / "ssu-f13-topology-tmp"),
              "timeout": "GNU timeout 120s; TERM; KILL after 30s",
              "inference": "none",
              "claim_scope": "selected fixture reproduction only; no topology correction or fleet claim",
          }
          with Path("ssu-f13-topology-context.json").open("x", encoding="utf-8") as output:
              output.write(json.dumps(context, sort_keys=True) + "\n")
          PY
      - name: Capture synthetic topology-parity subset
        if: ${{ always() && steps.compare_topology_inputs.outcome == 'success' }}
        working-directory: app-synthetic
        env:
          ORCHESTRATOR_PATHS_CACHE_DIR: ${{ runner.temp }}/ssu-f13-topology-cache
          ORCHESTRATOR_PATHS_TMP_DIR: ${{ runner.temp }}/ssu-f13-topology-tmp
        run: |
          mkdir -p "$ORCHESTRATOR_PATHS_CACHE_DIR" "$ORCHESTRATOR_PATHS_TMP_DIR"
          python "$GITHUB_WORKSPACE/root-producer/scripts/ci/native_conformance.py" \
            --cwd "$PWD" --junit ssu-f13-topology.xml --output native-ssu-f13-topology \
            --generated-output ssu-f13-topology.pytest.log \
            --repo "root_workflow=$GITHUB_WORKSPACE/ci-control" \
            --repo "root_producer=$GITHUB_WORKSPACE/root-producer" \
            --repo "orchestrator_synthetic=$PWD" \
            --repo "orchestrator_fixture_candidate_published=$GITHUB_WORKSPACE/app-published" \
            --repo "research=$GITHUB_WORKSPACE/research" \
            --read-path "$GITHUB_WORKSPACE/ci-control/.github/workflows/ssu-f13-bounded-followup.yml" \
            --read-path "$GITHUB_WORKSPACE/root-producer/scripts/ci/native_conformance.py" \
            --read-path "$GITHUB_WORKSPACE/root-producer/scripts/vidya/adapters/ci_conformance.py" \
            --read-path "$GITHUB_WORKSPACE/root-producer/scripts/vidya/claim_tuple.py" \
            --read-path "$GITHUB_WORKSPACE/root-producer/scripts/vidya/cli.py" \
            --read-path ssu-f13-topology-context.json \
            --read-path ssu-f13-topology-comparison.json \
            --read-path tests/fixtures/offhost_unit_bootstrap.py \
            --read-path pyproject.toml --read-path tests/conftest.py \
            --read-path tests/unit/test_affinity_preflight_cell_manifest.py \
            --read-path tests/unit/test_build_server_command_helpers.py \
            --read-path tests/unit/test_contention_matrix_host_health.py \
            --read-path scripts/server/affinity_preflight.py \
            --read-path scripts/server/orchestrator_stack.py \
            --read-path scripts/server/stack_commands.py \
            --read-path scripts/server/contention_matrix.py \
            --read-path scripts/server/stack_manifest.py --read-path scripts/server/stack_numa.py \
            --read-path scripts/server/stack_paths.py --read-path scripts/server/stack_env.py \
            --read-path scripts/server/stack_runtime.py --read-path scripts/server/stack_processes.py \
            --read-path scripts/server/stack_state.py --read-path src/registry/stack_priors.py \
            --read-path src/registry/kernel_paths.py --read-path src/registry_loader.py \
            --read-path src/scheduling/device_model.py \
            --read-path orchestration/launch_manifest.yaml \
            --read-path orchestration/stack_topology.yaml \
            --read-path orchestration/model_registry.yaml \
            --read-path orchestration/model_registry_full.yaml \
            --read-path orchestration/derived/stack_priors.yaml \
            --read-path "$GITHUB_WORKSPACE/app-published/pyproject.toml" \
            --read-path "$GITHUB_WORKSPACE/app-published/tests/conftest.py" \
            --read-path "$GITHUB_WORKSPACE/app-published/tests/unit/test_affinity_preflight_cell_manifest.py" \
            --read-path "$GITHUB_WORKSPACE/app-published/tests/unit/test_build_server_command_helpers.py" \
            --read-path "$GITHUB_WORKSPACE/app-published/tests/unit/test_contention_matrix_host_health.py" \
            --read-path "$GITHUB_WORKSPACE/app-published/scripts/server/affinity_preflight.py" \
            --read-path "$GITHUB_WORKSPACE/app-published/scripts/server/orchestrator_stack.py" \
            --read-path "$GITHUB_WORKSPACE/app-published/scripts/server/stack_commands.py" \
            --read-path "$GITHUB_WORKSPACE/app-published/scripts/server/contention_matrix.py" \
