name: C5 persisted seed/provider join conformance capture
on:
  push:
    branches: [codex/ni08-c5-seed-map-capture-20261006]
    paths:
      - .github/workflows/ni08-c5-seed-map-capture.yml
      - scripts/ci/ni08_c5_seed_map_capture.py
      - scripts/ci/ni08_c5_seed_map_capture_requirements.txt
      - scripts/ci/ni08_c5_seed_map_expected_cases.json
permissions:
  contents: read
jobs:
  c5-seed-map-capture:
    name: c5-seed-map-capture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESEARCH_PIN: 82619ca6f73d840107eaa0c5132652b010cbd9ed
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      APP_PIN: 70096b763939a43409a1f1827ab633d62425a6c1
      NI08_INSTALL_COMMAND: >-
        python -m pip install --require-hashes -r recipe/scripts/ci/ni08_c5_seed_map_capture_requirements.txt
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni08-c5-seed-map-capture/result"
          printf '{"state":"setup_pending","job":"c5-seed-map-capture","exit_code":null}\n' > "$RUNNER_TEMP/ni08-c5-seed-map-capture/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout APP lock source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - name: Checkout exact C5 Research source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-inference-research
          ref: ${{ env.RESEARCH_PIN }}
          path: research
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install hash-locked pytest closure
        run: ${{ env.NI08_INSTALL_COMMAND }}
      - name: Capture original JUnit and native fixture receipt
        run: python recipe/scripts/ci/ni08_c5_seed_map_capture.py
      - name: Preserve status, original JUnit, native receipt and original-only grade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni08-c5-seed-map-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni08-c5-seed-map-capture/result/
          if-no-files-found: error
