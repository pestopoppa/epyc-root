name: MF trace native source controls
on:
  push:
    branches: [codex/mf-trace-native-source-20261008]
permissions:
  contents: read
jobs:
  mf-trace-source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ROOT_CONTEXT_PIN: 11f38bd0c3824f4180d2f605e16a0d8b2b4d6526
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      APP_PIN: a4cc85eb774c066f30adc7b91aa26a40bbcc9036
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Initialize preserved original envelope
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mf-trace-native/result"
          printf '{"state":"setup_pending","exit_code":null}\n' > "$RUNNER_TEMP/mf-trace-native/status.json"
      - name: Checkout exact ROOT recipe and adapter proposal
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout unchanged original CI carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout exact APP source proposal
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install existing minimal locked native-test environment
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/mf-trace-native/venv"
          "$RUNNER_TEMP/mf-trace-native/venv/bin/python" -m pip install --require-hashes --no-deps --only-binary=:all: -r recipe/scripts/ci/mf_trace_native/requirements.txt 2>&1 | tee "$RUNNER_TEMP/mf-trace-native/result/dependency-install.log"
      - name: Capture all four whole-module synthetic controls once
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mf-trace-native/venv/bin/python" -I recipe/scripts/ci/mf_trace_native/capture.py
      - name: Retain original verdict JUnit errors and source custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mf-trace-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mf-trace-native/result/
            ${{ runner.temp }}/mf-trace-native/source-readset.json
            ${{ runner.temp }}/mf-trace-native/status.json
          if-no-files-found: error
