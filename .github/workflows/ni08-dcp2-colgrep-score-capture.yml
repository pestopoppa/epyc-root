name: NI08 DCP2 finite ColGREP score controls
on:
  push:
    branches: [codex/ni08-dcp2-colgrep-recipe-20261007]
permissions:
  contents: read
jobs:
  dcp2-colgrep-score-controls:
    name: dcp2-colgrep-score-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_PIN: b21e45af6fea25340bddf15e28b633ccc99b0604
      ROOT_CONTEXT_PIN: f71cc137fc3bc17325d6255884eaed7e9dee98c9
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      DCP2_RUNNER_CONTEXT: ubuntu-24.04
      DCP2_EXECUTION_CONTEXT: finite-score-injected-search-no-colgrep-or-model
      DCP2_INSTALL_COMMAND: >-
        python -m venv "$RUNNER_TEMP/ni08-dcp2-colgrep-score/venv" &&
        "$RUNNER_TEMP/ni08-dcp2-colgrep-score/venv/bin/python" -m pip install
        --no-deps --only-binary=:all: --require-hashes -r
        recipe/scripts/ci/ni08_dcp2_colgrep_requirements.txt
      ORCHESTRATOR_MOCK_MODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PYTEST_PLUGINS: ''
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Initialize artifact status before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni08-dcp2-colgrep-score/result"
          printf '{"state":"setup_pending","exit_code":null,"native_conformance":null,"native_receipt_state":"no_receipt","capture_started":false}\n' > "$RUNNER_TEMP/ni08-dcp2-colgrep-score/result/status.json"
      - name: Checkout exact ROOT recipe and enrolled context
        id: root_checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: recipe
          persist-credentials: false
      - name: Checkout existing native CI carrier
        id: carrier_checkout
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout exact APP source candidate
        id: app_checkout
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          fetch-depth: 0
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: '3.13.15'
      - name: Install only complete locked wheel closure
        id: install_deps
        run: |
          set -euo pipefail
          ${{ env.DCP2_INSTALL_COMMAND }} 2>&1 | tee "$RUNNER_TEMP/ni08-dcp2-colgrep-score/result/dependency-install.log"
      - name: Retain exact isolated environment
        id: freeze
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ni08-dcp2-colgrep-score/venv/bin/python" -m pip freeze --all > "$RUNNER_TEMP/ni08-dcp2-colgrep-score/result/pip-freeze.txt"
      - name: Capture original whole-module source controls
        id: capture
        env:
          REPL_COLGREP_BIN: ${{ runner.temp }}/ni08-dcp2-colgrep-score/absent/colgrep
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/app"
          "$RUNNER_TEMP/ni08-dcp2-colgrep-score/venv/bin/python" recipe/scripts/ci/ni08_dcp2_colgrep_capture.py
      - name: Preserve setup failure custody when capture never started
        if: always()
        env:
          ROOT_CHECKOUT_OUTCOME: ${{ steps.root_checkout.outcome }}
          CARRIER_CHECKOUT_OUTCOME: ${{ steps.carrier_checkout.outcome }}
          APP_CHECKOUT_OUTCOME: ${{ steps.app_checkout.outcome }}
          PYTHON_SETUP_OUTCOME: ${{ steps.setup_python.outcome }}
          DEPENDENCY_INSTALL_OUTCOME: ${{ steps.install_deps.outcome }}
          ENV_FREEZE_OUTCOME: ${{ steps.freeze.outcome }}
          CAPTURE_STEP_OUTCOME: ${{ steps.capture.outcome }}
        run: |
          python3 - "$RUNNER_TEMP/ni08-dcp2-colgrep-score/result" <<'PYSETUP'
          import hashlib, json, os, stat, sys
          from pathlib import Path
          root=Path(sys.argv[1]); status_path=root/'status.json'; record=root/'error-custody.json'
          if not status_path.is_file() or record.exists() or record.is_symlink(): raise SystemExit(0)
          status=json.loads(status_path.read_text())
          if status.get('capture_started') is True: raise SystemExit(0)
          outcomes={k:os.environ.get(k) for k in ('ROOT_CHECKOUT_OUTCOME','CARRIER_CHECKOUT_OUTCOME','APP_CHECKOUT_OUTCOME','PYTHON_SETUP_OUTCOME','DEPENDENCY_INSTALL_OUTCOME','ENV_FREEZE_OUTCOME','CAPTURE_STEP_OUTCOME')}
          tree={'.':{'kind':'directory'}}
          def walk(directory):
              for entry in sorted(os.scandir(directory),key=lambda item:item.name):
                  path=Path(entry.path); mode=entry.stat(follow_symlinks=False).st_mode; rel=path.relative_to(root).as_posix()
                  if rel=='status.json': continue
                  if stat.S_ISLNK(mode):
                      target=os.readlink(path).encode('utf-8','surrogateescape'); tree[rel]={'kind':'symlink_opaque','target_bytes':len(target),'target_sha256':hashlib.sha256(target).hexdigest()}
                  elif stat.S_ISDIR(mode): tree[rel+'/']={'kind':'directory'}; walk(path)
                  elif stat.S_ISREG(mode):
                      fd=os.open(path,os.O_RDONLY|getattr(os,'O_NOFOLLOW',0)); h=hashlib.sha256(); total=0
                      try:
                          before=os.fstat(fd)
                          if not stat.S_ISREG(before.st_mode) or before.st_nlink!=1: raise RuntimeError('nonregular setup artifact')
                          while True:
                              chunk=os.read(fd,1048576)
                              if not chunk: break
                              h.update(chunk); total+=len(chunk)
                          after=os.fstat(fd)
                          if total!=after.st_size or (before.st_dev,before.st_ino,before.st_size,before.st_mtime_ns)!=(after.st_dev,after.st_ino,after.st_size,after.st_mtime_ns): raise RuntimeError('setup artifact changed during hashing')
                      finally: os.close(fd)
                      tree[rel]={'kind':'regular','bytes':total,'sha256':h.hexdigest()}
                  else: raise RuntimeError('special setup artifact')
          walk(root)
          payload={'phase':'workflow_setup_before_native_capture','capture_started':False,'native_receipt_state':'no_receipt','native_metric_value':None,'workflow_step_outcomes':outcomes,'typed_result_tree_before_error_record':tree,'typed_result_tree_sha256':hashlib.sha256(json.dumps(tree,sort_keys=True,separators=(',',':')).encode()).hexdigest(),'status_excluded':True,'error_record_self_excluded':True,'proposition_invented':False}
          with record.open('x') as handle: json.dump(payload,handle,sort_keys=True,indent=2); handle.write('\n'); handle.flush(); os.fsync(handle.fileno())
          status.update(state='setup_failed',failure_stage='workflow_setup',capture_started=False,native_receipt_state='no_receipt',workflow_step_outcomes=outcomes,error_custody_state='written before final status; status and self excluded from typed tree')
          status_path.write_text(json.dumps(status,sort_keys=True)+'\n')
          PYSETUP
      - name: Preserve original JUnit, command, typed receipt, logs and custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni08-dcp2-colgrep-score-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni08-dcp2-colgrep-score/result/
          if-no-files-found: error
