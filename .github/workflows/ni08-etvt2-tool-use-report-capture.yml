name: NI08 ETV-T2 tool-use report synthetic capture
on:
  push:
    branches: [codex/ni08-etvt2-tool-use-report-capture-20261006]
    paths:
      - .github/workflows/ni08-etvt2-tool-use-report-capture.yml
      - scripts/ci/ni08_etvt2_tool_use_report_capture.py
permissions:
  contents: read
jobs:
  etvt2-tool-use-report-synthetic-capture:
    name: etvt2-tool-use-report-synthetic-capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PIN: 5c7333daf92cb1b1131abdbb3be733a0b4851163
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      NI08_RUNNER_CONTEXT: ubuntu-latest
      NI08_EXECUTION_CONTEXT: offline-native-tool-use-jsonl-fixtures
      NI08_INSTALL_COMMAND: >-
        python -m pip install pytest==9.0.3 iniconfig==2.3.0 packaging==26.0
        pluggy==1.6.0 Pygments==2.20.0
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni08-etvt2-tool-use-report-capture/result"
          printf '{"state":"setup_pending","job":"etvt2-tool-use-report-synthetic-capture","exit_code":null}\n' > "$RUNNER_TEMP/ni08-etvt2-tool-use-report-capture/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout reviewed APP source and selected tests
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install pinned APP lock-resolved test import closure
        run: ${{ env.NI08_INSTALL_COMMAND }}
      - name: Capture original JUnit and native synthetic receipt
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/app"
          python recipe/scripts/ci/ni08_etvt2_tool_use_report_capture.py
      - name: Preserve status, original JUnit and every native receipt member
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni08-etvt2-tool-use-report-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni08-etvt2-tool-use-report-capture/result/
          if-no-files-found: error
