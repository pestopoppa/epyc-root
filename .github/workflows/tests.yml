name: tests

# 40 dashboard tests sat RED, committed, for a day. `.github/workflows/` contained
# only `docs.yml`, which never invokes pytest, so nothing on a push would have said
# so. This workflow is that missing signal.
#
# It runs the HERMETIC suites -- the ones that need no GPU, no ROCm toolchain, and no
# live runtime state under /mnt/raid0. Suites that read production state are excluded
# BY NAME below rather than silently skipped, because a green run over an empty
# selection is worse than no run at all.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'dashboard/**'
      - '.github/workflows/tests.yml'
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL history, not the action's default `fetch-depth: 1`.
          #
          # `index_state.py` derives the `Oldest advance` column from
          # `git log -1 -S'- [x]' -- <handoff>` — the date of the last commit that
          # flipped a CHECKBOX. In a depth-1 checkout the ONLY commit reachable is the
          # tip, so the pickaxe attributes every handoff to it and all six domains
          # collapse to the tip's own date. The rendered block then differs from the
          # committed one in exactly that column, and the freshness assertion reports
          # "generated block is stale" on a tree that is perfectly in sync. That is
          # why this workflow failed 8 of its first 8 runs and never once passed.
          #
          # Do NOT "fix" this by relaxing the freshness check: the other three columns
          # (Handoffs / Open / Blocked) are content-derived and matched exactly, so the
          # check was right to fire — it was fed a repository that could not answer the
          # question. Full history is ~47 MB packed / ~4 s to clone.
          fetch-depth: 0

      - name: Checkout pinned research producers
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-inference-research
          ref: bed81e59f5a4d9f9cdb246b4b1eebe1d3e400762
          path: .ci-research-producers
          persist-credentials: false

      - name: Checkout pinned orchestrator S4 producer
        # Dashboard writer/reader canaries use a separate current contract checkout below.
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: 5775730ccd2bb69805f5843ab1b001b002930fbd
          path: .ci-orchestrator-producer
          persist-credentials: false

      - name: Checkout pinned dashboard contract producers
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-inference-research
          ref: 94b1dd64c163d915eb1347b118f57e44e981bf78
          path: .ci-dashboard-producers
          persist-credentials: false

      - name: Checkout pinned orchestrator analysis producers
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: cfcf3768716de888a971bf66489397f5b91241df
          path: .ci-orchestrator-analysis-producer
          persist-credentials: false

      - name: Checkout pinned REPL trace-capture producer
        # tests/vidya/test_repl_trace_capture.py executes the genuine producer bytes of THIS
        # commit (it is in neither orchestrator pin above, and `/workspace/repos/...` does not
        # exist on a hosted runner). Sparse: only the one directory is needed.
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: 488b31c96c6c148768508b3dcaefcb6c4c297664
          path: .ci-repl-trace-producer
          sparse-checkout: src/repl_environment
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The pinned native privacy preflight imports these through the orchestrator package.
          pip install pytest pyyaml numpy httpx "pydantic-graph>=1.80.0,<2" "langgraph>=0.2.0" "jsonschema>=4.20"

      - name: Belief substrate
        # The vidya adapters and their ladder: pure projection, no hardware.
        env:
          KV_QUANT_TEST_RESEARCH_ROOT: ${{ github.workspace }}/.ci-research-producers
          EXL3_TEST_PRODUCER: ${{ github.workspace }}/.ci-research-producers/scripts/kernel_rnd/exl3/evidence.py
          EVIDENCE_DURABILITY_PRODUCER: ${{ github.workspace }}/.ci-research-producers/scripts/validate/check_evidence_durability.py
          EPYC_ORCHESTRATOR_SOURCE_ROOT: ${{ github.workspace }}/.ci-orchestrator-producer
          EPYC_REPL_TRACE_SOURCE_ROOT: ${{ github.workspace }}/.ci-repl-trace-producer
          EPYC_MF_ORCHESTRATOR_SOURCE_ROOT: ${{ github.workspace }}/.ci-orchestrator-analysis-producer
          EPYC_EVAL_ORCHESTRATOR_SOURCE_ROOT: ${{ github.workspace }}/.ci-orchestrator-analysis-producer
          PYTHONPATH: ${{ github.workspace }}/.ci-orchestrator-producer:${{ github.workspace }}
        run: python -m pytest -q tests/vidya/

      - name: Handoff index integrity
        # Coverage, schema and freshness of the index rollup. Must exit 0 before a
        # commit lands, and now does so on a push as well.
        run: python3 scripts/handoffs/index_state.py --check

      - name: Dashboard contracts, health and actual surviving page renderers
        env:
          EPYC_INFERENCE_RESEARCH_ROOT: ${{ github.workspace }}/.ci-dashboard-producers
        run: python -m pytest -q tests/test_dashboard_activity.py tests/test_dashboard_panels.py tests/test_dashboard_panels_redteam.py tests/test_dashboard_loop_surface.py tests/test_dashboard_kernel_api_retirement.py tests/test_dashboard_kernel_rnd_merge.py tests/test_dashboard_kernel_freshness_envelopes.py tests/test_dashboard_operator_gates.py tests/test_dashboard_runtime_js.py tests/test_dashboard_progression.py tests/test_dashboard_authoring_refusal_visible.py tests/test_dashboard_champion_card.py tests/test_dashboard_controller_state_contract.py tests/test_dashboard_r21_4_fixtures.py tests/test_dashboard_knowledge_card.py tests/test_production_kernel_set.py tests/test_dashboard_serial_loop.py tests/test_dashboard_serial_completed.py tests/test_dashboard_terminal_loop.py tests/test_dashboard_runtime_progress.py tests/test_dashboard_runtime_observation.py

      - name: Trust-boundary ratification receipts
        # Every script that writes a human-only path (MEASUREMENT.md, its annexes,
        # agents/shared/*.md, CLAUDE.md, the boundary list itself) must emit the
        # MEASUREMENT.md section-5 consolidated receipt, or be a pinned historical
        # exemption. The checker landed at W7 (2026-08-02) and was never wired to
        # anything, so non-compliant ratifiers accumulated unseen until 2026-09-26.
        run: |
          python -m pytest -q tests/validate/test_check_ratification_receipts.py
          python3 scripts/validate/check_ratification_receipts.py

      - name: Report what was NOT run
        # Named, not hidden. A suite excluded without saying so reads as coverage.
        if: always()
        run: |
          echo "NOT run in CI, and why:"
          echo "  anything requiring an MI210, ROCm, or a llama.cpp build tree."
