name: tests

# 40 dashboard tests sat RED, committed, for a day. `.github/workflows/` contained
# only `docs.yml`, which never invokes pytest, so nothing on a push would have said
# so. This workflow is that missing signal.
#
# It runs the HERMETIC suites -- the ones that need no GPU, no ROCm toolchain, and no
# live runtime state under /mnt/raid0. Suites that read production state are excluded
# BY NAME below rather than silently skipped, because a green run over an empty
# selection is worse than no run at all.

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'dashboard/**'
      - '.github/workflows/tests.yml'
  pull_request:

jobs:
  hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL history, not the action's default `fetch-depth: 1`.
          #
          # `index_state.py` derives the `Oldest advance` column from
          # `git log -1 -S'- [x]' -- <handoff>` — the date of the last commit that
          # flipped a CHECKBOX. In a depth-1 checkout the ONLY commit reachable is the
          # tip, so the pickaxe attributes every handoff to it and all six domains
          # collapse to the tip's own date. The rendered block then differs from the
          # committed one in exactly that column, and the freshness assertion reports
          # "generated block is stale" on a tree that is perfectly in sync. That is
          # why this workflow failed 8 of its first 8 runs and never once passed.
          #
          # Do NOT "fix" this by relaxing the freshness check: the other three columns
          # (Handoffs / Open / Blocked) are content-derived and matched exactly, so the
          # check was right to fire — it was fed a repository that could not answer the
          # question. Full history is ~47 MB packed / ~4 s to clone.
          fetch-depth: 0

      - name: Checkout pinned research producers
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-inference-research
          ref: bed81e59f5a4d9f9cdb246b4b1eebe1d3e400762
          path: .ci-research-producers
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Belief substrate
        # The vidya adapters and their ladder: pure projection, no hardware.
        env:
          KV_QUANT_TEST_RESEARCH_ROOT: ${{ github.workspace }}/.ci-research-producers
          EXL3_TEST_PRODUCER: ${{ github.workspace }}/.ci-research-producers/scripts/kernel_rnd/exl3/evidence.py
          EVIDENCE_DURABILITY_PRODUCER: ${{ github.workspace }}/.ci-research-producers/scripts/validate/check_evidence_durability.py
        run: python -m pytest -q tests/vidya/

      - name: Handoff index integrity
        # Coverage, schema and freshness of the index rollup. Must exit 0 before a
        # commit lands, and now does so on a push as well.
        run: python3 scripts/handoffs/index_state.py --check

      - name: Trust-boundary ratification receipts
        # Every script that writes a human-only path (MEASUREMENT.md, its annexes,
        # agents/shared/*.md, CLAUDE.md, the boundary list itself) must emit the
        # MEASUREMENT.md section-5 consolidated receipt, or be a pinned historical
        # exemption. The checker landed at W7 (2026-08-02) and was never wired to
        # anything, so non-compliant ratifiers accumulated unseen until 2026-09-26.
        run: |
          python -m pytest -q tests/validate/test_check_ratification_receipts.py
          python3 scripts/validate/check_ratification_receipts.py

      - name: Report what was NOT run
        # Named, not hidden. A suite excluded without saying so reads as coverage.
        if: always()
        run: |
          echo "NOT run in CI, and why:"
          echo "  tests/test_dashboard_autokernel_*.py  - read live deployment state"
          echo "      under /mnt/raid0/llm/autokernel and pin content digests of"
          echo "      another repository's source modules. 11 of these are RED at"
          echo "      origin/main as of 2026-08-28; they are slated for rewrite in"
          echo "      P6 of handoffs/active/autokernel-rebuild-program.md, and"
          echo "      re-pinning digests on code about to be replaced would only"
          echo "      re-arm the landmine."
          echo "  anything requiring an MI210, ROCm, or a llama.cpp build tree."
