name: UTM-B3 BEAM FTS source controls
on:
  push:
    branches: [codex/ni08-utm-b3-beam-capture-20261007]
permissions:
  contents: read
jobs:
  beam-fts-source-controls:
    name: beam-fts-source-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROOT_SOURCE_PIN: 657a0f42f94a2e86bc2938504b317e206fbc1b48
      RESEARCH_PIN: 180a772445e2c227979998cdec9b7a50ae5aa54e
      APP_PIN: e7e4ffc45164af5a4c66c438ecb1e98120efcf6a
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      UTM_B3_RUNNER_CONTEXT: ubuntu-24.04
      UTM_B3_EXECUTION_CONTEXT: utm-b3-synthetic-beam-memory-provenance-private-sqlite-no-model-or-embedding
      UTM_B3_INSTALL_COMMAND: >-
        python -m venv "$RUNNER_TEMP/ni08-utm-b3-beam/venv" &&
        "$RUNNER_TEMP/ni08-utm-b3-beam/venv/bin/python" -m pip install
        --require-hashes --no-deps --only-binary=:all: -r
        recipe/scripts/ci/ni08_utm_b3_requirements.txt
      EPYC_ORCHESTRATOR_ROOT: ${{ github.workspace }}/app
      TULVING_TRACE_DB_DIR: ${{ runner.temp }}/ni08-utm-b3-beam/trace-db
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Initialize artifact envelope
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ni08-utm-b3-beam/result"
          printf '{"state":"setup_pending","exit_code":null}\n' > "$RUNNER_TEMP/ni08-utm-b3-beam/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: recipe
          persist-credentials: false
      - name: Checkout unchanged native carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout BEAM source proposal
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-inference-research
          ref: ${{ env.RESEARCH_PIN }}
          path: research
          persist-credentials: false
      - name: Checkout exact memory provenance source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install exact lock-derived wheel closure
        run: |
          set -euo pipefail
          ${{ env.UTM_B3_INSTALL_COMMAND }} 2>&1 | tee "$RUNNER_TEMP/ni08-utm-b3-beam/result/dependency-install.log"
      - name: Capture all 21 BEAM memory provenance controls
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/raid0/llm
          if sudo test -e /mnt/raid0/llm/epyc-orchestrator || sudo test -L /mnt/raid0/llm/epyc-orchestrator; then
            echo 'refusing to replace an existing orchestrator checkout path' >&2
            exit 1
          fi
          sudo ln -s "$GITHUB_WORKSPACE/app" /mnt/raid0/llm/epyc-orchestrator
          test -f /mnt/raid0/llm/epyc-orchestrator/src/trace/query.py
          grep -q 'ORDER_RELEVANCE' /mnt/raid0/llm/epyc-orchestrator/src/trace/query.py
          export PYTHONPATH="$GITHUB_WORKSPACE/research"
          "$RUNNER_TEMP/ni08-utm-b3-beam/venv/bin/python" recipe/scripts/ci/ni08_utm_b3_capture.py
      - name: Preserve original conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni08-utm-b3-beam-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ni08-utm-b3-beam/result/
            ${{ runner.temp }}/ni08-utm-b3-beam/source-readset.json
            ${{ runner.temp }}/ni08-utm-b3-beam/status.json
          if-no-files-found: error
