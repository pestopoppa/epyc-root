name: EVL-38 periodic root candidate-eval gate

on:
  schedule:
    - cron: '17 12 * * *'
  push:
    branches:
      - codex/ni08-evl38-periodic-proposal-20261007

permissions:
  contents: read

concurrency:
  group: evl38-candidate-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-gate:
    name: exact-root-gate-observation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EPYC_ORCHESTRATOR_REPO: ${{ github.workspace }}/app
      EPYC_INFERENCE_RESEARCH_REPO: ${{ github.workspace }}/research
      EPYC_LLAMA_REPO: ${{ github.workspace }}/llama
      CANDIDATE_EVAL_REQUIRE_DEPS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Initialize retained outcome before setup
        run: |
          mkdir -p "$RUNNER_TEMP/evl38/result"
          printf '%s\n' '{"state":"setup_pending","job":"candidate-gate","exit_code":null}' > "$RUNNER_TEMP/evl38/result/status.json"

      - name: Checkout the exact root workflow and gate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: root
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout orchestrator readiness inputs
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: main
          path: app
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout research readiness and PII fixture inputs
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-inference-research
          ref: main
          path: research
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout the frozen serving source for structural scoring only
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/llama.cpp
          ref: ffc1bac82eeca6f9099e1ccd9ba49703c460a115
          path: llama
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Provide the exact registry checkout layout
        run: |
          mkdir -p root/repos
          ln -s ../../app root/repos/epyc-orchestrator
          ln -s ../../research root/repos/epyc-inference-research

      - name: Create isolated environment and install locked wheels
        id: install
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/evl38/result"
          python -m venv "$RUNNER_TEMP/evl38/venv" > "$RUNNER_TEMP/evl38/result/install.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            "$RUNNER_TEMP/evl38/venv/bin/python" -m pip install \
              --require-hashes --no-deps --only-binary=:all: \
              -r root/scripts/ci/evl38-constraints.txt \
              >> "$RUNNER_TEMP/evl38/result/install.log" 2>&1
            rc=$?
          fi
          printf '{"state":"install_finished","install_exit_code":%s,"gate_exit_code":null}\n' \
            "$rc" > "$RUNNER_TEMP/evl38/result/status.json"
          cat "$RUNNER_TEMP/evl38/result/install.log"
          exit "$rc"

      - name: Capture the complete candidate gate through the existing verifier
        id: capture
        if: steps.install.outcome == 'success'
        run: |
          set +e
          "$RUNNER_TEMP/evl38/venv/bin/python" root/scripts/ci/evl38_run_capture.py \
            "$GITHUB_WORKSPACE/app" "$GITHUB_WORKSPACE/research" \
            "$GITHUB_WORKSPACE/llama" "$RUNNER_TEMP/evl38/result/capture" \
            "$RUNNER_TEMP/evl38/result/dependency-manifest.json" \
            > "$RUNNER_TEMP/evl38/result/driver.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/evl38/result/driver.log"
          printf '{"state":"capture_finished","install_exit_code":0,"gate_exit_code":%s}\n' "$rc" > "$RUNNER_TEMP/evl38/result/status.json"
          exit "$rc"

      - name: Preserve status, dependency manifest, original JUnit, command log and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evl38-candidate-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evl38/result/
          if-no-files-found: error
          retention-days: 90
