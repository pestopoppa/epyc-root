name: LR8 inactive event-duty synthetic capture
on:
  push:
    branches: [codex/lr8-event-duty-ci-20261006]
    paths:
      - .github/workflows/lr8-event-duty-capture.yml
      - scripts/ci/lr8_event_duty_capture.py
permissions:
  contents: read
jobs:
  lr8-event-synthetic:
    name: lr8-event-synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_PIN: 78c889085c61f7255171cd1f4ea161176d2ef473
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      LR8_RUNNER_CONTEXT: ubuntu-latest
      LR8_EXECUTION_CONTEXT: offhost-synthetic-event-duty-tests
      LR8_INSTALL_COMMAND: >-
        python -m pip install pytest==9.0.3 iniconfig==2.3.0 packaging==26.0
        pluggy==1.6.0 Pygments==2.20.0
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTEST_ADDOPTS: ''
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/lr8-event-duty/result"
          printf '%s\n' \
            '{"state":"setup_pending","job":"lr8-event-synthetic","exit_code":null}' \
            > "$RUNNER_TEMP/lr8-event-duty/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.SOURCE_PIN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install exact pytest closure
        run: ${{ env.LR8_INSTALL_COMMAND }}
      - name: Capture original JUnit and native synthetic receipt
        run: python recipe/scripts/ci/lr8_event_duty_capture.py
      - name: Preserve status, original JUnit and every native receipt member
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lr8-event-duty-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lr8-event-duty/result/
          if-no-files-found: error
