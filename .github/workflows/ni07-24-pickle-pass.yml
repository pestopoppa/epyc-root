name: NI07 signed-pickle checkpoint transport
on:
  push:
    branches: [codex/ni07-24-pickle-pass-recipe]
    paths:
      - .github/workflows/ni07-24-pickle-pass.yml
      - scripts/ci/ni07_24_pickle_pass_capture.py
permissions:
  contents: read
jobs:
  pickle-pass:
    name: pickle-pass
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_PIN: abaf5364c4ebfb1eb98173ad867b6c5d119a1581
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      NI07_RUNNER_CONTEXT: ubuntu-latest
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      ORCHESTRATOR_SESSION_HMAC_KEY: ni07-24-synthetic-fixture-key
      NI07_INSTALL_COMMAND: >-
        python -m pip install uv==0.8.15; uv sync --frozen --no-dev;
        uv pip install --python .venv/bin/python pytest==9.0.3 pytest-asyncio==1.3.0
        iniconfig==2.3.0 packaging==26.0 pluggy==1.6.0 Pygments==2.20.0
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni07-24-pickle-pass/result"
          printf '{"state":"setup_pending","job":"pickle-pass","exit_code":null}\n' > "$RUNNER_TEMP/ni07-24-pickle-pass/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout reviewed APP source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen application and test dependencies
        working-directory: app
        run: |
          python -m pip install uv==0.8.15
          uv sync --frozen --no-dev
          uv pip install --python .venv/bin/python pytest==9.0.3 pytest-asyncio==1.3.0 \
            iniconfig==2.3.0 packaging==26.0 pluggy==1.6.0 Pygments==2.20.0
      - name: Capture original checkpoint transport receipt
        working-directory: app
        env:
          PYTHONPATH: ${{ github.workspace }}/app
        run: .venv/bin/python recipe/scripts/ci/ni07_24_pickle_pass_capture.py
      - name: Preserve original receipt, JUnit and status on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni07-24-pickle-pass-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni07-24-pickle-pass/result/
          if-no-files-found: error
