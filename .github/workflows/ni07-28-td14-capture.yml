name: NI07-28 typed decision descriptions capture
on:
  push:
    branches: [codex/ni07-28-td14-capture-20261006]
    paths:
      - .github/workflows/ni07-28-td14-capture.yml
      - scripts/ci/ni07_28_td14_capture.py
permissions:
  contents: read
jobs:
  td14-synthetic-capture:
    name: td14-synthetic-capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PIN: 4dd914bb5a00d760e2e87c25069daef67305e9ba
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      NI07_RUNNER_CONTEXT: ubuntu-latest
      NI07_EXECUTION_CONTEXT: offline-fake-decision-fixtures
      ORCHESTRATOR_PATHS_LLAMA_CPP_BIN: /fixture/kernel-bin
      ORCHESTRATOR_PATHS_LLAMA_MTMD: /fixture/llama-mtmd-cli
      ORCHESTRATOR_PATHS_LLAMA_SERVER: /fixture/llama-server
      NI07_INSTALL_COMMAND: >-
        python -m pip install pytest==9.0.3 iniconfig==2.3.0 packaging==26.0
        pluggy==1.6.0 Pygments==2.20.0 httpx==0.28.1 anyio==4.13.0
        certifi==2026.2.25 h11==0.16.0 httpcore==1.0.9 idna==3.11
        jsonschema==4.26.0 attrs==26.1.0 jsonschema-specifications==2025.9.1
        referencing==0.37.0 rpds-py==0.30.0 PyYAML==6.0.3
        pydantic==2.13.0 pydantic-settings==2.13.1 pydantic-core==2.46.0
        annotated-types==0.7.0 typing-inspection==0.4.2 python-dotenv==1.2.2
        typing-extensions==4.15.0
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      ORCHESTRATOR_MOCK_MODE: '1'
      ORCHESTRATOR_LOG_DIR: /dev/null
      ORCHESTRATOR_SERVING_CALLS_LOG: off
      ORCHESTRATOR_COHERENCE_JUDGE_LOG: off
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni07-28-td14-capture/result"
          printf '{"state":"setup_pending","job":"td14-synthetic-capture","exit_code":null}\n' > "$RUNNER_TEMP/ni07-28-td14-capture/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout reviewed APP source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install pinned APP lock-resolved test import closure
        run: ${{ env.NI07_INSTALL_COMMAND }}
      - name: Capture original JUnit and native synthetic receipt
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/app"
          python recipe/scripts/ci/ni07_28_td14_capture.py
      - name: Preserve status, original JUnit and every native receipt member
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni07-28-td14-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni07-28-td14-capture/result/
          if-no-files-found: error
