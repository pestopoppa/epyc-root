name: EXL3-3B KFD teardown source controls
on:
  push:
    branches: [codex/ni08-exl3-3b-capture-20261007]
permissions:
  contents: read
jobs:
  exl3-3b-source-controls:
    name: exl3-3b-source-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROOT_SOURCE_PIN: 94e7d72a8448c3b77189b77dbb5cdd5d4ccfadbc
      RESEARCH_PIN: edcae4ac1d6e6b222c38dd1942c7acc54ba13a9c
      APP_PIN: a4132e57c96edb78088dedcfb7eb315497ef28db
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      EXL3_RUNNER_CONTEXT: ubuntu-24.04
      EXL3_EXECUTION_CONTEXT: exl3-3b-source-controls-synthetic-no-device-or-claim
      EXL3_INSTALL_COMMAND: >-
        python -m venv "$RUNNER_TEMP/ni08-exl3-3b/venv" &&
        "$RUNNER_TEMP/ni08-exl3-3b/venv/bin/python" -m pip install
        --require-hashes --no-deps --only-binary=:all: -r
        recipe/scripts/ci/ni08_exl3_3b_requirements.txt
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Initialize artifact envelope
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ni08-exl3-3b/result"
          printf '{"state":"setup_pending","exit_code":null}\n' > "$RUNNER_TEMP/ni08-exl3-3b/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: recipe
          persist-credentials: false
      - name: Checkout unchanged native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout exact Research source proposal
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-inference-research
          ref: ${{ env.RESEARCH_PIN }}
          path: research
          persist-credentials: false
      - name: Checkout exact APP lock provenance
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install exact lock-derived wheel closure
        run: |
          set -euo pipefail
          ${{ env.EXL3_INSTALL_COMMAND }} 2>&1 | tee "$RUNNER_TEMP/ni08-exl3-3b/result/dependency-install.log"
      - name: Prepare isolated test temporary root
        run: sudo install -d -o "$USER" -g "$USER" /mnt/raid0/llm/tmp
      - name: Capture complete 15-case synthetic suite
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/research"
          "$RUNNER_TEMP/ni08-exl3-3b/venv/bin/python" recipe/scripts/ci/ni08_exl3_3b_capture.py
      - name: Preserve original conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni08-exl3-3b-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ni08-exl3-3b/result/
            ${{ runner.temp }}/ni08-exl3-3b/status.json
          if-no-files-found: error
