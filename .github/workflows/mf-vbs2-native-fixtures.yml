name: MF-VBS2 selected native fixture capture
on:
  push:
    branches: [codex/ni08-mf-vbs2-native-recipe-20261006]
    paths:
      - .github/workflows/mf-vbs2-native-fixtures.yml
      - scripts/ci/mf_vbs2_capture.py
      - scripts/ci/mf_vbs2_ast_fixture.py
      - scripts/ci/mf-vbs2-native-fixtures.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mf-vbs2:
    name: selected original batch-edit fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROOT_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      APP_PIN: c0263f8c36f3042e9a8145d03dfda63952ade199
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Initialize retained outcome
        run: |
          mkdir -p "$RUNNER_TEMP/ni08-mf-vbs2/result"
          printf '{"state":"setup_pending","exit_code":null}\n' > "$RUNNER_TEMP/ni08-mf-vbs2/result/status.json"
      - name: Checkout exact capture recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout existing native carrier and shared grade
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout pinned orchestrator source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - name: Set up pinned Python patch release
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Create isolated interpreter
        run: python -m venv "$RUNNER_TEMP/mf-vbs2-venv"
      - name: Capture selected original fixtures through existing carrier
        run: "$RUNNER_TEMP/mf-vbs2-venv/bin/python recipe/scripts/ci/mf_vbs2_capture.py"
      - name: Retain originals and outcome on every result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mf-vbs2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni08-mf-vbs2/result/
          if-no-files-found: error
