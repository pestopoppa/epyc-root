name: NI59 bounded fixture matrix custody

on:
  push:
    branches:
      - codex/ni59-runner-scratch-ci-20261005
    paths:
      - .github/workflows/ni59-runner-scratch-matrix.yml

concurrency:
  group: ni59-runner-scratch-matrix-20261005
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_BASE_SHA: 6bb8d860d410217895efb7806e9ef907a62a4350
  APP_SOURCE_SHA: 8024ad80440a6f1bf6e9f0abc2ff9ee9a8c091cd
  APP_SOURCE_PARENT_SHA: 6bb8d860d410217895efb7806e9ef907a62a4350
  APP_LOCK_SHA256: 7eae6b0447832155673e18f0e9f849fd4a65e3eb5839bf85f4165b13a4b06ca3
  ROOT_PRODUCER_SHA: ff8a6baa7e4bc86fc7318055d3fe1050f31422c7
  ROOT_RECIPE_BASE_SHA: e6c0c9db7282ab85acdc2cc4b9119c72bfab02e1
  ROOT_RECIPE_PARENT_SHA: d1fcdc52bdae272828a27d1003c90fc1154683df
  EXPECTED_REPL_TEST_SHA256: d6befe192f52910ff511f5bfbbdb5d3adbff8d2206106237dc8a0bf8ddba4859
  EXPECTED_SCORER_TEST_SHA256: 6d042a42a8746ce9481a2e27b8905cca4116bccf96eb7f2e28479a1cd5b48ef8
  EXPECTED_DEBUG_SCORER_SHA256: e1b79e69dec755365d8bb69e2a8accb8e3ec747f4212e5bc2393561937d039fd
  EXPECTED_REPL_TYPES_SHA256: 710a906c4a153999fb390a1a06fa461f4534bed29f78c0cbe72670c85181afbc
  EXPECTED_REPL_ENVIRONMENT_SHA256: d3b3e2bfddc15af836c5c23db8eaea8a6364ad52e3943d32406bb28a779ac2e8
  EXPECTED_PYPROJECT_SHA256: 1d2e9183e25aea8c55e902bebaf2703b9578d974d723fcad7709614a54b00e5b
  EXPECTED_TESTS_CONF_SHA256: 48312d00152f362b340374097e096c5341a6fdbaf9c48573b08fb64143f7b524
  EXPECTED_UNIT_CONF_SHA256: 56cdbb92652bee7155f44a834693281ec364b85abf9210dc6f37b5afa38dddfb

jobs:
  fixture-module:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      ORCHESTRATOR_MOCK_MODE: 'true'
      MODULE_ID: ${{ matrix.module_id }}
      MODULE_PATH: ${{ matrix.module_path }}
      EXPECTED_CASES: ${{ matrix.expected_cases }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - module_id: repl-environment
            module_path: tests/unit/test_repl_environment.py
            expected_cases: 140
          - module_id: debug-scorer-code-execution
            module_path: tests/unit/test_debug_scorer_code_execution.py
            expected_cases: 12
    steps:
      - name: Establish absent dependencies, corpora, and private environment
        shell: bash
        run: |
          set -euo pipefail
          for target in \
            "$RUNNER_TEMP/ni59-unavailable-llama-cpp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$MODULE_ID" \
            "$RUNNER_TEMP/ni59-unavailable-mtmd-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$MODULE_ID" \
            "$RUNNER_TEMP/ni59-unavailable-llama-server-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$MODULE_ID" \
            "$RUNNER_TEMP/ni59-absent-research-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$MODULE_ID" \
            "$RUNNER_TEMP/ni59-absent-eval-pool-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$MODULE_ID.jsonl"; do
            if [[ -e "$target" || -L "$target" ]]; then
              echo "refusing preexisting kernel override: $target" >&2
              exit 1
            fi
          done
          printf 'ORCHESTRATOR_PATHS_LLAMA_CPP_BIN=%s/ni59-unavailable-llama-cpp-%s-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$MODULE_ID" >> "$GITHUB_ENV"
          printf 'ORCHESTRATOR_PATHS_LLAMA_MTMD=%s/ni59-unavailable-mtmd-%s-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$MODULE_ID" >> "$GITHUB_ENV"
          printf 'ORCHESTRATOR_PATHS_LLAMA_SERVER=%s/ni59-unavailable-llama-server-%s-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$MODULE_ID" >> "$GITHUB_ENV"
          printf 'EPYC_RESEARCH_ROOT=%s/ni59-absent-research-%s-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$MODULE_ID" >> "$GITHUB_ENV"
          printf 'AUTOPILOT_EVAL_ID_VOCAB_SOURCES=%s/ni59-absent-eval-pool-%s-%s-%s.jsonl\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$MODULE_ID" >> "$GITHUB_ENV"
          printf 'RECIPE_ROOT=%s/ci-control\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'NATIVE_ROOT=%s/root-producer\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'APP_CHECKOUT=%s/app-fixtures\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Checkout immutable workflow candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          path: ci-control
          persist-credentials: false

      - name: Checkout pinned native receipt producer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_PRODUCER_SHA }}
          path: root-producer
          persist-credentials: false

      - name: Checkout pinned app fixture candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_SOURCE_SHA }}
          fetch-depth: 4
          path: app-fixtures
          persist-credentials: false

      - name: Verify source ancestry, fixture-only delta, lock, and absent targets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ci-control rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C root-producer rev-parse HEAD)" = "$ROOT_PRODUCER_SHA"
          test "$(git -C app-fixtures rev-parse HEAD)" = "$APP_SOURCE_SHA"
          test -z "$(git -C ci-control status --porcelain --untracked-files=no)"
          test -z "$(git -C root-producer status --porcelain --untracked-files=no)"
          test -z "$(git -C app-fixtures status --porcelain --untracked-files=no)"
          git -C app-fixtures merge-base --is-ancestor "$APP_BASE_SHA" "$APP_SOURCE_SHA"
          test "$(git -C app-fixtures rev-parse "$APP_SOURCE_SHA^")" = "$APP_SOURCE_PARENT_SHA"
          test "$(git -C app-fixtures rev-list --count "$APP_BASE_SHA..$APP_SOURCE_SHA")" = 1
          expected_paths="$(printf '%s\n' \
            tests/unit/test_debug_scorer_code_execution.py \
            tests/unit/test_repl_environment.py | LC_ALL=C sort)"
          actual_paths="$(git -C app-fixtures diff --name-only "$APP_BASE_SHA" "$APP_SOURCE_SHA" | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"
          test "$(sha256sum app-fixtures/uv.lock | cut -d ' ' -f1)" = "$APP_LOCK_SHA256"
          test "$(sha256sum app-fixtures/tests/unit/test_repl_environment.py | cut -d ' ' -f1)" = "$EXPECTED_REPL_TEST_SHA256"
          test "$(sha256sum app-fixtures/tests/unit/test_debug_scorer_code_execution.py | cut -d ' ' -f1)" = "$EXPECTED_SCORER_TEST_SHA256"
          test "$(sha256sum app-fixtures/scripts/benchmark/debug_scorer.py | cut -d ' ' -f1)" = "$EXPECTED_DEBUG_SCORER_SHA256"
          test "$(sha256sum app-fixtures/src/repl_environment/types.py | cut -d ' ' -f1)" = "$EXPECTED_REPL_TYPES_SHA256"
          test "$(sha256sum app-fixtures/src/repl_environment/environment.py | cut -d ' ' -f1)" = "$EXPECTED_REPL_ENVIRONMENT_SHA256"
          test "$(sha256sum app-fixtures/pyproject.toml | cut -d ' ' -f1)" = "$EXPECTED_PYPROJECT_SHA256"
          test "$(sha256sum app-fixtures/tests/conftest.py | cut -d ' ' -f1)" = "$EXPECTED_TESTS_CONF_SHA256"
          test "$(sha256sum app-fixtures/tests/unit/conftest.py | cut -d ' ' -f1)" = "$EXPECTED_UNIT_CONF_SHA256"
          test "$(git -C app-fixtures rev-parse "$APP_BASE_SHA:tests/unit/test_repl_environment.py")" = 4e885ca211179483a4504ebbc765b5666688d6d6
          test "$(git -C app-fixtures rev-parse "$APP_BASE_SHA:tests/unit/test_debug_scorer_code_execution.py")" = 42b2740bad5bc7d0b6063307538a44e89aa9dfb2
          test "$(git -C app-fixtures rev-parse "$APP_SOURCE_SHA:tests/unit/test_repl_environment.py")" = af88493940fc9d79b156821300e5d7415bcee7b2
          test "$(git -C app-fixtures rev-parse "$APP_SOURCE_SHA:tests/unit/test_debug_scorer_code_execution.py")" = 702151bdd99e16c1e947264d5a21fe750b0e8b1d
          test "$(git -C app-fixtures rev-parse "$APP_SOURCE_SHA:scripts/benchmark/debug_scorer.py")" = 6b5da1895cf51cf6ce034cfbe77f9ff7694fbbee
          test "$(git -C app-fixtures rev-parse "$APP_SOURCE_SHA:src/repl_environment/types.py")" = db0f0c908c845baf03705246a7978a0741567060
          test "$(git -C app-fixtures rev-parse "$APP_SOURCE_SHA:src/repl_environment/environment.py")" = 7814ab14b3b57e44d580a40ccc25eb58ca383b51
          test "$(git -C app-fixtures rev-parse "$APP_SOURCE_SHA:tests/conftest.py")" = 3b87111c6bc4ec1f8c8840d204e337e12ae00851
          test "$(git -C app-fixtures rev-parse "$APP_SOURCE_SHA:tests/unit/conftest.py")" = 67752e81242ba51847cfae462b42f21981b9a5ad
          test "$(git -C app-fixtures rev-parse "$APP_SOURCE_SHA:pyproject.toml")" = b4fe6ccada3a1aee3e08aa860045a78d8b85c7b1
          test "$(git -C app-fixtures rev-parse "$APP_SOURCE_SHA:uv.lock")" = ef2306018773ff9a1e80389970d92f66fcf8d5b7
          test "$(git -C ci-control rev-parse HEAD^)" = "$ROOT_RECIPE_PARENT_SHA"
          test "$(git -C ci-control rev-parse "$ROOT_RECIPE_PARENT_SHA^")" = c2666662fac794441e54002648ad6c18414f54aa
          test "$(git -C ci-control rev-parse "$ROOT_RECIPE_PARENT_SHA^^")" = "$ROOT_RECIPE_BASE_SHA"
          test "$(git -C root-producer rev-parse "$ROOT_PRODUCER_SHA:scripts/ci/native_conformance.py")" = d2d7bd90f86cffa23c51db803288641c5c6fe461
          test "$(git -C root-producer rev-parse "$ROOT_PRODUCER_SHA:scripts/vidya/adapters/ci_conformance.py")" = b5a521ef4debe7ad105830f5fa27bbf9c2168dcd
          test "$(git -C root-producer rev-parse "$ROOT_PRODUCER_SHA:scripts/vidya/claim_tuple.py")" = 309af769e45245fd1452482eb2e0592a86a4a79f
          test "$(git -C root-producer rev-parse "$ROOT_PRODUCER_SHA:scripts/vidya/canonical.py")" = e7c93a39804c3e1cf8107f7801c8c32a23f0b45b
          test "$(git -C root-producer rev-parse "$ROOT_PRODUCER_SHA:scripts/vidya/frames.py")" = 47e485d913271b72c9aaf1d9dfb526294ef0fd14
          test "$(git -C root-producer show "$ROOT_PRODUCER_SHA:scripts/ci/native_conformance.py" | sha256sum | cut -d ' ' -f1)" = 2b8c63121e1472d10849224911ee8f4035b7f758ce1aefca7c766e2de263aa0e
          test "$(git -C root-producer show "$ROOT_PRODUCER_SHA:scripts/vidya/adapters/ci_conformance.py" | sha256sum | cut -d ' ' -f1)" = aceba149c1b3386e2edd0f8ce5b0bd6bb1d4489d0fe3b3275f8984050aeeb19c
          test "$(git -C root-producer show "$ROOT_PRODUCER_SHA:scripts/vidya/claim_tuple.py" | sha256sum | cut -d ' ' -f1)" = 058749d2a1ce3487672e85cc5a18fd352b6f17e741a47d7f48bb55be278f4bfe
          test "$(git -C root-producer show "$ROOT_PRODUCER_SHA:scripts/vidya/canonical.py" | sha256sum | cut -d ' ' -f1)" = cda6809d24382cbbfa80308c9f8df4eca353f458039816753b1c20156adf1434
          test "$(git -C root-producer show "$ROOT_PRODUCER_SHA:scripts/vidya/frames.py" | sha256sum | cut -d ' ' -f1)" = f47f148218ae99d54c51b322bf4f3b0632d4458e49572843f5ed4aa424d15749
          test ! -e "$ORCHESTRATOR_PATHS_LLAMA_CPP_BIN" && test ! -L "$ORCHESTRATOR_PATHS_LLAMA_CPP_BIN"
          test ! -e "$ORCHESTRATOR_PATHS_LLAMA_MTMD" && test ! -L "$ORCHESTRATOR_PATHS_LLAMA_MTMD"
          test ! -e "$ORCHESTRATOR_PATHS_LLAMA_SERVER" && test ! -L "$ORCHESTRATOR_PATHS_LLAMA_SERVER"
          test ! -e "$EPYC_RESEARCH_ROOT" && test ! -L "$EPYC_RESEARCH_ROOT"
          test ! -e "$AUTOPILOT_EVAL_ID_VOCAB_SOURCES" && test ! -L "$AUTOPILOT_EVAL_ID_VOCAB_SOURCES"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174
        with:
          version: '0.8.15'
          enable-cache: false

      - name: Create private capture directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          result_dir="$RUNNER_TEMP/ni59-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$MODULE_ID"
          if [[ -e "$result_dir" || -L "$result_dir" ]]; then
            echo "refusing preexisting capture directory: $result_dir" >&2
            exit 1
          fi
          mkdir -m 700 "$result_dir"
          mkdir -m 700 "$result_dir/tmp" "$result_dir/cache" "$result_dir/cache/uv" "$result_dir/cache/installer-tmp" "$result_dir/venv"
          for path in "$result_dir" "$result_dir/tmp" "$result_dir/cache" "$result_dir/cache/uv" "$result_dir/cache/installer-tmp" "$result_dir/venv"; do
            test ! -L "$path"
            test "$(stat -c '%a' "$path")" = 700
            test "$(stat -c '%u' "$path")" = "$(id -u)"
            test "$(stat -c '%g' "$path")" = "$(id -g)"
          done
          printf 'RESULT_DIR=%s\n' "$result_dir" >> "$GITHUB_ENV"
          printf 'UV_PROJECT_ENVIRONMENT=%s/venv\n' "$result_dir" >> "$GITHUB_ENV"
          printf 'RUNNER_PRIVATE_TMP=%s/tmp\n' "$result_dir" >> "$GITHUB_ENV"
          printf 'RUNNER_PRIVATE_CACHE=%s/cache\n' "$result_dir" >> "$GITHUB_ENV"
          printf 'UV_CACHE_DIR=%s/cache/uv\n' "$result_dir" >> "$GITHUB_ENV"

      - name: Install frozen development dependencies
        id: dependencies
        working-directory: app-fixtures
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export TMPDIR="$RUNNER_PRIVATE_CACHE/installer-tmp"
          export XDG_CACHE_HOME="$RUNNER_PRIVATE_CACHE"
          test "$(sha256sum uv.lock | cut -d ' ' -f1)" = "$APP_LOCK_SHA256"
          sha256sum pyproject.toml > "$RESULT_DIR/app-project-before-install.sha256"
          sha256sum uv.lock > "$RESULT_DIR/app-lock-before-install.sha256"
          python --version | grep -Fx 'Python 3.11.14'
          uv --version | grep -Fx 'uv 0.8.15'
          set +e
          timeout --verbose --signal=TERM --kill-after=15s 900s uv sync --frozen --extra dev --no-install-project \
            > "$RESULT_DIR/install.stdout" 2> "$RESULT_DIR/install.stderr"
          result=$?
          set -e
          sha256sum pyproject.toml > "$RESULT_DIR/app-project-after-install.sha256"
          sha256sum uv.lock > "$RESULT_DIR/app-lock-after-install.sha256"
          python - "$RESULT_DIR/install-status.json" "$result" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          target = Path(sys.argv[1])
          target.write_text(json.dumps({
              "schema": "ni59.install_status.v1",
              "exit_code": int(sys.argv[2]),
              "python": sys.version,
              "uv": subprocess.check_output(["uv", "--version"], text=True).strip(),
              "lock_sha256": subprocess.check_output(["sha256sum", "uv.lock"], text=True).split()[0],
          }, sort_keys=True) + "\n", encoding="utf-8")
          PY
          exit "$result"

      - name: Upload dependency installation prefix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ni59-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.module_id }}-install
          path: |
            ${{ runner.temp }}/ni59-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.module_id }}/install.stdout
            ${{ runner.temp }}/ni59-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.module_id }}/install.stderr
            ${{ runner.temp }}/ni59-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.module_id }}/install-status.json
            ${{ runner.temp }}/ni59-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.module_id }}/app-project-before-install.sha256
            ${{ runner.temp }}/ni59-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.module_id }}/app-lock-before-install.sha256
            ${{ runner.temp }}/ni59-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.module_id }}/app-project-after-install.sha256
            ${{ runner.temp }}/ni59-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.module_id }}/app-lock-after-install.sha256
          if-no-files-found: warn

      - name: Write immutable fixture context
        id: context
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        working-directory: app-fixtures
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$UV_PROJECT_ENVIRONMENT/bin/python" - <<'PY'
          import json
          import hashlib
          import os
          import subprocess
          from datetime import datetime, timezone
          import stat
          import sys
          from pathlib import Path

          if sys.version_info[:3] != (3, 11, 14):
              raise SystemExit(f"unexpected Python version: {sys.version}")
          uv_version = subprocess.check_output(["uv", "--version"], text=True).strip()
          if uv_version != "uv 0.8.15":
              raise SystemExit(f"unexpected uv version: {uv_version}")
          import pandas
          if pandas.__version__ != "3.0.2":
              raise SystemExit(f"unexpected frozen pandas version: {pandas.__version__}")
          lock_after_install = subprocess.check_output(
              ["sha256sum", "uv.lock"], text=True
          ).split()[0]
          if lock_after_install != os.environ["APP_LOCK_SHA256"]:
              raise SystemExit("frozen uv sync changed uv.lock; refusing fixture capture")
          result_root = Path(os.environ["RESULT_DIR"])
          meminfo_bytes = Path("/proc/meminfo").read_bytes()
          meminfo_text = meminfo_bytes.decode("utf-8")
          cpuinfo_bytes = Path("/proc/cpuinfo").read_bytes()
          cpuinfo_text = cpuinfo_bytes.decode("utf-8", errors="replace")
          (result_root / "runner-meminfo.txt").write_bytes(meminfo_bytes)
          (result_root / "runner-cpuinfo.txt").write_bytes(cpuinfo_bytes)
          cpu_model_lines = [line.split(":", 1)[1].strip() for line in cpuinfo_text.splitlines()
              if line.lower().startswith(("model name", "hardware")) and ":" in line]
          meminfo_values = {}
          for line in meminfo_text.splitlines():
              key, separator, value = line.partition(":")
              if separator and key in {"MemTotal", "MemAvailable", "SwapTotal", "SwapFree"}:
                  meminfo_values[key] = value.strip()
          if "MemTotal" not in meminfo_values:
              raise SystemExit("runner /proc/meminfo does not contain MemTotal")
          private_paths = [result_root, result_root / "tmp", result_root / "cache",
                           result_root / "cache" / "uv", result_root / "cache" / "installer-tmp",
                           Path(os.environ["UV_PROJECT_ENVIRONMENT"])]
          private_path_facts = {}
          for private_path in private_paths:
              metadata = private_path.lstat()
              ok = (stat.S_ISDIR(metadata.st_mode) and not stat.S_ISLNK(metadata.st_mode)
                    and stat.S_IMODE(metadata.st_mode) == 0o700
                    and metadata.st_uid == os.getuid() and metadata.st_gid == os.getgid())
              private_path_facts[str(private_path)] = {
                  "mode": oct(stat.S_IMODE(metadata.st_mode)), "uid": metadata.st_uid,
                  "gid": metadata.st_gid, "owned_private_0700": ok,
              }
              if not ok:
                  raise SystemExit(f"private runner path is not owned mode 0700: {private_path}")
          source_pins = {
              'src/concurrency.py': {"base_git_blob": '9fa224677f3bed07f0d484ef6477ff1b0d4f2ed0', "git_blob": '9fa224677f3bed07f0d484ef6477ff1b0d4f2ed0', "sha256": 'ce0b073f2b5074b8660d00cf1abd79e622727e7bc49ffaa9a3941505ff829de0'},
              'src/config/__init__.py': {"base_git_blob": '90c83b49ed877c1615661f4a3ac188efac02d644', "git_blob": '90c83b49ed877c1615661f4a3ac188efac02d644', "sha256": 'bd0a888d06c952e0899093233241029b6cac2b6c2e1d605fea4b56878fe04d17'},
              'src/constants.py': {"base_git_blob": 'c0ceed9132b3806745e1f3905e8a12af27770cbb', "git_blob": 'c0ceed9132b3806745e1f3905e8a12af27770cbb', "sha256": '6defb2ecad7642ae552069303fb2b142643328adfbfa2991c2dcccc33e206389'},
              'src/delegation_reports.py': {"base_git_blob": 'e4198744768fa1f0ab3cd239e2d4baf34d9f6698', "git_blob": 'e4198744768fa1f0ab3cd239e2d4baf34d9f6698', "sha256": 'af84911bc247980ca529989efd1a48dfaa106bc35fd4b6c040f11126789720d3'},
              'src/embedding_pool/__init__.py': {"base_git_blob": '04e813b930cbbd4f8fc998957bffbc9b4d16f85f', "git_blob": '04e813b930cbbd4f8fc998957bffbc9b4d16f85f', "sha256": '0cdc3766a697d215f398a9d900b2a38dadcb7ae65d21f66c559ab6f9c4c3e150'},
