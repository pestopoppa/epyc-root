name: NI53 immutable off-host capture impact

on:
  push:
    branches: [codex/ni53-capture-impact-prep-20261005]
    paths: [.github/workflows/ni53-capture-impact.yml]

permissions:
  contents: read

concurrency:
  group: ni53-capture-impact-prep-20261005
  cancel-in-progress: false

jobs:
  impact:
    name: ni53-capture-reader-impact
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_KIND: root
      ROOT_SHA: b2955bb397a912fc0d7854c6dd3072379f15611c
      CONTROL_SHA: 61453ea335028acba69536d680023d5ef59ef47e
      SOURCE_CLASSIFICATION_BASE: e6c0c9db7282ab85acdc2cc4b9119c72bfab02e1
      LOCK_SHA: 734c187820f8e972354dec7aa7519ce37bf0b688530ef83623d8baeb645b448c
      TARBALL_SHA: 9c90be3532671e6f4a94f949816113389798a26c604e61f7953dadaa405ecdd6
      PACKAGE_SHA: 99deb36e0705d0553fcd1baf1951e0c51c1cfd8297c0cde213c55088cb192750
      CLI_SHA: c4a575f85e7c40e707f4cb8bfbe8fcded4ffeefe6e1da1241545fad6c780078d
      MANAGER_SHA: 7e0dbfde84c815f953b02874654304f4c02d21952578f13d09f047609a6625b3
      LADYBUG_INSTALL_SHA: cb7d1110fa4144d39bd2d7ae347040a16cc5cced6607129409673655f22b099c
      LADYBUG_BINARY_SHA: 85b101251f07b052927443a994c69c23621f7c10159687145fa15b06decf7b49
    steps:
      - name: Checkout immutable recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout exact NI53 ROOT source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pestopoppa/epyc-root
          ref: b2955bb397a912fc0d7854c6dd3072379f15611c
          path: _ni53_root_input
          persist-credentials: false
          fetch-depth: 0

      - name: Pin reviewed Node and npm
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: 22.14.0
          check-latest: false

      - name: Establish private scope and immutable source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          NI53_SCOPE="$RUNNER_TEMP/ni53-$SOURCE_KIND-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$NI53_SCOPE" && test ! -L "$NI53_SCOPE"
          mkdir -m 700 "$NI53_SCOPE"
          export NI53_SCOPE
          NI53_PROJECT="$NI53_SCOPE/npm-project"
          NI53_SOURCE="$NI53_SCOPE/source"
          NI53_CAPTURE="$NI53_SCOPE/originals"
          GITNEXUS_HOME="$NI53_SCOPE/gitnexus-home"
          NI53_ALIAS="ni53-capture-$GITHUB_RUN_ID"
          NPM_CONFIG_CACHE="$NI53_SCOPE/npm-cache"
          NPM_CONFIG_PREFIX="$NI53_SCOPE/npm-prefix"
          NPM_CONFIG_USERCONFIG="$NI53_SCOPE/npmrc"
          export NI53_PROJECT NI53_SOURCE NI53_CAPTURE GITNEXUS_HOME NI53_ALIAS NPM_CONFIG_CACHE NPM_CONFIG_PREFIX NPM_CONFIG_USERCONFIG
          for dir in "$NI53_PROJECT" "$NI53_CAPTURE" "$GITNEXUS_HOME" "$NPM_CONFIG_CACHE" "$NPM_CONFIG_PREFIX"; do mkdir -m 700 "$dir"; done
          for phase in native index postcheck; do mkdir -m 700 "$NI53_CAPTURE/$phase"; printf '{"phase":"%s","state":"created before execution"}\n' "$phase" > "$NI53_CAPTURE/$phase/preflight.json"; chmod 600 "$NI53_CAPTURE/$phase/preflight.json"; done
          printf '%s\n' 'ignore-scripts=true' 'audit=false' 'fund=false' 'update-notifier=false' > "$NPM_CONFIG_USERCONFIG"
          chmod 600 "$NPM_CONFIG_USERCONFIG"
          printf 'NI53_SCOPE=%s\nNI53_PROJECT=%s\nNI53_SOURCE=%s\nNI53_CAPTURE=%s\nGITNEXUS_HOME=%s\nNI53_ALIAS=%s\nNPM_CONFIG_CACHE=%s\nNPM_CONFIG_PREFIX=%s\nNPM_CONFIG_USERCONFIG=%s\n' \
            "$NI53_SCOPE" "$NI53_PROJECT" "$NI53_SOURCE" "$NI53_CAPTURE" "$GITNEXUS_HOME" "$NI53_ALIAS" "$NPM_CONFIG_CACHE" "$NPM_CONFIG_PREFIX" "$NPM_CONFIG_USERCONFIG" >> "$GITHUB_ENV"
          printf '%s\n' "$HOME" > "$NI53_CAPTURE/home-before.txt"
          test "$(node --version)" = v22.14.0
          test "$(npm --version)" = 10.9.2
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$CONTROL_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = .github/workflows/ni53-capture-impact.yml
          git diff --exit-code "$CONTROL_SHA" HEAD -- . ':(exclude).github/workflows/ni53-capture-impact.yml' > "$NI53_CAPTURE/recipe-only-diff.stdout"
          cp .github/workflows/ni53-capture-impact.yml "$NI53_CAPTURE/workflow.yml"
          sha256sum "$NI53_CAPTURE/workflow.yml" > "$NI53_CAPTURE/workflow.sha256"
          input="$GITHUB_WORKSPACE/_ni53_root_input"
          source_sha="$ROOT_SHA"
          printf 'NI53_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
          timeout --signal=TERM --kill-after=15s 120s git clone --no-local --no-hardlinks --no-checkout "$input" "$NI53_SOURCE" \
            > "$NI53_CAPTURE/source-clone.stdout" 2> "$NI53_CAPTURE/source-clone.stderr"
          timeout --signal=TERM --kill-after=15s 60s git -C "$NI53_SOURCE" checkout --detach "$source_sha" \
            > "$NI53_CAPTURE/source-checkout.stdout" 2> "$NI53_CAPTURE/source-checkout.stderr"
          chmod 700 "$NI53_SOURCE"
          test "$(git -C "$NI53_SOURCE" rev-parse HEAD)" = "$source_sha"
          timeout --signal=TERM --kill-after=15s 60s git -C "$NI53_SOURCE" fetch --no-tags "$GITHUB_WORKSPACE" "$SOURCE_CLASSIFICATION_BASE" \
            > "$NI53_CAPTURE/control-object-fetch.stdout" 2> "$NI53_CAPTURE/control-object-fetch.stderr"
          test "$(git -C "$NI53_SOURCE" rev-parse "$SOURCE_CLASSIFICATION_BASE")" = "$SOURCE_CLASSIFICATION_BASE"
          test "$(git -C "$NI53_SOURCE" rev-parse --is-shallow-repository)" = false
          test -z "$(git -C "$NI53_SOURCE" status --porcelain=v1 --untracked-files=all)"
          test ! -e "$NI53_SOURCE/.gitnexus" && test ! -L "$NI53_SOURCE/.gitnexus"
          test ! -e /mnt/raid0/llm && test ! -L /mnt/raid0/llm
          test ! -e /workspace/repos && test ! -L /workspace/repos
          cat /proc/self/mountinfo > "$NI53_CAPTURE/mountinfo.txt"
          set +e
          grep -E '/mnt/raid0/llm|/workspace/repos' "$NI53_CAPTURE/mountinfo.txt" > "$NI53_CAPTURE/forbidden-mounts.stdout"
          mount_grep_rc=$?
          set -e
          if [ "$mount_grep_rc" -eq 0 ]; then exit 64; fi
          test "$mount_grep_rc" -eq 1
          git -C "$NI53_SOURCE" rev-parse HEAD > "$NI53_CAPTURE/source-head-before.txt"
          git -C "$NI53_SOURCE" status --porcelain=v1 --untracked-files=all > "$NI53_CAPTURE/source-status-before.txt"
          sha256sum "$NI53_SOURCE/scripts/gitnexus-analyze.sh" > "$NI53_CAPTURE/source-wrapper.sha256"
          test "$(sha256sum "$NI53_SOURCE/scripts/gitnexus-analyze.sh" | cut -d' ' -f1)" = 628b96a3c6ca54299eb80502ffa0623b22ad0120ccaa75b9b66dae57b87a4a91
          sha256sum "$NI53_SOURCE/scripts/gitnexus-patch.js" > "$NI53_CAPTURE/source-patcher.sha256"
          test "$(sha256sum "$NI53_SOURCE/scripts/gitnexus-patch.js" | cut -d' ' -f1)" = a568a90041c16b179e376ea2d760098f9caaf1d5749051623af989b0c55c295a
          printf '{"schema":"ni53.root_impact_context.v1","source_kind":"%s","source_sha":"%s","recipe_sha":"%s","scope":"%s","HOME_unchanged":true,"direct_private_cli":true,"host_wrappers_called":false,"host_global_tool_patch":false,"global_npm_mutation":false,"embeddings":false,"wiki":false,"LLM":false,"no_fabricated_LOW":true}\n' \
            "$SOURCE_KIND" "$source_sha" "$GITHUB_SHA" "$NI53_SCOPE" > "$NI53_CAPTURE/context.json"
          cat /etc/os-release > "$NI53_CAPTURE/os-release.txt"
          node --version > "$NI53_CAPTURE/node-version.txt"
          npm --version > "$NI53_CAPTURE/npm-version.txt"
          timeout --signal=TERM --kill-after=15s 30s node --input-type=module - <<'NODE' > "$NI53_CAPTURE/isolation-validation.stdout" 2> "$NI53_CAPTURE/isolation-validation.stderr"
          import fs from 'node:fs'; import path from 'node:path';
          const scope=process.env.NI53_SCOPE, uid=process.getuid();
          for(const value of [scope,process.env.NI53_PROJECT,process.env.NI53_SOURCE,process.env.NI53_CAPTURE,process.env.GITNEXUS_HOME,process.env.NPM_CONFIG_CACHE,process.env.NPM_CONFIG_PREFIX]) {
            if(!path.isAbsolute(value) || (value!==scope && !value.startsWith(scope+'/'))) throw Error('path outside private scope');
            const pieces=value.split('/').filter(Boolean); let prefix='/';
            for(const piece of pieces) {prefix=path.join(prefix,piece); if(fs.lstatSync(prefix).isSymbolicLink()) throw Error(`symlink directory ${prefix}`);}
            const stat=fs.statSync(value); if(stat.uid!==uid || (stat.mode & 0o777)!==0o700) throw Error(`nonprivate directory ${value}`);
          }
          // Preserve tracked symlinks, but ensure no reachable target leaves the private source.
          const source=process.env.NI53_SOURCE; const links=[];
          function visit(dir) {for(const entry of fs.readdirSync(dir,{withFileTypes:true})) {
            if(entry.name==='.git') continue;
            const file=path.join(dir,entry.name);
            if(entry.isSymbolicLink()) {
              const target=path.resolve(path.dirname(file),fs.readlinkSync(file));
              const reachable=fs.existsSync(file);
              if(reachable && !fs.realpathSync(file).startsWith(source+'/')) throw Error(`reachable external source symlink ${file}`);
              links.push({file,target,reachable});
            } else if(entry.isDirectory()) visit(file);
          }}
          visit(source); console.log(JSON.stringify({scope,uid,private:true,sourceSymlinks:links}));
          NODE

      - name: Verify reviewed npm graph and install without lifecycle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          lock_input="$GITHUB_WORKSPACE/artifacts/ni05/code-index-37358369281/ni52-index-install-originals-37358369281"
          test "$(sha256sum "$lock_input/package-lock.json" | cut -d' ' -f1)" = "$LOCK_SHA"
          test "$(sha256sum "$lock_input/gitnexus-1.6.8.tgz" | cut -d' ' -f1)" = "$TARBALL_SHA"
          timeout --signal=TERM --kill-after=15s 30s node --input-type=module - "$lock_input/package-lock.json" <<'NODE' > "$NI53_CAPTURE/lock-validation.stdout" 2> "$NI53_CAPTURE/lock-validation.stderr"
          import fs from 'node:fs';
          const lock=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(lock.lockfileVersion!==3 || lock.packages[''].dependencies.gitnexus!=='1.6.8') throw Error('root lock mismatch');
          const deps=Object.entries(lock.packages).filter(([key])=>key!=='');
          if(deps.length!==270) throw Error('locked package count mismatch');
          for(const [key,p] of deps) if(!p.resolved?.startsWith('https://registry.npmjs.org/') || !p.integrity?.startsWith('sha512-') || p.link || p.inBundle) throw Error(`unapproved package ${key}`);
          for(const key of ['node_modules/@ladybugdb/core','node_modules/@ladybugdb/core-linux-x64']) if(lock.packages[key].version!=='0.17.1') throw Error(`native version mismatch ${key}`);
          console.log(JSON.stringify({packages:deps.length,gitnexus:'1.6.8',passed:true}));
          NODE
          printf '%s\n' '{"name":"ni52-gitnexus-lock-prep","version":"1.0.0","private":true,"dependencies":{"gitnexus":"1.6.8"}}' > "$NI53_PROJECT/package.json"
          cp "$lock_input/package-lock.json" "$NI53_PROJECT/package-lock.json"
          cp "$lock_input/package-lock.json" "$NI53_CAPTURE/package-lock.json"
          timeout --signal=TERM --kill-after=15s 30s npm config get prefix > "$NI53_CAPTURE/npm-prefix.stdout" 2> "$NI53_CAPTURE/npm-prefix.stderr"
          timeout --signal=TERM --kill-after=15s 30s npm config get cache > "$NI53_CAPTURE/npm-cache.stdout" 2> "$NI53_CAPTURE/npm-cache.stderr"
          test "$(cat "$NI53_CAPTURE/npm-prefix.stdout")" = "$NPM_CONFIG_PREFIX"
          test "$(cat "$NI53_CAPTURE/npm-cache.stdout")" = "$NPM_CONFIG_CACHE"
          printf '%s\n' '["timeout","--signal=TERM","--kill-after=15s","480s","npm","ci","--ignore-scripts","--no-audit","--no-fund","--prefix","<private npm-project>"]' > "$NI53_CAPTURE/npm-ci-argv.json"
          set +e
          timeout --signal=TERM --kill-after=15s 480s npm ci --ignore-scripts --no-audit --no-fund --prefix "$NI53_PROJECT" \
            > "$NI53_CAPTURE/npm-ci.stdout" 2> "$NI53_CAPTURE/npm-ci.stderr"
          rc=$?
          set -e
          printf '{"exit_code":%s,"timeout_seconds":480,"ignore_scripts":true}\n' "$rc" > "$NI53_CAPTURE/npm-ci-status.json"
          test "$rc" -eq 0
          cmp "$lock_input/package-lock.json" "$NI53_PROJECT/package-lock.json"
          pkg="$NI53_PROJECT/node_modules/gitnexus"
          test "$(sha256sum "$pkg/package.json" | cut -d' ' -f1)" = "$PACKAGE_SHA"
          test "$(sha256sum "$pkg/dist/cli/index.js" | cut -d' ' -f1)" = "$CLI_SHA"
          test "$(sha256sum "$pkg/dist/storage/repo-manager.js" | cut -d' ' -f1)" = "$MANAGER_SHA"
          readlink -f "$NI53_PROJECT/node_modules/.bin/gitnexus" > "$NI53_CAPTURE/actual-cli-realpath.txt"
          test "$(cat "$NI53_CAPTURE/actual-cli-realpath.txt")" = "$pkg/dist/cli/index.js"
          sha256sum "$pkg/package.json" "$pkg/dist/cli/index.js" "$pkg/dist/storage/repo-manager.js" > "$NI53_CAPTURE/installed-tool.sha256"
          printf '{"package_sha256":"%s","cli_sha256":"%s","manager_sha256":"%s","lock_sha256":"%s","global_install":false}\n' \
            "$PACKAGE_SHA" "$CLI_SHA" "$MANAGER_SHA" "$LOCK_SHA" > "$NI53_CAPTURE/installed-tool-attestation.json"

      - name: Retain install originals immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ni53-capture-install-originals-${{ github.run_id }}
          path: ${{ env.NI53_CAPTURE }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Verify and load audited prebuilt native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          native="$NI53_CAPTURE/native"
          test -d "$native" && test "$(stat -c '%a' "$native")" = 700
          cd "$NI53_PROJECT"
          test "$(sha256sum node_modules/@ladybugdb/core/install.js | cut -d' ' -f1)" = "$LADYBUG_INSTALL_SHA"
          test ! -L node_modules/@ladybugdb/core-linux-x64/lbugjs.node
          test "$(sha256sum node_modules/@ladybugdb/core-linux-x64/lbugjs.node | cut -d' ' -f1)" = "$LADYBUG_BINARY_SHA"
          test ! -e node_modules/@ladybugdb/core/lbugjs.node && test ! -L node_modules/@ladybugdb/core/lbugjs.node
          cp -p node_modules/@ladybugdb/core-linux-x64/lbugjs.node node_modules/@ladybugdb/core/lbugjs.node
          test "$(sha256sum node_modules/@ladybugdb/core/lbugjs.node | cut -d' ' -f1)" = "$LADYBUG_BINARY_SHA"
          set +e
          timeout --signal=TERM --kill-after=15s 30s node - <<'NODE' > "$native/runtime.stdout" 2> "$native/runtime.stderr"
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const {Database}=require('@ladybugdb/core');
          console.log(JSON.stringify({ladybugVersion:Database.getVersion(),prebuilt:true}));
          const resolve=require('node-gyp-build');
          for(const [name,sha] of Object.entries({'tree-sitter-c':'85e912b183a49111b0f4c3a6c8908375732e70aca759ab0124501913cbbd942a','tree-sitter-proto':'dea80ed2fb48a6d19866468f652ec48eab5435306c6477b213eafe51cbbbf2ee'})) {
            const file=fs.realpathSync(resolve.path(path.join(process.cwd(),'node_modules/gitnexus/vendor',name)));
            if(!file.startsWith(process.cwd()+'/node_modules/gitnexus/vendor/') || !file.includes('/prebuilds/linux-x64/')) throw Error('native path outside reviewed prebuild');
            if(crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')!==sha) throw Error('native digest mismatch');
            require(file); console.log(JSON.stringify({name,file,sha256:sha,loaded:true}));
          }
          NODE
          rc=$?
          set -e
          printf '{"exit_code":%s,"native_compilation_attempted":false,"lifecycle_scripts_enabled":false}\n' "$rc" > "$native/command-status.json"
          test "$rc" -eq 0

      - name: Retain native originals immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ni53-capture-native-originals-${{ github.run_id }}
          path: ${{ env.NI53_CAPTURE }}/native/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Run direct private CLI and exact entry-point evidence
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          index="$NI53_CAPTURE/index"
          test -d "$index" && test "$(stat -c '%a' "$index")" = 700
          cd "$NI53_SOURCE"
          cli="$NI53_PROJECT/node_modules/gitnexus/dist/cli/index.js"
          # No host wrapper, patcher, global CLI, PATH override or CI grant is used.
          run_capture() {
            local label="$1" seconds="$2"
            shift 2
            node -e 'require("node:fs").writeFileSync(process.argv[1],JSON.stringify(process.argv.slice(2))+"\n")' "$index/$label-argv.json" "$@"
            local rc=0
            if timeout --signal=TERM --kill-after=15s "${seconds}s" "$@" > "$index/$label.stdout" 2> "$index/$label.stderr"; then rc=0; else rc=$?; fi
            printf '{"exit_code":%s,"timeout_seconds":%s,"kill_after_seconds":15}\n' "$rc" "$seconds" > "$index/$label-status.json"
            return "$rc"
          }
          run_capture version 30 node "$cli" --version
          test "$(cat "$index/version.stdout")" = 1.6.8
          run_capture analyze 1200 node "$cli" analyze --index-only --skip-agents-md --skip-skills --name "$NI53_ALIAS" --workers 2
          run_capture status 120 node "$cli" status
          test -f .gitnexus/meta.json && test ! -L .gitnexus/meta.json
          cp .gitnexus/meta.json "$index/meta.json"
          cp "$GITNEXUS_HOME/registry.json" "$index/registry.json"
          run_capture meta-validation 30 node --input-type=module -e \
            'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(m.lastCommit!==process.argv[2] || Number(m.stats?.embeddings ?? -1)!==0) throw Error("wrong source or nonzero/missing embeddings"); console.log(JSON.stringify({lastCommit:m.lastCommit,stats:m.stats,passed:true}));' \
            "$index/meta.json" "$NI53_SOURCE_SHA"
          while IFS='|' read -r label uid; do
            test -n "$label" && test -n "$uid"
            run_capture "context-$label" 120 node "$cli" context --uid "$uid" --repo "$NI53_ALIAS" --content
            run_capture "impact-$label" 120 node "$cli" impact --uid "$uid" --direction upstream --repo "$NI53_ALIAS" --depth 4 --limit 200
            run_capture "validate-$label" 30 node --input-type=module -e \
              'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(r.target?.id!==process.argv[2] || r.direction!=="upstream" || r.epistemic!=="exact") throw Error("ambiguous/missing/non-exact impact"); if(["HIGH","CRITICAL"].includes(String(r.risk).toUpperCase())) throw Error("STOP: HIGH/CRITICAL impact"); if(!["LOW","MEDIUM"].includes(String(r.risk).toUpperCase())) throw Error("unrecognized risk"); console.log(JSON.stringify({target:r.target.id,risk:r.risk,direction:r.direction,epistemic:r.epistemic,derived_from_actual_cli_result:true}));' \
              "$index/impact-$label.stdout" "$uid"
          done <<'TARGETS'
          runtime-source-verifier|Function:scripts/harness/strategy_projection_report_capture.py:_verify_runtime_sources
          report-capture-entrypoint|Function:scripts/harness/strategy_projection_report_capture.py:capture_report
          report-projection|Function:scripts/vidya/adapters/strategy_projection_report.py:project_strategy_projection_report
          read-receipt|Function:scripts/vidya/adapters/strategy_projection_report.py:read_receipt
          TARGETS
          # Preserve an explicit source caller map alongside GitNexus output; output can be empty/incomplete and is not assigned a fabricated LOW.
          set +e
          timeout --signal=TERM --kill-after=15s 30s git -C "$NI53_SOURCE" grep -n -E 'strategy_projection_report|_verify_runtime_sources|capture_report|project_strategy_projection_report|read_receipt|TRUSTED_APP_SOURCES|APP_ARTIFACTS|SOURCE_FILES|lock-runtime-source|strategy-projection-report|project=|Source\(|ingest_sources|source_for' "$NI53_SOURCE_SHA" -- scripts/harness scripts/vidya tests/vidya \
            > "$index/native-caller-map.stdout" 2> "$index/native-caller-map.stderr"
          grep_rc=$?
          set -e
          printf '{"exit_code":%s,"scope":"tracked scripts/harness, scripts/vidya, and tests/vidya references","risk":"manual caller inventory; no LOW claim","no_fabricated_LOW":true}\n' "$grep_rc" > "$index/native-caller-map-status.json"
          test "$grep_rc" -le 1
          # Attach the exact source bytes and delta from the reviewed e6 control for independent manual reconciliation.
          mkdir -m 700 "$index/source-readset"
          for path in scripts/vidya/adapters/strategy_projection_report.py scripts/harness/strategy_projection_report_capture.py scripts/vidya/ingest_sources.py scripts/vidya/cli.py scripts/vidya/adapters/README.md scripts/vidya/adapters/__init__.py scripts/vidya/claim_tuple.py tests/vidya/test_strategy_projection_report.py tests/vidya/test_ingest_sources.py; do
            mkdir -p "$index/source-readset/$(dirname "$path")"
            git -C "$NI53_SOURCE" show "$NI53_SOURCE_SHA:$path" > "$index/source-readset/$path"
          done
          git -C "$NI53_SOURCE" diff --no-ext-diff --no-renames --name-status "$SOURCE_CLASSIFICATION_BASE" "$NI53_SOURCE_SHA" -- scripts/harness/strategy_projection_report_capture.py scripts/vidya/adapters/strategy_projection_report.py scripts/vidya/adapters/README.md scripts/vidya/ingest_sources.py \
            > "$index/source-vs-control-name-status.txt"
          for new_path in scripts/harness/strategy_projection_report_capture.py scripts/vidya/adapters/strategy_projection_report.py; do
            if git -C "$NI53_SOURCE" cat-file -e "$SOURCE_CLASSIFICATION_BASE:$new_path" 2>/dev/null; then
              printf '{"unexpected_control_path":"%s","risk":"not_assessed"}\n' "$new_path" > "$index/source-classification.json"
              exit 65
            fi
          done
          test -f "$NI53_SOURCE/scripts/harness/strategy_projection_report_capture.py"
          test ! -e "$NI53_SOURCE/scripts/autopilot/strategy_projection_report.py" && test ! -L "$NI53_SOURCE/scripts/autopilot/strategy_projection_report.py"
          grep -n -F 'Strategy Projection Report CLI original custody (NI05-53)' "$NI53_SOURCE/scripts/vidya/adapters/README.md" > "$index/README-classification-row.txt"
          grep -F 'pending narrow producer/reader/adapter' "$index/README-classification-row.txt" > /dev/null
          grep -F 'scripts/autopilot/strategy_projection_report.py' "$index/README-classification-row.txt" > /dev/null
          printf '%s\n' '{"new_since_source_classification_base":["scripts/harness/strategy_projection_report_capture.py","scripts/vidya/adapters/strategy_projection_report.py"],"README_classification":"pending narrow producer/reader/adapter","README_producer_pointer_matches_source":false,"actual_producer_path":"scripts/harness/strategy_projection_report_capture.py","risk":"not_assessed until exact GitNexus result and manual caller review","no_fabricated_LOW":true}' > "$index/source-classification.json"
          find "$index/source-readset" -type f -print0 | sort -z | xargs -0 sha256sum > "$index/source-readset.sha256"
          test "$(sha256sum "$cli" | cut -d' ' -f1)" = "$CLI_SHA"
          test "$(sha256sum "$NI53_PROJECT/node_modules/gitnexus/package.json" | cut -d' ' -f1)" = "$PACKAGE_SHA"
          test "$(sha256sum "$NI53_PROJECT/package-lock.json" | cut -d' ' -f1)" = "$LOCK_SHA"
          printf '{"passed":true,"source_kind":"%s","source_sha":"%s","direct_private_cli":true,"host_index_deployment":false}\n' "$SOURCE_KIND" "$NI53_SOURCE_SHA" > "$index/complete.json"

      - name: Retain index and impact originals immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ni53-capture-index-originals-${{ github.run_id }}
          path: ${{ env.NI53_CAPTURE }}/index/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Independently record source and isolation postchecks
        if: always() && env.NI53_SOURCE != ''
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          post="$NI53_CAPTURE/postcheck"
          test -d "$post" && test "$(stat -c '%a' "$post")" = 700
          test "$(git -C "$NI53_SOURCE" rev-parse HEAD)" = "$NI53_SOURCE_SHA"
          git -C "$NI53_SOURCE" status --porcelain=v1 --untracked-files=all > "$post/source-status.txt"
          git -C "$NI53_SOURCE" status --porcelain=v1 --untracked-files=all > "$post/source-status-repeat.txt"
          cmp "$post/source-status.txt" "$post/source-status-repeat.txt"
          test ! -s "$post/source-status.txt"
          git -C "$NI53_SOURCE" diff --exit-code HEAD > "$post/tracked-source-diff.stdout"
          test "$HOME" = "$(cat "$NI53_CAPTURE/home-before.txt")"
          test ! -e /mnt/raid0/llm && test ! -L /mnt/raid0/llm
          test ! -e /workspace/repos && test ! -L /workspace/repos
          test ! -e "$NI53_SCOPE/session-bus" && test ! -L "$NI53_SCOPE/session-bus"
          test "$(stat -c '%a' "$NI53_SCOPE")" = 700
          test "$(stat -c '%u' "$NI53_SCOPE")" = "$(id -u)"
          test ! -L "$NI53_SOURCE/.gitnexus"
          if [ -d "$NI53_SOURCE/.gitnexus" ]; then
            test -z "$(find "$NI53_SOURCE/.gitnexus" -type l -print -quit)"
            find "$NI53_SOURCE/.gitnexus" -type f -print0 | sort -z | xargs -0 -r sha256sum > "$post/generated-index.sha256"
          fi
          printf '{"source_sha":"%s","source_clean":true,"HOME_unchanged":true,"canonical_host_paths_absent":true,"bus_absent":true,"index_deployed":false,"source_impact_risk":"captured actual result; HIGH/CRITICAL stops"}\n' "$NI53_SOURCE_SHA" > "$post/result.json"
          find "$NI53_CAPTURE" -type f ! -name sha256sums.txt -print0 | sort -z | xargs -0 -r sha256sum > "$post/sha256sums.txt"

      - name: Retain independent postchecks immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ni53-capture-postcheck-${{ github.run_id }}
          path: ${{ env.NI53_CAPTURE }}/postcheck/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
