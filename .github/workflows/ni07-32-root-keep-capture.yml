name: NI07-32 declared-root KEEP marker capture
on:
  push:
    branches: [codex/ni07-32-root-keep-20261006]
    paths:
      - .github/workflows/ni07-32-root-keep-capture.yml
      - scripts/ci/ni07_32_root_keep_capture.py
permissions:
  contents: read
jobs:
  root-keep-synthetic:
    name: root-keep-synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_PIN: 7f1aa593dd2ea23aceaa9d1b2d3c78b38d4dd906
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      NI32_RUNNER_CONTEXT: ubuntu-latest
      NI32_EXECUTION_CONTEXT: offhost-synthetic-root-cleanup-tests
      NI32_INSTALL_COMMAND: >-
        python -m pip install pytest==9.0.3 iniconfig==2.3.0 packaging==26.0
        pluggy==1.6.0 Pygments==2.20.0
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTEST_ADDOPTS: ''
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni07-32-root-keep/result"
          printf '%s\n' \
            '{"state":"setup_pending","job":"root-keep-synthetic","exit_code":null}' \
            > "$RUNNER_TEMP/ni07-32-root-keep/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.SOURCE_PIN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install exact pytest closure
        run: ${{ env.NI32_INSTALL_COMMAND }}
      - name: Capture original JUnit and native synthetic receipt
        run: python recipe/scripts/ci/ni07_32_root_keep_capture.py
      - name: Preserve status, original JUnit and every native receipt member
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni07-32-root-keep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni07-32-root-keep/result/
          if-no-files-found: error
