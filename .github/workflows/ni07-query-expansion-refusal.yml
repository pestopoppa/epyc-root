name: NI07 declared query-expansion refusal
on:
  push:
    branches: [codex/ni07-20-query-expansion-refusal-20261006]
    paths:
      - .github/workflows/ni07-query-expansion-refusal.yml
      - scripts/ci/ni07_query_expansion_refusal_capture.py
permissions:
  contents: read
jobs:
  synthetic-query-expansion-refusal:
    name: synthetic-query-expansion-refusal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PIN: 225256499e38c6ff964ec8141b1ef04fdf6da829
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      NI07_RUNNER_CONTEXT: ubuntu-latest
      NI07_EXECUTION_CONTEXT: offline-fake-model-modules
      NI07_INSTALL_COMMAND: python -m pip install numpy==2.4.4 pytest==9.0.3 iniconfig==2.3.0 packaging==26.0 pluggy==1.6.0 Pygments==2.20.0
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      ORCHESTRATOR_MOCK_MODE: '1'
      ORCHESTRATOR_LOG_DIR: /dev/null
      ORCHESTRATOR_SERVING_CALLS_LOG: off
      ORCHESTRATOR_COHERENCE_JUDGE_LOG: off
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni07-query-expansion-refusal/result"
          printf '{"state":"setup_pending","job":"query-expansion-refusal","exit_code":null}\n' > "$RUNNER_TEMP/ni07-query-expansion-refusal/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout reviewed APP source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install pinned fixture test dependencies
        run: ${{ env.NI07_INSTALL_COMMAND }}
      - name: Capture query-expansion refusal fixture receipt
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/app"
          python recipe/scripts/ci/ni07_query_expansion_refusal_capture.py
      - name: Preserve custody artifacts on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni07-query-expansion-refusal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni07-query-expansion-refusal/result/
          if-no-files-found: error
