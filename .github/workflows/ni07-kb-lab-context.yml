name: NI07 KB lab context catalog dependency
on:
  push:
    branches: [codex/ni07-18-lab-context-dependency-ci]
    paths:
      - .github/workflows/ni07-kb-lab-context.yml
      - scripts/ci/ni07_kb_lab_context_capture.py
permissions:
  contents: read
jobs:
  lab-context:
    name: lab-context
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PIN: af27ec4d31025d0515b0e2905ccf032163e9ee1f
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      NI07_RUNNER_CONTEXT: ubuntu-latest
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      ORCHESTRATOR_MOCK_MODE: '1'
      ORCHESTRATOR_LOG_DIR: /dev/null
      KB_RAG_QUERY_LENGTH_LOG: 'off'
      PYTHONUNBUFFERED: '1'
      NI07_INSTALL_COMMAND: >-
        python -m pip install pytest==9.0.3 numpy==2.4.4 PyYAML==6.0.3
        jsonschema==4.26.0 httpx==0.28.1 attrs==26.1.0
        jsonschema-specifications==2025.9.1 referencing==0.37.0 rpds-py==0.30.0
        anyio==4.13.0 certifi==2026.2.25 httpcore==1.0.9 h11==0.16.0 idna==3.11
        iniconfig==2.3.0 packaging==26.0 pluggy==1.6.0 pygments==2.20.0 sniffio==1.3.1
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni07-lab-context/result"
          printf '{"state":"setup_pending","job":"lab-context","exit_code":null}\n' > "$RUNNER_TEMP/ni07-lab-context/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout reviewed APP source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact lock-resolved fixture dependencies
        run: ${{ env.NI07_INSTALL_COMMAND }}
      - name: Capture original lab-context fixture receipt
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/app"
          python recipe/scripts/ci/ni07_kb_lab_context_capture.py
      - name: Preserve custody artifacts on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni07-kb-lab-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni07-lab-context/result/
          if-no-files-found: error
