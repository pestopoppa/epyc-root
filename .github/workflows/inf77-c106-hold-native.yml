name: C106 whole original HOLD native controls
on:
  push:
    branches: [codex/ni08-inf77-c106-hold-native-20261007]
permissions:
  contents: read
jobs:
  complete-repeat-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      PYTEST_PLUGINS: ''
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Preserve original setup status before imports
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inf77-c106-hold"
          printf '{"state":"setup_pending","exit_code":null}\n' > "$RUNNER_TEMP/inf77-c106-hold/status.json"
      - name: Checkout exact ROOT recipe and unchanged carrier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: recipe
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout approved exact APP source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pestopoppa/epyc-inference-research
          ref: b223b53aeee78f243618f45da8a6bffe9e55effd
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout MAIN exact prospective source and native enrollment
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fc11677033434eaff744ad7ded931946188b8601
          path: context
          persist-credentials: false
      - name: Checkout exact carrier input
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pestopoppa/epyc-root
          ref: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
          path: carrier
          persist-credentials: false
      - name: Checkout exact lock input
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: 70096b763939a43409a1f1827ab633d62425a6c1
          path: lock
          persist-credentials: false
      - name: Setup exact bounded interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install isolated ALL-wheel locked pytest closure
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/inf77-c106-hold-venv"
          "$RUNNER_TEMP/inf77-c106-hold-venv/bin/python" -m pip install --no-deps --only-binary=:all: --require-hashes -r recipe/scripts/ci/inf77_c106_hold_requirements.txt > "$RUNNER_TEMP/inf77-c106-hold/dependency-install.log" 2>&1
      - name: Capture whole original unit module and existing shared grade
        run: |
          set -euo pipefail
          env -u LD_LIBRARY_PATH -u LD_PRELOAD -u PYTHONHOME -u PYTHONPATH "$RUNNER_TEMP/inf77-c106-hold-venv/bin/python" recipe/scripts/ci/inf77_c106_hold_capture.py
      - name: Preserve all original setup and native outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inf77-c106-hold-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inf77-c106-hold
          include-hidden-files: true
          retention-days: 90
