name: C5 historical policy-path default-verification conformance capture
on:
  push:
    branches: [codex/ni08-c5-policy-path-capture-20261006]
permissions:
  contents: read
jobs:
  c5-policy-path-capture:
    name: c5-policy-path-capture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RESEARCH_PIN: 12f51c0e8b85f81576502377e0db9d678fbf1029
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      APP_PIN: 70096b763939a43409a1f1827ab633d62425a6c1
      C5_RUNNER_CONTEXT: ubuntu-24.04
      C5_INSTALL_COMMAND: >-
        python -m venv "$RUNNER_TEMP/ni08-c5-policy-path-capture/venv" &&
        "$RUNNER_TEMP/ni08-c5-policy-path-capture/venv/bin/python" -m pip install
        --require-hashes --no-deps --only-binary=:all: -r
        recipe/scripts/ci/ni08_c5_policy_path_capture_requirements.txt
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Initialize outcome artifact before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni08-c5-policy-path-capture/result"
          printf '{"state":"setup_pending","job":"c5-policy-path-capture","exit_code":null}\n' > "$RUNNER_TEMP/ni08-c5-policy-path-capture/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout APP lock source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - name: Checkout exact C5 Research source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-inference-research
          ref: ${{ env.RESEARCH_PIN }}
          path: research
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install isolated hash-locked wheel-only pytest closure
        run: |
          set -euo pipefail
          ${{ env.C5_INSTALL_COMMAND }} 2>&1 | tee "$RUNNER_TEMP/ni08-c5-policy-path-capture/result/dependency-install.log"
      - name: Capture original JUnit and native fixture receipt
        run: |
          "$RUNNER_TEMP/ni08-c5-policy-path-capture/venv/bin/python" recipe/scripts/ci/ni08_c5_policy_path_capture.py
      - name: Preserve status, original JUnit, native receipt and original-only grade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni08-c5-policy-path-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni08-c5-policy-path-capture/result/
          if-no-files-found: error
