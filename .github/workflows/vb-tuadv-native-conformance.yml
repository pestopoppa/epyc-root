name: VB TU-ADV-1 synthetic contract conformance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tuadv-native-conformance:
    if: github.ref == 'refs/heads/codex/vb-tuadv1-native-recipe-20261006'
    name: tuadv-native-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_PIN: 30a8665bcb69e7679173f026dc2dcf9549a6c7ca
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      APP_LOCK_PIN: 70096b763939a43409a1f1827ab633d62425a6c1
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTEST_ADDOPTS: ''
      PYTEST_PLUGINS: ''
    steps:
      - name: Initialize retained outcome before setup
        run: |
          mkdir -p "$RUNNER_TEMP/vb-tuadv/result"
          printf '{"state":"setup_pending","job":"tuadv-native-conformance","exit_code":null}\n' > "$RUNNER_TEMP/vb-tuadv/result/status.json"
          cp "$RUNNER_TEMP/vb-tuadv/result/status.json" "$RUNNER_TEMP/vb-tuadv/result/pre-status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout reviewed native carrier and shared grader
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout exact TU-ADV-1 APP source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.SOURCE_PIN }}
          path: source
          persist-credentials: false
      - name: Checkout pinned APP dependency lock source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_LOCK_PIN }}
          path: app-lock
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Create isolated Python environment
        run: python -m venv "$RUNNER_TEMP/vb-tuadv/venv"
      - name: Install exact APP-lock wheel closure
        run: >-
          "$RUNNER_TEMP/vb-tuadv/venv/bin/python" -m pip install
          --disable-pip-version-check --no-deps --require-hashes
          -r recipe/scripts/ci/vb_tuadv_native_requirements.txt
      - name: Capture original JUnit, source readset, native receipt and shared grade
        run: "$RUNNER_TEMP/vb-tuadv/venv/bin/python recipe/scripts/ci/vb_tuadv_native_capture.py"
      - name: Preserve every capture outcome and original
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vb-tuadv-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vb-tuadv/result/
          if-no-files-found: error
