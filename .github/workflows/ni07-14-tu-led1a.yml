name: NI07-14 TU-LED-1a native failure-ledger fixtures

on:
  push:
    branches: [codex/ni07-14-tu-led1a-ci-20261006]
    paths:
      - '.github/workflows/ni07-14-tu-led1a.yml'
      - 'scripts/ci/ni07_14_tu_led1a_capture.py'
      - 'artifacts/ni07-14-tu-led1a/ni07-14-tu-led1a-readset.json'
permissions:
  contents: read
jobs:
  failure-ledger-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROOT_PIN: 1f09dde6818df8756be86feaabcedeb9f3a60748
      APP_PIN: face5c0f39f128d4d228ca7d7d7374a285518036
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Initialize retained status before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ni07-14-tu-led1a/result"
          printf '{"schema":"ni07-14-tu-led1a-ci-status.v1","state":"setup_pending","exit_code":null}\n' > "$RUNNER_TEMP/ni07-14-tu-led1a/result/status.json"
      - name: Checkout workflow and capture recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout pinned native conformance producer
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_PIN }}
          path: root
          persist-credentials: false
      - name: Checkout exact DTAP source candidate
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated pytest dependency
        env:
          NI07_INSTALL_COMMAND: python -m pip install pytest==8.4.2 httpx==0.28.1 jsonschema==4.25.1 PyYAML==6.0.2
        run: python -m pip install pytest==8.4.2 httpx==0.28.1 jsonschema==4.25.1 PyYAML==6.0.2
      - name: Capture bounded synthetic failure-ledger controls
        if: always()
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          NI07_ROOT_PIN: ${{ env.ROOT_PIN }}
          NI07_APP_PIN: ${{ env.APP_PIN }}
          NI07_INSTALL_COMMAND: python -m pip install pytest==8.4.2 httpx==0.28.1 jsonschema==4.25.1 PyYAML==6.0.2
          PYTHONPATH: ${{ github.workspace }}/app:${{ github.workspace }}/app/scripts/autopilot/evals/dtap
        run: python recipe/scripts/ci/ni07_14_tu_led1a_capture.py
      - name: Retain original request, JUnit, logs, source readset, context, and status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ni07-14-tu-led1a-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ni07-14-tu-led1a/result/
          if-no-files-found: error
