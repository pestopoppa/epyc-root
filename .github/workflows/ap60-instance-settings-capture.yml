name: AP60 QScorer instance settings capture
on:
  push:
    branches: [codex/ni08-ap60-instance-env-capture-20261006]
permissions:
  contents: read
jobs:
  ap60-offline-fixture-capture:
    name: ap60-offline-fixture-capture
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_PIN: ec8529c26eb464a5f705e3e517c204ab59da660e
      ROOT_CARRIER_PIN: 4c0c653baf1654c8c25c66433cf39c8faefd8e52
      AP60_RUNNER_CONTEXT: ubuntu-24.04
      AP60_EXECUTION_CONTEXT: offline-qscorer-fixtures-temp-sqlite-faiss
      AP60_INSTALL_COMMAND: >-
        python -m venv "$RUNNER_TEMP/ap60-instance-settings/venv" &&
        "$RUNNER_TEMP/ap60-instance-settings/venv/bin/python" -m pip install
        --require-hashes --no-deps --only-binary=:all: -r
        recipe/scripts/ci/ap60_requirements.txt
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Initialize status before setup
        run: |
          mkdir -p "$RUNNER_TEMP/ap60-instance-settings/result"
          printf '{"state":"setup_pending","exit_code":null}\n' > "$RUNNER_TEMP/ap60-instance-settings/result/status.json"
      - name: Checkout exact recipe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recipe
          persist-credentials: false
      - name: Checkout shared native capture carrier
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-root
          ref: ${{ env.ROOT_CARRIER_PIN }}
          path: carrier
          persist-credentials: false
      - name: Checkout reviewed APP source
        uses: actions/checkout@v4
        with:
          repository: pestopoppa/epyc-orchestrator
          ref: ${{ env.APP_PIN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install hash-locked wheel-only test dependency closure
        run: |
          set -euo pipefail
          ${{ env.AP60_INSTALL_COMMAND }} 2>&1 | tee "$RUNNER_TEMP/ap60-instance-settings/result/dependency-install.log"
      - name: Capture the 115 selected native cases
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/app"
          "$RUNNER_TEMP/ap60-instance-settings/venv/bin/python" recipe/scripts/ci/ap60_instance_settings_capture.py
      - name: Preserve status and all original outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ap60-instance-settings-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ap60-instance-settings/result/
          if-no-files-found: error
