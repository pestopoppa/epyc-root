name: epyc-orchestrator-overrides
version: 0.1.0
description: |
  Adds deterministic Hermes slash commands for EPYC orchestrator request
  overrides. Commands persist per Hermes session and inject x_* extension
  fields into the next OpenAI-compatible request via the pre_llm_call hook.
author: epyc-root
provides_tools: []
provides_hooks:
  - pre_llm_call
provides_commands:
  - use
  - escalation
  - nocode
  - epyc-overrides
requires_env: []
