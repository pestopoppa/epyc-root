; Repo-wide pytest configuration (C16, 2026-07-28).
;
; WHY THIS FILE EXISTS. Before it, a bare `pytest` from the repo root collected
; 2200 tests and then ABORTED with 46 collection errors, so there was no
; whole-repo run at all — and therefore nothing for a broken suite to be red in.
; That is not a theoretical gap: on 2026-07-28 three separate suites looked like
; coverage and provided none (a screen-clearing fixture that deleted the signal
; under test, a suite whose entry points never asserted, and a spawn fixture that
; raced a window reaper). The point of this config is that a whole-repo run
; RUNS and is honestly red or green — never that it is green.
;
; It hides no failure. It excludes only trees that are not this repo's code, and
; it adds the repo root to sys.path so a suite that was unimportable becomes
; importable. Nothing here suppresses, deselects, or xfails a test.

; INVOKE FROM THE CANONICAL ROOT: /mnt/raid0/llm/epyc-root — not /workspace.
; Measured 2026-07-29, same commit and same interpreter:
;     cd /mnt/raid0/llm/epyc-root && pytest tests/test_ratify_pbench4_fg4b_*  -> 28 passed
;     cd /workspace              && pytest tests/test_ratify_pbench4_fg4b_*  ->  3 failed, 25 passed
; The two paths are ONE tree (`/workspace/.git` and `/mnt/raid0/llm/epyc-root/.git` share inode
; 96604699), but the E8 ratifier scripts under artifacts/operator/ compare the invocation path to
; the literal canonical root as a TRUST-BOUNDARY guard ("production ratifier must run from the
; canonical root"). That guard is doing its job and must not be relaxed to make a test pass — so
; the whole-repo number is only comparable when taken from the canonical path. Quote the path
; alongside any pass/fail tally from this repo. Tracked as C19.

[pytest]

; Trees that are not this repository's own test suites.
;   repos/            — child repos (epyc-orchestrator, epyc-inference-research,
;                       epyc-llama) reached through symlinks, plus their
;                       .bak-* backups. They own their suites and their
;                       dependencies; importing them from here produced 45 of the
;                       46 errors. They stay runnable ON PURPOSE: norecursedirs
;                       only governs directory RECURSION, so an explicit
;                       `pytest repos/epyc-orchestrator/tests` still works.
;   artifacts/, logs/ — data, not code; large enough to make collection crawl.
norecursedirs =
    repos
    *.bak-*
    artifacts
    logs
    .git
    __pycache__
    .venv
    node_modules
    .gitnexus

; The 46th error. tests/compliance/agent_file/test_runner.py imports itself by
; absolute path (`from tests.compliance.agent_file... import ...`), but neither
; `tests/` nor `tests/compliance/` is a package, so pytest inserted
; `tests/compliance` on sys.path instead of the repo root and the import failed
; with ModuleNotFoundError — aborting even a bare `pytest tests/`. Adding the
; root to sys.path fixes the import without turning `tests/` into a package,
; which would rename every test module in the repo.
pythonpath = .
