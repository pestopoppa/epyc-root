<!doctype html>
<meta charset="utf-8">
<title>Handoff graph — EPYC</title>
<style>
  :root { --bg:#0f1115; --fg:#e6e6e6; --dim:#8a8f98; --line:#2a2f3a; --card:#161a21; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:16px; font-weight:600; }
  .sub { color:var(--dim); font-size:12px; }
  .warn { color:#f0b232; }
  .bad  { color:#e5534b; }
  main { padding:14px 18px 40px; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin:10px 0 16px;
            color:var(--dim); font-size:12px; }
  .sw { display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:5px;
        vertical-align:-1px; }
  .domain { margin:0 0 22px; }
  .domain h2 { font-size:13px; font-weight:600; margin:0 0 8px; color:var(--fg); }
  .domain h2 span { color:var(--dim); font-weight:400; }
  .grid { display:flex; flex-wrap:wrap; gap:6px; }
  a.node { display:block; text-decoration:none; color:inherit; background:var(--card);
           border:1px solid var(--line); border-left-width:4px; border-radius:4px;
           padding:5px 8px; min-width:132px; max-width:230px; }
  a.node:hover { outline:1px solid #3d4756; }
  .nid { font:11px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--dim); }
  .ntrack { display:block; font-size:12px; margin-top:1px;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nmeta { font-size:11px; color:var(--dim); margin-top:2px; }
  .edges { margin-top:6px; }
  .edges code { font:11px ui-monospace,monospace; color:var(--fg); }
  .note { color:var(--dim); font-size:12px; max-width:70ch; margin:6px 0 0; }
  #err { color:#e5534b; }
</style>
<header>
  <h1>Handoff graph</h1>
  <div class="sub" id="sub">loading…</div>
</header>
<main>
  <div class="legend">
    <span><i class="sw" style="background:#3fb950"></i>advanced ≤7d</span>
    <span><i class="sw" style="background:#d29922"></i>8–30d</span>
    <span><i class="sw" style="background:#e5534b"></i>&gt;30d</span>
    <span><i class="sw" style="background:#6e7681"></i>never (no checkbox in git)</span>
    <span>bar width ∝ open tasks</span>
  </div>
  <p class="note" id="edgenote"></p>
  <div id="err"></div>
  <div id="out"></div>
</main>
<script>
// Deliberately dependency-free: the hub serves this file directly and has no
// bundler or CDN access, so a charting library would be a new failure mode for a
// view whose whole job is to be trustworthy at a glance.
const AGE = d => d === null || d === undefined ? '#6e7681'
                : d <= 7 ? '#3fb950' : d <= 30 ? '#d29922' : '#e5534b';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

fetch('/api/handoff_graph').then(r => r.json()).then(g => {
  const f = g._freshness || {};
  const sub = document.getElementById('sub');
  if (!g.nodes) {
    sub.className = 'sub bad';
    sub.textContent = (g.observation_notice || 'no producer reported');
    return;
  }
  const edges = g.edges || [];
  sub.textContent = `${g.nodes.length} index rows · ${edges.length} dependency edges · `
                  + `generated ${g.generated_at || '?'}`;
  if (f.status && f.status !== 'ok') { sub.className = 'sub warn'; sub.textContent += ` · ${f.status}`; }

  document.getElementById('edgenote').textContent =
    edges.length === 0
      ? 'No dependency edges yet — edges come only from the hand-authored Deps column, so this is '
      + 'an unfilled column, not an unconnected backlog. Colour still shows liveness.'
      : g.edge_note || '';

  // group by domain, then order by staleness so the neglected work is on top
  const by = {};
  for (const n of g.nodes) (by[n.domain] ||= []).push(n);
  const out = document.getElementById('out');
  const inc = {}; for (const e of edges) (inc[e.from] ||= []).push(e.to);

  for (const dom of Object.keys(by).sort()) {
    const list = by[dom].sort((a, b) =>
      (b.age_days ?? 1e9) - (a.age_days ?? 1e9) || b.open - a.open);
    const open = list.reduce((s, n) => s + n.open, 0);
    const max = Math.max(1, ...list.map(n => n.open));
    const sec = document.createElement('section');
    sec.className = 'domain';
    sec.innerHTML = `<h2>${esc(dom)} <span>· ${list.length} rows · ${open} open</span></h2>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const n of list) {
      const a = document.createElement('a');
      a.className = 'node';
      a.style.borderLeftColor = AGE(n.age_days);
      a.style.flexGrow = String(1 + 3 * (n.open / max));
      a.href = '/api/handoff_detail?id=' + encodeURIComponent((n.handoff || '').replace(/\.md$/, ''));
      a.title = `${n.handoff}\nopen ${n.open} · closed ${n.closed} · blocked ${n.blocked}\n`
              + `last advanced ${n.last_advanced || 'never'}`;
      const dep = inc[n.id] ? `<div class="edges"><code>→ ${inc[n.id].map(esc).join(', ')}</code></div>` : '';
      a.innerHTML = `<span class="nid">${esc(n.id)}</span>`
                  + `<span class="ntrack">${esc(n.track)}</span>`
                  + `<div class="nmeta">${n.open} open · `
                  + `${n.last_advanced ? esc(n.last_advanced) : 'never'}</div>${dep}`;
      grid.appendChild(a);
    }
    sec.appendChild(grid);
    out.appendChild(sec);
  }
}).catch(e => { document.getElementById('err').textContent = 'failed to load: ' + e; });
</script>
