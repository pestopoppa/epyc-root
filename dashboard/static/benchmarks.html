<!doctype html><meta charset="utf-8"><title>EPYC — Benchmark artifacts</title>
<style>body{background:#0d1117;color:#c9d1d9;font:14px system-ui;margin:24px;max-width:1200px}a{color:#60a5fa}input{background:#161b22;color:#c9d1d9;border:1px solid #30363d;padding:8px;width:360px}table{border-collapse:collapse;width:100%;margin-top:14px}th,td{padding:8px;border-bottom:1px solid #30363d;text-align:left}th{color:#8b949e}.note{color:#f0c088;background:#2b1d12;padding:10px}details{max-width:460px;white-space:normal}code{font-size:11px}</style>
<h1>Benchmark artifacts</h1>
<!-- RTG-47: the ONE shared nav, rendered from dashboard/registry.json. Do not
     hand-add cross-dashboard links here; add a registry row. -->
<nav id="epyc-nav"></nav>
<script defer src="/nav.js"></script>
<p class="note">Observation discipline: this is a read-only artifact index. Models attach only by an explicit saved model path; no role or campaign label is treated as model identity.</p>
<input id=q placeholder="Filter model or quant"><p id=summary>Loading…</p><table><thead><tr><th>Model</th><th>Quant</th><th>Artifacts</th><th>Quality suites</th><th>Details</th></tr></thead><tbody id=rows></tbody></table>
<script>
let models=[]; const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(){const q=document.querySelector('#q').value.toLowerCase();const shown=models.filter(m=>(m.model+' '+m.quant).toLowerCase().includes(q));document.querySelector('#rows').innerHTML=shown.map(m=>{const suites=m.artifacts.flatMap(a=>a.suites||[]).map(s=>s.suite).filter(Boolean);return `<tr><td>${esc(m.model)}</td><td>${esc(m.quant)}</td><td>${m.artifacts.length}</td><td>${esc([...new Set(suites)].join(', ')||'—')}</td><td><details><summary>paths / evidence labels</summary>${m.artifacts.map(a=>`<code>${esc(a.path)}</code><br>grade: ${esc(a.grade)} · kernel: ${esc(a.kernel||'not recorded')} · era: not inferred<br>`).join('')}</details></td></tr>`}).join('')||'<tr><td colspan=5>No matching models</td></tr>';}
fetch('/api/benchmark_artifacts').then(r=>r.json()).then(d=>{models=d.models||[];document.querySelector('#summary').textContent=`${d.counts?.matched_models||0} models · ${d.counts?.matched_artifacts||0} matched artifacts · ${d.counts?.unmatched_artifacts||0} explicitly unmatched`;render()}).catch(e=>document.querySelector('#summary').textContent='Index unavailable: '+e);document.querySelector('#q').oninput=render;
</script>
