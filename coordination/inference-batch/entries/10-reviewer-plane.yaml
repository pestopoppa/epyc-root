    coordination_note: >
      Operator spec section 21 Phase 1. Runs the reference-lineup shadow plane with the
      NEW Wave-2 semantics layer in-loop: CP1 deterministic policy_reducer (sole
      enforcement authority; RD-3 precedence subsumed), CP2 schema/ledger v1.1 (ABSTAIN,
      telemetry-only raw confidence), CP3 DecisionEnvelope + hash-bound invalidation +
      AssuranceProfiles. Accumulates decisions/findings/confidence/evidence-requests/
      cost/latency; does NOT alter architect or worker behavior. Pass gates the ADVISORY
      stage on measured FA/FR/CR + the LB-6 budget. NOTE (flag for main session): no
      dedicated rollout-stage checkbox exists yet; owned here under RD-5 (the shadow flag
      lineage) — the pass-fork advances the rollout stage rather than re-flipping RD-5.

  phase: 2
  priority: P2

  preconditions:
    stack_lineup: "REFERENCE trio (RCP-prologue relaunch, no reload); reviewer = CPU architect_general alias (A3)"
    kernel_era: production-consolidated-v6
    flags_required:
