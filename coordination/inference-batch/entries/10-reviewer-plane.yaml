# =============================================================================
# REVIEWER-PLANE RIDERS + SEMANTICS-LAYER ROLLOUT (Wave-3 M1).
#
# Two groups, both on the SAME reference lineup as the RCP prologue
# (00-rcp-prologue.yaml) with NO reload and NO stack change:
#
#  A) phase-1 reference-lineup riders (7) — ride the RCP-prologue relaunch to
#     accumulate the fuller reviewer-plane baselines. Reviewer shadow runs on the
#     CPU architect_general alias (spec amendment A3 — NOT the GPU-resident 122B-IQ2
#     arm; GLM-5.2 NOT resident). Decision-grade FA/FR/floor numbers are gated on
#     OP-5a (P-REV-1 / RC-6a); observation-grade versions run now.
#
#  B) semantics-layer rollout (2) — operator spec (2026-07-17) section 21 rollout:
#     a shadow-mode telemetry-accumulation entry, then an advisory-mode entry.
#     BOTH gated on the Wave-2 CP1 (policy_reducer) + CP2 (schema/ledger v1.1
#     ABSTAIN) + CP3 (DecisionEnvelope / hash-bound invalidation / AssuranceProfiles)
#     code landing. Each entry's pass-fork gates the NEXT rollout stage on measured
#     FA/FR/CR + the LB-6 budget gate (OP-5b threshold).
#
# All numbers observation-grade pre-P-REV-1 (RC-6a). NO enforce-mode anywhere.
# Self-check: python -c "import yaml; yaml.safe_load(open('10-reviewer-plane.yaml'))"
# =============================================================================

# --- A) reference-lineup riders (phase 1) -----------------------------------

- schema_version: inference_batch.entry.v1
  task_id: TM-8-full-coverage
  title: "TM-8 — Full trace-coverage gate (~100% of review invocations produce trace rows)"

  provenance:
    owning_handoff: handoffs/active/reviewer-trace-materialization.md
    checkbox: "TM-8"
    source_ref: "reviewer-control-plane-index.md M1 milestone (coverage gate → unblocks H4)"
    coordination_note: >
      Fuller coverage confirmation beyond the RCP-W2 50-q smoke: verifies not just
      row presence but per-step phase tags + executor-model-id + reminder events are
      recorded (intake-835). Rides the RCP-prologue relaunch; no reload. If RCP-W2
      already flipped TM-8 at ~100%, this entry is the confirmatory pass; if RCP-W2
      landed marginal, this is the authoritative coverage run.

  phase: 1
  priority: P1

  preconditions:
    stack_lineup: "REFERENCE trio (RCP-prologue relaunch); reviewer = CPU architect_general alias (A3)"
    kernel_era: production-consolidated-v6
    flags_required:
      review_decision_shadow: 1
    flags_forbidden:
      - review_decision_enforce
    flag_attestation: all_workers
    models:
      - architect_general
      - frontdoor
      - worker_general
    host_health:
      tier: quiet_window
      cache_state: warm
    topology:
      required_topology_hash: df373c79cc4af06f
      live_affinity_verified: true
      contention_matrix: not_required
    autopilot: stopped
    operator_gates:
      - OP-6a
      - OP-6b
      - BUILD-tm8-coverage-counter
    depends_on:
      - RCP-W1-reference-relaunch-preflight

  execution:
    driver: command
    protocol_id: "trace-coverage.v1 (row-presence + phase-tag/executor-id/reminder-event completeness)"
    dry_run: false
    command: >
      # BUILD-GATE: TM-8 trace-coverage is a thin counter over events.sqlite (query.decision_chain) — buildable, but contingent on the shadow plane firing during a live eval. No eval_tower.py replay CLI exists; src/trace/cli.py decision-chain has no --verify-coverage.
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: same_trial_eval_fanout
    fanout_transport: placement_queue
    contention_class: eval_fanout_reference_lineup
    est_wall_clock_h: 1.2
    timeout_s: 7200
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED

  outcomes:
    expected: >
      >=99% of review invocations over the replay produce a REVIEW_DECISION trace row
      AND carry phase tags + executor-model-id + reminder events; coverage.json records
      the per-field completeness.
    gate_table:
      - gate: "Is trace coverage ~100% including phase tags + executor-model-id + reminder events?"
        evidence: "coverage.json = (review-trace rows with all required fields) / (review invocations) via src/trace/query.py decision-chain + review_ledger counts"
        fork:
          pass:
            rule: "coverage >= ~99% AND phase-tag/executor-id/reminder-event completeness >= ~99%"
            action:
              - "flip TM-8 (reviewer-trace-materialization.md) as PASSED; update H0 milestone table (M1 coverage gate → H4 unblocked)"
            next: DONE_PASS
          marginal:
            rule: "row coverage >= ~99% but a specific field family (e.g. reminder events) < 99%"
            action:
              - "record TM-8 partial; open a targeted emission fix for the missing field family; H4 may start on the row-coverage guarantee with the gap noted"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "coverage < 90% OR required fields systematically absent"
            action:
              - "keep TM-8 open; H4 does NOT start; file trace-emission bug (src/trace/emit.py)"
            next: FAILED_REVERTED
          infra:
            classify: "placement-queue starvation / eval-tower dispatch error / trace DB lock"
            action:
              - "re-run in a fresh quiet window after drop_caches; confirm shadow flag 6/6 live"
          ambiguous:
            action:
              - "coverage 100% but invocation count implausibly low vs replay size — read decision-chain transcripts; hold for operator"
            next: HELD_AMBIGUOUS

  artifacts:
    outputs:
      - "/mnt/raid0/llm/tmp/tm8_coverage_<UTC>/{replay.jsonl,coverage.json}"
    package_to: "coordination/inference-batch/bundles/TM-8/"

  ledger:
    journal_quarantine_rule: >
      record coverage %, per-field completeness, n invocations, kernel era, flag state;
      observation-grade panel — coverage is an infra gate, not a decision-gating metric.
      Quarantine diagnostic_only if shadow flag was not 6/6 at run time.
    era_stamp: "instrument-era-2026-06-12-post-measurement-constitution"

- schema_version: inference_batch.entry.v1
  task_id: LB-1-regression-attribution
  title: "LB-1 — Reproduce + attribute the plan-review throughput regression (offline over RCP-W2 artifacts)"

  provenance:
    owning_handoff: handoffs/active/reviewer-latency-and-sampling-budget.md
    checkbox: "LB-1"
    source_ref: "reviewer-latency-and-sampling-budget.md LB-1; 2026-07-16 throughput-regression checkpoint"
    coordination_note: >
      Pure OFFLINE analysis over the RCP-W2 paired-replay artifacts (no new inference):
      decompose the shadow-emission overhead into plan-review prompt COUNT vs prompt
      LENGTH vs architect queueing. serial_noninference — safe to run outside a quiet
      window.

  phase: 1
  priority: P1

  preconditions:
    kernel_era: production-consolidated-v6
    host_health:
      tier: any
    topology:
      contention_matrix: not_required
    autopilot: any
    operator_gates:
      - BUILD-lb1-offline-attribution
    depends_on:
      - RCP-W2-paired-shadow-replay

  execution:
    driver: command
    protocol_id: "P-AB-1 attribution (offline decomposition of the RD-12 paired baseline)"
    dry_run: false
    command: >
      # BUILD-GATE: OFF/ON throughput-attribution tool does not exist. task_rate_goodput_replay.py does journal-Pareto replay, not OFF/ON shadow-overhead attribution. Offline (non-inference) analysis over RCP-W2 artifacts; downstream of a working Mechanism-A run.
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: serial_noninference
    fanout_transport: none
    contention_class: offline_analysis
    est_wall_clock_h: 0.3
    timeout_s: 3600
    retry_policy:
      max_attempts: 1
      retry_on: []

  outcomes:
    expected: >
      Attribution.json ranks the overhead drivers (plan-review prompt count vs length
      vs architect queueing) on the RD-12 baseline; feeds the LB-2 budget targets and
      the LB-6 gate denominator.
    gate_table:
      - gate: "Which call class dominates the review overhead on the RD-12 replay baseline?"
        evidence: "per-class token + wall-time decomposition from RCP-W2 OFF/ON artifacts + review_ledger latency_ms/tokens; ranked contribution to the ON-OFF delta"
        fork:
          pass:
            rule: "a dominant driver (or a clear ranked set) is identified with contribution shares summing to the measured ON-OFF delta"
            action:
              - "flip LB-1 (reviewer-latency-and-sampling-budget.md) with the attribution ranking"
              - "feed the ranking into LB-2/LB-3 sampling-policy design and the LB-6 denominator"
            next: DONE_PASS
          marginal:
            rule: "drivers identified but residual unexplained variance > ~20% of the delta"
            action:
              - "record LB-1 partial; flag the unexplained residual for a targeted instrumentation pass (request-level trial_id propagation is deferred — high GitNexus blast radius)"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "RCP-W2 artifacts insufficient to attribute (missing per-call token/latency breakdown)"
            action:
              - "keep LB-1 open; require RCP-W2 re-run with per-decision latency_ms + token accounting (RD-12) enabled"
            next: FAILED_REVERTED
          infra:
            classify: "artifact read error / corrupt JSONL / ledger schema drift"
            action:
              - "re-fetch RCP-W2 artifacts from the bundle; re-run the offline analysis"
          ambiguous:
            action:
              - "attribution contradicts the 2026-07-16 regression narrative (e.g. prompt length dominates where count was assumed) — hold for operator; attach the decomposition"
            next: HELD_AMBIGUOUS

  artifacts:
    outputs:
      - "/mnt/raid0/llm/tmp/lb1_attribution_<UTC>/attribution.json"
    package_to: "coordination/inference-batch/bundles/LB-1/"

  ledger:
    journal_quarantine_rule: >
      record driver ranking + contribution shares + residual; observation-grade;
      throughput claims stay under P-AB-1/P-SPEED-OBJ. No inference performed — not
      subject to the flag-attestation quarantine, but cite the RCP-W2 run header.
    era_stamp: "instrument-era-2026-06-12-post-measurement-constitution"

