      - OP-6b
      - BUILD-semantics-serving-integration
    depends_on:
      - RC-8-full-corpus-baseline

  execution:
    driver: command
    protocol_id: "P-REV-1 (observation-grade) + P-AB-1/P-SPEED-OBJ for cost; semantics-layer replay-tested reducer"
    dry_run: false
    command: >
      # BUILD-GATE: needs the CP1/CP2/CP3 semantics layer wired into the live serving path (landed as modules, not yet serving-integrated — stack-frozen) + the reviewer-corpus bridge for the shadow eval. No eval_tower.py replay --semantics-layer CLI.
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: same_trial_eval_fanout
    fanout_transport: placement_queue
    contention_class: eval_fanout_reference_lineup
    est_wall_clock_h: 3.0
    timeout_s: 18000
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED

  outcomes:
    expected: >
      Semantics-layer shadow telemetry accumulated (PolicyResult per decision via the
      deterministic reducer; ABSTAIN counted; DecisionEnvelope hashes + invalidation
      events recorded); FA/FR/CR panel + per-decision cost. Reducer is deterministic and
      replay-stable. No architect/worker behavior change. Observation-grade.
    gate_table:
      - gate: "Does the semantics-layer shadow run accumulate clean, replay-stable telemetry with FA/FR/CR + cost within the LB-6 budget envelope?"
        evidence: "reducer determinism (same inputs -> same PolicyResult + policy_hash on replay); FA/FR/CR panel; ABSTAIN rate; per-decision token/latency vs LB-2 budgets; DecisionEnvelope invalidation/replay tests green"
        fork:
          pass:
            rule: "reducer replay-stable AND FA/FR/CR computed AND per-decision cost within the LB-2 budget envelope (token_multiplier trending <=1.5x)"
            action:
              - "record the shadow-semantics baseline (observation-grade); advance the rollout to ADVISORY (semantics-advisory-rollout)"
              - "update reviewer-control-plane-index.md#P2 milestone note; do NOT re-flip RD-5"
            next: semantics-advisory-rollout
          marginal:
            rule: "telemetry accumulates but reducer shows non-determinism on a subset OR cost near the LB-2 ceiling"
            action:
              - "hold at shadow; file a reducer-determinism/invalidation fix (CP1/CP3); do NOT advance to advisory until replay-stable and within budget"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "reducer non-deterministic broadly OR shadow changes architect/worker behavior OR cost exceeds the LB-2 hard ceiling (2.0x)"
            action:
              - "keep the plane at shadow (or off); the semantics layer is not rollout-ready; escalate to CP1/CP2/CP3 owners"
            next: FAILED_REVERTED
          infra:
            classify: "placement-queue starvation / trace DB lock / reducer runtime error / server OOM"
            action:
              - "re-run in fresh quiet window after drop_caches; confirm shadow flag 6/6 and the semantics-layer code is the landed Wave-2 version"
          ambiguous:
            action:
              - "FA/FR/CR plausible but ABSTAIN rate or invalidation counts unexpected — read decision-chain + envelope transcripts; hold for operator"
            next: HELD_AMBIGUOUS

  artifacts:
    outputs:
      - "/mnt/raid0/llm/tmp/sem_shadow_<UTC>/{replay.jsonl,report.json}"
