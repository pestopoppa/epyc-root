- schema_version: inference_batch.entry.v1
  task_id: LB-7-baseline-floor
  title: "LB-7 — M3 baseline floor: full plane vs single-augmented-LLM (A0/A1) on the same tasks (gated OP-5a)"

  provenance:
    owning_handoff: handoffs/active/reviewer-latency-and-sampling-budget.md
    checkbox: "LB-7"
    source_ref: "reviewer-latency-and-sampling-budget.md LB-7 (the go/no-go the whole series answers to); LB-6 gate"
    coordination_note: >
      The standing floor: the plane must BEAT a single augmented LLM on the same tasks
      (M3). Plane arm vs A0 gates-only / A1 self-review baseline, paired, same tasks.
      Decision-grade go/no-go requires OP-5a (P-REV-1) AND the LB-6 threshold (OP-5b);
      an observation-grade floor read is runnable in this window but MUST NOT gate
      enforce-mode. Needs the H4 instrument (RC-8) + anchor arms.

  phase: 1
  priority: P1

  preconditions:
    stack_lineup: "REFERENCE trio (RCP-prologue relaunch); plane arm = CPU architect_general reviewer alias (A3); baselines A0 gates-only / A1 self-review"
    kernel_era: production-consolidated-v6
    flags_required:
      review_decision_shadow: 1
    flags_forbidden:
      - review_decision_enforce
    flag_attestation: all_workers
    models:
      - architect_general
      - frontdoor
      - worker_general
    host_health:
      tier: quiet_window
      cache_state: warm
    topology:
      required_topology_hash: df373c79cc4af06f
      live_affinity_verified: true
      contention_matrix: not_required
    autopilot: stopped
    operator_gates:
      - OP-6a
      - OP-6b
      - OP-5a
      - BUILD-mechanism-a-ledger-producer
    depends_on:
      - RC-8-full-corpus-baseline
      - LB-4-sampling-policy-ab

  execution:
    driver: command
    protocol_id: "P-AB-1 (N>=100/arm) + P-SPEED-OBJ (task_rate e-process); floor = LB-7"
    dry_run: false
    command: >
      # BUILD-GATE: single-model floor needs the Mechanism-A ledger producer. Downstream of RC-8. OP-5a decision-grade gate already present.
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: paired_sequential
    fanout_transport: placement_queue
    contention_class: eval_fanout_reference_lineup
    est_wall_clock_h: 3.0
    timeout_s: 18000
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED

  outcomes:
    expected: >
      Paired dP(success) and % throughput reduction of the plane vs the single-augmented-LLM
      baseline, feeding the LB-6 gate metric G = dP(success) / (% throughput reduction).
      Observation-grade until OP-5a; decision-grade go/no-go additionally needs the OP-5b
      threshold value.
    gate_table:
      - gate: "Does the full plane beat the single-augmented-LLM baseline at acceptable throughput cost (M3 floor)?"
        evidence: "paired dP(success) [pp, higher-better] + % throughput reduction [P-SPEED-OBJ e-process] over N>=100; G = dP(success) / (%throughput reduction); FA/FR e-process state (RC-5)"
        fork:
          pass:
            rule: "net dP(success) > 0 (plane beats baseline) with the cost recorded — and, for a DECISION-grade flip, OP-5a merged AND G >= the OP-5b threshold AND config not in FA/FR breach"
            action:
              - "flip LB-7 (reviewer-latency-and-sampling-budget.md) with dP(success), %throughput, G — observation-grade unless OP-5a+OP-5b both satisfied"
              - "mirror the floor number to H0 (LB-8); if OP-5a/OP-5b satisfied and G>=threshold, this is the M3 go signal"
            next: DONE_PASS
          marginal:
            rule: "dP(success) > 0 but small / CIs overlap zero OR e-process not yet confirmed"
            action:
              - "record LB-7 partial observation; keep the e-process running; NO enforce-mode flip"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "net dP(success) <= 0 (plane does NOT beat the baseline) OR throughput cost above the guardrail ceiling"
            action:
              - "the plane fails the standing floor — do NOT advance to enforce-mode; document the negative result; a control plane that only adds cost gets deleted (Fable5)"
            next: FAILED_REVERTED
          infra:
            classify: "placement-queue starvation / backend outage / eval-tower dispatch error"
            action:
              - "re-run in fresh quiet window after drop_caches + throttle-check"
          ambiguous:
            action:
              - "quality up but throughput cost extreme, or arms disagree across domains — hold for operator; the LB-6 threshold choice (OP-5b) adjudicates"
            next: HELD_AMBIGUOUS

  artifacts:
    outputs:
      - "/mnt/raid0/llm/tmp/lb7_floor_<UTC>/{baseline_A1.jsonl,plane_shadow.jsonl,floor.json}"
    package_to: "coordination/inference-batch/bundles/LB-7/"

  ledger:
    journal_quarantine_rule: >
      record dP(success), task_rate per arm, %throughput reduction, G, FA/FR e-process
      state, n/arm, corpus nearmiss-v1@1c50c025; observation-grade until P-REV-1 (OP-5a).
      No enforce-mode conclusion without OP-5b threshold. Quarantine diagnostic_only if
      speed_metric_mode/topology metadata missing or shadow flag not 6/6.
    era_stamp: "instrument-era-2026-06-12-post-measurement-constitution"

