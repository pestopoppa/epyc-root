# 6. ODLB-W3-01 — LightOnOCR model-gated bench (from odl_bench manifest_stubs.py)
# -----------------------------------------------------------------------------
- schema_version: inference_batch.entry.v1
  task_id: ODLB-W3-01-lightonocr
  title: "ODLB-W3-01 — LightOnOCR scanned/image OCR arm (OmniDocBench like-for-like)"
  provenance:
    owning_handoff: handoffs/active/opendataloader-pipeline-integration.md
    checkbox: "swap hybrid backend from docling-fast"
    also_flips:
      - "handoffs/active/opendataloader-pipeline-integration.md#does GPU-accelerated LightOnOCR beat docling-fast"
    source_ref: "epyc-inference-research/scripts/benchmark/odl_bench/manifest_stubs.py (ODLB-W3-01-lightonocr)"
    coordination_note: >
      Wave-2 B3 model-gated stub. Engine=lightonocr (PDFRouter._extract_with_lightonocr, async).
      Runs LightOnOCR over the same GT-page PDFs, writes <stem>.md predictions, scores with the
      deterministic OmniDocBench config for a like-for-like structural/table/reading-order compare
      vs pdftotext / ODL-local / LiteParse. PRECONDITION: source born-digital+scanned PDFs mapped
      to each GT page (demo_data lacks source PDFs — needs the OmniDocBench source corpus / LFS).
  phase: 3
  priority: P3
  preconditions:
    stack_lineup: "LightOnOCR server (config.server_urls.ocr_server; /ocr/pdf, port 8082); odl_bench adapter"
    kernel_era: production-consolidated-v9
    flag_attestation: env_only
    models:
      - lightonocr-2-1b
    host_health:
      tier: quiet_window
      max_uptime_days: 14
      cache_state: warm
    topology:
      required_topology_hash: 171f86f9188211e9
      live_affinity_verified: false
      contention_matrix: not_required
    autopilot: stopped
    operator_gates:
      - OP-ODL-SOURCE-CORPUS
    depends_on: []
  execution:
    driver: clean_window_entry
    protocol_id: "OmniDocBench deterministic-metric config (structural/table/reading-order + speed)"
    dry_run: false
    command: >
      PDF_ROUTER_FORCE_OCR=1 python -m scripts.benchmark.odl_bench.adapter run
      --engine lightonocr --pdf-manifest <pdf_manifest.json> --gt <OmniDocBench GT json>
      --run-dir $RUN_DIR --score
    cwd: /mnt/raid0/llm/epyc-inference-research
    concurrency_mode: isolated_bench
    fanout_transport: none
    contention_class: ocr_server
    est_wall_clock_h: 2.0
    timeout_s: 14400
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED
  outcomes:
    expected: >
      LightOnOCR predictions scored on the same OmniDocBench config; establishes whether the
      GPU OCR path beats docling-fast (0.43s/page) and the deterministic fast paths on scanned PDFs.
    gate_table:
      - gate: "Does LightOnOCR beat the deterministic fast paths on scanned/image PDFs at acceptable speed?"
        evidence: "structural/table/reading-order scores + per-page latency_ms vs pdftotext/ODL-local/LiteParse, OmniDocBench config"
        fork:
          pass:
            rule: "structural/table uplift over fast paths AND per-page latency competitive with docling-fast"
            action:
              - "flip the LightOnOCR experiment checkbox; recommend three-way routing (local -> hybrid -> LightOnOCR)"
            next: DONE_PASS
          marginal:
            rule: "quality uplift but latency worse than docling-fast"
            action:
              - "record observation; gate LightOnOCR to scanned-only routing"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "no structural uplift over fast paths"
            action:
              - "keep docling-fast default; document negative result"
            next: FAILED_REVERTED
          infra:
            classify: "OCR server unreachable / /ocr/pdf error / missing source PDFs for GT pages"
            action:
              - "verify LightOnOCR server + source-PDF corpus mapping; re-run in a fresh quiet window"
          ambiguous:
            action:
              - "hold for operator; attach per-page prediction+score rows"
            next: HELD_AMBIGUOUS
  artifacts:
    outputs:
      - "$RUN_DIR/predictions/lightonocr/<gt_stem>.md"
      - "opendataloader-bench/result/<save_name>_metric_result.json"
      - "$RUN_DIR/lightonocr_run_manifest.json"
    package_to: "coordination/inference-batch/bundles/ODLB-W3-01/"
  ledger:
    journal_quarantine_rule: >
      record engine=lightonocr, per-page latency_ms, structural/table/reading_order scores, GT set id;
      quarantine diagnostic_only if source PDFs were not mapped to every GT page.
    era_stamp: "E5-cpu-kernel"

