# -----------------------------------------------------------------------------
- schema_version: inference_batch.entry.v1
  task_id: BULK-XMAS-telemetry
  title: "X-MAS — post-enable live telemetry monitor (passive rider on enforce windows)"
  provenance:
    owning_handoff: handoffs/active/x-mas-text-routing.md
