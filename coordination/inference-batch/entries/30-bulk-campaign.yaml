      xmas_routing.mode=enforce landed 2026-07-03 (orchestrator d4a6c927); remaining work is
      post-enable telemetry monitoring, NOT another repaired-policy evidence gate. PASSIVE RIDER:
      this entry consumes live routing telemetry from whichever window already has the enforce
      flag set — it launches no dedicated inference. Rollback is xmas_routing.mode: off + API reload.
  phase: 3
  priority: P3
  preconditions:
    stack_lineup: "production lineup with xmas_routing enforce active"
