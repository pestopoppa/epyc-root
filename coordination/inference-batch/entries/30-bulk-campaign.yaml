      scaffold over the live KB-RAG index, but it does NOT close model-backed page drafting or adopt
      generated pages. (b) K11: FTS5 lexical signal landed default-off (orchestrator 74120be); this
      measures a lexical_weight sweep over the K7 certification pool after remapping archived handoff
      evidence paths and refreshing the KB-RAG index if stale. ColBERT MaxSim stays default until
      evidence justifies a lexical weight > 0.
