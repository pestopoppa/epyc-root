# -----------------------------------------------------------------------------
- schema_version: inference_batch.entry.v1
  task_id: BULK-A7-eseries
  title: "A7 — batched-decode E-series follow-ons (E3 conditional GEMM + E4 re-promotions)"
  provenance:
    owning_handoff: handoffs/active/batched-decode-measurement.md
    checkbox: "E3 — 8x8 GEMM SIMD body"
    also_flips:
      - "handoffs/active/batched-decode-measurement.md#E4 — conditional re-promotions"
    source_ref: "handoffs/completed/fable5-findings-06-kernel-and-concurrency.md"
    coordination_note: >
      E1 (A3B + dense-control) and E2 landed 2026-07-03/07. This entry runs the E-series
      follow-ons: E3 (AVX-512BW batch>1 GEMM body at arch/x86/repack.cpp:1563-1566) ONLY IF E1
      showed per-thread-BW unsaturated at intermediate batch, plus E4 conditional CPU17/CPU18
      re-promotions and the A7 eval-batch hook telemetry. E3-before-E1 is forbidden; E3 kernel
      work must land on llama.cpp-experimental, never production.
  phase: 3
  priority: P2
  preconditions:
    stack_lineup: "single full instance, -np sweep; frontdoor A3B + dense control"
    kernel_era: production-consolidated-v9
    flags_required:
      GGML_IQK: 1
    flag_attestation: env_only
    models:
      - frontdoor
    host_health:
      tier: quiet_window
      max_uptime_days: 7
      cache_state: drop_caches
    topology:
      required_topology_hash: 171f86f9188211e9
      live_affinity_verified: true
      contention_matrix: not_required
    autopilot: stopped
    operator_gates: []
    depends_on:
      - BULK-DS-E1-kv
  execution:
    driver: clean_window_entry
    protocol_id: "P-BENCH-3 via bench_canonical.sh"
    dry_run: false
    command: >
      # ESC-3 resolved 2026-07-17 — real E3/E4 8x8-GEMM-SIMD throughput leg (wrap in an external -np sweep loop;
      # the --np sweep flag was fabricated, bench_canonical is single -n):
      scripts/benchmark/bench_canonical.sh -m /mnt/raid0/llm/models/Qwen3.6-35B-A3B-MTP-Q8_0.gguf -n 128
    cwd: /mnt/raid0/llm/epyc-inference-research
    concurrency_mode: isolated_bench
    fanout_transport: none
    contention_class: single_instance_bench
    est_wall_clock_h: 4.0
    timeout_s: 21600
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED
  outcomes:
    expected: >
      E1 saturation regime re-confirmed at intermediate batch; E3 kernel written+benched only if
      compute headroom exists; E4 re-promotion rows flipped or explicitly re-closed with evidence.
    gate_table:
      - gate: "Does intermediate batch show per-thread-BW headroom that would justify the E3 GEMM body?"
        evidence: "aggregate tasks/hour + per-stream p50/p95 per -np N + BW utilization, P-BENCH-3, era E5-cpu-kernel"
        fork:
          pass:
            rule: "unsaturated per-thread BW at intermediate batch AND E3 kernel delta positive (canonical A/B)"
            action:
              - "flip E3 checkbox; land the AVX-512BW batch>1 body under cpu-shape handoff (experimental)"
              - "evaluate E4 CPU17/CPU18 re-promotions with the cited E1 evidence"
            next: DONE_PASS
          marginal:
            rule: "modest headroom; E3 delta within noise"
            action:
              - "record observation; do not write E3 kernel; leave E4 rows closed"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "BW-saturated at intermediate batch (no compute headroom)"
            action:
              - "document E3 as forbidden per measurement; re-close E4 reopen clauses"
            next: FAILED_REVERTED
          infra:
            classify: "server OOM / missing-IQK build / non-quiet host mid-sweep"
            action:
              - "confirm GGML_IQK build; re-run the full -np sweep in a fresh quiet window"
          ambiguous:
