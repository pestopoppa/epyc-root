# =============================================================================
# Wave-3 M3 — P3 BULK-CAMPAIGN inference-batch entries (phase 3).
#
# Per-model-group clean-window items. All entries are kernel-era-stamped
# (production-consolidated-v9 / E5-cpu-kernel; v9 freeze 2026-08-11, see CLAUDE.md)
# and throughput_sensitive -> require host_health.tier: quiet_window. The loop
# groups execution by model to avoid reload thrash ("per-model-group windows").
#
# Authored (not executed) for scripts/coordination/compile_inference_batch.py.
# Every entry copies the 00-example.yaml 5-fork gate_table shape
# (pass / marginal / fail / infra / ambiguous). NO inference is run here.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. DS-E1 — dynamic-stack KV measurement
# -----------------------------------------------------------------------------
- schema_version: inference_batch.entry.v1
  task_id: BULK-DS-E1-kv
  title: "DS-E1 — dynamic-stack KV measurement (decision-ready clean-window packet)"
  provenance:
    owning_handoff: handoffs/active/bulk-inference-campaign.md
    checkbox: "DS-E1 dynamic-stack KV measurement"
    also_flips:
      - "handoffs/active/routing-and-optimization-index.md#Dynamic stack / placement"
    source_ref: "docs/data/clean_window_measurement_manifest.json"
    coordination_note: >
      DS-E1 is decision-ready in the generated clean-window manifest and is the
      dynamic-stack KV-footprint measurement that feeds the DS-6/DS-7 static-vs-dynamic
      prewarm profile decision. Isolated bench in a quiet model-batched window; do not
      co-schedule with shape-keyed or K-ROPE exact-boundary work in the same window.
  phase: 3
  priority: P2
  preconditions:
    stack_lineup: "production default lineup (frontdoor + workers), single-instance measurement"
    kernel_era: production-consolidated-v9
    flags_required:
      GGML_IQK: 1
    flag_attestation: env_only
    models:
      - frontdoor
    host_health:
      tier: quiet_window
      max_uptime_days: 7
      cache_state: drop_caches
    topology:
      required_topology_hash: 171f86f9188211e9
      live_affinity_verified: true
      contention_matrix: not_required
    autopilot: stopped
    operator_gates:
      - OP-bench-recipe-abstraction
    depends_on: []
  execution:
    driver: clean_window_entry
    protocol_id: "P-BENCH-3 via bench_canonical.sh"
    dry_run: false
    command: >
      # ESC-3 resolved 2026-07-17 — THROUGHPUT SMOKE only (bench_canonical measures tg/pp, NOT KV footprint):
      scripts/benchmark/bench_canonical.sh -m /mnt/raid0/llm/models/Qwen3.6-35B-A3B-MTP-Q8_0.gguf -n 128
      # The REAL deliverable (KV-per-slot footprint, kv_bytes_per_slot per -np N) is NOT a bench_canonical mode
      # and stays build-gated (OP-bench-recipe-abstraction: operator-decided KV-footprint harness / run_batch_entry.py).
    cwd: /mnt/raid0/llm/epyc-inference-research
    concurrency_mode: isolated_bench
    fanout_transport: none
    contention_class: single_instance_bench
    est_wall_clock_h: 2.0
    timeout_s: 14400
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED
  outcomes:
    expected: >
      Dynamic-stack KV footprint measured under P-BENCH-3 with per-N slot occupancy;
      confirms whether dynamic prewarm materially beats the retained static profile.
    gate_table:
      - gate: "Does dynamic-stack KV allocation change the serving footprint enough to reopen DS-6?"
        evidence: "KV bytes/slot + tasks/hour per -np N, P-BENCH-3, host attest ref, era E5-cpu-kernel"
        fork:
          pass:
            rule: "material static-prewarm gap confirmed (>10% serving-slot headroom delta) with clean host attest"
            action:
              - "flip DS-E1 checkbox; file the packet with (metric, protocol, n, date, attest)"
              - "reopen DS-6 dynamic-prewarm evaluation per routing index"
            next: DONE_PASS
          marginal:
            rule: "delta within noise band; static profile still adequate"
            action:
              - "flip DS-E1; record observation; retain default static-prewarm profile"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "dynamic stack regresses footprint or destabilizes serving"
            action:
              - "retain static profile; document negative result in bulk-inference-campaign Open Questions"
            next: FAILED_REVERTED
          infra:
            classify: "server OOM / KV allocator error / non-quiet host during window"
            action:
              - "re-run in a fresh quiet window after drop_caches + throttle-check"
          ambiguous:
            action:
              - "hold for operator adjudication; attach raw per-N KV rows"
            next: HELD_AMBIGUOUS
  artifacts:
    outputs:
      - "data/clean_window/ds_e1/ds_e1_kv_measurement.json"
    package_to: "coordination/inference-batch/bundles/BULK-DS-E1/"
  ledger:
    journal_quarantine_rule: >
      record model, -np N, kv_bytes_per_slot, tasks_per_hour, host attest ref; quarantine
      diagnostic_only if host was not quiet-confirmed for the window.
    era_stamp: "E5-cpu-kernel"

# -----------------------------------------------------------------------------
# 2. K-ROPE — remaining RoPE long-context cells (worker re-attest gated)
# -----------------------------------------------------------------------------
- schema_version: inference_batch.entry.v1
  task_id: BULK-K-ROPE-cells
  title: "K-ROPE-1 — remaining RoPE long-context cells (exact-boundary + worker path)"
  provenance:
    owning_handoff: handoffs/active/research-evaluation-index.md
    checkbox: "RoPE K-ROPE-1 matrix"
    also_flips:
      - "handoffs/active/bulk-inference-campaign.md#K-ROPE"
    coordination_note: >
      PRECONDITION (2026-07-14 audit): the worker_general Gemma4-MTP serving gate is
      unverified-stale (2026-06-20 claim). Re-attest worker Gemma4-MTP serving against the
      Gemma4-MTP launch recipe BEFORE counting any worker RoPE cells. Valid 4K/8K
      (frontdoor/architect/ingest) and 16K (frontdoor/ingest) rows already committed; this
      entry adds exact-boundary rows + the worker cells only after re-attestation.
  phase: 3
  priority: P3
  preconditions:
    stack_lineup: "clean model-batched window; frontdoor + ingest resident, worker_general re-attested"
    kernel_era: production-consolidated-v9
    flags_required:
      GGML_IQK: 1
    flag_attestation: all_workers
    models:
      - frontdoor
      - ingest_long_context
      - worker_general
    host_health:
      tier: quiet_window
      max_uptime_days: 7
      cache_state: drop_caches
    topology:
      required_topology_hash: 171f86f9188211e9
      live_affinity_verified: true
      contention_matrix: not_required
    autopilot: stopped
    operator_gates:
      - OP-WORKER-MTP-REATTEST
      - OP-bench-recipe-abstraction
    depends_on: []
  execution:
    driver: clean_window_entry
    protocol_id: "P-QUAL-PROMO (long-context exact-boundary probe)"
    dry_run: false
    command: >
      # AMBIGUOUS (op-bundle): recipe k-rope-1-longcontext + --cells fabricated. Long-context ACCURACY matrix != bench_canonical (tg/pp throughput). Needs a long-context accuracy harness, not bench_canonical. OP-WORKER-MTP-REATTEST gate.
    cwd: /mnt/raid0/llm/epyc-inference-research
    concurrency_mode: isolated_bench
    fanout_transport: none
    contention_class: single_instance_bench
    est_wall_clock_h: 3.0
    timeout_s: 18000
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED
  outcomes:
    expected: >
      Worker Gemma4-MTP serving re-attested against launch recipe, THEN exact-boundary and
      worker RoPE cells filled; long-context accuracy matrix completed for the resident roles.
    gate_table:
      - gate: "Is worker_general Gemma4-MTP serving healthy (re-attested vs the launch recipe)?"
        evidence: "garbage-check + MTP draft-accept + no M-RoPE assert on worker_general, P-SMOKE-1"
        fork:
          pass:
            rule: "worker serves clean (no garble, draft-accept > 0, no assert)"
            action:
              - "proceed to fill worker + exact-boundary RoPE cells"
            next: BULK-K-ROPE-cells
          marginal:
            rule: "worker serves but with degraded MTP acceptance (<50%)"
            action:
              - "record worker cells as observation-only; do not promote worker RoPE claims"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "worker garbles or asserts (serving path still broken)"
            action:
              - "skip worker cells; fill only exact-boundary frontdoor/ingest cells; keep worker gate BLOCKED"
            next: BLOCKED_PRECONDITION
          infra:
            classify: "worker server crash / launch-recipe mismatch / non-quiet host"
            action:
              - "re-apply Gemma4-MTP launch recipe; re-run in a fresh quiet window"
          ambiguous:
            action:
              - "hold for operator adjudication; attach worker attest + raw MTP telemetry"
            next: HELD_AMBIGUOUS
      - gate: "Do the exact-boundary RoPE cells hold long-context accuracy at the boundary?"
        evidence: "per-cell long-context accuracy vs 4K/8K/16K baselines, P-QUAL-PROMO, era E5-cpu-kernel"
        fork:
          pass:
            rule: "boundary cells within tolerance of interior cells; matrix complete"
            action:
              - "flip K-ROPE-1 checkbox; commit cells to research"
            next: DONE_PASS
          marginal:
            rule: "boundary degradation present but bounded"
            action:
              - "record cells as observation; annotate boundary degradation"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "boundary collapse (accuracy floor at exact boundary)"
            action:
              - "document boundary failure mode; keep matrix open at those cells"
            next: FAILED_REVERTED
          infra:
            classify: "unparseable responses / server drop mid-matrix"
            action:
              - "re-run affected cells in a fresh quiet window after drop_caches"
          ambiguous:
            action:
              - "hold for operator; attach per-cell raw rows"
            next: HELD_AMBIGUOUS
  artifacts:
    outputs:
      - "benchmarks/results/clean_window/k_rope/k_rope_1_exact_boundary_worker.json"
    package_to: "coordination/inference-batch/bundles/BULK-K-ROPE/"
  ledger:
    journal_quarantine_rule: >
      record role, context length, cell (interior/exact-boundary), accuracy, worker attest ref;
      quarantine worker cells diagnostic_only if the MTP re-attest gate did not pass.
    era_stamp: "E5-cpu-kernel"

# -----------------------------------------------------------------------------
# 3. K-EMB-1 — Granite embedder bench Phase B
# -----------------------------------------------------------------------------
- schema_version: inference_batch.entry.v1
  task_id: BULK-K-EMB-1
  title: "K-EMB-1 — Granite embedder bench Phase B (load/vector smoke -> Phase B)"
  provenance:
    owning_handoff: handoffs/active/research-evaluation-index.md
    checkbox: "Granite embedder bench Phase B"
    also_flips:
      - "handoffs/active/granite-97m-r2-bench-plan.md#Phase B"
    coordination_note: >
      A-fast corpus/harness verified and GGUF artifacts produced for Granite/e5-base/BGE-M3
      on 2026-07-03. This entry runs the embedder-only load/vector smoke first, then Phase B
      retrieval bench. NO production model reload required: the command starts any missing warm
      embedder-only servers on ports 8096/8097/8098, preserves ones already live, and cleans up
      only the warm roles it introduced; baseline BGE stays on port 8090.
  phase: 3
  priority: P3
  preconditions:
    stack_lineup: "embedder-only servers (Granite/e5-base/BGE-M3 GGUF); no production role reload"
    kernel_era: production-consolidated-v9
    flag_attestation: env_only
    models:
      - granite-embedding-97m-r2
      - multilingual-e5-base
      - bge-m3
      - bge-large-en-v1.5
    host_health:
      tier: quiet_window
      max_uptime_days: 14
      cache_state: warm
    topology:
      required_topology_hash: 171f86f9188211e9
      live_affinity_verified: false
      contention_matrix: not_required
    autopilot: stopped
    operator_gates: []
    depends_on: []
  execution:
    driver: clean_window_entry
    protocol_id: "P-BENCH-3 (embedder latency) + retrieval recall bench"
    dry_run: false
    command: >
      bash -lc 'set -euo pipefail;
      port_open() { python3 -c "import socket,sys; s=socket.socket(); s.settimeout(0.25); sys.exit(0 if s.connect_ex((\"127.0.0.1\", int(sys.argv[1]))) == 0 else 1)" "$1"; };
      started_roles=();
      port_open 8096 || started_roles+=(embedder_granite_97m_r2);
      port_open 8097 || started_roles+=(embedder_multilingual_e5_base);
      port_open 8098 || started_roles+=(embedder_bge_m3);
      cleanup() {
        if ((${#started_roles[@]})); then
          cd /mnt/raid0/llm/epyc-orchestrator &&
          python3 scripts/server/orchestrator_stack.py stop "${started_roles[@]}" || true;
        fi;
      };
      trap cleanup EXIT;
      cd /mnt/raid0/llm/epyc-orchestrator &&
      python3 scripts/server/orchestrator_stack.py start --only embedder_granite_97m_r2 embedder_multilingual_e5_base embedder_bge_m3 --numa-mode full --skip-stack-change-gate --no-compile-registry;
      cd /mnt/raid0/llm/epyc-inference-research;
      mkdir -p data/embedder_bench;
      .venv/bin/python scripts/benchmark/embedder_recall_bench.py
      --corpus /mnt/raid0/llm/epyc-root/data/benchmarks/eval-corpus-v0.jsonl
      --models granite-embedding-97m-r2/Q8_0 multilingual-e5-base/Q8_0 bge-m3/Q8_0 bge-large-en-v1.5/reference
      --k 1 3 5 10 50 --batch-size 8 --max-input-chars 512;
      EMBEDDER_RECALL_EXECUTE=1 .venv/bin/python scripts/benchmark/embedder_recall_bench.py
      --corpus /mnt/raid0/llm/epyc-root/data/benchmarks/eval-corpus-v0.jsonl
      --models granite-embedding-97m-r2/Q8_0 multilingual-e5-base/Q8_0 bge-m3/Q8_0 bge-large-en-v1.5/reference
      --k 1 3 5 10 50 --batch-size 8 --max-input-chars 512 --execute
      --output data/embedder_bench/granite_97m_r2_phaseB.json'
    cwd: /mnt/raid0/llm/epyc-inference-research
    concurrency_mode: isolated_bench
    fanout_transport: none
    contention_class: embedder_only
    est_wall_clock_h: 1.5
    timeout_s: 10800
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED
  outcomes:
    expected: >
      Embedder load/vector smoke passes, then Phase B retrieval recall + latency measured for
      Granite-97m-r2 vs e5-base / BGE-M3 references.
    gate_table:
      - gate: "Does Granite-97m-r2 clear the load/vector smoke AND hold retrieval recall vs references?"
        evidence: "vector-smoke pass + recall@k and per-query latency vs e5-base/BGE-M3, P-BENCH-3"
        fork:
          pass:
            rule: "smoke passes AND recall within tolerance at lower latency/footprint than references"
            action:
              - "flip K-EMB-1 / Phase B checkbox; file the embedder bench packet"
            next: DONE_PASS
          marginal:
            rule: "recall parity but no latency/footprint win"
            action:
              - "record observation; no default embedder change"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "recall regression or smoke failure"
            action:
              - "keep current embedder default; document in granite bench plan"
            next: FAILED_REVERTED
          infra:
            classify: "embedder server 404/OOM / GGUF load failure"
            action:
              - "verify port 8090-8095 mapping (not SearXNG); re-run smoke then Phase B"
          ambiguous:
            action:
              - "hold for operator; attach recall + latency raw rows"
            next: HELD_AMBIGUOUS
  artifacts:
    outputs:
      - "data/embedder_bench/granite_97m_r2_phaseB.json"
    package_to: "coordination/inference-batch/bundles/BULK-K-EMB-1/"
  ledger:
    journal_quarantine_rule: >
      record embedder model, recall@k, per-query latency_ms, corpus id; quarantine diagnostic_only
      if the load/vector smoke did not pass first.
    era_stamp: "E5-cpu-kernel"

