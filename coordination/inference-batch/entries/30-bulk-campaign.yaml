    fanout_transport: none
    contention_class: kb_rag_offline_retrieval
    est_wall_clock_h: 2.5
    timeout_s: 18000
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED
  outcomes:
    expected: >
      K11 lexical-weight sweep priced against the ColBERT-only default over the remapped K7
      certification pool; AutoWiki deterministic writer dry-run reports policy-conformant page
      coverage without calling a model or adopting pages.
    gate_table:
      - gate: "Does an FTS5 lexical weight > 0 beat ColBERT-only recall without increasing miss risk?"
        evidence: "k11_lexical_weight_sweep.json: recall@10 per lexical_weight vs w=0 baseline over remapped K7 cert pool, plus AutoWiki dry-run policy summary"
        fork:
          pass:
            rule: "a lexical_weight improves recall beyond the 2pp noise band with 0 new missed-all-evidence cases, and AutoWiki dry-run ok=true"
            action:
              - "flip K11; propose the winning lexical_weight default to operator"
            next: DONE_PASS
          marginal:
            rule: "lexical uplift within noise; AutoWiki dry-run ok=true but no retrieval win"
            action:
              - "keep lexical_weight=0 default; leave model-backed AutoWiki drafting open"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "lexical weight regresses recall/miss-risk OR AutoWiki dry-run fails the evidence policy"
