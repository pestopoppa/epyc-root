      live_affinity_verified: false
      contention_matrix: not_required
    autopilot: any
    operator_gates:
      - XMAS-enforce-window-ab-root-present
    depends_on: []
  execution:
    driver: autopilot_action
    protocol_id: "P-AB-1 (live routing telemetry, observe-only)"
    dry_run: false
    command: >
      uv run python scripts/autopilot/fable5_gate_report.py --strict --xmas-ab-root <enforce-window AB root>
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: observe_only
    fanout_transport: none
    contention_class: passive_telemetry
    est_wall_clock_h: 0.0
    timeout_s: 0
  outcomes:
    expected: >
      Live post-enable telemetry shows no unexpected domain/latency regression or guard bypass;
      X-MAS enforce remains healthy or triggers a pre-decided rollback.
    gate_table:
      - gate: "Does live post-enable telemetry stay clean (no domain/latency regression, no guard bypass)?"
        evidence: "rolling domain score-delta + latency-ratio + guard-bypass counts vs the promote_candidate baseline, P-AB-1"
        fork:
          pass:
            rule: "no domain regresses beyond -0.05, latency-ratio <= 1.0, zero guard bypasses over the window"
            action:
              - "flip the telemetry-monitor checkbox; record the healthy window with (metric, protocol, n, date)"
            next: DONE_PASS
          marginal:
            rule: "minor latency drift within tolerance, no quality regression"
            action:
              - "record observation; keep enforce; widen the monitoring window"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "domain regression < -0.05 OR guard bypass OR sustained latency regression"
            action:
              - "roll back: set xmas_routing.mode: off + reload orchestrator API"
              - "document the regression mechanism in x-mas-text-routing Open Questions"
            next: FAILED_REVERTED
          infra:
            classify: "telemetry pipeline gap / Fable5 report unavailable"
            action:
              - "repair the report path; re-observe the same window before verdict"
          ambiguous:
            action:
              - "hold for operator; attach the raw per-domain telemetry rows"
            next: HELD_AMBIGUOUS
  artifacts:
    outputs:
      - "orchestration/reports/xmas_post_enable_telemetry_window.json"
    package_to: "coordination/inference-batch/bundles/BULK-XMAS-telemetry/"
  ledger:
    journal_quarantine_rule: >
      record window bounds, per-domain score-delta, latency-ratio, guard-bypass count; observe-only
      rows never gate a keep/promote decision on their own (P-AB-1 N>=100 rule).
    era_stamp: "E5-cpu-kernel"

