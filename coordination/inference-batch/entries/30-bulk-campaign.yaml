    dry_run: false
    command: >
      .venv/bin/python scripts/trace/run_task_lg_parity.py --arms run_task_lg,run_task
      --fixed-task-set data/trace/parity_task_set.json --seed 42 --execute
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: paired_sequential
    fanout_transport: none
    contention_class: single_instance_parity
    est_wall_clock_h: 2.0
    timeout_s: 14400
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED
  outcomes:
    expected: >
      run_task_lg reaches decision-chain parity with run_task on the fixed task set, with non-empty
      chains on both arms, clearing the live-parity prerequisite for interrupt-based review gates (H3).
    gate_table:
      - gate: "Is run_task_lg at parity with run_task on real nodes with non-empty decision chains?"
        evidence: "per-task decision-chain parity + non-empty trace coverage, P-AB-1, seed 42"
        fork:
          pass:
            rule: "decision-chain parity on all fixed tasks AND non-empty chains on both arms"
            action:
              - "flip TM-7 live parity residual; keep TM-8 coverage separate"
            next: DONE_PASS
          marginal:
            rule: "parity holds but chain coverage is partial or otherwise diagnostic-only"
            action:
              - "record observation; keep interrupt gates OFF pending trace coverage repair"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "decision-chain divergence OR empty decision chain on either arm"
            action:
              - "keep GENERALIZED_INTERRUPTS forbidden; document the live parity / trace coverage defect"
            next: FAILED_REVERTED
          infra:
            classify: "trace DB error / node crash unrelated to parity"
            action:
              - "verify data/trace/events.sqlite and the fixed task set; re-run the parity set in a fresh quiet window"
          ambiguous:
            action:
              - "hold for operator; attach per-task diff + resume side-effect trace"
            next: HELD_AMBIGUOUS
  artifacts:
    outputs:
      - "data/trace/tm7_realnode_parity.json"
    package_to: "coordination/inference-batch/bundles/BULK-langgraph-tm7-parity/"
  ledger:
    journal_quarantine_rule: >
      record task id, run_task vs run_task_lg decision-chain parity, trace chain lengths, seed;
      quarantine diagnostic_only if the fixed task set changed between arms.
    era_stamp: "E5-cpu-kernel"
