# =============================================================================
# Wave-3 M4 — COORDINATION rows (phase 90).
#
# These are NOT executable batch tasks. Each row is a precondition cross-reference
# to work OWNED BY A PARALLEL SESSION. They exist so downstream entries (P4 era
# stamps, P5 GLM probes, the A3 GPU arm, teleport knobs) can depend_on / reference a
# stable task_id, and so the status dashboard shows the external blocker.
#
# MARKER (per plan): phase 90 + a coordination_note. The loop's pick-next must NEVER
# execute these. The entry schema has no status field (additionalProperties:false),
# so the COORDINATION ledger status is seeded OUTSIDE the entry: the operator/compile
# step writes a COORDINATION ledger row for each task_id below (COORDINATION is not in
# ELIGIBLE_STATES={READY}, so pending()/pick-next skips it). Until that seed exists an
# empty-ledger --simulate would default these to READY — they are still authored
# observe_only + dry_run so a stray pick is a no-op. Do NOT ledger-seed here; that is
# the operator's step. See notes: on each row.
#
# Downstream dependents (documented per row):
#   * P4 era stamps            <- COORD-v7-promotion (v7 becomes a new kernel era)
#   * P5 GC-1..3               <- COORD-glm52-admission (GLM loads + is coherent)
#   * P6 A4 arm (RM-4)         <- COORD-glm52-admission
#   * P6 A3 arm (RM-2-A3)      <- COORD-axa-teleport (GPU bet #2 = AXA-1 residency lane)
#   * LB-2/AXA-3 latency knobs <- COORD-mi210-drafter-stage12 + COORD-axa-teleport
# =============================================================================

