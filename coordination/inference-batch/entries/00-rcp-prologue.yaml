# =============================================================================
# RCP PROLOGUE — reviewer-plane baseline window (Wave-3 M1, phase 0, P0).
#
# Subsumes the already-staged RCP-W1/W2/W3 tasks in
# handoffs/active/bulk-inference-campaign.md (2026-07-17 "OP-6 reviewer-plane
# baseline window" section, lines 609-616). These three entries ARE the
# execution of the reviewer-control-plane series leaf checkboxes:
#   TM-8 (reviewer-trace-materialization.md), RD-12 (reviewer-decision-plane.md),
#   RC-8 (reviewer-calibration-accounting.md), LB-1 (reviewer-latency-and-sampling-budget.md).
# No other session runs them independently (anti-double-run per the section header).
#
# Window discipline: ONE quiesced window (~1.5-2h), AutoPilot STOPPED, REFERENCE
# lineup only (122B-Q4 architect / 35B frontdoor / gemma workers; reviewer aliased
# to the CPU architect_general per spec amendment A3 — NO stack change, NOT the
# GPU-resident 122B-IQ2 arm; GLM-5.2 NOT resident). Kernel per OP-6(a): v6-now.
# All numbers observation-grade pre-P-REV-1 (RC-6a). Operator gates: OP-6a + OP-6b.
#
# Self-check:  python -c "import yaml; yaml.safe_load(open('00-rcp-prologue.yaml'))"
# Validate:    /mnt/raid0/llm/epyc-orchestrator/.venv/bin/python \
#                scripts/coordination/compile_inference_batch.py validate
# =============================================================================

- schema_version: inference_batch.entry.v1
  task_id: RCP-W1-reference-relaunch-preflight
  title: "RCP-W1 — Reference-lineup relaunch + flag-propagation + B4 topology attestation"

  provenance:
    owning_handoff: handoffs/active/bulk-inference-campaign.md
    checkbox: "RCP-W1"
    source_ref: "handoffs/active/bulk-inference-campaign.md#L613 (2026-07-17 OP-6 reviewer-plane baseline window); master-handoff-index.md OP-6 decision (b)(1)"
    coordination_note: >
      Enabling preflight for the whole prologue. The 1-of-6 uvicorn runtime-flag
      propagation hazard silently corrupts TM-8 coverage if review_decision_shadow
      is not live on ALL workers, so this MUST pass (all_workers attestation) before
      any replay. Reference lineup only — no lineup change, reviewer = CPU
      architect_general alias (A3). Does NOT itself flip a series metric checkbox;
      it gates RCP-W2/W3.

  phase: 0
  priority: P0

  preconditions:
    stack_lineup: "REFERENCE trio — architect_general Qwen3.5-122B-A10B-Q4 / frontdoor Qwen3.6-35B-A3B-Q8 / gemma-4-26B-A4B workers; reviewer aliased to CPU architect_general (A3); GLM-5.2 NOT resident"
    kernel_era: production-consolidated-v6
    flags_required:
      review_decision_shadow: 1
    flags_forbidden:
      - review_decision_enforce
    flag_attestation: all_workers
    models:
      - architect_general
      - frontdoor
      - worker_general
    host_health:
      tier: quiet_window
      cache_state: warm
    topology:
      required_topology_hash: df373c79cc4af06f
      live_affinity_verified: true
      contention_matrix: not_required
    autopilot: stopped
    operator_gates:
      - OP-6a
      - OP-6b
      - OP-stack-restart-approval
    depends_on: []

  execution:
    driver: command
    protocol_id: "preflight-gate.v1 + three-gates (pipeline-green != starts != live==config)"
    dry_run: false
    # RCP-W1 PREREQUISITE (manual operator step under OP-stack-restart-approval, NOT part of the command below):
    # ESC-1 RESOLVED 2026-07-17 — there is NO `restart`/`--lineup` verb; the REFERENCE lineup IS the default manifest HOT tier.
    # From cwd /mnt/raid0/llm/epyc-orchestrator (fleet is DOWN), bring it up with the shadow flag in launch env:
    #   env ORCHESTRATOR_FEATURE_REVIEW_DECISION_SHADOW=1 .venv/bin/python scripts/server/orchestrator_stack.py start --numa-mode full
    # (== launch_production.sh --full + shadow flag; architect_general=Qwen3.5-122B-A10B-Q4, GLM-5.2 NOT resident,
    #  reviewer=CPU architect_general alias. There is no `restart`; restart == `stop --all` + `start`. If `status` shows
    #  stragglers, `stop --all` first. The command below is the POST-RELAUNCH preflight only; all 4 clauses are real/verified.)
    command: >
      scripts/server/affinity_preflight.py --require-memory-locality &&
      scripts/server/preflight_gate.py --expected-topology-hash df373c79cc4af06f --require-servers --json &&
      scripts/validate/attest_orchestrator_workers.py --min-workers 6 --expect-feature review_decision_shadow &&
      scripts/validate/attest_flags.py
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: observe_only
    fanout_transport: none
    contention_class: stack_control_no_inference
    est_wall_clock_h: 0.4
    timeout_s: 3600
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED

  outcomes:
    expected: >
      Reference lineup live==config on all six API workers; live affinity matches
      NUMA_CONFIG for every role; preflight_gate attestation JSON records topology
      hash df373c79cc4af06f fresh; review_decision_shadow=ON confirmed on ALL 6
      uvicorn workers via per-worker flag introspection; review_decision_enforce OFF.
    gate_table:
      - gate: "Is the reference lineup live==config AND is review_decision_shadow=ON on ALL 6 workers AND topology attested fresh?"
        evidence: "three-gates check; affinity_preflight live-affinity pass; preflight_gate.py attestation JSON (topology df373c79cc4af06f, servers up, matrix fresh); attest_orchestrator_workers.py 6/6 with feature review_decision_shadow; attest_flags.py no env diffs"
        fork:
          pass:
            rule: "6/6 workers report review_decision_shadow=ON AND enforce=OFF AND live affinity == NUMA_CONFIG for all roles AND topology hash == df373c79cc4af06f"
            action:
              - "flip RCP-W1 checkbox in bulk-inference-campaign.md"
              - "record attestation JSON path + per-worker flag table"
            next: RCP-W2-paired-shadow-replay
          marginal:
            rule: "lineup live and affinity clean but attestation shows uptime warning only, OR a single worker needs a re-broadcast that then reaches 6/6"
            action:
              - "re-run attest_orchestrator_workers.py after POST /config re-broadcast; require 6/6 before proceeding"
              - "record the transient in the run header"
            next: RCP-W2-paired-shadow-replay
          fail:
            rule: "fewer than 6 workers show shadow=ON (1-of-6 propagation bug) OR any live affinity mismatch OR topology hash drift"
            action:
              - "DO NOT proceed to replay — a partial flip silently corrupts TM-8 coverage"
              - "reload the affected role via orchestrator_stack.py; set flags in launch env (not POST /config); rerun affinity + attestation"
            next: BLOCKED_PRECONDITION
          infra:
            classify: "relaunch failure / server OOM / port-bind / preflight_gate error / NUMA warmup stall"
            action:
              - "drop_caches + throttle-check; restart the stack via orchestrator_stack.py; re-queue RCP-W1"
          ambiguous:
            action:
              - "attestation inconsistent (launch env shows ON but /config poll shows OFF on some worker) — hold for operator; attach per-worker introspection + attest_flags output"
            next: HELD_AMBIGUOUS

  artifacts:
    outputs:
      - "epyc-orchestrator/data/preflight/<UTC>.json"
      - "epyc-orchestrator/orchestration/reports/rcp_w1_flag_attestation_<UTC>.json"
    package_to: "coordination/inference-batch/bundles/RCP-W1/"

  ledger:
    journal_quarantine_rule: >
      record lineup id, kernel era, topology hash, per-worker shadow-flag state (6/6
      required), enforce=OFF; quarantine the whole prologue diagnostic_only if flag
      attestation is not 6/6 or topology hash != df373c79cc4af06f.
    era_stamp: "instrument-era-2026-06-12-post-measurement-constitution"

- schema_version: inference_batch.entry.v1
  task_id: RCP-W2-paired-shadow-replay
  title: "RCP-W2 — RD-12 paired shadow-OFF/ON replay (feeds TM-8 coverage + LB-1 overhead + first review_ledger rows)"

  provenance:
    owning_handoff: handoffs/active/bulk-inference-campaign.md
    checkbox: "RCP-W2"
    also_flips:
      - "handoffs/active/reviewer-decision-plane.md#RD-12"
      - "handoffs/active/reviewer-trace-materialization.md#TM-8"
      - "handoffs/active/reviewer-latency-and-sampling-budget.md#LB-1"
    source_ref: "handoffs/active/bulk-inference-campaign.md#L614; master-handoff-index.md OP-6 decision (b)(2)"
    coordination_note: >
      The 50-question eval-tower replay run shadow-OFF then shadow-ON (paired, SAME
      questions, seed42 production sampling). OFF leg re-anchors the post-bc8d3303
      throughput baseline (LB-1 attribution seed); ON leg measures shadow-emission
      overhead and produces the FIRST review_ledger rows (RD-12). TM-8 coverage gate
      = ~100% of review invocations produce trace rows. Sampling-sensitive:
      production temp + seed42 both legs.
      Ledger production is a firing-contingent workaround (events→ledger materializer); RCP-W3 no longer depends on this.
      VALIDATED 2026-07-17 (ESC-4, non-inference): the materialize->report pipeline was exercised end-to-end on the 32 historical REVIEW_DECISION events in data/trace/events.sqlite — 32/32 events -> 32 review_ledger rows, report generated cleanly (acceptance 50%, parse_failure_rate 15.6%), FA/FR/ECE null because those events' candidate_ids ('S1'/empty) are NOT nearmiss row_ids. RCP-W2 = first ledger rows from EXISTING events (non-inference, runnable now); RCP-W3 = non-null FA/FR via the corpus-matched bridge that emits its own decisions keyed to nearmiss row_ids. Pipeline CONFIRMED.

  phase: 0
  priority: P0

  preconditions:
    stack_lineup: "REFERENCE trio (unchanged from RCP-W1); reviewer = CPU architect_general alias (A3)"
    kernel_era: production-consolidated-v6
    flags_required:
      review_decision_shadow: 1
    flags_forbidden:
      - review_decision_enforce
    flag_attestation: all_workers
    models:
      - architect_general
      - frontdoor
      - worker_general
    host_health:
      tier: quiet_window
      cache_state: warm
    topology:
      required_topology_hash: df373c79cc4af06f
      live_affinity_verified: true
      contention_matrix: not_required
    autopilot: stopped
    operator_gates:
      - OP-6a
      - OP-6b
      - BUILD-mechanism-a-ledger-producer
    depends_on:
      - RCP-W1-reference-relaunch-preflight

  execution:
    driver: command
    protocol_id: "P-AB-1 (paired, same questions/seed both legs) + P-SPEED-OBJ (task_rate) for the throughput delta"
    dry_run: false
    # MECHANISM-A ledger production. The events→ledger materializer is BUILT (reviewer_events_to_ledger.py).
    # Discovery: data/trace/events.sqlite ALREADY holds 32 historical REVIEW_DECISION events, so the
    # materialize+report leg below is runnable NOW (non-inference) for first ledger rows. A fuller run first
    # drives a fresh shadow-ON reference-lineup eval to generate MORE events (inference), then re-materializes.
    # Firing-contingency (op-bundle ESC-4): a scoped run may legitimately find 0 events — that is diagnostic, not failure.
    command: >
      .venv/bin/python scripts/analysis/reviewer_events_to_ledger.py
      --events data/trace/events.sqlite
      --corpus /mnt/raid0/llm/datasets/nearmiss-corpus-v1/rows.jsonl
      --output /mnt/raid0/llm/tmp/rcp_w2_<UTC>/ --emit ledger-sqlite &&
      .venv/bin/python scripts/analysis/reviewer_calibration_report.py
      --ledger /mnt/raid0/llm/tmp/rcp_w2_<UTC>/review_ledger.sqlite
      --corpus /mnt/raid0/llm/datasets/nearmiss-corpus-v1/rows.jsonl --k 2 --print
      --out-json /mnt/raid0/llm/tmp/rcp_w2_<UTC>/report.json
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: paired_sequential
    fanout_transport: placement_queue
    contention_class: eval_fanout_reference_lineup
    est_wall_clock_h: 1.0
    timeout_s: 7200
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED

  outcomes:
    expected: >
      Both legs complete 50/50 same questions; shadow-ON emits a REVIEW_DECISION trace
      row + review_ledger row for ~100% of review invocations (TM-8); ON-vs-OFF
      eval-wall + token delta is the LB-1/H-LB shadow-overhead baseline; RD-12
      per-decision latency_ms + tokens recorded with zero enforcement side effects.
    gate_table:
      - gate: "Does the paired replay yield ~100% trace coverage (TM-8) with a clean shadow-overhead delta (LB-1) and durable first ledger rows (RD-12)?"
        evidence: "coverage = review-trace rows / review invocations via src/trace/query.py decision-chain + review_ledger counts; ON-vs-OFF eval-wall + median/aggregate t/s + token delta; ledger rows durable in data/trace/events.sqlite; seed42 production sampling both legs"
        fork:
          pass:
            rule: "coverage >= ~99% (phase tags + executor-model-id + reminder events all present) AND both legs complete 50/50 AND ledger rows durable"
            action:
              - "flip RCP-W2 checkbox in bulk-inference-campaign.md"
              - "flip RD-12 (reviewer-decision-plane.md), TM-8 (reviewer-trace-materialization.md), LB-1 (reviewer-latency-and-sampling-budget.md) with the numbers — all OBSERVATION-grade pre-P-REV-1"
              - "record overhead delta in H-LB AND reviewer-decision-plane per RD-12 reporting instructions"
            next: RCP-W3-rc8-smoke-slice
          marginal:
            rule: "coverage 90-99% (missing phase tags / reminder / executor-model-id on some rows) OR overhead delta within noise"
            action:
              - "record RCP-W2 + RD-12 + LB-1 as partial observations; open a TM-8 follow-up for the missing event types"
              - "do NOT flip TM-8 as ~100% — H4 does not start until coverage is ~100%"
            next: RCP-W3-rc8-smoke-slice
          fail:
            rule: "coverage < 90% OR the ON leg is dominated by errors/timeouts OR ledger rows not durable across the run"
            action:
              - "shadow emission is lossy — do NOT start H4; file a trace-emission bug against src/trace/emit.py"
              - "keep TM-8 / RD-12 open; re-run after the emission fix"
            next: FAILED_REVERTED
          infra:
            classify: "placement-queue starvation / backend outage / eval-tower dispatch error / server OOM"
            action:
              - "re-run in a fresh quiet window after drop_caches + throttle-check; confirm 6/6 shadow flag still live first"
          ambiguous:
            action:
              - "coverage number surprising (e.g. 100% but suspiciously low invocation count, or overhead delta sign-flips vs the 2026-07-16 regression) — broken-instrument guardrail: read decision-chain transcripts before believing; hold for operator"
            next: HELD_AMBIGUOUS

  artifacts:
    outputs:
      - "/mnt/raid0/llm/tmp/rcp_w2_replay_<UTC>/{shadow_off.jsonl,shadow_on.jsonl}"
      - "epyc-orchestrator/data/trace/events.sqlite (review_ledger rows)"
    package_to: "coordination/inference-batch/bundles/RCP-W2/"

  ledger:
    journal_quarantine_rule: >
      record n/arm=50, seed=42, sampling=production, coverage %, ON-vs-OFF eval-wall +
      median/aggregate t/s + token delta, ledger row count, kernel era, corpus/flag
      stamp; all numbers OBSERVATION-grade until P-REV-1 merges (RC-6a). Quarantine
      diagnostic_only if the two legs do not share identical question set/seed or if
      shadow-flag attestation was not 6/6 at run time.
    era_stamp: "instrument-era-2026-06-12-post-measurement-constitution"

- schema_version: inference_batch.entry.v1
  task_id: RCP-W3-rc8-smoke-slice
  title: "RCP-W3 — RC-8 smoke slice: first FA/FR/CR observations on nearmiss-v1 (shadow self-review)"

  provenance:
    owning_handoff: handoffs/active/bulk-inference-campaign.md
    checkbox: "RCP-W3"
    also_flips:
      - "handoffs/active/reviewer-calibration-accounting.md#RC-8"
    source_ref: "handoffs/active/bulk-inference-campaign.md#L615; master-handoff-index.md OP-6 decision (b)(3)"
    coordination_note: >
      Status-quo self-review (CPU architect_general alias, A3) in shadow over ~100-200
      multi-oracle nearmiss-v1 rows across domains incl. the natural-defect control
      slice. Scores via reviewer_calibration_report.py -> first FA/FR/CR. This is the
      SMOKE slice that seeds the phase-1 RC-8 full-corpus baseline (10-reviewer-plane.yaml);
      observation-grade pre-P-REV-1. Broken-grader guardrail is load-bearing here.
      Now self-contained via the reviewer-corpus ledger bridge (produces its own decisions); independent of RCP-W2. ECE/AUC null until confidence captured; FA/FR/CR/parse compute.

  phase: 0
  priority: P0

  preconditions:
    stack_lineup: "REFERENCE trio (unchanged); reviewer = CPU architect_general alias (A3)"
    kernel_era: production-consolidated-v6
    flags_required:
      review_decision_shadow: 1
    flags_forbidden:
      - review_decision_enforce
    flag_attestation: all_workers
    models:
      - architect_general
    host_health:
      tier: quiet_window
      cache_state: warm
    topology:
      required_topology_hash: df373c79cc4af06f
      live_affinity_verified: true
      contention_matrix: v7-recert-required
    autopilot: stopped
    operator_gates:
      - OP-6a
      - OP-6b
    depends_on:
      - RCP-W1-reference-relaunch-preflight

  execution:
    driver: command
    protocol_id: "P-REV-1 (observation-grade pre-merge; RC-6a not yet signed)"
    dry_run: false
    command: >
      .venv/bin/python scripts/analysis/reviewer_corpus_ledger_run.py
      --corpus /mnt/raid0/llm/datasets/nearmiss-corpus-v1/rows.jsonl
      --reviewer architect_general --n 200 --domain multi_oracle --slice multi_oracle
      --output /mnt/raid0/llm/tmp/rcp_w3_rc8_<UTC>/ --emit decisions-jsonl --execute &&
      .venv/bin/python scripts/analysis/reviewer_calibration_report.py
      --decisions /mnt/raid0/llm/tmp/rcp_w3_rc8_<UTC>/decisions.jsonl
      --corpus /mnt/raid0/llm/datasets/nearmiss-corpus-v1/rows.jsonl --k 2 --print
      --out-json /mnt/raid0/llm/tmp/rcp_w3_rc8_<UTC>/report.json
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: same_trial_eval_fanout
    fanout_transport: placement_queue
    contention_class: eval_fanout_reference_lineup
    est_wall_clock_h: 0.6
    timeout_s: 5400
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED

  outcomes:
    expected: >
      >=100 multi-oracle rows scored; reviewer_calibration_report.py returns FA rate,
      FR rate, FA/FR ratio, CR (pass^k, k=2), parse-failure rate per domain with Wilson
      CIs. Directions: FA/FR lower-better, yield/CR higher-better. Expect FR >> FA
      (intake-836 overcorrection prior). Transcripts confirm numbers are real.
    gate_table:
      - gate: "Do the first FA/FR/CR observations on the nearmiss-v1 smoke slice compute cleanly and survive the broken-grader guardrail?"
        evidence: "reviewer_calibration_report.py panel (FA/FR/ratio/CR/parse-failure per domain, Wilson CIs, n>=100 multi_oracle rows); transcripts of surprising rows read before belief; instrument stamp = kernel v6 + provisional ngram+MTP worker config + corpus nearmiss-v1@1c50c025 + flag state"
        fork:
          pass:
            rule: "report completes on >=100 multi_oracle rows AND FA/FR/CR computed with CIs AND transcript spot-check confirms the numbers reflect real decisions (not grader repair)"
            action:
              - "flip RCP-W3 checkbox in bulk-inference-campaign.md"
              - "flip RC-8 (reviewer-calibration-accounting.md) with the first FA/FR/CR numbers — OBSERVATION-grade (pre-P-REV-1); do NOT gate any keep/revert/promote"
              - "hand off to phase-1 RC-8-full-corpus-baseline (10-reviewer-plane.yaml) for the fuller run"
            next: DONE_PASS
          marginal:
            rule: "50-100 rows scored OR high parse-failure rate on the schema-emission path (itself an IQ2-adjacent quality signal)"
            action:
              - "record RC-8 as a partial observation; note parse-failure rate as a first-class signal (RA-9)"
              - "RC-8 stays open; expand n in the phase-1 full-corpus run"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "report cannot compute (gold-label join empty / all rows single_oracle / no shadow decisions in ledger)"
            action:
              - "fix the gold-label join (RC-2) or confirm shadow decisions actually flowed (depends on RCP-W2 coverage); do NOT trust any number"
            next: FAILED_REVERTED
          infra:
            classify: "server unavailable / corpus load error / placement-queue dispatch error"
            action:
              - "re-run after drop_caches + throttle-check; re-verify shadow flag 6/6 live"
          ambiguous:
            action:
              - "surprising FA/FR flip (e.g. FA >> FR, contradicting the intake-836 FR>>FA prior) — broken-grader guardrail (CORE-Bench 42->95% was grader repair): read transcripts before believing; hold for operator adjudication"
            next: HELD_AMBIGUOUS

  artifacts:
    outputs:
      - "/mnt/raid0/llm/tmp/rcp_w3_rc8_<UTC>/{replay.jsonl,report.json,report.md}"
    package_to: "coordination/inference-batch/bundles/RCP-W3/"

  ledger:
    journal_quarantine_rule: >
      record n multi_oracle rows, FA/FR/ratio/CR/parse-failure per domain, corpus
      nearmiss-v1 content_sha256 1c50c025, gold source, reviewer=architect_general
      alias, grader, mode=shadow, kernel era; ALL numbers OBSERVATION-grade until
      P-REV-1 merges (RC-6a) — never decision-gating. Quarantine diagnostic_only on
      corpus-hash mismatch or <100 gate-worthy rows.
    era_stamp: "instrument-era-2026-06-12-post-measurement-constitution"
