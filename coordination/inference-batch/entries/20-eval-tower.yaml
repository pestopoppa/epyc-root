    fanout_transport: none
    contention_class: single_model_sequential
    est_wall_clock_h: 6.0
    timeout_s: 28800
    retry_policy:
      max_attempts: 1
      retry_on:
        - INFRA_BLOCKED
  outcomes:
    expected: >
      A fresh math baseline over 1819 items/arm (GSM8K 1319 + MATH-500 500) under
      math_verify scoring, production temperature + seed=42, with dataset_sha256 and
      test_profile recorded per arm. On a clean pass it supersedes the stale
      exact-match math baseline via a new instrument-era label (append; never edit
      historical). The prior 0/1819 exact-match no-op is the thing being fixed.
    gate_table:
      - gate: "Does math_verify re-baseline run clean over all 1819 items/arm, and how does per-role math accuracy move vs the prior era baseline?"
        evidence: "per-arm math_verify accuracy on GSM8K(1319)+MATH-500(500), dataset_sha256 + test_profile per arm, production temp+seed=42, protocol eval-tower.math-rebaseline.v1"
        fork:
          pass:
