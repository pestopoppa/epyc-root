# =============================================================================
# Wave-3 M2 — eval-tower inference-batch entries (phase 2 = eval-tower standalone).
#
# AUTHORED (not executed). The operator's /loop consumes these via
# scripts/coordination/compile_inference_batch.py + the B2 run_batch_entry.py bridge.
# One entry per task; small-model verifier windows kept sequential to minimize
# reloads. Every entry carries the 5-fork gate_table (pass/marginal/fail/infra/
# ambiguous) copied from 00-example.yaml.
#
# Trust boundary: ALL numbers produced here are pre-P-REV-1 OBSERVATIONS
# (MEASUREMENT.md) except the two that explicitly promote a baseline
# (EV-4 calibration baseline, EV-11 math re-baseline) — those supersede via
# era-label append, NEVER by editing historical records.
#
# Validate (do NOT run here):
#   /mnt/raid0/llm/epyc-orchestrator/.venv/bin/python \
#     scripts/coordination/compile_inference_batch.py validate
# =============================================================================

# ---------------------------------------------------------------------------
# EV-4 — Calibration baseline (foundational; comparison point for EV-5/EV-7)
# ---------------------------------------------------------------------------
- schema_version: inference_batch.entry.v1
  task_id: EV-4-calibration-baseline
  title: "EV-4 — Eval-tower calibration baseline on Scoring Verifiers HE-R+ (ECE/AUC/Top-1/Bottom-1/rho/MAE)"
  notes: >
    First real inference pass of the redesigned eval tower. Establishes the
    calibration baseline that every subsequent verification improvement compares
    against. Unblocks EV-5 (T2 uncertain-question selection) and EV-7 (Ouro T0).
  provenance:
    owning_handoff: handoffs/active/eval-tower-verification.md
    checkbox: "EV-4"
    source_ref: "handoffs/active/eval-tower-verification.md#EV-4 (needs inference)"
    coordination_note: >
      EV-1/2/3/6 are code-complete; the only remaining EV-4 work is inference.
      Confidence may still be a binary proxy (float(correct)) until llama-server
      logprob passthrough lands — if so ECE is trivially ~0 and the baseline is
      provisional (marginal fork). AA-Omniscience can supply ground-truth
      calibration data alongside HE-R+.
  phase: 2
  priority: P1
  preconditions:
    stack_lineup: "production default lineup (frontdoor + worker_general + architect_general)"
    kernel_era: production-consolidated-v6
    flag_attestation: env_only
    models:
      - frontdoor
      - worker_general
      - architect_general
    host_health:
      tier: quiet_window
      max_uptime_days: 7
      cache_state: warm
    topology:
      required_topology_hash: df373c79cc4af06f
      live_affinity_verified: true
      contention_matrix: not_required
    autopilot: stopped
    operator_gates:
      - OP-quiet-window
      - OP-eval-suite-routing
    depends_on: []
  execution:
    driver: command
    protocol_id: "eval-tower.calibration-baseline.v1"
    dry_run: false
    command: >
      # AMBIGUOUS (op-bundle): the tier-based eval_batch_serving_evaltower_window.py cannot express --suite scoring_verifiers --split HE-R+ --roles --record-metrics. Route via run_benchmark.py --suite scoring_verifiers (loses per-role/ECE/HE-R+ granularity) OR extend the window runner. Operator decides.
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: same_trial_eval_fanout
    fanout_transport: placement_queue
    contention_class: eval_fanout_full_core
    est_wall_clock_h: 3.0
    timeout_s: 18000
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED
  outcomes:
    expected: >
      A well-formed calibration baseline (ECE, AUROC, Top-1, Bottom-1, Spearman
      rho, MAE) per role on HE-R+ candidate-level items. Recorded as the standing
      comparison point (era-labelled), not a keep/revert gate on its own.
    gate_table:
      - gate: "Does the eval tower produce a complete, non-degenerate calibration baseline on HE-R+?"
        evidence: "6 metrics (ECE/AUROC/Top-1/Bottom-1/rho/MAE) per role, n=6701 candidate items, seed=42, protocol eval-tower.calibration-baseline.v1"
        fork:
          pass:
            rule: "all 6 metrics recorded per role AND confidence distribution non-degenerate (ECE meaningful, not trivially 0)"
            action:
              - "record as the eval-tower calibration baseline under a new instrument-era label (append; never edit historical)"
              - "flip EV-4 checkbox; unblock EV-5 and EV-7"
            next: DONE_PASS
          marginal:
            rule: "all metrics recorded but confidence is the binary float(correct) proxy (ECE ~ 0, uninformative)"
            action:
              - "record as PROVISIONAL baseline; log the logprob-passthrough gap as the blocker"
              - "keep EV-4 open pending logprob passthrough; do not treat ECE as calibrated"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "adapter/scoring failure yields no metric-bearing rows for one or more roles"
            action:
              - "quarantine run diagnostic_only; escalate scoring_verifiers_adapter / suite wiring"
            next: FAILED_REVERTED
          infra:
            classify: "server OOM / placement-queue starvation / sequential-load failure"
            action:
              - "re-run in a fresh quiet window after drop_caches + throttle-check"
          ambiguous:
            action:
              - "hold for operator adjudication; attach per-role raw metric rows across reps"
            next: HELD_AMBIGUOUS
  artifacts:
    outputs:
      - "orchestration/reports/eval_tower_calibration_baseline_HE-R+/"
    package_to: "coordination/inference-batch/bundles/EV-4/"
  ledger:
    journal_quarantine_rule: >
      record role, suite=scoring_verifiers, split=HE-R+, n, ECE, AUROC, Top-1,
      Bottom-1, Spearman, MAE, confidence_source (proxy|logprob), seed;
      quarantine diagnostic_only if any role has < full HE-R+ item coverage.
    era_stamp: "instrument-era-2026-06-12-post-measurement-constitution"

# ---------------------------------------------------------------------------
# EV-5 — ThinkPRM-1.5B T2 process verification (MODEL DOWNLOAD precondition)
# ---------------------------------------------------------------------------
- schema_version: inference_batch.entry.v1
  task_id: EV-5-thinkprm-t2-verifier
  title: "EV-5 — Deploy ThinkPRM-1.5B (Q4_K_M) for T2 step-level process verification on uncertain questions"
  notes: >
    Sequential model loading: complete standard T2 scoring -> unload generation
    models -> load ThinkPRM -> verify N most-uncertain questions -> unload.
    Cross-family enforcement (EV-6 check_cross_family) is a runtime guard.
  provenance:
    owning_handoff: handoffs/active/eval-tower-verification.md
    checkbox: "EV-5"
    source_ref: "handoffs/active/eval-tower-verification.md#EV-5 (needs model download)"
    coordination_note: >
      MODEL DOWNLOAD PRECONDITION: ThinkPRM-1.5B GGUF (Q4_K_M, ~2GB) may not have
      a public GGUF — Known Issue in the handoff notes conversion via
      llama.cpp/convert_hf_to_gguf.py may be required. That download/convert is an
      operator gate, NOT a manifest entry. Sequential loading is mandatory
      (feedback_sequential_model_loading).
  phase: 2
  priority: P2
  preconditions:
    stack_lineup: "production lineup + ThinkPRM-1.5B loaded sequentially at T2"
    kernel_era: production-consolidated-v6
    flag_attestation: env_only
    models:
      - thinkprm-1.5b-q4km
    host_health:
      tier: quiet_window
      max_uptime_days: 7
      cache_state: warm
    topology:
      live_affinity_verified: true
      contention_matrix: not_required
    autopilot: stopped
    operator_gates:
      - OP-quiet-window
      - MODEL-DOWNLOAD-thinkprm-1.5b-q4km-gguf
      - BUILD-evalbatch-verifier-mode
    depends_on:
      - EV-4-calibration-baseline
  execution:
    driver: command
    protocol_id: "eval-tower.thinkprm-t2.v1"
    dry_run: false
    command: >
      # BUILD-GATE: eval_batch_serving_evaltower_window.py is tier-based and has no --verifier/--diversity-baseline/--suite/--uncertain-topn. Cross-family verifier / diversity-baseline mode not wired to this CLI. Model download-gated.
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: paired_sequential
    fanout_transport: none
    contention_class: single_model_sequential
    est_wall_clock_h: 4.0
    timeout_s: 21600
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED
  outcomes:
    expected: >
      ThinkPRM-1.5B loads cross-family, produces step-level verdicts and
      P(yes)/(P(yes)+P(no)) scores on the N most-uncertain T2 questions, stored in
      QuestionResult.details. Observation-grade signal for PromptForge, not a gate.
    gate_table:
      - gate: "Does ThinkPRM-1.5B deploy and yield cross-family step-level process verification on the T2 uncertain subset?"
        evidence: "per-question step verdicts + P(yes) score on N=40 uncertain questions, cross-family check PASS, protocol eval-tower.thinkprm-t2.v1"
        fork:
          pass:
            rule: "ThinkPRM loads, check_cross_family PASS, step-level attribution produced for the full uncertain subset"
            action:
              - "record process-verification signal; flip EV-5 checkbox"
              - "note availability as an EV-7 T2 verifier candidate"
            next: DONE_PASS
          marginal:
            rule: "loads and runs but verification coverage is partial or signal weak/low-confidence"
            action:
              - "record observation; keep EV-5 open pending stronger coverage"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "GGUF unavailable / conversion fails / cross-family violation blocks the verifier"
            action:
              - "escalate download+convert (convert_hf_to_gguf.py) or pick an alternate cross-family PRM"
            next: FAILED_REVERTED
          infra:
            classify: "sequential-load OOM / verifier server crash / T2 budget overrun"
            action:
              - "re-run in a fresh quiet window; confirm main models unloaded before ThinkPRM load"
          ambiguous:
            action:
              - "hold for operator; attach step-verdict samples that failed reproducibility"
            next: HELD_AMBIGUOUS
  artifacts:
    outputs:
      - "orchestration/reports/eval_tower_thinkprm_t2/"
    package_to: "coordination/inference-batch/bundles/EV-5/"
  ledger:
    journal_quarantine_rule: >
      record verifier=thinkprm-1.5b-q4km, generator_family, cross_family_ok,
      n_uncertain, per-question step_verdicts + p_yes; quarantine diagnostic_only
      if cross_family_ok is false (EV-6 violation).
    era_stamp: "instrument-era-2026-06-12-post-measurement-constitution"

