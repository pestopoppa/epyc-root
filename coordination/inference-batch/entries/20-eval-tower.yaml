      # BUILD-GATE: eval_batch_serving_evaltower_window.py is tier-based and has no --verifier/--diversity-baseline/--suite/--uncertain-topn. Cross-family verifier / diversity-baseline mode not wired to this CLI. Model download-gated.
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: paired_sequential
    fanout_transport: none
    contention_class: single_model_sequential
    est_wall_clock_h: 3.0
    timeout_s: 18000
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED
  outcomes:
    expected: >
      Ouro-2.6B validates on MATH-500 within a usable band of the published 90.85%
      and is confirmed cross-family (non-Qwen/Llama) -> integrate as a T0 sentinel
      verification candidate. Observation-grade; does not by itself change routing.
    gate_table:
      - gate: "Does Ouro-2.6B validate as a cross-family T0 sentinel (MATH-500 performance + family distinctness)?"
        evidence: "MATH-500 accuracy on CPU, cross-family check PASS, seed=42, protocol eval-tower.ouro-t0-sentinel.v1"
        fork:
          pass:
            rule: "MATH-500 within a usable band of published (>= ~80%) AND cross-family confirmed"
