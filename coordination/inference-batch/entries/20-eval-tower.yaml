      debug_scorer._score_math_verify must drop the non-greedy manual
      \boxed{(.+?)} extraction (it truncates \boxed{\frac{1}{2}} -> \frac{1} ->
      parse-fail -> silent exact_match -> wrong) and pass the raw answer to native
      balanced-brace math_verify.parse(). EV-11a is a CODE prereq owned by
