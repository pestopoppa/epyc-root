            classify: "transformers-CPU load failure / OOM / serving timeout"
            action:
              - "re-run serially in a fresh quiet window; confirm no co-resident model"
          ambiguous:
            action:
              - "hold for operator; attach MATH-500 rep-to-rep variance"
