      recorded — inline _aggregate ECE (top bin open, c<hi) vs
      stat_tests.expected_calibration_error (top bin closed) differ 0.15-0.40 on
      binary-confidence math; CRITICAL path (feeds SafetyGate/journal) -> operator
      call, bundled with this re-baseline. math_verify is NOT symmetric and NOT
      thread-safe (signal.alarm) — gold first, external timeout.
