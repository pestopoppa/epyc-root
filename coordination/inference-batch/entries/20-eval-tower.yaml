      - MODEL-DOWNLOAD-ouro-2.6b-thinking
      - BUILD-evalbatch-verifier-mode
    depends_on:
      - EV-4-calibration-baseline
  execution:
    driver: command
    protocol_id: "eval-tower.ouro-t0-sentinel.v1"
    dry_run: false
