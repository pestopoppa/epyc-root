              - "flag A4 arm as diagnosis-limited to the operator"
            next: HELD_OP_GATE
          infra:
            classify: "GLM load / placement-queue / OOM"
            action:
              - "re-run in a fresh quiet window after drop_caches + throttle-check"
          ambiguous:
            action:
              - "hold for operator adjudication; attach rationale vs gold-cause pairs"
            next: HELD_AMBIGUOUS
  artifacts:
    outputs:
      - "data/reviewer_capability/gc3_why_diagnosis.jsonl"
    package_to: "coordination/inference-batch/bundles/P5-GC3/"
  ledger:
    journal_quarantine_rule: >
      record reviewer=GLM-5.2/UD-IQ2_M, corpus rev-nearmiss-v1@1c50c025, match_rate, n, seed;
      quarantine diagnostic_only if sample < planned n.
    era_stamp: "instrument-era-2026-06-12-post-measurement-constitution"

# --------------------------------------------------------------------------- P6
- schema_version: inference_batch.entry.v1
  task_id: P6-RC8-baseline-decision-grade
  title: "RC-8 — full-corpus decision-grade reviewer baseline (self-review / architect alias, shadow, corpus v1)"
  provenance:
    owning_handoff: handoffs/active/reviewer-calibration-accounting.md
    checkbox: "RC-8"
    coordination_note: >
      The instrument centerpiece: the first decision-grade FA/FR numbers on nearmiss-v1
      via the current self-review (architect alias) in shadow. Gated on OP-5a (P-REV-1
      signed, RC-6a) and OP-5b (LB-6 threshold picked, LB-6b) — until both land these
      numbers are observations, never decision-gating. Broken-grader guardrail: read
      transcripts before trusting a surprising flip (CORE-Bench 42->95% was grader repair).
      RC-1..RC-5 (ledger, gold pipeline, corpus v1, report, e-processes) are already
      landed 2026-07-17.
  phase: 6
  priority: P1
  preconditions:
    stack_lineup: "production default lineup + CPU architect alias in shadow reviewer role"
    kernel_era: production-consolidated-v6
    host_health:
      tier: quiet_window
      cache_state: any
    autopilot: stopped
    operator_gates:
      - OP-5a
      - OP-5b
    depends_on: []
  execution:
    driver: command
    protocol_id: "P-REV-1"
    dry_run: false
    command: >
      # DECISION-GRADE re-run of the corresponding observation-grade entry (RC-8/LB-7/RM-4) AFTER OP-5a signs P-REV-1. Same runner as the phase-1 entry; the difference is instrument-grade, not command.
    concurrency_mode: same_trial_eval_fanout
    fanout_transport: placement_queue
    contention_class: reviewer_shadow_eval_fanout
    est_wall_clock_h: 4.0
  outcomes:
    expected: >
      Decision-grade FA rate, FR rate, FA/FR ratio, yield, CR, Brier/ECE/AUC per
      (reviewer config x grading model x rubric version x corpus version x domain) on
      the full nearmiss-v1 corpus, in P-REV-1 claim grammar.
    gate_table:
      - gate: "What are the decision-grade FA/FR (and ratio/CR) of the status-quo self-review reviewer on corpus v1?"
        evidence: "reviewer_calibration_report.py full panel, N>=100, seed, P-REV-1 instrument (corpus rev-nearmiss-v1@1c50c025, gold source+version, grammar-flag, grader, rubric, mode=shadow)"
        fork:
          pass:
            rule: "no FA/FR e-process breach; transcripts confirm the numbers are real (not grader artifact)"
            action:
              - "flip RC-8; publish the baseline FA/FR in H0 milestone table (P-REV-1 grammar)"
              - "unblock LB-7 (M3 floor) and RM-4 (anchor A1) consumption"
            next: DONE_PASS
          marginal:
            rule: "numbers land but FA/FR ratio or CR near tolerance edges"
            action:
              - "record decision-grade baseline with caveats; keep reviewer default-shadow"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "FA or FR e-process breach on the status-quo config"
            action:
              - "auto-demote-to-shadow already holds; document overcorrection (FR>>FA) in handoff"
            next: FAILED_REVERTED
          infra:
            classify: "eval-fanout dispatch / placement-queue starvation / architect-alias server error"
            action:
              - "re-run in a fresh quiet window after drop_caches + throttle-check"
          ambiguous:
            action:
              - "hold for operator adjudication; attach near-miss transcripts (broken-grader guardrail)"
            next: HELD_AMBIGUOUS
  artifacts:
    outputs:
      - "data/reviewer_calibration/rc8_baseline_self_review.jsonl"
    package_to: "coordination/inference-batch/bundles/P6-RC8/"
  ledger:
    journal_quarantine_rule: >
      record reviewer config, grader, rubric version, corpus rev+hash, mode, n, FA, FR,
      FA/FR ratio, yield, CR, Brier/ECE/AUC, seed; quarantine diagnostic_only if any
      arm has < N=100 or transcripts unread on a surprising flip.
    era_stamp: "instrument-era-2026-06-12-post-measurement-constitution"

- schema_version: inference_batch.entry.v1
  task_id: P6-LB7-single-model-floor
  title: "LB-7 — M3 baseline-floor measurement (full reviewer plane vs single-augmented-LLM on the same tasks)"
  provenance:
    owning_handoff: handoffs/active/reviewer-latency-and-sampling-budget.md
    checkbox: "LB-7"
    coordination_note: >
      The go/no-go the whole series answers to: the plane (shadow->enforce candidate)
      must BEAT a single augmented LLM on the same tasks (A0/A1 arms). Needs the H4
      instrument (RC-8) and the H5 anchor arms. Throughput axis under P-SPEED-OBJ
      (task_rate, e-process, never single-trial); parallel-reviewer wall-clock models as
      SUM not MAX on this host. Gated OP-5a (P-REV-1) + OP-5b (LB-6 threshold, LB-6b).
  phase: 6
  priority: P1
  preconditions:
    stack_lineup: "production default lineup + CPU architect alias reviewer (A1) + gates-only (A0)"
    kernel_era: production-consolidated-v6
    host_health:
      tier: quiet_window
      cache_state: any
    autopilot: stopped
    operator_gates:
      - OP-5a
      - OP-5b
    depends_on:
      - P6-RC8-baseline-decision-grade
  execution:
    driver: command
    protocol_id: "P-AB-1 + P-SPEED-OBJ"
    dry_run: false
    command: >
      # DECISION-GRADE re-run of the corresponding observation-grade entry (RC-8/LB-7/RM-4) AFTER OP-5a signs P-REV-1. Same runner as the phase-1 entry; the difference is instrument-grade, not command.
    concurrency_mode: paired_sequential
    fanout_transport: placement_queue
    contention_class: reviewer_plane_vs_single_llm_paired
    est_wall_clock_h: 6.0
  outcomes:
    expected: >
      Paired plane-arm vs single-augmented-LLM-baseline-arm on the same task set/seeds:
      dP(success) [pp] and % throughput reduction, feeding G = dP(success) / (% throughput
      reduction). The standing floor is net dP(success) > 0 at acceptable cost.
    gate_table:
      - gate: "Does the full reviewer plane beat a single augmented LLM on the same tasks (net quality, acceptable cost)?"
        evidence: "paired dP(success) [pp] + task_rate reduction under P-AB-1/P-SPEED-OBJ, N>=100/arm, e-process; G vs OP-5b threshold"
        fork:
          pass:
            rule: "net dP(success) > 0 AND G >= the operator-picked LB-6 threshold (OP-5b)"
            action:
              - "flip LB-7; publish standing numbers to H0; the plane clears its M3 floor"
            next: DONE_PASS
          marginal:
            rule: "net dP(success) > 0 but G below threshold (earns quality but not its cost)"
            action:
              - "keep enforce-mode blocked; recommend LB-3 sampling / GPU relief valves"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "net dP(success) <= 0 (plane adds cost without quality)"
            action:
              - "the plane fails its go/no-go floor; recommend deletion/redesign per Fable5 posture"
            next: FAILED_REVERTED
          infra:
            classify: "paired-replay dispatch / placement-queue / server error"
            action:
              - "re-run strictly sequential in a fresh quiet window (SUM-not-MAX; quiesced host)"
          ambiguous:
            action:
              - "hold for operator adjudication; attach both arms' raw task-rate + success rows"
            next: HELD_AMBIGUOUS
  artifacts:
    outputs:
      - "data/reviewer_budget/lb7_plane_vs_single_llm.jsonl"
    package_to: "coordination/inference-batch/bundles/P6-LB7/"
  ledger:
    journal_quarantine_rule: >
      record arm (plane|single-LLM), task set, seeds, P(success), task_rate, dP,
      % throughput reduction, G, n; quarantine diagnostic_only if run non-sequentially or
      any arm < N=100.
    era_stamp: "instrument-era-2026-06-12-post-measurement-constitution"

- schema_version: inference_batch.entry.v1
  task_id: P6-RM4-confirmation-tier
  title: "RM-4 — confirmation-tier reviewer tournament (N>=100 paired, Holm; arms A0/A1/A4/Ref)"
  provenance:
    owning_handoff: handoffs/active/reviewer-model-ablations.md
    checkbox: "RM-4"
    coordination_note: >
      Fully-paired confirmation tier for the Pareto-promising pairings ONLY — it CONSUMES
      the P2 screening winners from RM-3 (screening tier, sibling-authored P2 entries;
      exact task_ids owned by the pool-gen/screening agent — see FLAG). Arms covered here
      (CPU-runnable given gates): A0 gates-only (objective-verifier floor), A1 self-review
      (status-quo alias = the RC-8 baseline config), A4 GLM-5.2-IQ2 CPU (requires
      P5 GC-1..3), Ref external judge-of-judge (operator budget-approved, pinned
      model-id+date). The A3 122B-IQ2-GPU arm is a SEPARATE entry
      (P6-RM2-A3-arm-122b-iq2-gpu) because it is GPU-bet-#2-gated. Family-preference is
      measured as a covariate, not assumed. Gated OP-5a + OP-5b.
  phase: 6
  priority: P2
  preconditions:
    stack_lineup: "confirmation-tier reviewer arms A0/A1/A4/Ref over corpus v1 near-miss + ambiguous rows"
    kernel_era: production-consolidated-v6
    models:
      - "GLM-5.2-UD-IQ2_M"
    host_health:
      tier: quiet_window
      cache_state: any
    autopilot: stopped
    operator_gates:
      - OP-5a
      - OP-5b
    depends_on:
      - P5-GC3-why-diagnosis
      - P6-RC8-baseline-decision-grade
  execution:
    driver: command
    protocol_id: "P-REV-1"
    dry_run: false
    command: >
      # DECISION-GRADE re-run of the corresponding observation-grade entry (RC-8/LB-7/RM-4) AFTER OP-5a signs P-REV-1. Same runner as the phase-1 entry; the difference is instrument-grade, not command.
    concurrency_mode: paired_sequential
    fanout_transport: placement_queue
    contention_class: reviewer_confirmation_paired
    est_wall_clock_h: 10.0
  outcomes:
    expected: >
      Fully-paired (same tasks/prompts/grammar/stop/verifier budget), N>=100/arm, paired
      flips via sequential_verdict.quality_trial_statistic, Holm across metric families,
      per-domain reporting for arms A0/A1/A4/Ref. Bias-robustness (RM-5) and field-order
      (RM-6) fold into this protocol.
    gate_table:
      - gate: "Which (architect, reviewer, grader) arm maximizes calibrated review value per token at confirmation grade?"
        evidence: "paired FA/FR/ratio/CR per arm, N>=100/arm, Holm-corrected across families, per-domain, P-REV-1 grammar"
        fork:
          pass:
            rule: "a non-anchor arm (e.g. A4) Pareto-dominates A0/A1 on calibrated value with no FA/FR breach"
            action:
              - "flip RM-4; promote the winning pairing(s) to RM-8 registry annotation"
            next: P6-RM8-registry-annotation
          marginal:
            rule: "arms tie within CIs or win is domain-local only"
            action:
              - "record per-domain leaderboard; keep status-quo A1 as default reviewer"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "no arm beats A0 gates-only (objective-verifier floor) at acceptable cost"
            action:
              - "document that the model-reviewer layer does not clear the gates-only floor"
            next: FAILED_REVERTED
          infra:
            classify: "confirmation-fanout dispatch / GLM load / placement-queue / budget-arm API error"
            action:
              - "re-run affected arm strictly sequential in a fresh quiet window"
          ambiguous:
            action:
              - "hold for operator adjudication; attach per-arm paired rows + covariate table"
            next: HELD_AMBIGUOUS
  artifacts:
    outputs:
      - "data/reviewer_ablations/rm4_confirmation_a0_a1_a4_ref.jsonl"
    package_to: "coordination/inference-batch/bundles/P6-RM4/"
  ledger:
    journal_quarantine_rule: >
      record arm, reviewer/grader/rubric/corpus tuple, per-domain FA/FR/ratio/CR, Holm
      family, n, seed, family_match covariate; quarantine diagnostic_only if any arm < N=100
      or screening-winner provenance missing.
    era_stamp: "instrument-era-2026-06-12-post-measurement-constitution"

- schema_version: inference_batch.entry.v1
  task_id: P6-RM2-A3-arm-122b-iq2-gpu
  title: "RM-2 A3 arm — 122B-IQ2 GPU-resident heavyweight reviewer (GPU bet #2 gated)"
  provenance:
    owning_handoff: handoffs/active/reviewer-model-ablations.md
    checkbox: "RM-2"
    coordination_note: >
      The A3 same-family GPU heavyweight arm (122B UD-IQ2_M resident, 43.7 t/s, grammar
      mandatory). GATED BEHIND GPU BET #2 — it needs the single-card residency lane and is
      NOT startable until the operator sequences the GPU (bet #2 = AXA-1 fast-architect
      residency in mi210-big-model-and-acceleration-roadmap.md; see COORD-axa-teleport in
      90-coordination-rows.yaml). depends_on COORD-axa-teleport keeps this structurally
      BLOCKED_PRECONDITION until the parallel GPU session releases the lane. IQ2 strict-IF
      is weak (2/11) -> GBNF grammar mandatory (K22 grammar-crash fix is landed). Also
      serves the control-plane interim reviewer once residency is granted.
  phase: 6
  priority: P3
  preconditions:
    stack_lineup: "MI210 122B-IQ2_M GPU-resident reviewer arm (single-card residency lane, GBNF on)"
    kernel_era: "experimental-v7-candidate (HIP build-hip)"
    models:
      - "Qwen3.5-122B-UD-IQ2_M"
    host_health:
      tier: quiet_window
      cache_state: any
    autopilot: stopped
    operator_gates:
      - OP-5a
      - OP-5b
      - BUILD-mechanism-a-ledger-producer
    depends_on:
      - P6-RC8-baseline-decision-grade
      - COORD-axa-teleport
  execution:
    driver: command
    protocol_id: "P-REV-1"
    dry_run: false
    command: >
      # BUILD-GATE: 122B-IQ2 GPU reviewer arm — needs GPU residency lane (COORD-axa-teleport / GPU-bet-2) + the Mechanism-A ledger producer. NO stack change until parallel-session feature tests complete.
    concurrency_mode: paired_sequential
    fanout_transport: placement_queue
    contention_class: reviewer_gpu_resident_single_card
    est_wall_clock_h: 6.0
  outcomes:
    expected: >
      Confirmation-grade paired FA/FR/CR for the A3 122B-IQ2 GPU-resident reviewer arm
      (GBNF mandatory), folded into the RM-4 tournament once the GPU residency lane is
      granted. Cost reported alongside quality (single-card contention).
    gate_table:
      - gate: "Does the 122B-IQ2 GPU-resident reviewer (GBNF on) beat the CPU anchors at confirmation grade, given single-card cost?"
        evidence: "paired FA/FR/ratio/CR vs A0/A1/A4, N>=100/arm, P-REV-1 grammar; strict-IF emission rate with GBNF"
        fork:
          pass:
            rule: "A3 Pareto-competitive with no FA/FR breach AND strict-IF emission acceptable under GBNF"
            action:
              - "fold A3 result into RM-4; record GPU-resident reviewer cost/quality in registry (RM-8)"
            next: P6-RM8-registry-annotation
          marginal:
            rule: "quality competitive but single-card cost not justified vs A4 CPU"
            action:
