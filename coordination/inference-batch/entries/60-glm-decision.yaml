# =============================================================================
# Wave-3 M4 — GLM reviewer-capability window (P5) + decision-grade confirmations (P6)
#
# AUTHORED, not executed. The operator's /loop consumes these later; NO inference
# is run here. Validated by scripts/coordination/compile_inference_batch.py
# (Draft-07 schema + owning_handoff/checkbox/>=1-gate-row lint).
#
# P5 (phase 5) — GLM-5.2 reviewer capability probes (GC-1..3), sequential, gated on
#   the parallel GLM session's admission/load checkpoints (COORD-glm52-admission in
#   90-coordination-rows.yaml). Runs at SMOKE / observation grade PRE-OP-5a.
# P6 (phase 6) — decision-grade confirmations. operator_gates [OP-5a, OP-5b]
#   (OP-5a = P-REV-1 signed = reviewer-calibration-accounting.md RC-6a;
#    OP-5b = LB-6 threshold picked = reviewer-latency-and-sampling-budget.md LB-6b).
#
# Dependency chain: COORD-glm52-admission -> GC-1 -> GC-2 -> GC-3 -> RM-4;
#   RC-8 -> {LB-7, RM-4, A3, RELABEL}; RM-4 -> RM-8. All P6 rows hold on OP-5a/OP-5b.
# =============================================================================

# --------------------------------------------------------------------------- P5
- schema_version: inference_batch.entry.v1
  task_id: P5-GC1-strict-if-typed-emission
  title: "GC-1 — GLM-5.2 strict-IF / typed review_decision emission probe (GBNF-constrained vs free-parse-with-retry, K-of-M gate)"
  provenance:
    owning_handoff: handoffs/active/glm52-reviewer-capability-gates.md
    checkbox: "GC-1"
    source_ref: "handoffs/active/reviewer-control-plane-index.md"
    coordination_note: >
      CONSUMES the parallel GLM session's checkpoints — GLM-5.2 UD-IQ2_M download +
      integrity and glm-dsa load/coherence smoke are owned by
      glm51-reap-cpu-evaluation.md (see COORD-glm52-admission in
      90-coordination-rows.yaml) and are NOT re-run here. This entry only adds the
      reviewer-specific typed-emission capability probe on top of "loads and is
      coherent". CPU path first (v7 GPU grammar path K22 is closed but the GPU lane
      stays behind GPU bet #2). Motivation: 122B-IQ2 scored 2/11 strict-IF, so quant
      may degrade format compliance; GBNF constraint is the expected mitigation.
  phase: 5
  priority: P2
  preconditions:
    kernel_era: "experimental-v7-candidate-glm-dsa-3dee86a5a"
    models:
      - "GLM-5.2-UD-IQ2_M"
    host_health:
      tier: quiet_window
      cache_state: any
    autopilot: stopped
    operator_gates: []
    depends_on:
      - COORD-glm52-admission
  execution:
    driver: command
    protocol_id: "eval-tower.reviewer-capability.smoke (observation-grade pre-P-REV-1)"
    dry_run: false
    command: >
      cd /mnt/raid0/llm/epyc-orchestrator &&
      AUTOPILOT_GLM_REVIEWER_CAPABILITY_INFERENCE=1
      .venv/bin/python scripts/autopilot/glm_reviewer_capability_probe.py --probe strict_if --execute
    concurrency_mode: same_trial_eval_fanout
    fanout_transport: placement_queue
    contention_class: reviewer_capability_probe_single_model
    est_wall_clock_h: 3.0
  outcomes:
    expected: >
      Schema-valid review_decision emission rate on a fixed probe set, GBNF-constrained
      vs free-parse-with-retry, reported as a K-of-M pass rate. SMOKE / observation
      grade: numbers are hypotheses until re-run decision-grade under P-REV-1 (OP-5a,
      P6-RELABEL). Do NOT gate A4 arm design on this alone.
    gate_table:
      - gate: "Does GLM-5.2 emit schema-valid typed review_decisions at an acceptable rate (GBNF vs free-parse)?"
        evidence: "K-of-M schema-valid emission rate, GBNF-constrained vs free-parse-with-retry, on the fixed probe set (observation-grade, pre-P-REV-1)"
        fork:
          pass:
            rule: "GBNF-constrained emission clears the K-of-M floor with no repetition-loop failure"
            action:
              - "record observation (metric, protocol, n, date) in glm52-reviewer-capability-gates.md + registry GC-5"
              - "proceed to GC-2; queue decision-grade re-run behind OP-5a (P6-RELABEL)"
            next: P5-GC2-rubric-authoring-quality
          fail:
            rule: "emission rate below floor even with GBNF, or repetition-loop failure"
            action:
              - "flag A4 (GLM-5.2-IQ2 CPU) arm risk in reviewer-model-ablations.md RM-2"
              - "hold GC-2/GC-3; escalate to operator (grammar path / quant caveat)"
            next: HELD_OP_GATE
          infra:
            classify: "GLM load / placement-queue / OOM on the 239GB reviewer"
            action:
              - "re-run in a fresh quiet window after drop_caches + throttle-check; confirm glm-dsa binary (3dee86a5a)"
          ambiguous:
            action:
              - "hold for operator adjudication; attach raw emission transcripts"
            next: HELD_AMBIGUOUS
  artifacts:
    outputs:
      - "data/reviewer_capability/gc1_strict_if_typed_emission.jsonl"
    package_to: "coordination/inference-batch/bundles/P5-GC1/"
  ledger:
    journal_quarantine_rule: >
      record reviewer=GLM-5.2/UD-IQ2_M, gbnf=on|off, K, M, emission_rate, n, seed;
      quarantine diagnostic_only if the model failed to load or n < M.
    era_stamp: "instrument-era-2026-06-12-post-measurement-constitution"

