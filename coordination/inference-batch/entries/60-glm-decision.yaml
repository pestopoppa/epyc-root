    coordination_note: >
      IQ2 quant may degrade why-diagnosis more than that-detection (intake-836 —
      measure, do not assume). Depends on GC-2. Consumes the corpus-v1 near-miss sample
      built by reviewer-calibration-accounting.md RC-3 (nearmiss-v1). GLM admission owned
      by glm51-reap-cpu-evaluation.md (COORD-glm52-admission). This is the last P5 gate
      before the A4 arm can enter the P6 RM-4 confirmation tier.
  phase: 5
  priority: P2
  preconditions:
    kernel_era: "experimental-v7-candidate-glm-dsa-3dee86a5a"
    models:
      - "GLM-5.2-UD-IQ2_M"
    host_health:
      tier: quiet_window
      cache_state: any
    autopilot: stopped
    operator_gates: []
    depends_on:
      - P5-GC2-rubric-authoring-quality
  execution:
    driver: command
    protocol_id: "eval-tower.reviewer-capability.smoke (observation-grade pre-P-REV-1)"
    dry_run: false
    command: >
      cd /mnt/raid0/llm/epyc-orchestrator &&
      AUTOPILOT_GLM_REVIEWER_CAPABILITY_INFERENCE=1
      .venv/bin/python scripts/autopilot/glm_reviewer_capability_probe.py --probe why_diagnosis --execute
    concurrency_mode: same_trial_eval_fanout
    fanout_transport: placement_queue
    contention_class: reviewer_capability_probe_single_model
    est_wall_clock_h: 3.5
  outcomes:
    expected: >
      Rationale-vs-gold-cause match rate on a corpus-v1 (nearmiss-v1) sample. Captures
      the detect-THAT (95-100%) vs detect-WHY (52-75%) gap. SMOKE / observation grade
      until decision-grade re-run under P-REV-1 (OP-5a, P6-RELABEL).
    gate_table:
      - gate: "Does GLM-5.2 diagnose the correct failure CAUSE (not just detect THAT a defect exists)?"
        evidence: "rationale_vs_gold_cause match rate on the nearmiss-v1 sample (observation-grade)"
        fork:
          pass:
