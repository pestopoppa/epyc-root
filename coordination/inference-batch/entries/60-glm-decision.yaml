      so this is the capability that matters most for the A4 arm. Depends on GC-1
      (typed-emission must work before authoring is measurable). GLM admission/load is
      owned by glm51-reap-cpu-evaluation.md (COORD-glm52-admission) — consumed, not re-run.
  phase: 5
  priority: P2
  preconditions:
    kernel_era: "experimental-v7-candidate-glm-dsa-3dee86a5a"
    models:
