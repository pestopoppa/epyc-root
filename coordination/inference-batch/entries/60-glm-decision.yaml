      GPU lane was contended or n < 100.
    era_stamp: "instrument-era-2026-06-12-post-measurement-constitution"

- schema_version: inference_batch.entry.v1
  task_id: P6-RM8-registry-annotation
  title: "RM-8 — winners' calibration profiles into model_registry measured: fields (non-inference)"
  provenance:
    owning_handoff: handoffs/active/reviewer-model-ablations.md
    checkbox: "RM-8"
    also_flips:
      - "handoffs/active/glm52-reviewer-capability-gates.md#GC-5"
    coordination_note: >
      Non-inference ledger/registry write: the RM-4 (and A3, if granted) confirmation
      winners' calibration profiles (typed-emission rate, authoring score, why-diagnosis,
      FA/FR) into model_registry.yaml measured: fields per MEASUREMENT §5b, following
      new-model onboarding conventions. No claim leaves without P-REV-1 citation. Gated
      OP-5a/OP-5b so only decision-grade numbers are annotated.
  phase: 6
  priority: P2
  preconditions:
    kernel_era: production-consolidated-v6
    host_health:
      tier: any
      cache_state: any
    autopilot: any
    operator_gates:
      - OP-5a
      - OP-5b
    depends_on:
      - P6-RM4-confirmation-tier
  execution:
    driver: command
    protocol_id: "P-REV-1"
    dry_run: false
    command: >
      # Non-inference: writes reviewer-capability fields (GC-5) to the model registry after the decision-grade P6 results land. Registry is human-amendment-only (MEASUREMENT.md) — loop proposes, operator writes. Depends on P6-RC8/LB7/RM4.
    concurrency_mode: serial_noninference
    est_wall_clock_h: 0.5
  outcomes:
    expected: >
      model_registry.yaml (research, full) measured: fields updated for the confirmation
      winners in P-REV-1 grammar; H0 milestone table + GC-5 registry fields synced.
    gate_table:
      - gate: "Are the confirmation-winner calibration profiles recorded in the registry in P-REV-1 grammar?"
        evidence: "registry diff adding measured: FA/FR/ratio/CR/typed-emission/authoring/why-diagnosis with P-REV-1 citation"
        fork:
          pass:
            rule: "registry rows written with full P-REV-1 instrument citation; no bare numbers"
            action:
              - "flip RM-8 + GC-5; sync H0 milestone table"
            next: DONE_PASS
          fail:
            rule: "a number would land without instrument citation"
            action:
              - "block the write; return to RM-4 for the missing instrument fields"
            next: BLOCKED_PRECONDITION
          infra:
            classify: "registry-write failure / lock contention / schema-validation error on the annotation write"
            action:
              - "retry the registry annotation once; if it fails, HELD_OP_GATE (registry is human-amendment-only per MEASUREMENT.md) + op-bundle row"
          ambiguous:
            action:
              - "hold for operator; registry writes are on the measurement trust boundary"
            next: HELD_OP_GATE
  artifacts:
    outputs:
      - "epyc-inference-research/orchestration/model_registry.yaml"
    package_to: "coordination/inference-batch/bundles/P6-RM8/"
  ledger:
    journal_quarantine_rule: >
      record which model/quant rows were annotated with which measured: keys + P-REV-1
      instrument version; this is a registry write, not an inference run.
    era_stamp: "instrument-era-2026-06-12-post-measurement-constitution"

- schema_version: inference_batch.entry.v1
  task_id: P6-RELABEL-p1p2-decision-grade
  title: "Re-label — convert P1/P2 observation-grade reviewer runs to decision-grade post-P-REV-1 (non-inference)"
  provenance:
    owning_handoff: handoffs/active/reviewer-calibration-accounting.md
    checkbox: "RC-9"
    coordination_note: >
      Non-inference era operation: once P-REV-1 is signed (OP-5a / RC-6a merged into
      MEASUREMENT.md), append an instrument_eras.yaml era row (scope: reviewer_plane) and
      re-stamp the earlier PHASE-1/PHASE-2 observation-grade reviewer ledger rows
      (RM-3 screening tier + the P5 GC smoke rows + any pre-sign-off RC-8 observation) as
      decision-grade under the frozen corpus-v1 + gold-pipeline instrument. NEVER edit
      historical numbers in place — append eras only (MEASUREMENT §5). FLAG: the exact
      P1/P2 run task_ids are owned by the sibling screening/pool-gen agent (entries in the
      10-40 range) — this entry references them by phase, not by hard depends_on, to avoid
      cross-owner coupling; the operator resolves the concrete row set at re-stamp time.
  phase: 6
  priority: P2
  preconditions:
    kernel_era: production-consolidated-v6
    host_health:
      tier: any
      cache_state: any
    autopilot: any
    operator_gates:
      - OP-5a
    depends_on:
      - P6-RC8-baseline-decision-grade
  execution:
    driver: command
    protocol_id: "P-REV-1"
    dry_run: false
    command: >
      # Non-inference: re-labels P1/P2 observation-grade numbers as decision-grade in instrument_eras.yaml AFTER OP-5a signs P-REV-1. Era registry human-amendment-only — loop proposes the era append, operator commits.
    concurrency_mode: serial_noninference
    est_wall_clock_h: 0.5
  outcomes:
    expected: >
      instrument_eras.yaml gains the reviewer_plane era row on corpus-v1 + gold freeze;
      P1/P2 observation-grade reviewer rows are era-labeled decision-grade (append, never
      rescale-in-place). Enables downstream claims to gate keep/promote decisions.
    gate_table:
      - gate: "Is P-REV-1 merged so the P1/P2 observation runs can be era-stamped decision-grade?"
        evidence: "MEASUREMENT.md contains merged P-REV-1 blocks (RC-6a) + instrument_eras.yaml reviewer_plane era row"
        fork:
          pass:
            rule: "P-REV-1 merged AND corpus-v1/gold-pipeline frozen"
            action:
              - "append instrument_eras.yaml reviewer_plane era row; era-label the P1/P2 reviewer rows decision-grade"
              - "flip RC-9; note the retro-certification in H0"
            next: DONE_PASS
          fail:
            rule: "P-REV-1 not yet merged (RC-6a open)"
            action:
              - "hold; keep all P1/P2 reviewer numbers as observations (never decision-gating)"
            next: HELD_OP_GATE
          infra:
            classify: "era-registry write failure / instrument_eras.yaml lock / attestation-ref resolution error"
            action:
              - "retry once; else HELD_OP_GATE (era registry is human-amendment-only) + op-bundle row"
          ambiguous:
            action:
              - "hold for operator; era stamping is on the measurement trust boundary (human-amendment-only)"
            next: HELD_OP_GATE
  artifacts:
    outputs:
      - "epyc-orchestrator/orchestration/instrument_eras.yaml"
    package_to: "coordination/inference-batch/bundles/P6-RELABEL/"
  ledger:
    journal_quarantine_rule: >
      record which prior ledger rows were era-relabeled and the era id; this is an
      append-only era operation, not an inference run and not an edit of historical numbers.
    era_stamp: "instrument-era-2026-06-12-post-measurement-constitution"
