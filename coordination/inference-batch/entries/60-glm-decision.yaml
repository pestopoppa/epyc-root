            next: DONE_MARGINAL_OBS
          fail:
            rule: "IQ2 strict-IF still fails under GBNF, or A3 no better than CPU anchors"
            action:
              - "document IQ2 GPU-reviewer limitation; defer A3; keep A4/A1"
            next: FAILED_REVERTED
          infra:
            classify: "GPU residency contention / HIP grammar path / single-card admission"
            action:
              - "re-queue behind the parallel session's GPU admission smoke; do not preempt the card"
          ambiguous:
            action:
