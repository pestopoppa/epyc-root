# =============================================================================
# Wave-3 M3 — P4 KERNEL-OP2 inference-batch entries (phase 4).
#
# Kernel-era-SENSITIVE bench items. Every entry carries kernel_era +
# era_stamp (E5-cpu-kernel, the 2026-06-26 v6+iqk cutover boundary). Benches run
# via the canonical recipes on the experimental (v7-candidate) binary where the
# feature is new; v6 production kernels are FROZEN and never modified in place.
#
# V7-PROMOTION FORK (MEASUREMENT.md 5a): if the parallel kernel session promotes a
# v7 kernel mid-batch, the E5-cpu-kernel era boundary advances. Any row measured
# pre-v7 is demote-to-prior for a v7-stack decision — the ledger era_stamp is what
# decides comparability. Do NOT rescale across the boundary; re-measure within era.
#
# Authored (not executed) for compile_inference_batch.py; each entry copies the
# 00-example.yaml 5-fork gate_table shape. NO inference is run here.
# =============================================================================

# -----------------------------------------------------------------------------
# frontdoor Q8_0 barrier-fusion A/B (est +10-15% CPU decode)
# -----------------------------------------------------------------------------
- schema_version: inference_batch.entry.v1
  task_id: KOP2-frontdoor-q8-fusion-ab
  title: "frontdoor Q8_0 operator/graph barrier-fusion A/B (fusion flag on/off, tg128)"
  provenance:
    owning_handoff: handoffs/active/cpu-shape-specialized-gemv-decode.md
    checkbox: "frontdoor Q8_0 operator/graph fusion to cut barrier COUNT"
    also_flips:
      - "handoffs/active/batched-decode-measurement.md#E3 — 8x8 GEMM SIMD body"
    source_ref: "handoffs/active/fable5-window2-findings-05-intake-sweep-and-roofline.md (kernel ROI ranking; frontdoor Q8_0 fusion lever L52/L76/L82)"
    coordination_note: >
      #2 cross-substrate kernel ROI per findings-05: frontdoor Q8_0 decode is barrier/op-count-bound
      (13.8% of 460 GB/s; 45% of Q4_K decode cycles are libomp barrier at 96t; 0.17 IPC, 96.6%
      backend-stalled). Fuse expert gate+up and the attn QKV cluster to cut barrier COUNT (est
      +10-15% decode; one cluster already measured +2.6%). Cheapest test: llama-bench tg128 frontdoor
      Q8_0, fusion flag on/off, same window. EXPERIMENTAL-KERNEL DISCIPLINE: the fusion arm is a fresh
      llama.cpp-experimental build off the current production tip (NOT a v6 in-place edit); bench must
      come from the experimental (v7-candidate) binary, and validate no regression vs v6 before any
      promotion. This is the fusion path, NOT more SIMD.
  phase: 4
  priority: P2
  preconditions:
    stack_lineup: "single-instance llama-bench, frontdoor Qwen3.6-27B Q8_0; experimental fusion build vs v6 baseline"
    kernel_era: production-consolidated-v9
    flags_required:
      GGML_IQK: 1
    flag_attestation: env_only
    models:
      - frontdoor
    host_health:
      tier: quiet_window
      max_uptime_days: 7
      cache_state: drop_caches
    topology:
      required_topology_hash: 171f86f9188211e9
      live_affinity_verified: true
      contention_matrix: not_required
    autopilot: stopped
    operator_gates:
      - OP-EXPERIMENTAL-KERNEL-BENCH
    depends_on: []
  execution:
    driver: clean_window_entry
    protocol_id: "P-BENCH-3 via bench_canonical.sh (tg128 decode, fusion on/off, paired)"
    dry_run: false
    command: >
      scripts/benchmark/bench_canonical.sh -m <frontdoor Q8_0 experimental-fusion gguf> -n 128 --dry-run &&
      scripts/benchmark/bench_canonical.sh -m <frontdoor Q8_0 v6 gguf> -n 128
    cwd: /mnt/raid0/llm/epyc-inference-research
    concurrency_mode: paired_sequential
    fanout_transport: none
    contention_class: single_instance_bench
    est_wall_clock_h: 2.0
    timeout_s: 14400
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED
  outcomes:
    expected: >
      Barrier-fusion arm cuts barrier count and lifts frontdoor Q8_0 tg128 decode by the projected
      +10-15%, PPL-preserved, with no regression vs the v6 baseline kernel.
    gate_table:
      - gate: "Does frontdoor Q8_0 barrier-fusion lift tg128 decode without a correctness regression vs v6?"
        evidence: "tg128 t/s delta (fusion on/off), PPL delta on WikiText-2, P-BENCH-3, host attest, era E5-cpu-kernel"
        fork:
          pass:
            rule: "decode delta >= +10% with PPL Delta < 0.01 and no v6-baseline regression"
            action:
              - "flip the barrier-fusion checkbox; advance the experimental build toward v7-candidate validation"
            next: DONE_PASS
          marginal:
            rule: "decode delta in [+2%, +10%) with PPL preserved"
            action:
              - "record observation with (metric, protocol, n, date, attest); keep fusion behind a build flag"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "no decode gain OR PPL regression OR regression vs v6 baseline"
            action:
              - "do not promote; keep v6 production frozen; document in cpu-shape handoff"
            next: FAILED_REVERTED
          infra:
            classify: "experimental build missing GGML_IQK / llama-bench -fa default drift / non-quiet host"
            action:
              - "rebuild experimental off fresh production tip (confirm iqk present); re-run tg128 paired A/B"
          ambiguous:
            action:
              - "hold for operator; attach fusion on/off t/s + PPL + barrier-count profile"
            next: HELD_AMBIGUOUS
  artifacts:
    outputs:
      - "data/kernel_op2/frontdoor_q8_fusion_ab_tg128.json"
    package_to: "coordination/inference-batch/bundles/KOP2-frontdoor-q8-fusion-ab/"
  ledger:
    journal_quarantine_rule: >
      record arm (fusion on/off), tg128 t/s, PPL delta, barrier count, experimental build sha, host attest;
      quarantine diagnostic_only if benched on a build lacking our own GPU/CPU opts or if a v7 promotion
      advanced the era boundary mid-run (re-stamp + re-measure within the new era).
    era_stamp: "E5-cpu-kernel"

# -----------------------------------------------------------------------------
# v6-iqk canonical verification (the standing OP-2 item; can ride the P0 RCP window)
# -----------------------------------------------------------------------------
- schema_version: inference_batch.entry.v1
  task_id: KOP2-v6iqk-canonical-verify
  title: "v6+iqk canonical verification — clean post-reboot throughput bench (standing OP-2)"
  provenance:
    owning_handoff: handoffs/active/v6-iqk-promotion.md
    checkbox: "clean post-reboot throughput bench remains a separate formal gate"
    also_flips:
      - "handoffs/active/v6-iqk-promotion.md#M"
    source_ref: "handoffs/active/v6-iqk-promotion.md#checkbox-J (clean post-reboot throughput bench = separate formal gate, L52)"
    coordination_note: >
      The standing OP-2 item. v6+iqk cutover COMPLETE (autonomous bar met 2026-06-26); eval-parity has
      N=206 matched full-port IQK-on/off evidence (accuracy unchanged, +38.5% avg t/s). STILL PENDING:
      the clean post-reboot throughput bench (pre-reboot numbers are throttle-caveated) + any operator
      production-policy decision that depends on it. Reboot is OPERATOR-ONLY (feedback_operator_owns_
      host_reboots) — not an autonomous step. This entry can also ride the P0 RCP window (the shadow-mode
      OP-6-gated window) since both need a clean quiet post-reboot host. Do not archive v6-iqk-promotion
      until this clean bench/policy tail resolves.
  phase: 4
  priority: P1
  preconditions:
    stack_lineup: "canonical v6 stack (all hot roles on the v6 binary, GGML_IQK=1); post-reboot host"
    kernel_era: production-consolidated-v9
    flags_required:
      GGML_IQK: 1
    flag_attestation: all_workers
    models:
      - frontdoor
      - worker_general
      - architect_general
    host_health:
      tier: quiet_window
      max_uptime_days: 1
      cache_state: drop_caches
    topology:
      required_topology_hash: 171f86f9188211e9
      live_affinity_verified: true
      contention_matrix: not_required
    autopilot: stopped
    operator_gates:
      - OP-POST-REBOOT
    depends_on: []
  execution:
    driver: clean_window_entry
    protocol_id: "P-BENCH-3 via canonical_recipe.py V6_IQK (clean post-reboot per-role throughput)"
    dry_run: false
    command: >
      scripts/benchmark/bench_canonical.sh -m <architect_general role gguf> -n 128 &&
      scripts/benchmark/bench_canonical.sh -m <frontdoor role gguf> -n 128 &&
      scripts/benchmark/bench_canonical.sh -m <worker_general role gguf> -n 128
    cwd: /mnt/raid0/llm/epyc-inference-research
    concurrency_mode: isolated_bench
    fanout_transport: none
    contention_class: single_instance_bench
    est_wall_clock_h: 2.5
    timeout_s: 16200
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED
  outcomes:
    expected: >
      Clean post-reboot per-role throughput for the v6+iqk canonical stack, throttle-free and host-
      attested, closing the last formal v6-iqk promotion gate and enabling the operator policy decision.
    gate_table:
      - gate: "Does the clean post-reboot v6+iqk canonical bench meet the expected per-role throughput with no garble?"
        evidence: "per-role decode t/s (throttle-free, drop_caches, post-reboot attest) + garbage-check + [iqk] ACTIVE, P-BENCH-3"
        fork:
          pass:
            rule: "all hot roles within expected throughput band, no garble, GGML_IQK attested everywhere"
            action:
              - "flip the clean-post-reboot-bench gate + Phase M close-out; hand the packet to operator for the policy decision"
            next: DONE_PASS
          marginal:
            rule: "throughput within band but one role throttle-caveated / borderline"
            action:
              - "record the caveated numbers; request one more clean window before the policy decision"
            next: DONE_MARGINAL_OBS
          fail:
            rule: "throughput below expectation OR any role garbles / loses [iqk]"
            action:
              - "hold the policy decision; consider R0 (GGML_IQK=0 reload) per the rollback ladder; document"
            next: FAILED_REVERTED
          infra:
            classify: "host not truly quiet post-reboot / throttle detected / SONAME lib-shadow / attest gap"
            action:
              - "run throttle-check + drop_caches; verify /proc/maps v6 lib + GGML_IQK env; re-bench"
          ambiguous:
            action:
              - "hold for operator; attach per-role throughput + attest refs + garbage-check transcripts"
            next: HELD_AMBIGUOUS
  artifacts:
    outputs:
      - "data/package_g/v6_iqk_canonical_post_reboot_bench.json"
    package_to: "coordination/inference-batch/bundles/KOP2-v6iqk-canonical-verify/"
  ledger:
    journal_quarantine_rule: >
      record role, decode t/s, throttle state, cache state, reboot uptime, iqk-active attest; quarantine
      diagnostic_only if the host was not clean post-reboot (throttle or non-quiet), keeping the pre-reboot
      throttle-caveated status.
    era_stamp: "E5-cpu-kernel"

