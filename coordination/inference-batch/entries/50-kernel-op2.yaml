    timeout_s: 43200
    retry_policy:
      max_attempts: 2
      retry_on:
        - INFRA_BLOCKED
  outcomes:
    expected: >
      RustEvo2 pass@1 (and pass@10) for Strand-Rust-Coder-14B vs Qwen2.5-Coder-14B-Instruct base and
      gemma4 worker; verdict against the leaderboard distribution + base-model isolation of Strand's value.
