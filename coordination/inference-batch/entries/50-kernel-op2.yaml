    host_health:
      tier: quiet_window
      max_uptime_days: 7
      cache_state: warm
    topology:
      required_topology_hash: 171f86f9188211e9
      live_affinity_verified: true
      contention_matrix: not_required
    autopilot: stopped
    operator_gates:
      - OP-STRAND-INFERENCE-APPROVAL
    depends_on: []
  execution:
