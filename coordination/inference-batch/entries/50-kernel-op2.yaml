            rule: "Strand pass@1 >= 65.3% (leaderboard #1 band) AND a material lift over the Qwen2.5-Coder-14B base"
            action:
              - "flip Phase B; run the C-2 contamination/harness/sampling scrutiny; then GO on swarm-dataset-distillation"
            next: DONE_PASS
          marginal:
            rule: "Strand beats base but lands mid-table (not #1)"
