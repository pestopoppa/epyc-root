    source_ref: "arxiv:2503.16922 (RustEvo2) + repo github.com/SYSUSELab/RustEvo @ aed98f6 (intake-614/615)"
    coordination_note: >
      Phase A COMPLETE (GGUF downloaded, harness validated, Rust toolchain installed 2026-06-18). Phase B
      is USER-APPROVAL-REQUIRED, single-instance, models loaded ONE AT A TIME (sequential). Bench order:
      Strand-Rust-Coder-14B-v1-Q4_K_M -> baselines incl. Qwen2.5-Coder-14B-Instruct Q4_K_M (isolates the
      Strand fine-tune vs base) and gemma4-26B-A4B MTP Q4_K_M. Harness: RustEvo/Evaluate/eval_models_rq1.py
      (588 tasks, RustEvo^2.json). Frontier leaderboard reference: Claude-3.7-Sonnet 65.3% / o1-mini 57.5%.
