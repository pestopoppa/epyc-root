# =============================================================================
# Wave-3 M3 — P4 ROUTING inference-batch entries (phase 4).
#
# Placement / contention / edit-transaction routing probes. Quiet-window
# throughput/latency-sensitive; kernel-era-stamped so cross-boundary comparability
