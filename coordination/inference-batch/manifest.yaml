      contention_matrix: not_required
    autopilot: stopped
    operator_gates:
    - OP-6a
    - OP-6b
    - BUILD-mechanism-a-ledger-producer
    depends_on:
    - RCP-W1-reference-relaunch-preflight
  execution:
    driver: command
    protocol_id: P-AB-1 (paired, same questions/seed both legs) + P-SPEED-OBJ (task_rate)
      for the throughput delta
    dry_run: false
    command: '.venv/bin/python scripts/analysis/reviewer_events_to_ledger.py --events
      data/trace/events.sqlite --corpus /mnt/raid0/llm/datasets/nearmiss-corpus-v1/rows.jsonl
      --output /mnt/raid0/llm/tmp/rcp_w2_<UTC>/ --emit ledger-sqlite && .venv/bin/python
      scripts/analysis/reviewer_calibration_report.py --ledger /mnt/raid0/llm/tmp/rcp_w2_<UTC>/review_ledger.sqlite
      --corpus /mnt/raid0/llm/datasets/nearmiss-corpus-v1/rows.jsonl --k 2 --print
      --out-json /mnt/raid0/llm/tmp/rcp_w2_<UTC>/report.json

      '
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: paired_sequential
    fanout_transport: placement_queue
    contention_class: eval_fanout_reference_lineup
    est_wall_clock_h: 1.0
    timeout_s: 7200
    retry_policy:
      max_attempts: 2
      retry_on:
      - INFRA_BLOCKED
  outcomes:
    expected: 'Both legs complete 50/50 same questions; shadow-ON emits a REVIEW_DECISION
      trace row + review_ledger row for ~100% of review invocations (TM-8); ON-vs-OFF
      eval-wall + token delta is the LB-1/H-LB shadow-overhead baseline; RD-12 per-decision
      latency_ms + tokens recorded with zero enforcement side effects.

      '
    gate_table:
    - gate: Does the paired replay yield ~100% trace coverage (TM-8) with a clean
        shadow-overhead delta (LB-1) and durable first ledger rows (RD-12)?
      evidence: coverage = review-trace rows / review invocations via src/trace/query.py
        decision-chain + review_ledger counts; ON-vs-OFF eval-wall + median/aggregate
        t/s + token delta; ledger rows durable in data/trace/events.sqlite; seed42
        production sampling both legs
      fork:
        pass:
          rule: coverage >= ~99% (phase tags + executor-model-id + reminder events
            all present) AND both legs complete 50/50 AND ledger rows durable
          action:
          - flip RCP-W2 checkbox in bulk-inference-campaign.md
          - flip RD-12 (reviewer-decision-plane.md), TM-8 (reviewer-trace-materialization.md),
            LB-1 (reviewer-latency-and-sampling-budget.md) with the numbers — all
            OBSERVATION-grade pre-P-REV-1
          - record overhead delta in H-LB AND reviewer-decision-plane per RD-12 reporting
            instructions
          next: RCP-W3-rc8-smoke-slice
        marginal:
          rule: coverage 90-99% (missing phase tags / reminder / executor-model-id
            on some rows) OR overhead delta within noise
          action:
          - record RCP-W2 + RD-12 + LB-1 as partial observations; open a TM-8 follow-up
            for the missing event types
          - do NOT flip TM-8 as ~100% — H4 does not start until coverage is ~100%
          next: RCP-W3-rc8-smoke-slice
        fail:
          rule: coverage < 90% OR the ON leg is dominated by errors/timeouts OR ledger
            rows not durable across the run
          action:
          - shadow emission is lossy — do NOT start H4; file a trace-emission bug
            against src/trace/emit.py
          - keep TM-8 / RD-12 open; re-run after the emission fix
          next: FAILED_REVERTED
        infra:
          classify: placement-queue starvation / backend outage / eval-tower dispatch
            error / server OOM
          action:
          - re-run in a fresh quiet window after drop_caches + throttle-check; confirm
            6/6 shadow flag still live first
        ambiguous:
          action:
          - 'coverage number surprising (e.g. 100% but suspiciously low invocation
            count, or overhead delta sign-flips vs the 2026-07-16 regression) — broken-instrument
            guardrail: read decision-chain transcripts before believing; hold for
            operator'
          next: HELD_AMBIGUOUS
  artifacts:
    outputs:
    - /mnt/raid0/llm/tmp/rcp_w2_replay_<UTC>/{shadow_off.jsonl,shadow_on.jsonl}
    - epyc-orchestrator/data/trace/events.sqlite (review_ledger rows)
