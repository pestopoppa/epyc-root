      writer produces policy-conformant pages (>=3 source refs, verified confidence)
      on changed sources only.

      '
    gate_table:
    - gate: Does an FTS5 lexical weight > 0 beat ColBERT-only recall AND does the
        AutoWiki writer meet the evidence policy?
      evidence: recall@10 per lexical_weight vs w=0 baseline (K7 pool) + writer structural-lint/evidence-policy
        pass rate
      fork:
        pass:
          rule: a lexical_weight improves recall beyond the 2pp noise band with 0
            new missed-all-evidence cases AND writer pages pass policy
          action:
          - flip K11 + AutoWiki-writer checkboxes; propose the winning lexical_weight
            default to operator
          next: DONE_PASS
        marginal:
          rule: lexical uplift within noise; writer pages pass policy but no retrieval
            win
          action:
          - keep lexical_weight=0 default; adopt AutoWiki writer as observation-gated
          next: DONE_MARGINAL_OBS
        fail:
          rule: lexical weight regresses recall/miss-risk OR writer pages fail the
            evidence policy
          action:
          - keep ColBERT-only default; hold the writer; document in internal-kb-rag
          next: FAILED_REVERTED
        infra:
          classify: index build failure / eval fan-out dispatch error / architect
            alias down
          action:
          - rebuild the KB-RAG index; re-run the sweep via the eval-concurrency path
        ambiguous:
          action:
