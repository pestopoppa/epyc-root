- schema_version: inference_batch.entry.v1
  task_id: EV-8-diversity-redundancy
  title: EV-8 — Diversity baseline pass + Verbalized-Sampling temperature ladder +
    SAE eval-redundancy probe
  notes: 'Three-row gate table (one entry per task): (1) diversity baseline populated
    + warn-rule live; (2) Verbalized-Sampling recovery probe on the T=0.7 baseline
    + T=1.0 ladder point; (3) SAE feature-coverage eval-suite redundancy pruning signal.
    Row 3 is evaluation-free (one SAE pull, no new inference) and runs as a serial_noninference
    companion step within this window.

    '
  provenance:
    owning_handoff: handoffs/active/eval-tower-verification.md
    checkbox: EV-8
    source_ref: handoffs/active/eval-tower-verification.md#EV-8 (DD4/intake-441 +
      Qwen-Scope intake-521)
    coordination_note: 'SAE DOWNLOAD PRECONDITION for gate row 3: SAE-Res-Qwen3.5-27B
      single mid-band layer pull (~3.34 GB) is an operator gate, NOT a manifest entry.
      The redundancy probe is evaluation-free (Qwen-Scope Section 4); require held-out
      checkpoint cross-validation before any suite is pruned. The eval trust boundary
      is human-amendment-only -> pruning is a recommendation, not an auto-action.

      '
  phase: 2
  priority: P2
  preconditions:
    stack_lineup: 4 production roles (frontdoor + worker_general + architect_general
      + coder_escalation)
    kernel_era: production-consolidated-v7
    flag_attestation: env_only
    models:
    - frontdoor
    - worker_general
    - architect_general
    - coder_escalation
    host_health:
      tier: quiet_window
      max_uptime_days: 7
      cache_state: warm
    topology:
      required_topology_hash: 8c8cfcbb13d2611d
      live_affinity_verified: true
      contention_matrix: v7-recert-required
    autopilot: stopped
    operator_gates:
    - OP-quiet-window
    - MODEL-DOWNLOAD-sae-res-qwen35-27b-single-layer
    depends_on: []
  execution:
    driver: command
    protocol_id: eval-tower.diversity-redundancy.v1
    dry_run: false
    command: '# MODE BUILT (BUILD-evalbatch-verifier-mode satisfied 2026-07-17): run
      via # eval_batch_serving_evaltower_window.py --mode calibration --verifier <model>
      ... # BLOCKED on MODEL-DOWNLOAD-<x> (require_verifier_on_disk raises until the
      model lands).

      '
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: same_trial_eval_fanout
    fanout_transport: placement_queue
    contention_class: eval_fanout_full_core
    est_wall_clock_h: 5.0
    timeout_s: 25200
    retry_policy:
      max_attempts: 2
      retry_on:
      - INFRA_BLOCKED
  outcomes:
    expected: 'Diversity baseline file populated (distinct-2, self-BLEU, entropy,
      TTR, semantic-embedding-agreement) with the warn-only rule live; Verbalized-Sampling
      recovery ratio measured; SAE redundancy ranking produced as an evaluation-free
      pruning recommendation. Observation-grade; SafetyGate stays warn-only.

      '
    gate_table:
    - gate: Row 1 — Is the diversity baseline populated with the warn-rule live across
        all 4 roles?
      evidence: diversity_entropy/distinct2/self_bleu/ttr/semantic_embedding_agreement
        per role x 20 prompts x 4 completions, protocol eval-tower.diversity-redundancy.v1
      fork:
        pass:
          rule: all 5 diversity fields populated per role AND warn-only rule active
            for 10 trials
          action:
          - populate orchestration/autopilot_baseline.yaml diversity_baseline block
          - keep SafetyGate warn-only (default SAFETY_GATE_WARN_ONLY on)
          next: DONE_PASS
        marginal:
          rule: baseline populated for a subset of roles / metrics only
          action:
          - record partial baseline; keep EV-8 row 1 open for the missing roles
          next: DONE_MARGINAL_OBS
        fail:
          rule: diversity scoring produces no usable rows
          action:
          - quarantine diagnostic_only; escalate diversity metrics wiring
          next: FAILED_REVERTED
        infra:
          classify: eval-fanout dispatch error / embedder unavailable / OOM
          action:
          - re-run fresh quiet window; confirm sentence-embedder injected (else semantic-agreement
            is NaN)
        ambiguous:
          action:
          - hold for operator; attach per-role metric spread
          next: HELD_AMBIGUOUS
    - gate: Row 2 — Does the Verbalized-Sampling probe recover > 50% of the diversity
        gap (T=0.7 baseline vs T=1.0)?
      evidence: recovery_ratio() from verbalized_sampling.py on the distributional
        prompt, temperature ladder 0.7 -> 1.0
      fork:
        pass:
          rule: VS recovery_ratio > 0.50 on >= 1 role
          action:
          - 'record: VS recovers gap -> models are NOT reject candidates on diversity
            alone (multi-signal REJECT suppressed)'
          next: DONE_PASS
        marginal:
          rule: VS recovery in (0, 0.50] — partial recovery
          action:
          - record observation; keep warn-only; do not flip to multi-signal reject
          next: DONE_MARGINAL_OBS
        fail:
          rule: VS probe fails to parse / zero recovery across all roles
          action:
          - record negative; investigate VS prompt template / parser tolerance
          next: FAILED_REVERTED
        infra:
          classify: temperature-ladder run failed / sampling seed not honored
          action:
          - re-run with production sampling seed=42 confirmed per feedback_production_sampling_seed_not_temp0
        ambiguous:
          action:
          - hold for operator; attach VS completions that failed parsing
          next: HELD_AMBIGUOUS
    - gate: Row 3 — Does the SAE feature-coverage probe yield a defensible eval-suite
        pruning recommendation?
      evidence: per-benchmark feature-coverage R-hat(D) + pairwise asymmetric overlap,
        cross-validated against held-out 5-checkpoint ranking-preservation (Qwen-Scope
        Section 4)
      fork:
        pass:
          rule: redundancy ranking holds on held-out checkpoints AND identifies >=
            1 subsumed suite (e.g. GSM8K covered by MATH)
          action:
          - publish pruning RECOMMENDATION only (eval trust boundary is human-amendment-only);
            do NOT remove any suite
          next: DONE_PASS
        marginal:
          rule: redundancy signal computed but held-out cross-validation is weak/inconclusive
          action:
          - record observation; no pruning recommendation
          next: DONE_MARGINAL_OBS
        fail:
          rule: SAE encode fails / coverage curves degenerate
          action:
          - escalate SAE pull integrity; row 3 stays open
          next: FAILED_REVERTED
        infra:
          classify: SAE artifact missing / storage or encode OOM
          action:
          - re-verify the ~3.34 GB single-layer pull; re-run encode (no inference)
        ambiguous:
          action:
          - hold for operator; attach coverage curves + overlap matrix
          next: HELD_AMBIGUOUS
  artifacts:
    outputs:
    - orchestration/autopilot_baseline.yaml (diversity_baseline block)
    - orchestration/reports/eval_tower_diversity_baseline/
    - orchestration/reports/eval_suite_sae_redundancy/
    package_to: coordination/inference-batch/bundles/EV-8/
  ledger:
    journal_quarantine_rule: 'record role, prompt_id, completion_idx, temperature,
      diversity_* metrics, vs_recovery_ratio, seed; SAE row records benchmark, R_hat,
      overlap pairs, heldout_rank_preservation; quarantine diagnostic_only if seed
      not recorded or embedder absent (semantic-agreement NaN).

      '
    era_stamp: instrument-era-2026-06-12-post-measurement-constitution
