      kernel era, corpus/flag stamp; all numbers OBSERVATION-grade until P-REV-1 merges
      (RC-6a). Quarantine diagnostic_only if the two legs do not share identical question
      set/seed or if shadow-flag attestation was not 6/6 at run time.

      '
    era_stamp: instrument-era-2026-06-12-post-measurement-constitution
