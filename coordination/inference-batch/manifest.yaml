      Needs the H4 instrument (RC-8) and the H5 anchor arms. Throughput axis under
      P-SPEED-OBJ (task_rate, e-process, never single-trial); parallel-reviewer wall-clock
      models as SUM not MAX on this host. Gated OP-5a (P-REV-1) + OP-5b (LB-6 threshold,
      LB-6b).

      '
