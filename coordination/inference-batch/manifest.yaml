    source_ref: handoffs/active/bulk-inference-campaign.md#L614; master-handoff-index.md
      OP-6 decision (b)(2)
    coordination_note: 'The 50-question eval-tower replay run shadow-OFF then shadow-ON
      (paired, SAME questions, seed42 production sampling). OFF leg re-anchors the
      post-bc8d3303 throughput baseline (LB-1 attribution seed); ON leg measures shadow-emission
      overhead and produces the FIRST review_ledger rows (RD-12). TM-8 coverage gate
      = ~100% of review invocations produce trace rows. Sampling-sensitive: production
      temp + seed42 both legs. Ledger production is a firing-contingent workaround
      (events→ledger materializer); RCP-W3 no longer depends on this. VALIDATED 2026-07-17
      (ESC-4, non-inference): the materialize->report pipeline was exercised end-to-end
      on the 32 historical REVIEW_DECISION events in data/trace/events.sqlite — 32/32
      events -> 32 review_ledger rows, report generated cleanly (acceptance 50%, parse_failure_rate
      15.6%), FA/FR/ECE null because those events'' candidate_ids (''S1''/empty) are
      NOT nearmiss row_ids. RCP-W2 = first ledger rows from EXISTING events (non-inference,
      runnable now); RCP-W3 = non-null FA/FR via the corpus-matched bridge that emits
      its own decisions keyed to nearmiss row_ids. Pipeline CONFIRMED.

      '
  phase: 0
  priority: P0
  preconditions:
    stack_lineup: REFERENCE trio (unchanged from RCP-W1); reviewer = CPU architect_general
      alias (A3)
    kernel_era: production-consolidated-v6
    flags_required:
      review_decision_shadow: 1
