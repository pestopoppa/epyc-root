  execution:
    driver: command
    protocol_id: P-AB-1 (N>=100/arm) + P-SPEED-OBJ (task_rate e-process); floor =
      LB-7
    dry_run: false
    command: '# BUILD-GATE: single-model floor needs the Mechanism-A ledger producer.
      Downstream of RC-8. OP-5a decision-grade gate already present.

      '
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: paired_sequential
    fanout_transport: placement_queue
    contention_class: eval_fanout_reference_lineup
    est_wall_clock_h: 3.0
    timeout_s: 18000
    retry_policy:
      max_attempts: 2
      retry_on:
      - INFRA_BLOCKED
  outcomes:
    expected: 'Paired dP(success) and % throughput reduction of the plane vs the single-augmented-LLM
      baseline, feeding the LB-6 gate metric G = dP(success) / (% throughput reduction).
      Observation-grade until OP-5a; decision-grade go/no-go additionally needs the
      OP-5b threshold value.

      '
    gate_table:
    - gate: Does the full plane beat the single-augmented-LLM baseline at acceptable
        throughput cost (M3 floor)?
      evidence: paired dP(success) [pp, higher-better] + % throughput reduction [P-SPEED-OBJ
        e-process] over N>=100; G = dP(success) / (%throughput reduction); FA/FR e-process
        state (RC-5)
      fork:
        pass:
          rule: net dP(success) > 0 (plane beats baseline) with the cost recorded
            — and, for a DECISION-grade flip, OP-5a merged AND G >= the OP-5b threshold
            AND config not in FA/FR breach
          action:
          - flip LB-7 (reviewer-latency-and-sampling-budget.md) with dP(success),
            %throughput, G — observation-grade unless OP-5a+OP-5b both satisfied
          - mirror the floor number to H0 (LB-8); if OP-5a/OP-5b satisfied and G>=threshold,
            this is the M3 go signal
          next: DONE_PASS
        marginal:
          rule: dP(success) > 0 but small / CIs overlap zero OR e-process not yet
            confirmed
          action:
          - record LB-7 partial observation; keep the e-process running; NO enforce-mode
            flip
          next: DONE_MARGINAL_OBS
        fail:
          rule: net dP(success) <= 0 (plane does NOT beat the baseline) OR throughput
            cost above the guardrail ceiling
          action:
          - the plane fails the standing floor — do NOT advance to enforce-mode; document
            the negative result; a control plane that only adds cost gets deleted
            (Fable5)
          next: FAILED_REVERTED
        infra:
          classify: placement-queue starvation / backend outage / eval-tower dispatch
            error
          action:
          - re-run in fresh quiet window after drop_caches + throttle-check
        ambiguous:
          action:
          - quality up but throughput cost extreme, or arms disagree across domains
            — hold for operator; the LB-6 threshold choice (OP-5b) adjudicates
          next: HELD_AMBIGUOUS
