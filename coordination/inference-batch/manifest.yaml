    source_ref: handoffs/active/eval-tower-verification.md#EV-11c fresh math re-baseline
      (INFERENCE -> batch manifest)
    coordination_note: 'PRECONDITION CHAIN (all BLOCKING): (a) EV-11a companion fix
      landed — debug_scorer._score_math_verify must drop the non-greedy manual \boxed{(.+?)}
      extraction (it truncates \boxed{\frac{1}{2}} -> \frac{1} -> parse-fail -> silent
      exact_match -> wrong) and pass the raw answer to native balanced-brace math_verify.parse().
      EV-11a is a CODE prereq owned by debug_scorer, NOT a manifest entry — so it
      is an operator_gate here, not a depends_on task_id. (b) math-verify importable
      — eval_tower._require_math_verify passes (DONE: math-verify 0.9.0 installed).
      (c) EV-11b ECE-binning decision recorded — inline _aggregate ECE (top bin open,
      c<hi) vs stat_tests.expected_calibration_error (top bin closed) differ 0.15-0.40
      on binary-confidence math; CRITICAL path (feeds SafetyGate/journal) -> operator
      call, bundled with this re-baseline. math_verify is NOT symmetric and NOT thread-safe
      (signal.alarm) — gold first, external timeout.

      '
  phase: 2
  priority: P1
  preconditions:
    stack_lineup: production default lineup (frontdoor + worker_general + architect_general)
    kernel_era: production-consolidated-v7
    flag_attestation: env_only
