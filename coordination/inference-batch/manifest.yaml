      --cutoffs 3,5,10 --output-dir /mnt/raid0/llm/epyc-orchestrator/data/kb_rag/eval/k11_lexical_w$w
      ; done

      '
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: same_trial_eval_fanout
    fanout_transport: placement_queue
    contention_class: eval_fanout_full_core
    est_wall_clock_h: 2.5
    timeout_s: 18000
    retry_policy:
      max_attempts: 2
