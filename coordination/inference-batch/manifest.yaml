  title: RCP-W2 — RD-12 paired shadow-OFF/ON replay (feeds TM-8 coverage + LB-1 overhead
    + first review_ledger rows)
  provenance:
    owning_handoff: handoffs/active/bulk-inference-campaign.md
    checkbox: RCP-W2
    also_flips:
    - handoffs/active/reviewer-decision-plane.md#RD-12
