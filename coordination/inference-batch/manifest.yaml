      set/seeds: dP(success) [pp] and % throughput reduction, feeding G = dP(success)
      / (% throughput reduction). The standing floor is net dP(success) > 0 at acceptable
      cost.

      '
    gate_table:
    - gate: Does the full reviewer plane beat a single augmented LLM on the same tasks
        (net quality, acceptable cost)?
      evidence: paired dP(success) [pp] + task_rate reduction under P-AB-1/P-SPEED-OBJ,
        N>=100/arm, e-process; G vs OP-5b threshold
      fork:
        pass:
          rule: net dP(success) > 0 AND G >= the operator-picked LB-6 threshold (OP-5b)
          action:
