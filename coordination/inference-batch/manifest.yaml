      live_affinity_verified: true
      contention_matrix: not_required
    autopilot: stopped
    operator_gates:
    - OP-quiet-window
    - EV-11a-boxed-fix-landed
    - EV-11b-ece-binning-decision-recorded
    - math-verify-importable-attested
    depends_on: []
  execution:
    driver: command
    protocol_id: eval-tower.math-rebaseline.v1
    dry_run: false
    command: '.venv/bin/python scripts/benchmark/eval_batch_serving_evaltower_window.py
      --mode math_rebaseline --scoring math_verify --full --roles worker_general,worker_math
      --seed 42 --api-url http://localhost:8000 --apply --confirm-clean-window

      '
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: paired_sequential
    fanout_transport: none
    contention_class: single_model_sequential
    est_wall_clock_h: 6.0
    timeout_s: 28800
    retry_policy:
      max_attempts: 1
      retry_on:
      - INFRA_BLOCKED
  outcomes:
    expected: 'A fresh math baseline over 1819 items/arm (GSM8K 1319 + MATH-500 500)
      under math_verify scoring, production temperature + seed=42, with dataset_sha256
      and test_profile recorded per arm. On a clean pass it supersedes the stale exact-match
      math baseline via a new instrument-era label (append; never edit historical).
      The prior 0/1819 exact-match no-op is the thing being fixed.

      '
    gate_table:
    - gate: Does math_verify re-baseline run clean over all 1819 items/arm, and how
        does per-role math accuracy move vs the prior era baseline?
      evidence: per-arm math_verify accuracy on GSM8K(1319)+MATH-500(500), dataset_sha256
        + test_profile per arm, production temp+seed=42, protocol eval-tower.math-rebaseline.v1
      fork:
        pass:
          rule: math_verify scores all 1819 items/arm with no import/infra fault AND
            dataset_sha256 + test_profile recorded per arm
          action:
          - promote the new math baseline under a NEW instrument-era label (append;
            never edit historical rows)
          - flip EV-11c; record the boxed-extraction fix's measured impact vs stale
            exact-match
          next: DONE_PASS
        marginal:
          rule: runs clean but per-role accuracy moves within noise / mixed per-suite
