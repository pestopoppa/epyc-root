      LB-6 threshold (OP-5b); an observation-grade floor read is runnable in this
      window but MUST NOT gate enforce-mode. Needs the H4 instrument (RC-8) + anchor
      arms.

      '
  phase: 1
  priority: P1
  preconditions:
    stack_lineup: REFERENCE trio (RCP-prologue relaunch); plane arm = CPU architect_general
      reviewer alias (A3); baselines A0 gates-only / A1 self-review
    kernel_era: production-consolidated-v6
    flags_required:
