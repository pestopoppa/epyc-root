      runtime-flag propagation hazard silently corrupts TM-8 coverage if review_decision_shadow
      is not live on ALL workers, so this MUST pass (all_workers attestation) before
      any replay. Reference lineup only — no lineup change, reviewer = CPU architect_general
      alias (A3). Does NOT itself flip a series metric checkbox; it gates RCP-W2/W3.

      '
