      Qwen3.6-35B-A3B-Q8 / gemma-4-26B-A4B workers; reviewer aliased to CPU architect_general
      (A3); GLM-5.2 NOT resident
    kernel_era: production-consolidated-v6
    flags_required:
      review_decision_shadow: 1
    flags_forbidden:
    - review_decision_enforce
    flag_attestation: all_workers
    models:
    - architect_general
    - frontdoor
    - worker_general
    host_health:
      tier: quiet_window
      cache_state: warm
    topology:
      required_topology_hash: df373c79cc4af06f
      live_affinity_verified: true
      contention_matrix: not_required
    autopilot: stopped
    operator_gates:
    - OP-6a
    - OP-6b
    - OP-stack-restart-approval
    depends_on: []
  execution:
    driver: command
    protocol_id: preflight-gate.v1 + three-gates (pipeline-green != starts != live==config)
    dry_run: false
    command: 'scripts/server/affinity_preflight.py --require-memory-locality && scripts/server/preflight_gate.py
      --expected-topology-hash df373c79cc4af06f --require-servers --json && scripts/validate/attest_orchestrator_workers.py
      --min-workers 6 --expect-feature review_decision_shadow && scripts/validate/attest_flags.py

      '
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: observe_only
    fanout_transport: none
    contention_class: stack_control_no_inference
    est_wall_clock_h: 0.4
    timeout_s: 3600
    retry_policy:
      max_attempts: 2
      retry_on:
      - INFRA_BLOCKED
  outcomes:
    expected: 'Reference lineup live==config on all six API workers; live affinity
      matches NUMA_CONFIG for every role; preflight_gate attestation JSON records
      topology hash df373c79cc4af06f fresh; review_decision_shadow=ON confirmed on
      ALL 6 uvicorn workers via per-worker flag introspection; review_decision_enforce
      OFF.

      '
    gate_table:
    - gate: Is the reference lineup live==config AND is review_decision_shadow=ON
        on ALL 6 workers AND topology attested fresh?
      evidence: three-gates check; affinity_preflight live-affinity pass; preflight_gate.py
        attestation JSON (topology df373c79cc4af06f, servers up, matrix fresh); attest_orchestrator_workers.py
        6/6 with feature review_decision_shadow; attest_flags.py no env diffs
      fork:
        pass:
          rule: 6/6 workers report review_decision_shadow=ON AND enforce=OFF AND live
            affinity == NUMA_CONFIG for all roles AND topology hash == df373c79cc4af06f
          action:
          - flip RCP-W1 checkbox in bulk-inference-campaign.md
          - record attestation JSON path + per-worker flag table
          next: RCP-W2-paired-shadow-replay
        marginal:
          rule: lineup live and affinity clean but attestation shows uptime warning
            only, OR a single worker needs a re-broadcast that then reaches 6/6
          action:
          - re-run attest_orchestrator_workers.py after POST /config re-broadcast;
            require 6/6 before proceeding
          - record the transient in the run header
          next: RCP-W2-paired-shadow-replay
        fail:
          rule: fewer than 6 workers show shadow=ON (1-of-6 propagation bug) OR any
            live affinity mismatch OR topology hash drift
          action:
          - DO NOT proceed to replay — a partial flip silently corrupts TM-8 coverage
          - reload the affected role via orchestrator_stack.py; set flags in launch
            env (not POST /config); rerun affinity + attestation
          next: BLOCKED_PRECONDITION
        infra:
          classify: relaunch failure / server OOM / port-bind / preflight_gate error
            / NUMA warmup stall
          action:
          - drop_caches + throttle-check; restart the stack via orchestrator_stack.py;
            re-queue RCP-W1
        ambiguous:
          action:
          - attestation inconsistent (launch env shows ON but /config poll shows OFF
            on some worker) — hold for operator; attach per-worker introspection +
            attest_flags output
          next: HELD_AMBIGUOUS
  artifacts:
    outputs:
    - epyc-orchestrator/data/preflight/<UTC>.json
    - epyc-orchestrator/orchestration/reports/rcp_w1_flag_attestation_<UTC>.json
    package_to: coordination/inference-batch/bundles/RCP-W1/
  ledger:
