          action:
          - record observation; inspect the EV-11a boxed-fix effect on MATH-500 frac/sqrt/matrix
            answers
          - consider the GSM8K revert-to-exact fork if GSM8K (short-answer) regresses
            under math_verify
          next: DONE_MARGINAL_OBS
        fail:
          rule: a role regresses beyond noise vs the prior era baseline
          action:
          - hold promotion; inspect EV-11a boxed-fix; consider GSM8K revert-to-exact
            fork
          - do NOT edit the historical baseline; record the regression against the
            new era
          next: FAILED_REVERTED
        infra:
          classify: math-verify import error / _require_math_verify raises / signal.alarm
            thread fault / server OOM
          action:
          - HARD FAIL by design — do NOT silent-fallback to exact_match; re-queue
            ONLY after EV-11a + import are attested clean
        ambiguous:
          action:
          - 'hold for operator: dataset_sha256 mismatch across arms OR missing test_profile
