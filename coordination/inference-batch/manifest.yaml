      measured FA/FR/CR AND the LB-6 budget gate (OP-5b threshold). NOTE (flag for
      main session): advisory mode has no dedicated leaf checkbox; owned here under
      HG-8 (the enforce-policy A/B its evidence feeds) — the pass-fork advances the
      rollout stage, it does not itself flip enforce-mode. Gated on the CP1/CP2/CP3
      semantics layer + the shadow-rollout pass.

      '
  phase: 3
  priority: P2
  preconditions:
    stack_lineup: REFERENCE trio (RCP-prologue relaunch, no reload); reviewer = CPU
      architect_general alias (A3); advisory surfacing server-side only (x_* fields)
    kernel_era: production-consolidated-v6
    flags_required:
      review_decision_shadow: 1
    flags_forbidden:
    - review_decision_enforce
    flag_attestation: all_workers
    models:
    - architect_general
    - frontdoor
    - worker_general
    host_health:
      tier: quiet_window
      cache_state: warm
    topology:
      required_topology_hash: df373c79cc4af06f
      live_affinity_verified: true
      contention_matrix: not_required
    autopilot: stopped
    operator_gates:
    - OP-6a
    - OP-6b
    - OP-5a
    - BUILD-semantics-serving-integration
    depends_on:
    - semantics-shadow-rollout
  execution:
    driver: command
    protocol_id: P-AB-1 (advisory-on vs advisory-off) + P-REV-1 (FA/FR/CR) + P-SPEED-OBJ
      (churn/rework cost)
    dry_run: false
    command: '# BUILD-GATE: advisory-mode rollout needs semantics serving integration
      + OP-5b budget-gate. No eval_tower.py replay --advisory-mode CLI.

      '
    cwd: /mnt/raid0/llm/epyc-orchestrator
    concurrency_mode: paired_sequential
    fanout_transport: placement_queue
    contention_class: eval_fanout_reference_lineup
    est_wall_clock_h: 3.5
    timeout_s: 21600
    retry_policy:
      max_attempts: 2
      retry_on:
      - INFRA_BLOCKED
  outcomes:
    expected: 'Advisory findings surfaced to the architect (server-side x_* only);
      paired advisory-on vs advisory-off measures advisory precision/usefulness (fraction
      of findings leading to a beneficial change) and rework/churn, alongside FA/FR/CR
      and the throughput cost. Feeds the LB-6 gate and the Phase-3 canary decision.

      '
    gate_table:
    - gate: Does advisory mode prevent defects without creating churn — enough to
        gate the narrow-canary stage (FA/FR/CR + LB-6)?
      evidence: 'paired advisory-on/off: advisory precision/usefulness, rework rate,
        FA/FR/CR (P-REV-1), dP(success) + %throughput reduction -> G vs LB-6 threshold
        (OP-5b); FA/FR e-process state (RC-5)'
      fork:
        pass:
          rule: advisory improves net dP(success) with usefulness > churn AND FA/FR
            not in breach AND (for canary advance) G >= the OP-5b LB-6 threshold with
            OP-5a merged
          action:
          - record advisory-mode results; if LB-6 (OP-5b) + P-REV-1 (OP-5a) satisfied,
            GATE-OPEN the narrow-canary enforcement stage (Phase 3) for one low-risk/reversible
            task class
          - flip HG-8 (reviewer-escalation-and-human-gate-policy.md) policy-A/B evidence
            row; update reviewer-control-plane-index.md#P5
          next: DONE_PASS
        marginal:
          rule: advisory net-positive but churn/rework nontrivial OR G below the strictest
            candidate threshold OR e-process unconfirmed
          action:
          - stay in advisory; tighten review-trigger/complexity gating (LB-3); do
            NOT open the canary; keep collecting
          next: DONE_MARGINAL_OBS
        fail:
          rule: advisory creates more churn/rework than defects prevented (net dP(success)
            <= 0) OR FA/FR breach
          action:
          - auto-demote to shadow (RC-5 / LB-6 demotion machinery); do NOT open the
            canary; document the negative result
          next: FAILED_REVERTED
        infra:
          classify: placement-queue starvation / advisory surfacing (x_*) path error
            / backend outage
          action:
          - re-run in fresh quiet window after drop_caches + throttle-check; confirm
            semantics layer + shadow flag live
        ambiguous:
          action:
          - usefulness and churn point opposite ways with overlapping CIs, or G straddles
            the candidate thresholds — hold for operator; the OP-5b threshold choice
            adjudicates
          next: HELD_AMBIGUOUS
  artifacts:
    outputs:
    - /mnt/raid0/llm/tmp/sem_advisory_<UTC>/{advisory_off.jsonl,advisory_on.jsonl,report.json}
    package_to: coordination/inference-batch/bundles/semantics-advisory/
  ledger:
    journal_quarantine_rule: 'record advisory precision/usefulness, rework/churn rate,
      FA/FR/CR, dP(success), %throughput reduction, G vs LB-6 candidate thresholds,
      FA/FR e-process state, semantics-layer code version; observation-grade until
      P-REV-1 (OP-5a) AND no canary/enforce advance without the OP-5b LB-6 threshold.
      Quarantine diagnostic_only if semantics layer not the landed Wave-2 build or
      shadow flag not 6/6.

      '
