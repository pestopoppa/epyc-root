    dry_run: false
    command: '# DECISION-GRADE re-run of the corresponding observation-grade entry
      (RC-8/LB-7/RM-4) AFTER OP-5a signs P-REV-1. Same runner as the phase-1 entry;
      the difference is instrument-grade, not command.

      '
