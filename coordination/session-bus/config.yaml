# Session bus configuration — policy-as-data (fabric contract: policy-data-never-code).
# Owning handoff: handoffs/active/session-bus-thin-dispatcher.md (M1 + §Rider).
schema_version: session_bus.config.v1

# Adding a main = 1 roster row + 4 files (inbox/outbox/heartbeat/cursor).
# Roster rows are slot-shaped so a future local-model main is just another row.
roster:
  # Window renamed to `codex-inference` by the operator 2026-07-28 to disambiguate it from
  # codex-bus-tests. The bare `tmux:agent` endpoint then resolved to nothing — the adapter
  # correctly REFUSED to guess a pane rather than typing into the wrong one — so the window
  # is now named explicitly. Roster id stays `codex`: it is the identity every existing
  # queue row, cursor, inbox and outbox is keyed on, and renaming it would orphan all of them.
  - {id: codex,             role: main,              lanes: [cpu, gpu, none], endpoint: "tmux:agent:codex-inference", drain: boundary}
  # RETIRED 2026-07-28: the operator closed its tmux window (agent:claude_A). The row is kept,
  # not deleted — queue rows, cursors and its inbox/outbox are all keyed on this identity, and
  # removing it would orphan that history. `lanes: []` means the daemon will never assign to it.
  # Its 2 undelivered inbox messages are moot: the stage_b_prune_plan task-assign was reassigned
  # to codex-bus-tests and completed. Endpoint left as-is so the C8 lint keeps it visible.
  - {id: claude-main,       role: retired,           lanes: [],               endpoint: "monitor:file", drain: push}
  - {id: coordinator-agent, role: coordinator-agent, lanes: [none],           endpoint: "monitor:file", drain: push}
  # Added by coordinator-agent 2026-07-28. Test authoring for the session bus itself
  # (zero coverage found: no file under tests/ references session_bus, while the bus is
  # now load-bearing for coordination). lanes:[none] — this main must never take an
  # inference lane, so it cannot contend with the codex main running G3/E8.
  - {id: codex-bus-tests,   role: main,              lanes: [none],           endpoint: "tmux:agent",   drain: boundary}
  # Added by coordinator-agent 2026-07-28 on operator direction, after codex reported the MI210
  # idle with all legacy campaign GPU inference terminal. Owns gpu-serving-tie-in-program P2-1
  # (role-agnostic resident lane) and P2-3 (Stage-0 hardening). lanes:[none, gpu] — it may hold
  # the GPU lane, but NEVER cpu: the codex main runs CPU-side E8/G3 work and P1-2's E5 grid has
  # a ~2026-07-31 deadline on this host.
  - {id: claude-gpu-lane,   role: main,              lanes: [gpu, none],      endpoint: "tmux:agent",   drain: boundary}
  # Added by coordinator-agent 2026-07-28 on operator direction. Fable 5 at xhigh effort,
  # READ-ONLY auditor of the E8 harness contract set. Rationale: three consecutive failed-closed
  # cycles each surfaced a DIFFERENT defect in a different layer (snapshot publisher binding,
  # watcher abort path, runner sealed-question contract), so codex is discovering contract
  # violations one run-cycle at a time. A fresh reviewer reading the whole harness at once can
  # find the remainder statically. lanes: [none] — it must never take an inference lane or a
  # region claim; codex owns E8 and the tail regeneration still to come.
  - {id: fable-auditor,     role: reviewer,          lanes: [none],           endpoint: "tmux:agent",   drain: boundary}

authority:
  within_lane: [self]
  cross_main: [operator, coordinator-agent]
  # Lease grant/revoke is coordinator-agent's; the daemon may re-grant ONLY by
  # deterministic rule from the priority artifact, never by discretion.
  lease_grant: [operator, coordinator-agent]
  lease_regrant_deterministic: [coordinator-daemon]

coordinator_daemon:
  tick_s: 45
  lookahead: 1
  authority: manual        # manual (M1) | advisory (M3) | assign (M4)
  epoch: 0

# Live tmux topology (operator requirement, 2026-07-27): every spawned main is a
# WINDOW in the one live session — never its own session. Throwaway sessions are
# for tests only. `spawn` refuses any target that is not this session, refuses a
# non-tmux endpoint, and never creates a session (it only ever calls new-window).
tmux:
  live_session: agent
  allow_session_creation: false

flags:
  codex_sendkeys: on       # gate: OP-SENDKEYS-CODEX in tokens/token-queue.md
  triage: off               # M5

caps:
  max_headless_workers: 0
  # Raised 3 -> 6 by operator direction 2026-07-28. NOTE THE SEMANTICS: cmd_spawn counts
  # spawn EVENTS in adapter-ledger.jsonl for today, not live windows — so killing a main does
  # NOT return its slot. On 2026-07-28 three spawns were used while only two mains were alive,
  # blocking further spawns. The operator's expectation (and the better design) is a CONCURRENCY
  # cap on simultaneous live mains, which is what actually costs compute, context and attention.
  # A daily action cap instead penalises churn and perversely discourages closing an idle
  # session — cutting against the lifecycle rule that says "nothing assignable -> close it".
  # Filed as a task; this bump is headroom in the meantime, not the fix.
  max_spawns_per_day: 6
  triage_calls_per_day: 0

leases:
  none_lane_grace_s: 900
  bench_grace_margin: 1.5   # x est_wall_clock_h
  # R5: bound the hold so drain latency has a ceiling. Work exceeding this must
  # persist progressively (every persisted unit is a drain point) or be refused.
  max_hold_s: 1800

# R5 pausability, split by run type. Progressive persistence makes *progress*
# resumable but not a *timing measurement*: a throughput run split across a pause
# spans different thermal/cache/NUMA-warmth states and the halves may not compose
# into one valid observation.
pausability:
  exclusive-contiguous:     # decision-gating timing runs (canonical throughput)
    pausable: false
  resumable:                # quality evals, sweeps, replays, evidence collection
    pausable: true
    drain_at: persisted_unit

# R5 priority classes. Yield is quiesce+drain, never kill (fabric axiom 4).
priority_classes:
  - {name: production-live,   yields_to: []}
  - {name: operator-directed, yields_to: [production-live]}
  - {name: background-churn,  yields_to: [production-live, operator-directed]}

# R3: co-residency policy carries the contention-matrix shape INCLUDING a
# staleness guard. The orchestrator matrix refuses itself under a mismatched
# topology_hash; a hand-declared contention_class without this guard fails
# silently, which is the failure mode this exists to prevent.
co_residency:
  source: "epyc-orchestrator/orchestration/contention_matrix.yaml"
  generator: "epyc-orchestrator/scripts/server/contention_matrix.py"   # never a second generator
  expected_topology_hash: "8c8cfcbb13d2611d"
  on_topology_mismatch: refuse      # fail-closed (fabric axiom 3)
  default_floor: 0.85
  # Declared classes are provisional until measured; promote via the generator above.
  declared_classes_are_provisional: true

# Human-only write paths live in their own hash-pinned, hook-protected file so
# that an agent able to edit this config cannot widen its own authority:
#   human_only_paths.yaml  +  human_only_paths.sha256   (see R7)
trust_boundary:
  source: "coordination/session-bus/human_only_paths.yaml"
  pin: "coordination/session-bus/human_only_paths.sha256"
  on_pin_mismatch: refuse
