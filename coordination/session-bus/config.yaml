# Session bus configuration — policy-as-data (fabric contract: policy-data-never-code).
# Owning handoff: handoffs/active/session-bus-thin-dispatcher.md (M1 + §Rider).
schema_version: session_bus.config.v1

# Adding a main = 1 roster row + 4 files (inbox/outbox/heartbeat/cursor).
# Roster rows are slot-shaped so a future local-model main is just another row.
# `worktree:` (added 2026-08-12, phase 3 B4) is the directory `tmux_adapter.py spawn`
# starts the main in. Policy-as-data: the adapter reads this key and holds no table of
# agent names. A row WITHOUT the key spawns in the shared clone /workspace — deliberate
# for `coordinator-agent` (reads across everyone, owns no lane) and `inference` (whose
# lane is ~302 commits behind; moving it is its own reconciliation task). A row WITH the
# key whose directory is missing REFUSES to spawn rather than silently using the shared
# clone: `scripts/coordination/setup_main_worktrees.sh <agent>` recreates it.
roster:
  # Window renamed to `codex-inference` by the operator 2026-07-28 to disambiguate it from
  # codex-bus-tests. The bare `tmux:agent` endpoint then resolved to nothing — the adapter
  # correctly REFUSED to guess a pane rather than typing into the wrong one — so the window
  # is now named explicitly. Roster id stays `codex`: it is the identity every existing
  # queue row, cursor, inbox and outbox is keyed on, and renaming it would orphan all of them.
  - {id: inference,         role: main,              lanes: [cpu, gpu, none], endpoint: "tmux:agent:inference",  drain: boundary}   # was `codex` until 2026-07-29
  # RETIRED 2026-07-28: the operator closed its tmux window (agent:claude_A). The row was kept,
  # not deleted — queue rows, cursors and its inbox/outbox are all keyed on this identity, and
  # removing it would orphan that history.
  #
  # REVIVED 2026-07-29 post-reboot by coordinator-agent, on the operator's standing rule "always
  # reuse main aliases after reboot". It owns E5 W1-W4 (the NUMA×batch sweep) on the cpu lane.
  # NOTE (superseded 2026-08-16, P3-1): retirement is now a TOMBSTONE, not a re-usable slot.
  # The paragraph below records the older reading. Reviving an identity keeps its
  # outbox history, cursor and triage corr_ids attached to the same name, whereas a fresh alias
  # would orphan all of it AND leave the old row drawing "LOOKS DEAD" advisories forever.
  # endpoint monitor:file -> tmux:agent:claude-main so it can actually be nudged: monitor:file has
  # no push delivery, which `validate` flags precisely because assigned work rots unread there.
  # RETIRED 2026-08-16 (P3-1). TOMBSTONE, NOT A RE-USABLE SLOT: the identity keeps its
  # history (queue rows, inbox, outbox, triage corr_ids all key on it) and nothing may be
  # newly addressed to it. Reviving it is a deliberate act with its own procedure
  # (retirements/mainA.retirement.json), never a side effect of writing the id into a
  # message — that is how C24 (inherited dead heartbeat) and C28 (relay re-flood into a
  # recreated inbox) happened. Retired with a verified-DEAD liveness read and a receipt.
  - {id: mainA, role: retired, lanes: [], endpoint: "retired:mainA", drain: none}
  # Renamed window 0 `claude` -> `coordinator` and re-pointed monitor:file -> tmux 2026-07-29:
  # monitor:file has NO push delivery, which `validate` flagged precisely because assigned
  # work rots unread there. The id stays `coordinator-agent` — it is the authority name in
  # authority.cross_main and lease_grant, not a session label.
  - {id: coordinator-agent, role: coordinator-agent, lanes: [none],           endpoint: "tmux:agent:coordinator", drain: push}
  # Added by coordinator-agent 2026-07-28. Test authoring for the session bus itself
  # (zero coverage found: no file under tests/ references session_bus, while the bus is
  # now load-bearing for coordination). lanes:[none] — this main must never take an
  # inference lane, so it cannot contend with the codex main running G3/E8.
  - {id: codex-bus-tests,   role: retired,           lanes: [],               endpoint: "tmux:agent:codex-bus-tests",   drain: boundary}
  # Added by coordinator-agent 2026-07-28 on operator direction, after codex reported the MI210
  # idle with all legacy campaign GPU inference terminal. Owns gpu-serving-tie-in-program P2-1
  # (role-agnostic resident lane) and P2-3 (Stage-0 hardening). lanes:[none, gpu] — it may hold
  # the GPU lane, but NEVER cpu: the codex main runs CPU-side E8/G3 work and P1-2's E5 grid has
  # a ~2026-07-31 deadline on this host.
  # RE-ACTIVATED 2026-07-29T12:47Z on operator direction (reversing the 12:40Z stand-down):
  # P2-2 tenant landing starts PRE-reboot rather than deferring. Re-using the same roster id
  # deliberately — its inbox still holds the undelivered lane-activation decision, so a fresh
  # session in this slot drains it rather than needing it re-relayed.
  # RETIRED 2026-08-16 (P3-1). TOMBSTONE, NOT A RE-USABLE SLOT: the identity keeps its
  # history (queue rows, inbox, outbox, triage corr_ids all key on it) and nothing may be
  # newly addressed to it. Reviving it is a deliberate act with its own procedure
  # (retirements/mainB.retirement.json), never a side effect of writing the id into a
  # message — that is how C24 (inherited dead heartbeat) and C28 (relay re-flood into a
  # recreated inbox) happened. Retired with a verified-DEAD liveness read and a receipt.
  - {id: mainB, role: retired, lanes: [], endpoint: "retired:mainB", drain: none}
  # Added by coordinator-agent 2026-07-28 on operator direction. Fable 5 at xhigh effort,
  # Originally spawned 2026-07-28 as a READ-ONLY auditor of the E8 harness contract set:
  # three consecutive failed-closed cycles had each surfaced a DIFFERENT defect in a different
  # layer (snapshot publisher binding, watcher abort path, runner sealed-question contract), so
  # the inference main was discovering contract violations one run-cycle at a time, and a fresh
  # reviewer reading the whole harness at once could find the remainder statically.
  #
  # NO LONGER READ-ONLY, corrected 2026-07-29. It adopted C-OWN — the session-bus delivery plane,
  # including `tmux_adapter.py` and the whole C-series — which makes implementing fixes part of
  # its job, not a deviation from it. It has since landed C29/C30b/C31/C33/C34. The stale
  # "READ-ONLY" wording was found by a charter audit and is corrected here rather than left to
  # contradict MAIN-GOALS.md. Its second standing duty is auditing other mains' completed work,
  # which is the counterweight that makes "prefer finishing whole items over polishing" safe.
  #
  # lanes: [none] STILL HOLDS and is unchanged: it must never take an inference lane or a region
  # claim. Owning the delivery plane is not a licence to contend for the host.
  #
  # SESSION RETIRED 2026-08-16 (P3-7) — and deliberately NOT a tombstone. The
  # INTERACTIVE auditor is dead (verified DEAD by retire_identity.py: no window, no
  # live pid, heartbeat 46.8h stale) so the `tmux:` endpoint and the `worktree:` key
  # are GONE: nothing may spawn, probe, nudge or type into a pane under this id again.
  # role: reviewer -> service, for the same reason hardware-backfill is a service —
  # it is a mechanism, not a session; it has no tmux window and nothing nudges it.
  # Side effect, and the desired one: the Phase-0 `_fleet_presence` gate counted
  # roles main+reviewer, so this row stopped being a permanently-dead fleet-gate
  # candidate. That gate was retired by P3-4 (runner-liveness + starvation, which
  # look at `exec:` endpoints only), so the side effect is now moot rather than
  # load-bearing — recorded here because the reasoning above cites it.
  #
  # The IDENTITY is NOT retired, because it is still ADDRESSED and still WRITES:
  # worker_runner.py emits every completed batch's audit packet with
  # to/assignee/needs_routing_to = "auditor", and headless_audit.py pins
  # AUDITOR_AGENT = "auditor" for its own outbox. `role: retired` would make
  # session_bus.py::_check_routing_intent REFUSE that append and break the P2-7
  # audit path mid-pilot. The reviewer FUNCTION now lives on as per-packet headless
  # invocations of scripts/coordination/headless_audit.py. Receipt (including the
  # 3944 undrained bytes and why the cursor was NOT archived):
  # retirements/auditor.retirement.json. The lane worktree at
  # /mnt/raid0/llm/worktrees/mains/auditor was CLEAN and is left in place.
  - {id: auditor,           role: service,           lanes: [none],           endpoint: "monitor:file",          drain: none}
  # Added by coordinator-agent 2026-07-29 on operator direction: 293 tasks closed in the last 7
  # days against a target of 1000+, and the binding constraint is idle mains, not throughput per
  # main. mainC/mainD exist purely to churn backlog — they take whatever unblocked handoff work is
  # dispatched to them. lanes:[none] deliberately: the CPU is already contended by inference (E8)
  # and mainA (E5), and none-lane work is the only kind that can be dispatched instantly at any
  # moment, which is exactly what an anti-idle reserve needs to be.
  # RETIRED 2026-08-16 (P3-1). TOMBSTONE, NOT A RE-USABLE SLOT: the identity keeps its
  # history (queue rows, inbox, outbox, triage corr_ids all key on it) and nothing may be
  # newly addressed to it. Reviving it is a deliberate act with its own procedure
  # (retirements/mainC.retirement.json), never a side effect of writing the id into a
  # message — that is how C24 (inherited dead heartbeat) and C28 (relay re-flood into a
  # recreated inbox) happened. Retired with a verified-DEAD liveness read and a receipt.
  - {id: mainC, role: retired, lanes: [], endpoint: "retired:mainC", drain: none}
  # RETIRED 2026-08-16 (P3-1). TOMBSTONE, NOT A RE-USABLE SLOT: the identity keeps its
  # history (queue rows, inbox, outbox, triage corr_ids all key on it) and nothing may be
  # newly addressed to it. Reviving it is a deliberate act with its own procedure
  # (retirements/mainD.retirement.json), never a side effect of writing the id into a
  # message — that is how C24 (inherited dead heartbeat) and C28 (relay re-flood into a
  # recreated inbox) happened. Retired with a verified-DEAD liveness read and a receipt.
  - {id: mainD, role: retired, lanes: [], endpoint: "retired:mainD", drain: none}
  # Added by coordinator-agent 2026-08-12 on operator instruction. The hardware-idle
  # backfill runner (5af987ef) detects idle compute with queued compute-gated work and
  # files it. Without this row its appends fail CLOSED with the roster error - it was
  # working and mute. role: service because it is a runner, not a session: it has no
  # tmux window and nothing nudges it. lanes:[none] - it OBSERVES and REPORTS idle
  # hardware; it never claims a device or launches a job.
  - {id: hardware-backfill, role: service,           lanes: [none],           endpoint: "monitor:file",          drain: none}

  # P2-5 (Loop-Owned Fleet, 2026-08-16). THE POOL IDENTITY, and the one schema
  # extension the plan permits. `endpoint: exec:...` is a new SCHEME, not a new
  # message kind: instead of naming a tmux window a courier must type into, it
  # names a program the daemon EXECS with the assignment. That is the whole
  # structural change — spawn-args in, report file and exit status out — and it
  # is why the composer/glyph/heartbeat delivery plane has no surface left to
  # fail on for pool work.
  #
  # role: main because it must be SCHEDULABLE (the daemon only assigns to mains,
  # per 240251bf). lanes: [cpu, none] — pool work is code/doc churn; a worker
  # needing a GPU requests a window through the bus like every other consumer.
  # The runner is exec'd FRESH per assignment and never persists, so this row
  # names a mechanism, not a session — nothing here can go stale the way a dead
  # tmux endpoint does.
  - {id: workerpool,        role: main,              lanes: [cpu, none],      endpoint: "exec:worker_runner",    drain: none}

# P2-5 / D1 / D2. Bounds on the pool, as DATA. Changing the harness is an edit
# here, never a code change (policy-data-never-code).
worker_pool:
  # THE MASTER SWITCH, and it starts OFF. The roster row alone makes the pool
  # SCHEDULABLE; this flag is what makes it EXECUTABLE. Separating them matters:
  # a schedulable-but-not-executable pool is precisely the 2026-08-14 shape —
  # the daemon assigns, nothing runs, the lease expires, the row dies. So the
  # daemon treats `enabled: false` as "endpoint not ready" and leaves the work
  # READY and visible. Flip to true only after the runner has been proven
  # end-to-end on this host.
  enabled: false
  # D2: claude for the <=10-row pilot (isolates the structural variable from
  # model quality); codex exec is the intended scale-out default once the pilot
  # has measured tokens/row. Per-lane override lives in `lane_harness`.
  worker_harness: claude
  lane_harness: {}
  # D1 bounds. concurrency is additionally floor-capped by the number of pool
  # worktrees that exist — scaling past them is a deliberate, operator-visible
  # step, never on-demand creation.
  max_concurrent_workers: 4
  token_ceiling_per_batch: 250000
  # D6: kill is allowed at lease expiry, loss is not. Grace before SIGKILL, then
  # MANDATORY salvage to a salvage/<task_id> ref.
  lease_grace_s: 60
  # The runner refuses to spawn until this names the ratification, because a
  # runner that enforces a lease can kill. D6 was ratified by the operator on
  # 2026-08-15 (recorded in docs/design/loop-owned-fleet.html, "RATIFIED
  # (amended)"); the protocol text it authorises is BUS_PROTOCOL.md rule 8,
  # amended 2026-08-16 — pool workers only, interactive reclaim unchanged.
  rule8_amendment_ack: "D6 ratified 2026-08-15 (plan of record: docs/design/loop-owned-fleet.html); BUS_PROTOCOL.md rule 8 amendment 2026-08-16"
  # P2-6: rows from the same source handoff may share one invocation.
  max_rows_per_batch: 3
  pool_root: /mnt/raid0/llm/worktrees/pool
  # D8: the pane is the OPERATOR's window into the worker. The machine never
  # types into it and never decides from its text.
  visible_panes: true

  # D2b. The authority a pool worker runs under, as DATA — widening it is a
  # config diff, never a code change.
  #
  # The deny list is the load-bearing half and every entry is an incident, not a
  # hypothetical. Note what is NOT here: the trust boundary itself
  # (human_only_paths.yaml, CLAUDE.md, agents/shared/*) is enforced by the
  # PreToolUse hooks for every agent alike, and duplicating it here would create
  # a second copy to drift. This list covers what is specific to an unattended
  # worker.
  permission_profile:
    allow:
      - "Read"
      - "Grep"
      - "Glob"
      - "Edit"
      - "Write"
      - "Task"          # a worker fans out its own subagents — that is the multiplier
      - "Bash(git *)"
      - "Bash(python3 *)"
      - "Bash(ls *)"
      - "Bash(rg *)"
      - "Bash(pytest *)"
    deny:
      # Never a name pattern on a shared host: a pattern is a wildcard over
      # other sessions' processes, and a guard's own argv contains the names it
      # guards (origin: INC-20260731 — llama-server was killed twice, and
      # earlyoom died because its command line names what it protects).
      - "Bash(pkill *)"
      - "Bash(pgrep *)"
      - "Bash(killall *)"
      # git clean -x deletes ignored files. That is how the bus was destroyed on
      # 2026-08-12, along with the evidence of who ran it.
      - "Bash(git clean *)"
      # prune is what destroyed all five lane worktrees at once on 2026-08-12.
      - "Bash(git worktree prune *)"
      # A worker commits its OWN lane. Pushing is serialized elsewhere.
      - "Bash(git push *)"
      - "Bash(sudo *)"
      - "Bash(rm -rf /*)"

authority:
  within_lane: [self]
  cross_main: [operator, coordinator-agent]
  # Lease grant/revoke is coordinator-agent's; the daemon may re-grant ONLY by
  # deterministic rule from the priority artifact, never by discretion.
  lease_grant: [operator, coordinator-agent]
  lease_regrant_deterministic: [coordinator-daemon]

coordinator_daemon:
  tick_s: 45
  lookahead: 1
  authority: assign        # manual (M1) | advisory (M3) | assign (M4)
  # RAISED manual->assign by operator decision 2026-08-12. Rationale: the daemon
  # emitted 4,602 would-assign rows in one night, every one carrying a concrete
  # task_id, and delivered none - fleet ran at ~8-9% utilisation with a 3h47m
  # window at zero. M1 (e9a11f08) routes the pick to coordinator-agent's inbox and
  # silences itself structurally once assign lands: apply_assignment moves the row
  # out of READY, the would-assign stops, the signature changes.
  epoch: 0

# Live tmux topology (operator requirement, 2026-07-27): every spawned main is a
# WINDOW in the one live session — never its own session. Throwaway sessions are
# for tests only. `spawn` refuses any target that is not this session, refuses a
# non-tmux endpoint, and never creates a session (it only ever calls new-window).
tmux:
  live_session: agent
  allow_session_creation: false

flags:
  codex_sendkeys: on       # gate: OP-SENDKEYS-CODEX in tokens/token-queue.md
  triage: off               # M5

caps:
  max_headless_workers: 0
  # C9 FIXED 2026-07-28. `cmd_spawn` now counts LIVE roster-member windows in
  # tmux.live_session, so closing an idle main returns its slot immediately —
  # which is what the session-lifecycle rule asks sessions to do. The superseded
  # `max_spawns_per_day` counted spawn EVENTS per day: killing a main never
  # returned its slot, and on 2026-07-28 three spawn rows blocked further spawns
  # while only two mains were alive.
  #
  # The old key is REFUSED, not read as a fallback: its 6 authorised six spawn
  # ACTIONS in a day, and re-reading that as six SIMULTANEOUS mains would grant
  # concurrency nobody approved — a fail-open, in the module whose defect history
  # (C3, C6, C8) is entirely fail-opens. Setting this key is the migration.
  #
  # 4 = one free slot above the steady state of 3 live mains (codex,
  # coordinator-agent, claude-gpu-lane). Operator decision, 2026-07-28.
  # An uncountable live set (tmux unreachable, session absent) REFUSES.
  # Raised 4 -> 7 by coordinator-agent 2026-07-29 on operator direction: parallelise the
  # withheld tier-B/tier-C audit findings across additional mains ahead of the reboot.
  # Concurrency semantics (C9): counts LIVE roster windows, so closing a main returns its slot.
  max_concurrent_mains: 7
  triage_calls_per_day: 0

leases:
  none_lane_grace_s: 900
  bench_grace_margin: 1.5   # x est_wall_clock_h
  # R5: bound the hold so drain latency has a ceiling. Work exceeding this must
  # persist progressively (every persisted unit is a drain point) or be refused.
  max_hold_s: 1800

# R5 pausability, split by run type. Progressive persistence makes *progress*
# resumable but not a *timing measurement*: a throughput run split across a pause
# spans different thermal/cache/NUMA-warmth states and the halves may not compose
# into one valid observation.
pausability:
  exclusive-contiguous:     # decision-gating timing runs (canonical throughput)
    pausable: false
  resumable:                # quality evals, sweeps, replays, evidence collection
    pausable: true
    drain_at: persisted_unit

# R5 priority classes. Yield is quiesce+drain, never kill (fabric axiom 4).
priority_classes:
  - {name: production-live,   yields_to: []}
  - {name: operator-directed, yields_to: [production-live]}
  - {name: background-churn,  yields_to: [production-live, operator-directed]}

# R3: co-residency policy carries the contention-matrix shape INCLUDING a
# staleness guard. The orchestrator matrix refuses itself under a mismatched
# topology_hash; a hand-declared contention_class without this guard fails
# silently, which is the failure mode this exists to prevent.
co_residency:
  source: "epyc-orchestrator/orchestration/contention_matrix.yaml"
  generator: "epyc-orchestrator/scripts/server/contention_matrix.py"   # never a second generator
  expected_topology_hash: "8c8cfcbb13d2611d"
  on_topology_mismatch: refuse      # fail-closed (fabric axiom 3)
  default_floor: 0.85
  # Declared classes are provisional until measured; promote via the generator above.
  declared_classes_are_provisional: true

# Human-only write paths live in their own hash-pinned, hook-protected file so
# that an agent able to edit this config cannot widen its own authority:
#   human_only_paths.yaml  +  human_only_paths.sha256   (see R7)
trust_boundary:
  source: "coordination/session-bus/human_only_paths.yaml"
  pin: "coordination/session-bus/human_only_paths.sha256"
  on_pin_mismatch: refuse
