# Human-only write paths — the trust boundary, as data.
#
# THIS FILE IS HUMAN-AMENDMENT-ONLY. It defines what requires an operator
# signature, so an agent able to edit it could widen its own authority. Three
# things enforce that, in layers:
#
#   1. scripts/hooks/check_trust_boundary_edit.sh refuses Write/Edit to this
#      file and to its .sha256 pin (PreToolUse — blocks before the edit lands).
#   2. human_only_paths.sha256 pins the content. `session_bus.py validate`
#      compares them and fails on drift, so a change made outside the hook
#      (a direct shell write, another tool) is still detected after the fact.
#   3. The coordinator-daemon's audit pass emits a `defect` record on drift.
#
# Amending it is deliberate: edit this file, then rewrite the pin with
#   sha256sum coordination/session-bus/human_only_paths.yaml | awk '{print $1}' \
#     > coordination/session-bus/human_only_paths.sha256
# Both steps are operator actions. An agent that finds itself needing to amend
# this file should raise a token-request instead.
schema_version: session_bus.human_only_paths.v1

# ---------------------------------------------------------------------------
# MECHANICALLY CHECKABLE — real paths, verified to exist 2026-07-27. A diff
# touching any of these requires a granted operator token.
# ---------------------------------------------------------------------------
paths:
  - repo: epyc-root
    glob: "MEASUREMENT.md"
    why: "instrument constitution; the measurement trust boundary itself"
  - repo: epyc-root
    glob: "agents/shared/MEASUREMENT_POLICY.md"
    why: "the agent-facing digest of that boundary; amending it amends the rules"
  - repo: epyc-root
    glob: "CLAUDE.md"
    why: "auto-loaded instruction surface; a wrong premise here becomes every session's truth"
  - repo: epyc-root
    glob: "agents/AGENT_INSTRUCTIONS.md"
    why: "auto-loaded instruction surface; same amplifier as CLAUDE.md"
  - repo: epyc-root
    glob: "agents/shared/*.md"
    why: "shared policy loaded by every role overlay; generalises the MEASUREMENT_POLICY.md entry"
  - repo: epyc-root
    glob: "measurement/protocols/*.md"
    why: "MEASUREMENT v2 protocol annexes — same trust boundary as the core constitution"
  - repo: epyc-orchestrator
    glob: "orchestration/instrument_eras.yaml"
    why: "era registry rows — historical numbers are era-labelled, never edited"
  - repo: epyc-orchestrator
    glob: "orchestration/autopilot_baseline.yaml"
    why: "AutoPilot baseline applies are an enumerated human-only write"

# Branch-scoped rather than path-scoped: any commit landing on a frozen
# production kernel branch. Additionally requires the four-step promotion
# workflow, not merely a token.
branches:
  - repo: epyc-llama
    glob: "production-consolidated-*"
    why: "frozen production kernels; version past them, never patch in place"
    extra_requirement: "four-step experimental->promotion workflow"

# ---------------------------------------------------------------------------
# NOT GLOB-CHECKABLE — real boundaries that no path pattern captures. Listed so
# they are not silently forgotten, and explicitly marked unenforceable by the
# audit so nobody mistakes a clean audit for full coverage.
# ---------------------------------------------------------------------------
conceptual:
  - "eval tower / scoring semantics (spread across scorers and harnesses)"
  - "safety gates"
  - "host reboots and kernel/boot configuration"
  - "privileged system-wide changes affecting stability"
  - "AutoKernel evaluator immutability against non-agent writes — the PreToolUse layer sees agent tool calls only, so a daemon or a candidate subprocess bypasses it entirely; the enforcing layer is OS-level (separate uid or read-only bind mount), and no glob can express it"
  - "glob: entries in the paths: block above were DECLARATIVE ONLY until 2026-08-03: the matcher in scripts/hooks/check_trust_boundary_edit.sh quoted its right-hand side, which disables bash pattern matching, so measurement/protocols/*.md matched nothing and Annexes B/Q/G were agent-writable through Write/Edit while the guard reported success. Literal entries were unaffected and always blocked, which is why the defect survived every prior test. REPAIRED in epyc-root 6f1c4a8b (RHS unquoted) with scripts/hooks/test_check_trust_boundary_edit.sh asserting both directions against the live gate list. A future editor must not re-quote it"
