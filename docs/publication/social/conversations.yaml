schema_version: social_conversations.v1
policy: >-
  Append-only ledger of external social conversations. Every public performance
  claim carries an in-repo evidence pointer and a MEASUREMENT.md grade. No
  internal role aliases, local paths, host identifiers, or F1 personal-task data
  leave this repo. This ledger is a working record, not published site content;
  it lives outside the mkdocs docs_dir (site_src). Corrections are appended,
  never rewritten in place.
