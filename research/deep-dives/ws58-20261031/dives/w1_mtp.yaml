entries:
- id: intake-2548
  verification: dive-verified
  read_depth: FULL
  source_revision: 'arXiv:2610.38331v1 HTML sha256-12 60d4b7009aa0, retrieved 2026-10-31 (abs page lists v1 only)'
  source_text_path: scratch:dive-ws58-20261031/dive/mtp/paper_v1.txt
  key_claims:
  - 'The MTP cross-entropy gradient at the k-th MTP hidden state decomposes exactly (add-and-subtract identity) into g_KL = W^T(p_k - q) toward the position-aligned, teacher-forced NTP distribution q = p^(0)_{t+k}, plus g_res = W^T(q - x), the NTP CE gradient against the data; the "low-SNR" property of g_res is an empirical measurement (about 4x lower SNR than g_KL, 4.1x at 167M to 4.6x at 1.2B; g_res carries ~80% of the MTP gradient reaching the trunk), not part of the identity.'
  - 'Soft-MTP recovers the KL gradient at the MTP heads and shared trunk by straight-through routing (h0[t+k] += s_k*(sg(h_k) - h_k), numerically zero in the forward), so the NTP CE backward injects -g_res into each MTP hidden; no vocabulary-sized logit tensors are materialized and fused CE kernels still work. Exactness requires the MTP and NTP heads to share the same linear output head W on post-norm hiddens; W itself still receives the hard MTP CE gradient (Soft-MTP != direct KL at W).'
  - 'At 167M-1.2B (DeepSeek-style K=3, single run per arm, no seeds/intervals reported) Soft-MTP beats standard MTP on FineWeb-Edu and WikiText ppl, self-speculative acceptance/speedup in every domain, and average zero-shot accuracy at every scale, with no added parameters; it is NOT better on every metric: LAMBADA ppl is worse at 167M and 332M and MTP loss is lower only from 689M on.'
  - 'Stage-1 suspicion OVERTURNED: the text summary (acceptance length +1.8-2.2%, speedup +1.4-1.5% averaged over five domains) matches the mean of the Table 2 per-cell deltas; every printed per-cell delta reproduces from the printed values within rounding.'
  - 'NEW: with a FROZEN trunk and frozen shared output head (our case), Soft-MTP and direct KL-MTP give identical gradients to the MTP head parameters (the repo test asserts head/trunk gradient identity at 1e-14 in fp64 and that the two differ only at W); so on a frozen trunk Soft-MTP is not a new objective but a cheap way to compute exact forward-KL self-distillation. The paper''s trunk-side wins (NTP ppl, readout effective rank, downstream accuracy) cannot transfer to that setting, and the paper reports no frozen-trunk experiment.'
  - 'NEW: Table 6 (1.2B) shows KL-MTP and Soft-MTP neck and neck on speculative decoding (acc. len 1.71 vs 1.70, speedup 1.76 vs 1.76, KL 0.363 vs 0.364); the spec-decoding gain comes from the KL target, not from the routing trick.'
  - 'NEW: Table 5 (1.2B, one H200): Soft-MTP has the same matmul FLOPs (10.28 GFLOP/token), MFU (51.7%) and fused-CE peak memory (107.0 GB) as MTP; KL-MTP costs +1.5% FLOPs, -5.6% throughput and +21 GB peak memory.'
  reported_results:
  - 'Table 2 (acc. len excludes the always-accepted next token; speedup vs AR; 256 prompts x 512 tok per domain, Leviathan speculative sampling): 167M FW-Edu speedup 1.90->1.92, acc 1.52->1.54; Wiki 1.88->1.89, 1.49->1.50; Books 1.88->1.91, 1.49->1.52; Science 1.88->1.90, 1.49->1.51; Math 1.76->1.81, 1.36->1.41. 332M FW 1.96->1.98, 1.57->1.60; Wiki 1.94->1.95, 1.54->1.55; Books 1.94->1.97, 1.55->1.58; Science 1.94->1.97, 1.54->1.58; Math 1.87->1.93, 1.47->1.53. 689M FW 1.88->1.90, 1.62->1.66; Wiki 1.84->1.87, 1.58->1.61; Books 1.85->1.88, 1.60->1.64; Science 1.86->1.88, 1.60->1.63; Math 1.81->1.84, 1.57->1.60. 1.2B FW 1.74->1.76, 1.67->1.70; Wiki 1.72->1.74, 1.63->1.66; Books 1.71->1.74, 1.62->1.67; Science 1.72->1.75, 1.65->1.68; Math 1.70->1.73, 1.60->1.64.'
  - 'Table 2 means of printed per-cell deltas (dive recomputation): acc. len +1.80/+2.22/+2.14/+2.20% and speedup +1.42/+1.54/+1.42/+1.52% at 167M/332M/689M/1.2B; recomputed from the printed absolute values the 332M speedup mean is +1.57% (rounds to 1.6, just outside the text 1.4-1.5 range; immaterial rounding).'
  - 'Table 2 verifier match (FW-Edu, mean over 3 heads) KL MTP->Soft: 0.485->0.470, 0.448->0.430, 0.410->0.390, 0.384->0.364; TV 0.305->0.300, 0.288->0.282, 0.271->0.265, 0.260->0.253.'
  - 'Table 3 avg zero-shot acc MTP->Soft: 46.84->46.91, 50.38->50.46, 54.47->55.01, 56.80->57.31 (NTP 47.42, 50.79, 54.79, 56.75). LAMBADA ppl MTP->Soft 43.013->43.790 (167M, worse), 26.997->28.566 (332M, worse), 18.560->17.977, 14.996->14.073.'
  - 'Table 4 (1.2B, NTP-only fine-tune): GSM8K 48.60->49.66, MATH-500 23.20->25.00, HumanEval pass@64 40.85->43.90, MBPP pass@16 48.28->47.88 (the one cell Soft-MTP loses).'
  - 'Table 6 (1.2B) MTP/KL-MTP/Soft-MTP: acc. len 1.67/1.71/1.70, speedup 1.74/1.76/1.76, GSM8K 48.60/50.34/49.66, MATH-500 23.20/26.00/25.00; Fig. 6 readout effective rank NTP 496, MTP 131, KL-MTP 321, Soft-MTP 437.'
  - 'Table 5 (1.2B, one H200): throughput NTP 62,851 / MTP 49,783 / KL-MTP 46,990 / Soft-MTP 49,748 tok/s; fused-CE peak memory 95.5 / 107.0 / 128.1 / 107.0 GB.'
  claim_verdicts:
  - {claim_index: 0, verdict: CONFIRMED, evidence: 'Eq. 2 / App. B.3 are a plain add-subtract identity at the post-norm MTP hidden; it holds for any q. The SNR numbers (Fig. 3, App. E) are empirical, from offline checkpoint probes, with no variance across runs.'}
  - {claim_index: 1, verdict: PARTIAL, evidence: 'Exact in exact arithmetic (App. B.4-B.5; repo test fp64 atol 1e-14). Narrowed: needs a shared linear head (otherwise the injected W^T(q-x) is not the head''s g_res); W keeps the CE gradient (Table 1, §7 caveat). Under bf16 autocast loss.py:169-171 casts s_k to the hidden dtype; for T=2048, K=3 this rounds s_1 by +0.146% (dive arithmetic), leaving a ~0.1% g_res leak. Immaterial, but "exact" is fp64-exact only.'}
  - {claim_index: 2, verdict: PARTIAL, evidence: 'Table 2 wins every cell; Table 3 avg acc wins at every scale, but the margin is +0.07/+0.08 points at 167M/332M and LAMBADA ppl is worse at 167M and 332M; Fig. 4(c) says MTP loss is lower only from 689M. No seeds or intervals anywhere; the 1-4% Table 2 deltas carry no noise estimate.'}
  - {claim_index: 3, verdict: OVERTURNED, evidence: 'Text and table agree: mean per-cell acc-len deltas 1.80-2.22%, speedup 1.42-1.54%; no printed delta is off by more than 0.06 pp from its recomputation.'}
  - {claim_index: 4, verdict: CONFIRMED, evidence: 'Derived from App. B.4 (the only difference to KL-MTP is the W gradient) plus repo tests/test_kl_recovery.py:80-98 @4e1cf66 and the freeze_backbone path in src/train.py:388-406 (freezes embed, trunk, final norm and lm_head). The paper''s experiments are all joint pretraining; App. E probes use frozen checkpoints only for diagnostics.'}
  - {claim_index: 5, verdict: CONFIRMED, evidence: 'Table 6 and §6.3 text.'}
  - {claim_index: 6, verdict: CONFIRMED, evidence: 'Table 5 and §6.3 text.'}
  claim_anchors:
  - {claim_index: 0, locator: 'v1 Abstract', quote: 'the MTP cross-entropy gradient can be decomposed exactly into a KL self-distillation term that pulls each MTP head toward the model’s own next-token prediction (NTP) distribution and improves speculative decoding, and a residual that has a low signal-to-noise ratio'}
  - {claim_index: 0, locator: 'v1 §6.1', quote: 'Yet despite its low SNR, the residual accounts for'}
  - {claim_index: 1, locator: 'v1 Abstract', quote: 'when two distributions share a linear output head, the gradient of their KL divergence can be recovered exactly by combining their cross-entropy gradients through straight-through gradient routing'}
  - {claim_index: 1, locator: 'v1 §7', quote: 'with the caveat that only the MTP heads and shared trunk receive the exact KL gradient, whereas the shared output head'}
  - {claim_index: 2, locator: 'v1 §1', quote: 'From 167M to 1.2B parameters, Soft-MTP improves over standard MTP with lower NTP perplexity, faster'}
  - {claim_index: 3, locator: 'v1 §6.2 Speculative decoding', quote: 'domains, it improves acceptance length by 1.8–2.2% and speedup by 1.4–1.5% at each scale.'}
  - {claim_index: 3, locator: 'v1 Table 2 caption', quote: 'Acceptance Length (Acc. Len.): average accepted tokens per draft, excluding the next-token prediction which is always accepted.'}
  - {claim_index: 4, locator: 'v1 §7', quote: 'This is also suitable for methods that already freeze the output head under the KL loss'}
  - {claim_index: 5, locator: 'v1 §6.3', quote: 'In speculative decoding the two are neck and neck, with KL-MTP ahead by at most'}
  - {claim_index: 6, locator: 'v1 §6.3', quote: 'Soft-MTP has the same matmul FLOPs, MFU and fused-CE peak'}
  claim_corrections:
  - {claim_index: 0, effect: narrowed, note: 'The decomposition is an exact algebraic identity (trivially true for any q); the "low SNR" half is an empirical, single-run probe and must be cited as such.'}
  - {claim_index: 1, effect: narrowed, note: 'Exact only for gradients upstream of the MTP hidden, only with a shared linear head, and fp64-exact (bf16 rounds s_k by up to 0.15%). W still trains on hard CE.'}
  - {claim_index: 2, effect: narrowed, note: 'Not uniform: LAMBADA ppl worse at 167M/332M, MTP loss better only from 689M, zero-shot margin ~0.1 points at small scale; single run, no intervals.'}
  - {claim_index: 3, effect: overturned, note: 'No text/table disagreement exists; at most a 0.07 pp rounding edge at 332M speedup.'}
  dive_corrections: 'Stage 1 flagged a possible text/Table 2 mismatch; recomputing every cell shows none: the 1.8-2.2% / 1.4-1.5% summary is the five-domain mean of the per-cell deltas, and only the 332M speedup mean drifts to 1.57% when recomputed from the printed absolute values. Stage 1 also carried the method claims without scope, and the dive narrows three of them. The decomposition is a tautological identity and the low-SNR part is empirical. Exactness needs a shared linear head, is fp64-exact rather than bf16-exact, and does not cover W. The gains are not uniform: LAMBADA ppl regresses at 167M and 332M, and there are no seeds or intervals. Most important for us: on a frozen trunk with a frozen shared head, Soft-MTP gives the same head gradient as direct forward-KL self-distillation (the repo test proves it and has a freeze_backbone mode), but the paper has no frozen-trunk result. So the paper''s trunk-side benefits do not transfer to restoring or training heads on fixed served weights. What transfers is (a) the case for the verifier''s own distribution over hard labels as the drafter target, as a variance argument, and (b) a memory trick that gets the exact KL gradient through hard-label fused CE kernels from a d-wide teacher hidden, without V-wide teacher logits.'
  reader_should_conclude: 'Cite intake-2548#03 (Table 2 text/table consistency), #05 (KL-MTP ~= Soft-MTP on spec decoding, so the gain is the KL target) and #06 (cost table). Cite #04 when choosing a loss for a head or drafter trained on a frozen target: there, Soft-MTP IS exact forward-KL distillation to the target''s teacher-forced NTP distribution, delivered cheaply. Do NOT carry the paper''s NTP-ppl, zero-shot, fine-tune or readout-rank gains into any frozen-trunk decision: they come from trunk gradients we never apply. Do NOT cite the 4x SNR figure as a property of the identity. Results are single-run at <=1.2B with a GPT-2 vocabulary (50,304), with no intervals.'
  not_read: 'Figures (image-only in HTML: Fig. 1 loss curve, 3-7 plots); Algorithm 1 body (App. A) read only via the repo''s equivalent loss.py; reference list beyond what §2/§7 cite.'
- id: intake-2549
  verification: dive-verified
  read_depth: PARTIAL
  source_revision: 'github.com/JaydenTeoh/Soft-MTP @ 4e1cf66 (git clone --depth 1, 2026-10-31)'
  source_text_path: scratch:dive-ws58-20261031/dive/mtp/soft-mtp-repo/README.md
  key_claims:
  - 'Hard MTP and Soft-MTP share one loss function (src/models/loss.py:combined_mtp_loss) and differ only in the is_soft branch, which adds the scaled straight-through term s_k*(sg(z_k)-z_k) into the aligned NTP post-norm hidden before the NTP CE; s_k = lambda*N0/(K*N_k) is computed from supervised-token counts, so prompt-masked (SFT) and ragged batches stay exact.'
  - 'Configs for 167M/332M/689M/1.2B NTP models with K=3 DeepSeek-style MTP heads and per-head final RMSNorm; README points to an HF collection with NTP, MTP and Soft-MTP checkpoints (the checkpoints themselves were not inspected).'
  - 'MIT licensed (LICENSE: Copyright (c) 2026 Jayden Teoh).'
  - 'NEW: the repo ships a frozen-backbone mode (train.freeze_backbone; src/train.py:388-406, described there as FastMTP / Nemotron-style MTP boosting) that trains only the MTP-module parameters with embed, trunk, final norm and lm_head frozen. This is our setting, and with lm_head frozen soft_mtp and direct_kl give identical head gradients.'
  - 'NEW: tests/test_kl_recovery.py gates the identity in fp64: head and trunk gradients of soft_mtp equal direct_kl at atol 1e-14 (n_mtp 1-3, prompt/ragged masks); they differ only at W, where soft_mtp equals hard_mtp; the head gradient matches the closed form coeff*(p_k-q)^T W; a mutation test (scale x0.5/x2) breaks it.'
  - 'NEW: eval reports acceptance via Leviathan/Chen speculative SAMPLING (not greedy); the paper''s Acc. Len. is mean drafts accepted per round, excluding the bonus token (src/decoding/acceptance.py:35-46), i.e. AL-1 in the usual convention.'
  reported_results: []
  claim_verdicts:
  - {claim_index: 0, verdict: CONFIRMED, evidence: 'loss.py:145-180 @4e1cf66; the README states the same.'}
  - {claim_index: 1, verdict: PARTIAL, evidence: 'configs/*.yaml: n_mtp: 3, mtp_per_head_norm: true, objective soft_mtp, mtp_weight 1.0; the README table gives the sizes. HF checkpoints not fetched.'}
  - {claim_index: 2, verdict: CONFIRMED, evidence: 'LICENSE header MIT.'}
  - {claim_index: 3, verdict: CONFIRMED, evidence: 'src/train.py:386-406 (MTP_MODULE_PREFIXES, freeze_backbone), wired at :447-448.'}
  - {claim_index: 4, verdict: CONFIRMED, evidence: 'tests/test_kl_recovery.py:80-149 (read, not executed: no compute).'}
  - {claim_index: 5, verdict: CONFIRMED, evidence: 'acceptance.py:16-46; README "Acc. Len. is alpha * n_mtp, excluding the always-accepted next token".'}
  claim_anchors:
  - {claim_index: 0, locator: 'README.md @4e1cf66 (KL gradient-recovery trick section)', quote: 'Standard MTP (`hard_mtp`) and Soft-MTP (`soft_mtp`) share this loss function and differ only by the `is_soft` condition.'}
  - {claim_index: 1, locator: 'README.md @4e1cf66 (Pretrained checkpoints)', quote: 'The models from the paper for NTP, MTP and Soft-MTP objectives are available on the'}
  - {claim_index: 2, locator: 'README.md @4e1cf66 (last line)', quote: 'MIT. See [LICENSE](LICENSE).'}
  - {claim_index: 4, locator: 'README.md @4e1cf66 (KL gradient-recovery trick section)', quote: 'Verify that the KL gradient–recovery trick produces the same gradient at the MTP heads as explicitly minimising `KL(q || p)`, to machine precision in float64'}
  - {claim_index: 5, locator: 'README.md @4e1cf66 (Evaluation)', quote: 'Acc. Len. is `alpha * n_mtp`, excluding the always-accepted next token.'}
  claim_corrections:
  - {claim_index: 0, effect: unaffected, note: 'The single-flag claim holds; the dive adds the count-based scale and the bf16 cast at loss.py:169-171.'}
  - {claim_index: 1, effect: narrowed, note: 'Checkpoint availability is README-asserted only; not verified.'}
  depends_on:
  - {entry: intake-2548, claim_index: 4, why: 'The frozen-trunk equivalence argument rests on the paper''s App. B.4 derivation; the repo test is its executable form.'}
  dive_corrections: 'The dive confirms the stage-1 claims and adds three load-bearing facts stage 1 missed. (1) There is a freeze_backbone mode, the exact setting we would use. (2) A fp64 test proves soft_mtp == direct_kl at heads and trunk and differs only at W, so with W frozen the two objectives coincide. (3) Acc. Len. excludes the bonus token and is measured under speculative sampling. The bf16 cast of s_k slightly breaks fp64-exactness in mixed-precision training (<=0.15% at T=2048).'
  reader_should_conclude: 'Use loss.py:145-180 as the reference implementation if we ever train a head or drafter that projects through the target''s frozen lm_head. Use freeze_backbone plus the released NTP checkpoints as a ready testbed for the frozen-trunk question. Do NOT read the repo''s Acc. Len. as comparable to llama.cpp''s "mean len" without adding 1 (and checking that convention). Do not claim checkpoint availability without fetching it.'
  not_read: 'src/models/model.py beyond lines 240-300; src/train.py beyond 380-460; data/, eval/ (except acceptance.py, eval_spec.py headers), decoding/sequential.py body; requirements; HF checkpoints not fetched; tests not executed (no-compute rule).'
ledger:
- {row: MTP-1, entries: [intake-2548, intake-2549], action: 'Amend the DF2-DRAFTER-CAPABILITY trainer and data contract (the INF-62 record contract inherited from the cancelled DF2-QWOPUS) so the default objective is forward-KL self-distillation to the target''s own teacher-forced NTP distribution rather than hard next-token labels. Where the drafter projects through the target''s frozen lm_head, capture ONE extra tap, the target''s final post-norm hidden: 5120 x bf16 = 10,240 B/token, +20% over the 51,200 B/token taps. That yields the exact teacher distribution through the shared W, with no V-wide logits stored and none materialized in training (Soft-MTP routing over fused hard-label CE; reference loss.py:145-180). Keep hard labels as the fallback arm.', grounding: 'INF-62 report /mnt/raid0/llm/tmp/codex-ni-20261027-inf62-scope-audit/INF-62-REPORT.md:19-21 ("train only drafter parameters against aligned token labels"; "hard next-token labels are the least-storage interpretation"); dflash2-block-drafter-experimental-build.md:78 (contract: hard next-token labels) and :196 (DF2-DRAFTER-CAPABILITY open); 2548 Table 6 / §5.3 (KL target gives the spec-decoding gain; hard labels add irreducible one-hot sampling variance).', owner: 'handoffs/active/dflash2-block-drafter-experimental-build.md', posture: primitive-now, benefit: 'Higher drafter acceptance per training token, and an exact KL instead of a top-k approximation at a +20% capture cost instead of ~V*2 B/token logits. Must stay correct: verify that the drafter really shares and freezes the target lm_head and final norm; otherwise the trick does not apply and a fused KL kernel is needed.', decision_rule: 'n/a (contract edit); the trainer objective is settled by MTP-2 or by the first real drafter-training pilot running both arms.', reason: 'The only live place where the loss choice changes a real decision (trainer and record format), and the cost is set at capture time; it cannot be retrofitted after features are dumped.'}
- {row: MTP-2, entries: [intake-2548, intake-2549], action: 'Bounded frozen-trunk probe on the Soft-MTP repo (MI210, ROCm torch, <=4 GPU-h, no llama.cpp). Take the released 167M (or 332M) NTP checkpoint, set freeze_backbone=true, and train fresh K=3 DeepSeek-style heads under two arms with identical data order, seed, steps and LR: (A) hard_mtp on corpus labels, (B) soft_mtp (== direct KL at frozen W). Optional arm (C): hard CE on target-SAMPLED continuations, which is the INF-62 label type. Evaluate with src/eval_spec.py speculative sampling on the 5 fixed prompt sets. Six controls: (1) frozen manifest = repo @4e1cf66, checkpoint hash, data shard hashes, the 5 x 256 prompt .npy files; (2) baseline = arm A at the same step count; (3) raw per-round round_accepts and per-head accept counts kept per prompt; (4) holdout = train on FineWeb-Edu train shards only, with the fixed prompt arrays and a second seed untouched until the decision; (5) complete denominator = all 1,280 prompts per arm, all rounds, failed runs reported; (6) predeclared rule below.', grounding: 'Paper has no frozen-trunk experiment (2548 claim 4); repo freeze_backbone src/train.py:388-406; our only planned training is frozen-target drafter distillation (dflash2-block-drafter-experimental-build.md:58-60, :196).', owner: 'handoffs/active/dflash2-block-drafter-experimental-build.md', posture: cheap-screen-now, benefit: 'Settles whether KL-target vs hard-label matters for heads on a FIXED trunk before card-days go into a real drafter. Must stay correct: identical frozen trunk across arms (assert zero grad on trunk params).', decision_rule: 'Promote KL as the default drafter objective if B beats A in five-domain mean acceptance length (drafts only) by >=1.5% relative, with the second-seed replicate on the same side and Math not worse. If |B-A| < 0.5% on both seeds, record the KL target as cost-neutral and choose on storage alone. Otherwise inconclusive; do not extend.', reason: 'Cheapest experiment that answers the frozen-trunk transfer question with the authors'' own instrument; the compute is a few GPU-hours, not card-days.'}
- {row: MTP-3, entries: [intake-2548], action: 'No change to Axis E. Restoring the Qwen3.8-Flash-Next MTP head loads the published unsloth shared-Q8_0 head (no training), so the MTP-objective choice does not touch it.', grounding: 'cpu-decode-roofline-program.md:3897-3915 (Axis E facts: unsloth published heads, no converter run needed, shared- heads borrow output projection from the trunk).', owner: 'handoffs/active/cpu-decode-roofline-program.md', posture: knowledge-only, benefit: 'Avoids inventing a training task where none exists.', decision_rule: 'n/a', reason: 'Axis E is graph port plus tensor borrowing, not head training.'}
- {row: MTP-4, entries: [intake-2548], action: 'Record a trigger on the speculative-decoding refresh. If a served fine-tune ships with a stock (base-co-trained) MTP head, as already observed for ThinkingCap and Qwopus, the remedy is head-only re-alignment on the frozen fine-tuned trunk against its own NTP distribution (Nemotron-style MTP boosting), implemented with the Soft-MTP routing (MTP-1 primitive). Open it only when such a model enters the registry and its native-MTP acceptance trails base by a measured gap.', grounding: 'speculative-decoding-mtp-refresh.md:297 (ThinkingCap MTP head byte-identical to stock, co-trained-head vs modified-trunk mismatch); dflash2-block-drafter-experimental-build.md:42-50 (Qwopus native MTP acceptance 0.590; DF2-QWOPUS cancelled 2026-10-27, :79).', owner: 'handoffs/active/speculative-decoding-mtp-refresh.md', posture: monitor, benefit: 'Cheapest way to recover acceptance on fine-tunes, a few hundred MB of head training versus a full DFlash2 drafter.', decision_rule: 'Trigger: a registry-served fine-tune whose native-MTP acceptance is >=0.05 absolute below its base on the same prompt manifest.', reason: 'No such model is served today (Qwopus has no registry role and is cancelled).'}
- {row: MTP-5, entries: [intake-2548], action: 'Decline adopting Soft-MTP as a pretraining objective.', grounding: 'Our stack trains no trunks; the only training code in epyc-inference-research is a vendored EAGLE-1 trainer (research/eagle-official/eagle/train/main.py:231-237, which already uses soft-target CE against the frozen target''s softmax plus SmoothL1 feature loss, unrun since the initial commit) and unrelated TIDE/memento adapters.', owner: 'handoffs/active/speculative-decoding-mtp-refresh.md', posture: decline, benefit: 'n/a', decision_rule: 'n/a', reason: 'The joint-pretraining benefits need trunk training we do not do; the frozen-trunk part is carried by MTP-1/2.'}
dive_surfaced_sources:
- {source: 'arXiv:2606.15007 (Nemotron 3 Ultra: Open, Efficient Mixture-of-Experts Hybrid Mamba-Transformer Model for Agentic Reasoning)', settles: 'Whether frozen-backbone, head-only forward-KL "MTP Boosting" improves acceptance at frontier scale (the frozen-trunk case the Soft-MTP paper does not test); secondary sources give T=2 and up to 5.82% speedup, unverified', bears_on: intake-2548, recommend: ingest-and-dive}
- {source: 'arXiv:2603.23911 (Self-Distillation for Multi-Token Prediction)', settles: 'Top-N, gradient-detached KL self-distillation of MTP heads (cited by the paper as Zhao et al. 2026a); the alternative the trick claims to dominate on cost', bears_on: intake-2548, recommend: 'decline: superseded for our purpose by MTP-1/2; the paper''s Table 6 already compares against exact KL'}
- {source: 'arXiv:2602.06019 (Multi-Token Prediction via Self-Distillation)', settles: 'Argmax-target MTP self-distillation (Kirchenbauer et al.); another point on the label-type axis', bears_on: intake-2548, recommend: 'decline: same axis as MTP-2 arm C; no stack decision depends on it'}
artifact_audit: clean
